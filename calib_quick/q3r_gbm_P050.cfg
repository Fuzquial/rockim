# CAS 3 GBM = q3r_gbm_P050 + grainMeshRandom (points interieurs aleatoires : le reseau triangulaire par defaut est STRUCTURE, R6 0,55) — rockim_f2n.exe
#   joints de grain NON affaiblis (gbAlpha* omis = 1,0) : seule la CONTRASTE de phase differe du cas 1.
#   grains 3 mm (~90 grains) pour tenir sous 5 min ; delaunay intra-grain a 0,18 d = 0,54 mm.
#   rockim_f2j.exe calib_quick\q3r_gbm_P050.cfg out_q3r
mode = fdem
mesh = voronoi
W = 0.02
H = 0.04
grainSize = 0.003
grainSeeding = random
grainMesh = delaunay
lloydIters = 2
seed = 12345
# ---- CHARGEMENT (sonde 4 du 31 aout) ----
scenario = tension
T = 2.2e-3                  # 0,25 m/s x 1,9 ms = 0,475 mm = 1,2 % de deformation apres les delais
frames = 22
pullV = -0.25               # RESERVE 1 du par. 3ter : epsdot ~ 5/s, six ordres au-dessus du labo
pullRamp = 2e-4
pullDelay = 3e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false
confiningPressure = 50e6    # sigma3 = 50 MPa ; cible : pic q = 599 MPa a 0,95 %, chute 26 %
confiningRamp = 1e-4
confineFaces = sides
confineGaugeTime = 3e-4
# ---- BULK : ELASTIQUE dans les trois cas (law = mc incompatible avec phases) ----
rho = 2620
E = 80e9
nu = 0.25
crushCap = 1e12
# ---- JOINTS (jeu de la sonde 4, non calibre) ----
ft = 12e6
cohesion = 25e6
frictionDeg = 48
Gf = 40
gfShearFactor = 20
jointResidualMu = 0.25
jointPenaltyFactor = 20
jointXi = 0.01
jointSoftening = yan
insertion = adaptive
gcActivation = adaptive
# ---- PHASES (fractions Red Bohus ; quartz/biotite de gbm1, feldspath ajuste pour les moyennes) ----
phases = feldspar quartz biotite
phase.feldspar.fraction = 0.62
phase.feldspar.E = 84.2e9
phase.feldspar.ft = 11.73e6
phase.feldspar.cohesion = 19.44e6
phase.quartz.fraction = 0.31
phase.quartz.E = 83.1e9
phase.quartz.nu = 0.17
phase.quartz.ft = 14e6
phase.quartz.cohesion = 35e6
phase.biotite.fraction = 0.07
phase.biotite.E = 29.3e9
phase.biotite.nu = 0.36
phase.biotite.rho = 2800
phase.biotite.ft = 5.5e6
phase.biotite.cohesion = 30e6
gcSurfaceRefresh = eager
grainMeshRandom = true      # points interieurs Poisson-disc (R6 0,007 contre 0,55 pour le reseau)
