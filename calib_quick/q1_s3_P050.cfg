# CAS 1 (homogene) sur la REALISATION 3 du maillage : bruit de realisation de l objectif, parametres identiques a q1_homog_P050
#   rockim_f2j.exe calib_quick\q1_s3_P050.cfg out_q1   (depuis la racine de rockim_f2, OMP_NUM_THREADS = 14)
mode = fdem
mesh = file
meshFile = calib_quick/meshes/box20x40_h08_s3.msh   # realisation 3 (champ de taille bruite seede, make_box_mesh.py) : R6 0,02-0,07
seed = 12345
# ---- CHARGEMENT (sonde 4 du 31 aout) ----
scenario = tension
T = 2.2e-3                  # 0,25 m/s x 1,9 ms = 0,475 mm = 1,2 % de deformation apres les delais
frames = 22
pullV = -0.25               # RESERVE 1 du par. 3ter : epsdot ~ 5/s, six ordres au-dessus du labo
pullRamp = 2e-4
pullDelay = 3e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false
confiningPressure = 50e6    # sigma3 = 50 MPa ; cible : pic q = 599 MPa a 0,95 %, chute 26 %
confiningRamp = 1e-4
confineFaces = sides
confineGaugeTime = 3e-4
# ---- BULK : ELASTIQUE dans les trois cas (law = mc incompatible avec phases) ----
rho = 2620
E = 80e9
nu = 0.25
crushCap = 1e12
# ---- JOINTS (jeu de la sonde 4, non calibre) ----
ft = 12e6
cohesion = 25e6
frictionDeg = 48
Gf = 40
gfShearFactor = 20
jointResidualMu = 0.25
jointPenaltyFactor = 20
jointXi = 0.01
jointSoftening = yan
insertion = adaptive
gcActivation = adaptive
