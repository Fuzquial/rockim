# CAS 1 x 0,7 a l_cz = 22 mm, E PHYSIQUE 77,7 GPa / nu 0,29 (critique A5 : cibles eps x (1 - nu^2), E garde pour le transfert forage) : base des controles C3-C8
#   rockim_f2j.exe calib_quick\q1v070L_P050.cfg out_q1v070   (depuis la racine de rockim_f2, OMP_NUM_THREADS = 14)
mode = fdem
mesh = file
meshFile = calib_quick/meshes/box40x80_h08_s1.msh   # C5 : eprouvette 40 x 80 mm, meme h = 0,8 mm (W/l_cz 0,9 -> 1,8)
seed = 12345
# ---- CHARGEMENT (sonde 4 du 31 aout) ----
scenario = tension
T = 4.4e-3                  # x 2 : meme deformation finale a 0,25 m/s sur 80 mm
frames = 22
pullV = -0.25               # RESERVE 1 du par. 3ter : epsdot ~ 5/s, six ordres au-dessus du labo
pullRamp = 2e-4
pullDelay = 3e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false
confiningPressure = 50e6    # sigma3 = 50 MPa ; cible : pic q = 599 MPa a 0,95 %, chute 26 %
confiningRamp = 1e-4
confineFaces = sides
confineGaugeTime = 3e-4
# ---- BULK : ELASTIQUE dans les trois cas (law = mc incompatible avec phases) ----
rho = 2620
E = 77.7e9                  # E physique (fit des 12 triaxiaux) ; en deformation plane E_app = E/(1-nu^2) = 84,8 -> comparer a eps_exp (1-nu^2)
nu = 0.29                   # moyenne des 12 essais (seuils_sbm_bohus.json)
crushCap = 1e12
# ---- JOINTS (jeu de la sonde 4, non calibre) ----
ft = 8.4e6                 # <<< x 0.7
cohesion = 17.5e6           # <<< x 0.7
frictionDeg = 48
Gf = 20.0                  # l_cz = E Gf / ft^2 = 22 mm (comme la sonde 4)
gfShearFactor = 20
jointResidualMu = 0.25
jointPenaltyFactor = 20
jointXi = 0.01
jointSoftening = yan
insertion = adaptive
gcActivation = adaptive
W = 0.04                    # (informatif : W_/H_ viennent de la boite du maillage ; H sert au depouillement eps = u/H)
H = 0.08
