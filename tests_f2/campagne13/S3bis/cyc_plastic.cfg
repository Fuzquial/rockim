# ---------------------------------------------------------------------------
# cyc_plastic.cfg — loi rockim de reference (retour radial, ratchet)
# S3 bis (relecture V du 13/09) : CYCLE FERME a pression variable — le test
# que la critique independante reclame et que `jbMode = shear` ne fait pas
# (il glisse a pression CONSTANTE). Rectangle du plan (s, dn) :
#   A  s : 0 -> jbAmp        a dn = jbNormal   (glissement sous faible compression)
#   B  dn : jbNormal -> jbNormal2  a s = jbAmp (on COMPRIME davantage)
#   C  s : jbAmp -> 0        a dn = jbNormal2  (retour sous forte compression)
#   D  dn : jbNormal2 -> jbNormal  a s = 0     (retour au point de depart)
# L etat final EST l etat initial. Aucune rupture (jbAmp << sE), aucun contact
# (deux tetraedres prescrits), aucun amortisseur (jointXi = 0, dampingLocal = 0),
# aucun DIF (strainRateDIF absent). Le travail NET des tractions du joint sur
# un cycle doit donc etre <= 0. S il est > 0, la loi CREE de l energie.
# jbSteps fixe le pas : 2000 -> dt = jbAmp/(jbRate*jbSteps).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = jointbench
frames = 2

rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20

jointPenaltyFactor = 25
jointPenaltyLength = edge
jointElastic = parabolic
jointSoftening = munjiza
jointQuadrature = midedge
jointXi = 0
dampingLocal = 0
jointFailRule = majority
jointDeath = damage
jointResidualMu = 0
jointNormalProxy = law
jointShearRange = coulomb

jbEdge = 1e-3
jbRate = 1.0
jbSteps = 2000
jbMode = cycle
jbNormal = -2.0e-8
jbNormal2 = -2.0e-7
jbAmp = 2.0e-6
jbCycles = 3
jointShearUnload = plastic
jointSecantRatchet = on

