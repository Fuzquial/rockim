# ===========================================================================
# bitid deck 6/8 — mode = fdem3d, joints cohesifs lineaires (defaut), volume
# elastique, traction directe sur un cube (grille Kuhn interne, joints plans
# normaux a z), viscosite de Yan (bulkViscosityXi = 2.0, opt-in), insertion
# intrinseque (defaut), contact penalite (defaut).
# source : test `visc_yan_3d` (tier full) de tools/verify_suite.py :
#          configs/verify_fdem3d_tension.cfg + surcharge bulkViscosityXi = 2.0
#          (references de la suite a 1 fil : viscwork 0.00316169 J, broken 200),
#          RACCOURCI : T 4e-4 -> 1.4e-4 s et pullV 0.05 -> 0.15 m/s (x3),
#          frames 8 -> 2. MESURE : la charge est une ONDE (pic 9,45 MPa a 55 us
#          puis decharge sans rupture a T = 1,0e-4 : 0 joint casse) ; a
#          T = 1,4e-4 les 200 joints d'un plan de Kuhn cassent DANS la fenetre
#          (deuxieme passage de l'onde), puis vol libre + contact penalite des
#          deux moities. COUT : le deck source entier vaut ~690 s a OMP 4 sur
#          machine chargee (t = 1,73e-4 en 300 s) ; T = 1,4e-4 = 269 s sous
#          forte charge, ~195 s sinon. Le deck 6 n'est donc plus egal au test
#          de la suite : meme maillage, meme loi, meme viscosite, vitesse x3 et
#          duree /2,9.
# maillage : interne 10 x 10 x 10 cellules (6 000 tets), 40 mm.
# duree mesuree : 207,5 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05 18:47, machine
#          chargee par la matrice v2 a 14 fils + une suite a 1 fil ; 269 s sous charge plus
#          forte a 18:2x ; 19 576 pas, dt 7,152e-9 s ; 200 joints casses, 11,0 mJ visqueux).
#          Les deux runs donnent les MEMES hachages (history d5e75bf8a679913f). Valeur
#          courante : tools/bitid_refs.json.
# ===========================================================================
mode = fdem3d
scenario = tension
T = 1.4e-4
frames = 2

W = 0.04
D = 0.04
H = 0.04
nx = 10
ny = 10
nz = 10
meshJitter = 0.0

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
pullV = 0.15                 # bitid : x3 (0.05 dans le deck source)
dampingLocal = 0.7

# --- surcharge du test visc_yan_3d --------------------------------------------
bulkViscosityXi = 2.0

writeRuptureFields = true
jointShearRange = coulomb
