# ===========================================================================
# bitid deck 4/8 — mode = fdem3d, joints cohesifs (jointSoftening = yan,
# enveloppe yang, residuel mu), volume elastique + bulkDamage = yang
# (pulverisation), 3 phases (roche / acier / carbure), 6 corps (rock, insert,
# bit, piston, circlip, plate) assembles par groupBond, insertion ADAPTATIVE,
# contact POTENTIEL + gcActivation adaptive, DIF yang-fig2, viscosite Yan
# graduee, gravite : le chemin complet de la replique Yang 2026 (papier 2).
# source : bench_impact/configs/impact_kuru9.cfg, RACCOURCI : T 1.0e-3 ->
#          1.0e-5 s, frames 40 -> 2, et groupVel.piston -9 -> -30 m/s (le
#          piston vole a 0,2 mm du bit : a 9 m/s le contact tombe a 22 us,
#          hors fenetre ; a 30 m/s il tombe a 6,7 us : ~3 us de contact
#          piston/bit par POTENTIEL, onde dans le bit, joints d'assemblage
#          charges). La roche n'est PAS touchee : ce deck exerce l'import
#          multi-corps (6 groupes, 3 phases, groupBond, gravite), l'armement
#          adaptatif/DIF/bulkDamage et le contact entre corps, pas l'impact.
#          COUT : ce maillage vaut ~0,47 s par pas a OMP 4 sur machine chargee
#          (T = 5e-5 = 2 300 pas mesure > 15 min) ; meshFile en
#          chemin RELATIF A LA RACINE rockim_f2 ; la coquille `fragBrushV`
#          (cle inerte, lue `fragBrushV0` par le code — constat T14 / mesure
#          C0 du plan) est corrigee ici, sans effet sur ce run (fragBrushStart
#          5e-4 > T).
#          QUATRE cles du deck source sont ABSENTES ici (constat du verificateur
#          du 2026-09-05, source inchange depuis le 01/09) : `energyBodyForces =
#          on`, `budgetAbortPct = 2`, `trackGroups = bit piston insert`,
#          `gauge.bit = 0.28 0.30` — metrologie et garde-fou du bilan d'energie,
#          pas la physique ; les reintroduire changerait history.csv (colonnes)
#          donc l'ancre : a faire seulement avec --update + ligne CHANGELOG.
# maillage : impact_kuru_s15.msh, 39 734 elements Gmsh (pilote s = 1,5).
# duree mesuree : 233,8 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05, machine
#          chargee ; 2 768 pas, dt 3,614e-9 s). Valeur courante : tools/bitid_refs.json.
# ===========================================================================
mode = fdem3d
scenario = percussion
toolShape = none
T = 1.0e-5
frames = 2

mesh = file
meshFile = meshes/impact_kuru_s15.msh
gravity = 9.81

# --- roche : Kuru Grey, Table 1 du papier 2 (integralement) -----------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
# coefficient de frottement interne 1,85 -> atan(1,85) = 61,6 deg
frictionDeg = 61.6
# G_I = 50 J/m2 ; G_II = 1000 J/m2 -> facteur 20
Gf = 50
gfShearFactor = 20

# --- les trois materiaux (Table 1, colonnes carbure et acier) ---------------
phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.insert = carbide
groupPhase.circlip = carbide
groupPhase.plate = steel

# --- assemblage et charge ----------------------------------------------------
groupBond.bit.insert = joints
groupBond.bit.circlip = joints
# vitesse du piston : -9 m/s dans le deck source (cas d'analyse du papier) ;
# -30 m/s ICI pour que le contact piston/bit tombe dans la fenetre (bitid)
groupVel.piston = 0 0 -30.0

# --- schema : adaptatif ------------------------------------------------------
insertion = adaptive
insertionPenaltyFactor = 4
strainRateDIF = yang-fig2
contact = potential
gcActivation = adaptive
dampingLocal = 0
dtFactor = 0.2

# --- frottements (Table 1 + regle de paire mesuree dans Solidity) -----------
jointResidualMu = 0.18
contactMu = 0.6

# --- PULVERISATION (leur eq. 3-4 = bulkDamage yang) --------------------------
bulkDamage = yang
contactResidualMu = 0.18

# --- chaine « article-exact » (papier 1, reprise du deck fidele) -------------
jointShearEnvelope = yang
jointSoftening = yan
bulkViscosityXi = 0.6
bulkViscosityGraded = 1
viscousInInsertion = 0
crushCap = 2e9

# --- tri des fragments (leur §2.3) : inerte ici, fragBrushStart > T ----------
fragBrushStart = 5.0e-4
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8

jointShearUnload = plastic
jointShearRange = coulomb
writeRuptureFields = true
jointBreakModeRef = slipRef
