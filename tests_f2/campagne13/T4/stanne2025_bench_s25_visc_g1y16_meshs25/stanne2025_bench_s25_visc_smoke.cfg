# ---------------------------------------------------------------------------
# stanne2025_bench_s25_visc.cfg — CAS DE CONFORMITE ST ANNE (T4 de la campagne
# de correction du 13/09, docs/CAMPAGNE_correction_2026-09-13.md), variante SANS
# amortissement REMPLACEE par : variante AVEC bulkViscosity = 2000
# (EXPLORATOIRE, genere par tools/make_conformity_decks.py depuis
# _visc0 : seule la cle bulkViscosity est ajoutee, en fin de section
# AMORTISSEMENT). Impact a insert unique sur le CALCAIRE ST ANNE de Yang et al.
# 2025 (IJRMMS 191, 106125, Table 4 p. 6) : le cas discriminant du moteur
# joint/contact SANS le modele de pulverisation de 2026 (COMPLEMENT §2 : « il faut
# commencer par St Anne »). Sur le maillage s = 2,5 a TRAIN FIGE de T3.
#
# CLES QUI DIFFERENT DU TEMOIN A (configs/yang2026_bench_s25_v3P_300.cfg),
# liste EXACTE — tout le reste est le temoin mot pour mot :
#   meshFile           impact_yang_train1_rock25_hxt.msh  (T3 : train s = 1, roche SR 2,5, hxt)
#   T / frames         4.5e-4 / 18  (cessation des radiales a 388 us chez Yang 2025, fig. 14)
#   rho                2731        (Table 4, St Anne)          temoin 2626
#   E                  57e9                                    temoin 60e9
#   nu                 0.31                                    temoin 0.24
#   ft                 7.0e6                                   temoin 10.98e6
#   cohesion           18.8e6                                  temoin 29.84e6
#   frictionDeg        45          (tan phi = 1,0)             temoin 61.61
#   Gf                 12          (GI, J/m2)                  temoin 50
#   gfShearFactor      66.667      (GII/GI = 800/12)           temoin 20
#   contactMu.rock     0.6         (glissement de la roche, Table 4)   temoin 0.18
#   jointPenaltyLength edge        (el de Solidity = h de Guo)         temoin min (absent)
#   jointPenaltyFactor 26.316      (p0/(2E) = 3000/(2 x 57), ARMA 24-0952 Table 1)  temoin 20
#   bulkDamage         off         (aucune pulverisation en 2025)      temoin yang
#     -> bulkDamagePhase/Delta0/DeltaF/Dmax RETIREES (inertes sans bulkDamage)
#     -> contactDamageCoupling RETIREE (le code l exige avec bulkDamage = yang, l. 1353)
#   meanTensionCapFactor 0         (cap cache 3 ft neutralise, DIAGNOSTIC §4)  temoin absent (= 3)
#   groupVel.piston    0 0 -10.66  (cas d analyse de leur fig. 14-15)  temoin -9.0
# Clefs INCHANGEES a dessein (choix, pas des donnees publiees) : la loi de joint du
# temoin (plastic + coulomb + ratchet + normalProxy law + deltaC solidity +
# majority), le contact du temoin (potentiel, potStiffnessByPhase = min,
# potPenaltyFactor 1, gcBirth ramp), le DIF (2025 : ft et GI en traction, c et
# GII en compression, pas tan phi — c est ce que fait refreshDif, exposant 0,17
# comme le temoin, COMPLEMENT §4). La VARIANTE _visc ajoute bulkViscosity = 2000.
#
# COUT ESTIME (a partir de results/yang_bench_s25_v3P.log : 70 733 pas pour
# 200 us en 5 498 s a 14 fils machine partagee = 77,7 ms/pas ; ~17 ms/pas seul
# d apres le « ~20 min seul » du cadrage) : voir docs/DECKS_conformite_2026-09-13.md
# (le dt est MESURE par le lancement de 2 us, tools/deck_smoke.py).
#
# CRITERE DE SUCCES (Yang 2025, fig. 14 a 10,66 m/s ; Table 3 = ordres de
# grandeur des sept criteres sur trois maillages non structures, cas non precise
# dans le texte extrait) : zone broyee sous l insert avant 130 us ; radiales,
# laterales et MEDIANE de 130 us a la fin de la charge (254 us) ; arret des
# medianes a 291 us et des radiales a 388 us ; longueur de fissure radiale
# 20-25 mm (tools/crack_paths.py, composante connectee au noyau) ; rayon de
# cratere 10-12 mm ; vitesse d indentation ~9,4-9,9 m/s et rebond ~6,9-7,1 m/s
# (PENTES du deplacement, tools/fig_kinetics.py, pas les maxima instantanes) ;
# enfoncement ~1,5 mm. ECHEC = reseau diffus sans radiale connectee au-dela de
# ~12 mm, ou bit non freine (v_bit >= vitesse d indentation a la fin de la charge).
# INCONNUES assumees : contact (raideur, naissance), amortissement (variante
# _visc), quadrature/decharge de Solidity (bancs B/B1/B2 en cours).
#
#   OMP_NUM_THREADS=14 rockim_g1y17.exe configs/stanne2025_bench_s25_visc.cfg out_stanne_s25_visc
# ---------------------------------------------------------------------------

mode = fdem3d
scenario = percussion
# L outil EST le corps maille « piston » lance par groupVel : aucune sphere
# analytique (le defaut en creerait une de 0,5 kg a 8 m/s, 16 J fantomes).
toolShape = none

# --- maillage : leur fig. 5 (geometrie) et fig. 6 (tailles) ----------------
# Six corps : rock, insert (carbure), bit, piston, circlip, plate (acier).
# Roche cylindre R 125 x 150 mm ; insert hemispherique R 8,51 mm ; bit Phi 30
# x 265 mm insert compris ; piston Phi 26,5 x 260 mm ; plaque 119,9 x 40 x 6.
# Yang 2025 §3.1 : circlip et plaque presents, poids sur l outil NON applique,
# pesanteur appliquee. Jeux 0,02 mm : insert POSE sur la roche.
# MAILLAGE A TRAIN FIGE (T3, docs/MAILLAGE_serie_2026-09-13.md) : le train
# metallique a l echelle s = 1 (masses du piston et du bit identiques a la
# serie s = 1), la roche a SR = 2,5 — le jumeau s = 2,5 historique avait un
# piston 26,5 % plus leger (DIAGNOSTIC §4).
mesh = file
meshFile = meshes/impact_yang_s2.5_pose.msh

# --- duree : fig. 14 de Yang 2025 (10,66 m/s) --------------------------------
# Zone broyee < 130 us ; radiales/laterales/mediane 130-254 us (fin de charge) ;
# medianes arretees a 291 us, radiales a 388 us. 450 us couvre la sequence,
# 18 trames = une toutes les 25 us.
T = 2e-06
frames = 1
historyFlush = true

# --- garde-fous et pesanteur -------------------------------------------------
gravity = 9.81
energyBodyForces = on
budgetAbortPct = 2

# ---------------------------------------------------------------------------
# MATERIAUX — Yang et al. 2025, Table 4 p. 6, colonne St Anne (sans substitution)
# ---------------------------------------------------------------------------
# Calcaire St Anne (marbre a inclusions bioclastiques, UCS 179 MPa, porosite
# 0,7 %). Le bloc global = la roche.
rho = 2731                       # kg/m3
E = 57e9                         # Pa      (57 GPa)
nu = 0.31
ft = 7.0e6                       # Pa      tensile strength
cohesion = 18.8e6                # Pa      cohesive
# « tan(phi) = 1,0 » : phi = 45 deg.
frictionDeg = 45
# GI = 12 J/m2, GII = 800 J/m2 (rapport 66,667). Yang 2025 §3.2 : GI et GII
# CALIBRES (absents du rapport d essai), point de depart GI 19,4 / GII 485.
Gf = 12
gfShearFactor = 66.667

# Trois PHASES (materiaux) pour six CORPS (volumes physiques du maillage).
# Fractions = celles du maillage s = 2,5 historique (elles ne servent qu au
# bilan par phase ; la ligne « target » du journal les compare au maillage).
phases = rock steel carbide
phase.rock.fraction = 0.9573
# acier : bit, piston, plaque de charge (Yang 2025 Table 5 a ses colonnes
# acier/carbure INVERSEES — COMPLEMENT §4 ; on garde acier 200 GPa / 7850).
phase.steel.fraction = 0.0421
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
# carbure : insert et circlip (600 GPa / 15 250).
phase.carbide.fraction = 0.0007
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.2
# Corps elastiques incassables (aucune resistance publiee pour l acier ni le
# carbure) : sans ces lignes rockim leur donnerait ft = 7 MPa, c = 18,8 MPa.
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.insert = carbide
groupPhase.circlip = carbide
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.plate = steel

# Insert et circlip sont BRASES au bit (leur fig. 5d : une seule piece).
groupBond.bit.insert = joints
groupBond.bit.circlip = joints

# Corps CONTINUS : aucun joint n est evalue dans l acier ni le carbure (voir
# le temoin pour les deux raisons mesurees : dt et complaisance).
groupContinuum.insert = true
groupContinuum.circlip = true
groupContinuum.bit = true
groupContinuum.piston = true
groupContinuum.plate = true

# ---------------------------------------------------------------------------
# LOI DE JOINT (roche) — Yang 2025 §2, fig. 1 ; penalite ARMA 24-0952
# ---------------------------------------------------------------------------
# Insertion INTRINSEQUE (joints a six noeuds entre tous les tetraedres de la
# roche) : cle `insertion` ABSENTE = defaut de rockim.
#
# Raideur de penalite : ARMA 24-0952 Table 1 p. 4, « Penalty Number » 3 000 GPa
# pour St Anne (1 800 pour Rhune). Si ce nombre est le p0 de Guo et la longueur
# l arete moyenne de la facette (el de Solidity), la parabole de rockim donne
# facteur = p0/(2E) = 3000/(2 x 57) = 26,316 (COMPLEMENT §3 : conversion
# CONDITIONNELLE, a verifier sur les courbes du joint — banc S3).
jointPenaltyLength = edge
jointPenaltyFactor = 26.316
# Branche elastique PARABOLIQUE de Solidity (Guo eq. 2.31), adoucissement
# z-curve de Munjiza 2004 (a = 0,63, b = 1,8, c = 6).
jointElastic = parabolic
jointSoftening = munjiza
# Critere : Mohr-Coulomb avec COUPURE DE TRACTION (eq. 1 de Yang 2025 ; le
# signe correct est celui de rockim, COMPLEMENT §4).
jointShearEnvelope = yang
# Plage de mode II divisee par f_s(sigma_n) a la pression courante (Guo p. 65).
jointShearRange = coulomb
# Decharge/recharge en cisaillement : la loi du TEMOIN (plastic + ratchet).
# La loi `solidity` (memoire nulle) est mesuree a part par les bancs B/B1.
jointShearUnload = plastic
jointSecantRatchet = on
jointNormalProxy = law
# Joint rompu sans cisaillement (dpefm = 0 de Solidity), le contact prend le
# relais ; mort du joint des D >= 1 quel que soit le signe de l ouverture.
jointResidualMu = 0
jointDeath = damage
# Aucun amortisseur visqueux de joint chez Solidity.
jointXi = 0
# Conventions de Solidity (points a mi-arete, ouverture critique Y3Dfd.c
# l. 1099, mort a deux points sur trois).
jointQuadrature = midedge
jointDeltaC = solidity
jointFailRule = majority

# ---------------------------------------------------------------------------
# EFFET DE VITESSE DE DEFORMATION — Yang 2025 eq. 2-3 (« DIF 2025 »)
# ---------------------------------------------------------------------------
# Dans le modele 2025 le DIF agit sur ft et GI en traction, c et GII en
# compression, PAS sur tan(phi) : c est exactement ce que fait refreshDif
# (src/Fdem3dSolver.cpp). L exposant de traction imprime 0,07 en 2025 est une
# coquille (loi discontinue) ; la fig. 2 et l eq. de 2026 appuient 0,17
# (COMPLEMENT §4 : « ne pas revenir a 0,07 »).
#   DIF_compression = 0,77 + 0,56 edot^0,07,  plafond 1,84 au-dela de 1e4 /s
#   DIF_traction    = 0,95 + 0,41 edot^0,17,  plafond 1,85 au-dela de 1e2 /s
strainRateDIF = yang
difExpT = 0.17
difExpS = 0.07
# Variable LOCALE reevaluee a chaque pas sur le taux brut (Solidity).
strainRateDIFArm = continuous
strainRateFilter = none

# ---------------------------------------------------------------------------
# PAS DE PULVERISATION (modele 2025) — et pas de cap cache
# ---------------------------------------------------------------------------
# Yang 2025 n a pas le dommage volumique de 2026 : les tetraedres restent
# elastiques, seule la fissuration des joints dissipe. bulkDamage = off est le
# defaut ; pose explicitement pour documenter l intention.
bulkDamage = off
# Garde-fou maison de rockim (deviateur plafonne a 8 c par defaut) : neutralise
# comme dans le temoin, le modele de Yang n a pas de plafond.
crushCap = 1e12
# Cap CACHE sur la pression moyenne en traction (defaut 3 ft = 21 MPa ici) :
# neutralise pour tout essai de conformite (DIAGNOSTIC §4, ECARTS §5). Sous
# joints a ft = 7 MPa (DIF <= 1,85) un element ne devrait pas l atteindre ;
# S1 ajoute le compteur d ecretage au journal pour le verifier.
meanTensionCapFactor = 0

# ---------------------------------------------------------------------------
# CONTACT — le potentiel de Munjiza, celui de Solidity (temoin inchange)
# ---------------------------------------------------------------------------
contact = potential
potTangentFactor = 1.4286
potStiffnessByPhase = min
gcActivation = adaptive
# Frottement de glissement, Table 4 : roche 0,60 ; carbure et acier 0,6 comme
# le temoin. Regle du minimum de Solidity : toute paire vaut 0,6.
contactMu = 0.6
contactMu.rock = 0.6
contactMu.steel = 0.6
contactMu.carbide = 0.6
# INCONNU : la raideur de contact (p0/200 = 15 GPa chez Solidity, soit
# potPenaltyFactor = 0.263 ici) et la naissance (gcBirth = penalty) sont le
# paquet du banc D ; ce deck garde le contact du temoin pour n attribuer le
# resultat qu au materiau et a la penalite de joint.

# ---------------------------------------------------------------------------
# AMORTISSEMENT ET PAS DE TEMPS
# ---------------------------------------------------------------------------
# ARMA 24-0952 Table 1 : « Mass Damping Coefficient » 4 000 pour St Anne, sans
# unite ni operateur (COMPLEMENT §3) — INCONNU. Cette variante n en applique
# AUCUN ; la variante _visc pose bulkViscosity = 2000 (eta D de Guo eq. 2.6 =
# 2 mu D, convention du banc C), marquee EXPLORATOIRE.
dampingLocal = 0
# EXPLORATOIRE (T4) : ARMA 24-0952 « Mass Damping Coefficient 4000 » lu comme
# eta = 4000 Pa.s de Guo 2014 eq. 2.6 (T = ... + eta D), soit 2000 dans la
# convention 2 mu D de rockim — la convention du banc C. Ni l unite ni
# l operateur ne sont publies (COMPLEMENT §3) : un amortissement de masse
# -alpha M v freinerait aussi la translation rigide, ce qu une viscosite de
# volume ne fait pas. Viscosite GLOBALE (acier et carbure compris).
bulkViscosity = 2000
# dt = dtFactor x min(CFL des elements, ressorts).
dtFactor = 0.15

# ---------------------------------------------------------------------------
# INSTRUMENTATION : les sept criteres de leur fig. 8
# ---------------------------------------------------------------------------
# Meme repere solveur que le temoin (bas de la roche a z = 0, bit dans
# z = [0,1732 ; 0,4150] m, milieu 0,2941) : le journal imprime l etendue de
# chaque corps et avertit si la fenetre de jauge sort de la moitie centrale.
trackGroups = bit piston insert
gauge.bit = 0.28 0.31

# ---------------------------------------------------------------------------
# CHARGEMENT — Yang 2025 §3.1 : vitesse initiale du piston
# ---------------------------------------------------------------------------
# Cas d analyse de leurs fig. 14-15 : 10,66 m/s (energie du piston 1,173 kg :
# 66,6 J). Autres cas publies pour St Anne : 2,475 ; 6,235 ; 9,41 ; 11,84 m/s.
groupVel.piston = 0 0 -10.66

# ---------------------------------------------------------------------------
# OPTION — tri des fragments de Yang 2025 §2.3 (critere « masse de fragments »)
# ---------------------------------------------------------------------------
# A armer QUAND la masse de fragments est la metrique visee (+0,5 ms de run) :
#   T = 1.3e-3
#   fragBrushStart = 8.0e-4
#   fragBrushV0 = 2.5e-3
#   fragBrushAccel = 98.1
#   fragBrushBeta = 0.8
