# ===========================================================================
# bitid deck 7/8 — mode = fdem (2D), joints cohesifs (yan, unload origin,
# friction scaled), volume ELASTIQUE (crushCap desarme), raclage au cutter
# PDC 2D (toolShape = pdc, backRake 20 deg), contact outil SIGNORINI, insertion
# ADAPTATIVE, contact POTENTIEL + gcActivation adaptive, bloc libre.
# source : = test `t1_toolcontact_signorini` (tier fast) de tools/verify_suite.py :
#          configs/verify_fdem_toolcontact.cfg + surcharge toolContact =
#          signorini, INCHANGE (T 3e-4, frames 6 ; references de la suite a
#          1 fil : toolinj 0.904801, toolvb 1.07878, broken 0). Le banc T1 est
#          un banc de POMPE : la voie penalite doit echouer (toolinj 4,43).
# maillage : meshes/t1_toolcontact.msh (bloc 4 x 2 mm, h 0,25 mm), chemin
#          relatif a la racine rockim_f2 comme dans le deck source.
# duree mesuree : 99,5 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05, machine
#          chargee ; 61 s au premier essai, 22 s a 1 fil dans suite_f2u ; 205 405 pas,
#          dt 1,461e-9 s ; pic 205 788 N/m). Valeur courante : tools/bitid_refs.json.
# ===========================================================================
mode = fdem
scenario = shear
T = 3.0e-4
frames = 6

thickness = 1.0
mesh = file
meshFile = meshes/t1_toolcontact.msh

# --- granite Utah FORGE (Heilman et al., Table 1) ---------------------------
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 152.9
gfShearFactor = 4.220
crushCap = 1e12              # volume ELASTIQUE, comme leur modele

# --- cutter PDC -------------------------------------------------------------
toolShape = pdc
backRakeDeg = 20
cutterLen = 0.002            # face de coupe, a l'echelle du bloc
cutterThick = 0.0005         # face de degagement (sinon coin infini)
chamferLen = 0.0             # lu mais SANS EFFET dans le contact (defaut connu)
cutDepth = 0.0002            # 0,2 mm
cutSpeed = 10.0
toolX = -0.0003              # part hors matiere
contactMu = 0.8

# --- schema : celui de la campagne coupe -----------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

# --- loi de contact de l'outil : SIGNORINI (surcharge du test) --------------
toolContact = signorini

# le moniteur d'energie est DESARME a dessein (banc T1)
budgetAbortPct = 0
