# ===========================================================================
# bitid deck 3/8 — mode = fem3d, loi = saksala2011 (port fidele : Perzyna
# viscoplastique DP + Rankine, omega_t, kapDP), percussion sur cylindre
# large, maillage INTERNE (geometry = cylinder, grille Kuhn + jitter, seed),
# contact outil penalite, Lysmer partout.
# source : configs/fem3d_percussion_cyl_saksala2011.cfg, RACCOURCI : T 1e-3 ->
#          2e-4 s (l'insert touche a 12,5 us : ~190 us de contact, pic de force
#          compris), frames 25 -> 2 ; tout le reste inchange.
# maillage : interne 28 x 28 x 20 cellules, cylindre D 160 x H 100 mm.
# duree mesuree : 102,3 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05, machine
#          chargee ; 73 920 tets, 1 127 pas, dt 1,775e-7 s ; pic 30 390 N). Valeur
#          courante : tools/bitid_refs.json.
# ===========================================================================
mode = fem3d
law = saksala2011
scenario = percussion
geometry = cylinder
T = 2e-4
frames = 2

W = 0.16
D = 0.16
H = 0.1
nx = 28
ny = 28
nz = 20
# desordre du maillage : Kuhn miroite en damier (defaut) + jitter fort des
# noeuds interieurs — casse l'alignement des fissures sur les diagonales
meshJitter = 0.45
seed = 12345

rho = 2600
E = 60e9
nu = 0.2
ft = 13e6
cohesion = 37.5e6
frictionDeg = 30
Gf = 70
gfShearFactor = 10

toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

absorbing = all
dampingLocal = 0.05
dtFactor = 0.3
