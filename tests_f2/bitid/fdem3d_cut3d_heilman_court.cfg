# ===========================================================================
# bitid deck 5/8 — mode = fdem3d, joints cohesifs (yan, unload origin,
# friction scaled), volume ELASTIQUE (crushCap desarme), coupe 3D au cutter
# PDC (toolShape = pdc 3D, ToolPdc3d, cutterFloor), contact outil SIGNORINI
# (relax 0), insertion ADAPTATIVE, contact POTENTIEL + gcActivation adaptive,
# garde-fou d'energie arme, bloc tenu (fond encastre).
# source : configs/cut3d_heilman.cfg (Heilman et al., ARMA 24-0238, granite
#          Utah FORGE, hFine 0,5 mm), RACCOURCI : T 5.0e-4 -> 6.0e-6 s
#          (course 0,06 mm a 10 m/s), frames 30 -> 2, et toolX 0.0025 ->
#          0.00299 m (arete a 0,01 mm de la face verticale de l'entaille en
#          x = 3 mm au lieu de 0,5 mm : le contact Signorini 3D s'engage des
#          le 1er us, ~0,05 mm d'enfoncement dans la face = onde de contact,
#          armement adaptatif, pas de rupture). COUT : ce maillage vaut
#          ~3e-8 s de simulation par seconde a OMP 4 sur machine chargee
#          (T = 6e-5 mesure > 30 min) ; tout le reste inchange.
# maillage : cut3d_h50.msh, 21 544 elements Gmsh.
# duree mesuree : 93,6 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05, machine
#          chargee ; 3 889 pas, dt 1,543e-9 s ; pic 19 541 N). Valeur courante :
#          tools/bitid_refs.json.
# ===========================================================================
mode = fdem3d
scenario = shear
T = 6.0e-6
frames = 2
historyFlush = true

mesh = file
meshFile = meshes/cut3d_h50.msh

# --- materiau : leur Table 1, granite Utah FORGE ---------------------------
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 152.9
gfShearFactor = 4.220
crushCap = 1e12              # volume ELASTIQUE : leur modele n a pas de plasticite

# --- le cutter PDC 3D --------------------------------------------------------
toolShape = pdc
cutterDia = 0.013
cutterThick = 0.0025
chamferLen = 0.0
backRakeDeg = -20
cutterFloor = true
cutDepth = 0.001016
cutSpeed = 10.0
toolX = 0.00299              # bitid : 0,01 mm devant la face de l'entaille (0.0025 dans le deck source)
toolY = 0.015
contactMu = 0.8

# --- contact outil : SIGNORINI ----------------------------------------------
toolContact = signorini
toolSignoriniRelax = 0.0

# --- schema : celui des runs 2D de coupe et 3D d impact ---------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

# --- garde-fou -------------------------------------------------------------
budgetAbortPct = 5
budgetAbortMin = 1.0
