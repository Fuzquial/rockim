# ===========================================================================
# bitid deck 1/8 — mode = fem3d, loi = cdp (Concrete Damaged Plasticity, carte
# inverse Abaqus), contact outil PENALITE, quarterModel, confinement suiveur
# 20 MPa, erosion par soupapes + spall en energie. Deck de reference de la
# chaine w14 -> w18 (bitid_w15..w18, comparaison_*.txt).
# source : etude_lois_fem/bitid_w12/PQ_cdpI_P020_court.cfg (copie raccourcie
#          de CONTINUUM/calib_bohus_triax/cdp_rockim/perc3d/PQ_cdpI_P020.cfg,
#          T 360 -> 130 us, frames 2), INCHANGE sauf meshFile : chemin
#          RELATIF A LA RACINE rockim_f2 (tools/bitid.py lance l'exe depuis
#          cette racine) au lieu du chemin absolu.
# maillage : Q1_c05_clean.msh, 3209 noeuds / 13 687 tets (hors depot : CONTINUUM/).
# duree mesuree : 129,5 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05 18:17,
#          machine chargee par la matrice v2 a 14 fils ; 10 501 pas, dt 1,238e-8 s ;
#          pic 7916,75 N a OMP 4 contre 7791,04 N a OMP 2 : les hachages ne se
#          comparent qu'au meme nombre de fils). Valeur courante : tools/bitid_refs.json.
# ===========================================================================
mode = fem3d
scenario = percussion
mesh = file
meshFile = ../../CONTINUUM/calib_bohus_triax/cdp_rockim/perc3d/Q1_c05_clean.msh
quarterModel = true
T = 0.00013
frames = 2

# --- carte CDP INVERSE (Abaqus cdp_inverse) : tables en deformation, traction BTS ---
law = cdp
rho = 2620
E = 77.66e9
nu = 0.29
ft = 8.5e6
Gf = 100
gfShearFactor = 10
cohesion = 22.77e6
frictionDeg = 50.4
cdpKc = 0.6061
cdpDilationDeg = 35
cdpEcc = 0.1
cdpFbFc = 1.16
cdpHardening = 126.6e6:0 316.8e6:0.0008 150.2e6:0.004 25e6:0.012
cdpCompDamage = 0:0 0:0.0008 0.5:0.004 0.92:0.012
cdpTensionDamage = 0:0 0.95:2.35e-5

# --- insert : sphere sur l'arete (0, 0), masse / 4 (quart de bloc) ---
toolShape = sphere
toolRadius = 7.94e-3
toolMass = 0.125
impactSpeed = 8.0
toolX = 0
toolY = 0
toolGap = 1e-4
contactMu = 0.5
contactXi = 0.05

# --- bords : Lysmer sur x = W, y = D, z = 0 ; rien sur les plans de symetrie ---
absorbing = all
absorbSpringFactor = 0
dampingLocal = 0.05
dtFactor = 0.7

# --- confinement lateral suiveur (faces x = W, y = D), impact apres la jauge ---
confiningPressure = 2e+07
confiningRamp = 30e-6
confineGaugeTime = 60e-6
toolDelay = 60e-6

# --- suppression : soupapes geometriques + spall en energie (comme la matrice) ---
erodeDetMin = 0.3
erodeStrainMax = 0.3
erodeEpv = 0
erodeD = 2
erodeWfrac = 0.98

fieldStats = true
activeNodes = true
