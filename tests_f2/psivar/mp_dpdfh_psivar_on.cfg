# ---------------------------------------------------------------------------
# BANC COURT psi(p) — ESSAI : dilatance VARIABLE psi(pbar), cle dfhPsiVar.
#
#   build\rockim.exe matpoint tests_f2\psivar\mp_dpdfh_psivar_on.cfg out.csv
#
# Meme point materiel que mp_dpdfh_psivar_off.cfg, une seule ligne de plus :
# dfhPsiVar = 1. La loi devient celle de vumat_hole.f l.336-339 :
#     psi = clamp(dfhPsi0 - dfhKPsi * pbar[MPa], 0, dfhPsiMax)
# soit 51,7 deg (SATURE, ecoulement associe psi = beta) tant que
# pbar < (160,345 - 51,7)/0,213793 = 508,2 MPa, puis une DECROISSANCE
# lineaire jusqu a psi = 0 a pbar = 750,0 MPa.
#
# CRITERE FALSIFIANT (ce que le banc doit montrer) :
#   1. a sigma3 = 0 la trace DOIT differer du temoin (psi 51,7 vs 15 deg) :
#      si elle etait identique, la cle serait INERTE ;
#   2. psi(p) coupe la valeur fixe de 15 deg a pbar = (160,345 - 15)/0,213793
#      = 679,8 MPa. L ecart de dilatance essai - temoin DOIT donc CHANGER DE
#      SIGNE entre les confinements dont le pbar au seuil encadre 679,8 MPa.
#      Avec beta = 51,7 deg et dcoh = 153,3 MPa le seuil vaut
#      pbar = 1,73 sigma3 + 88 MPa : sigma3 = 300 MPa donne pbar = 607 MPa
#      (psi = 30,6 deg > 15 : PLUS dilatant) et sigma3 = 400 MPa donne
#      pbar = 780 MPa (psi = 0 : MOINS dilatant, ecoulement isochore).
#      C est la variante qui DOIT echouer si psi(p) n est pas cablee.
# ---------------------------------------------------------------------------
law = dpdfh
rho = 2620
E = 52e9
nu = 0.25

dfhBetaDeg = 51.7
dfhDCoh = 153.3e6
dfhPsiDeg = 15              # MORT quand dfhPsiVar = 1
dfhWeibullM = 24
dfhSigW = 23.5e6
dfhZeff = 1e-9
dfhK = 0.38
dfhS = 4.18879
dfhDeld = 1e9

# ---- la capacite portee de la branche insertion-pointe (commit c2c2d42) ----
dfhPsiVar = 1
dfhPsi0 = 160.345           # deg
dfhKPsi = 0.213793          # deg / MPa
dfhPsiMax = 51.7            # deg (= dfhBetaDeg : ecoulement associe)

mpPath = triax
mpSigma3 = 0 200e6 300e6 400e6 500e6
mpStrainMax = 0.06
mpSteps = 6000
mpLc = 1e-3
mpDt = 1e-8
mpConfineFirst = true
