# ---------------------------------------------------------------------------
# BANC COURT psi(p) — TEMOIN : dilatance FIXE (comportement d origine).
#
#   build\rockim.exe matpoint tests_f2\psivar\mp_dpdfh_psivar_off.cfg out.csv
#
# Point materiel DP-DFH (aucun maillage, quelques secondes). Chemin triaxial
# a cinq confinements, du domaine ou psi(p) est SATURE (pbar << 509 MPa) a
# celui ou il DECROIT. Le temoin ne pose PAS dfhPsiVar : psi = dfhPsiDeg = 15
# deg a toutes les pressions. La comparaison avec ..._on.cfg est le banc.
#
# CRITERE FALSIFIANT : ce fichier doit rendre une trace RIGOUREUSEMENT
# identique a celle du binaire d avant le portage (rockim_f2w21.exe) — le
# portage de psi(p) est OPT-IN, donc bit-identique cle absente.
# ---------------------------------------------------------------------------
law = dpdfh
rho = 2620
E = 52e9
nu = 0.25

# carte DP-DFH de la these (Red Bohus), constants = 10
dfhBetaDeg = 51.7
dfhDCoh = 153.3e6
dfhPsiDeg = 15              # la constante #5 de la carte
dfhWeibullM = 24
dfhSigW = 23.5e6
dfhZeff = 1e-9
dfhK = 0.38
dfhS = 4.18879
dfhDeld = 1e9               # pas de suppression

# pilotage point-materiel
mpPath = triax
mpSigma3 = 0 200e6 300e6 400e6 500e6
mpStrainMax = 0.06
mpSteps = 6000
mpLc = 1e-3
mpDt = 1e-8                 # 2e-5 de deformation par pas a 2e3 /s
mpConfineFirst = true
