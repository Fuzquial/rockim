# ===========================================================================
# BANC COURT « insertion en POINTE » — insertion = none, CONTINUUM PUR
# (capacite portee de la branche insertion-pointe, commit 28c6ec2).
#
#   buildockim.exe tests_f2\insertion_pointe\ins_none.cfg <sortie>
#
# Compression uniaxiale entre plateaux (le deck de bit-identite 8/8
# fdem_ucs_yan_adaptive_court raccourci a T = 4e-3 s, frames 1 : l arret
# automatique ucsStopAfterPeak coupe le run 0,2 ms apres le pic) en insertion
# ADAPTATIVE : c est la seule configuration ou la capacite a un sens, un
# schema intrinseque n ayant rien a inserer.
# Depouillement et verdict : tests_f2/insertion_pointe/check_tip.py
# ===========================================================================
# insertion = none : aucun joint ne peut naitre, les copies de noeuds restent
# liees pour toujours (elements finis a noeuds partages, exactement). Le banc
# exige : 0 joint insere, 0 joint rompu, et un pas de temps PLUS GRAND que
# celui de l adaptatif (le ressort de penalite des joints sort du budget).
mode = fdem (2D), joints cohesifs (jointSoftening = yan,
# eq. 11 de Yan 2023), volume elastique, compression uniaxiale entre plateaux
# rigides frottants (loading = platens), maillage VORONOI + Delaunay intra-
# grain (mesh = voronoi, seed 4211 : tirages std propres a la plateforme),
# insertion ADAPTATIVE, arret automatique apres le pic (ucsStopAfterPeak).
# source : configs_yan/ucs_adap.cfg (= test `ucs_yan_adaptive`, tier full, de
#          tools/verify_suite.py ; references Linux UCS 51.07 MPa, broken 327,
#          inserted 1288 ; MSVC 313 / 1308 = ecart de plateforme documente),
#          RACCOURCI : T 1.5e-2 -> 2.0e-3 s (PRE-PIC : le run source s'arrete
#          seul a 2,87 ms, 0,2 ms apres le pic de 51,1 MPa, et coute 270 s a
#          OMP 4 sur machine chargee ; a 2,0 ms on est vers 80 % de l'UCS,
#          insertion adaptative deja active), frames 24 -> 2.
# duree mesuree : 180,0 s a OMP_NUM_THREADS = 4 (rockim_f2w18.exe, 2026-09-05, machine
#          chargee ; 136 574 pas, dt 1,464e-8 s ; le run source entier fait 270 s).
#          Valeur courante : tools/bitid_refs.json.
# ===========================================================================
mode = fdem
scenario = tension
loading = platens
T = 4.0e-3
frames = 1

W = 0.036
H = 0.072
thickness = 1.0

# maillage non structure : un "grain" voronoi ne sert ici que de support au
# mailleur delaunay intra-grain — 1 phase, tous les alphas a 1, donc les
# joints de frontiere portent exactement le materiau du volume
mesh = voronoi
grainSize = 0.006
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.0015
seed = 4211

rho = 1704
E = 15e9
nu = 0.24
ft = 1.3e6
cohesion = 16.4e6
frictionDeg = 23
Gf = 3.8
# GfII = 84 N/m = 22.1 x GfI
gfShearFactor = 22.105
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

pullV = -0.1
pullRamp = 2e-4
contactMu = 0.1
dampingLocal = 0.7
jointXi = 0.0

# --- mode : insertion adaptative -------------------------------------------
insertion = none
jointPenaltyFactor = 20
insertionPenaltyFactor = 4

# --- metrologie de la compression (patch ucs_yan.patch) ---
ucsStopAfterPeak = true
ucsStopDelay = 2.0e-4
gaugeLoFrac = 0.25
gaugeHiFrac = 0.75

# loi cohesive de l'article (eq. 11, a=0,63 b=1,8 c=6)
jointSoftening = yan
