# FDEM/GBM verification — direct tension on a SINGLE-PHASE voronoi grain
# structure with unattenuated joints (all alphas = 1): every joint carries
# the bulk strength, so the macroscopic peak must sit AT or slightly ABOVE
# ft — above, because the crack has to follow a tortuous grain-boundary path
# whose inclined facets see only sigma*cos^2(theta). The check bands the
# peak in [-5 %, +25 %] of ft and the excess is expected physics.
mode = fdem
scenario = tension
mesh = voronoi
T = 6e-4
frames = 10

W = 0.06
H = 0.12
grainSize = 0.008
grainJitter = 0.5
lloydIters = 2
vertexMergeFrac = 0.12
refineLevels = 0
seed = 12345

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
pullV = 0.05
dampingLocal = 0.7

# jointXi = 0 : cette verification mesure la LOI de joint (le pic doit valoir
# ft exactement), pas la dissipation visqueuse. Une fois le signe du dashpot
# corrige il dissipe pour de bon, et a jointXi = 0,05 il abaisse le pic de
# 6,6 points (-1,39 % contre -7,96 %). Plusieurs codes etablis (OpenFDEM,
# Akantu, Yade JCFPM) n'ont d'ailleurs aucun dashpot au joint.
jointXi = 0.0

# ---- ESSAI 9 : la forme fermee de la thermo-elasticite ----
# Barre bloquee aux mors (pullV = 0), flancs libres (gripLateralFree),
# refroidie UNIFORMEMENT (faces = all, h enorme = limite Dirichlet,
# conductivite de TEST x1e7 pour equilibrer T dans la fenetre du run).
# CIBLE FERMEE, deformation plane, eps_yy = 0, sigma_xx = 0 :
#   sigma_yy = E alphaT dT / (1 - nu) = 50e9 x 8e-6 x 10 / 0,75 = 5,333 MPa
# soit 53 % de ft = 10 MPa : AUCUNE fissure attendue.
pullV = 0
gripLateralFree = 1
thermal = on
thermalFaces = all
thermalTemp = -10
thermalTref = 0
thermalAlpha = 8e-6
thermalH = 1e9
thermalConduct = 3e7   # valeur de TEST (kappa x1e7) : equilibre en ~1e-4 s
thermalHeatCap = 800
