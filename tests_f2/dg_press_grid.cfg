# FDEM verification — direct tension on a uniform strip. All joints carry the
# same stress, so the macroscopic peak must equal ft exactly (the joint
# penalty only softens the modulus, not the strength). No jitter, no scatter.
mode = fdem
scenario = tension
T = 6e-4
frames = 10

W = 0.06
H = 0.12
nx = 24
ny = 48
meshJitter = 0.0

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
pullV = 0.05
dampingLocal = 0.7

# jointXi = 0 : cette verification mesure la LOI de joint (le pic doit valoir
# ft exactement), pas la dissipation visqueuse. Une fois le signe du dashpot
# corrige il dissipe pour de bon, et a jointXi = 0,05 il abaisse le pic de
# 6,6 points (-1,39 % contre -7,96 %). Plusieurs codes etablis (OpenFDEM,
# Akantu, Yade JCFPM) n'ont d'ailleurs aucun dashpot au joint.
jointXi = 0.0

hydro = on
hydroSource = all
hydroInjection = pressure
hydroPressure = 0
