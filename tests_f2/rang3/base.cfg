# Rang 3 (feuille de route acceleration, 2026-10-03) : micro-banc dynamique du
# basculement de raideur cohesif/contact (Ghesquiere-Dierickx, Molinari, Anciaux
# 2025, arXiv 2511.14323, par. 3.2). Deux tetraedres reguliers (arete 1 mm),
# deux corps lies par UN joint (groupBond.A.B = joints) ; A encastre, B lance
# vers +z : le joint s ouvre, s endommage sans casser, puis B oscille librement
# entre traction (raideur adoucie) et compression (pj plein sous
# jointContactPenalty = fixed, (1-D) pj sous adaptive). Loi de joint du deck v3P.
mode = fdem3d
scenario = loads
mesh = file
meshFile = tests_f2/rang3/deux_tets.msh
T = 2e-5
frames = 1
historyFlush = true
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20
jointPenaltyFactor = 20
jointElastic = parabolic
jointSoftening = munjiza
jointShearEnvelope = yang
jointShearRange = coulomb
jointShearUnload = plastic
jointSecantRatchet = on
jointResidualMu = 0
jointDeath = damage
jointXi = 0
jointQuadrature = midedge
jointDeltaC = solidity
jointFailRule = majority
contact = potential
dampingLocal = 0
groupBond.A.B = joints
fix.A = all
groupVel.B = 0 0 5.0
trackGroups = B
