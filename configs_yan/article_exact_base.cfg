# ---------------------------------------------------------------------------
# PRESET « article exact » — toutes les formes LITTERALES de Yan et al. 2023
# activees. A inclure en fin de config (derniere cle gagne) ou copier dans un
# cas : c'est la base commune de la branche article-exact.
#
# Etat de la parite structurelle (voir PLAN_article_exact.md) :
#   FAIT  eq. 7-8   critere d'insertion            (identique depuis toujours)
#   FAIT  eq. 9/11-17 loi cohesive f(D) + secante  (identique / kI calibre Gf)
#   FAIT  eq. 10    f(D) sur TOUT le cap           (jointFrictionScaled = 1)
#   FAIT  eq. 21    extremite SHPB -2 rho c v      (absorbFactor = 2)
#   FAIT  eq. 6     terme visqueux 2*mu*D          (bulkViscosity, Table 1)
#   FAIT  eq. 18    decharge cisaillement sur la secante a l'origine
#                                                  (jointShearUnload = origin)
#   RESTE eq. 2-5   contact par POTENTIEL de Munjiza + NBS (penalite noeud-
#         arete aujourd'hui — LE chantier B, plan et jalons dans le PLAN)
# ---------------------------------------------------------------------------
insertion = adaptive
insertionPenaltyFactor = 4
jointSoftening = yan
yanA = 0.63
yanB = 1.8
yanC = 6.0
jointFrictionScaled = 1        # eq. 10 litterale : f(D) multiplie le Coulomb
jointShearUnload = origin      # eq. 18 : decharge/recharge sur la secante a
                               # l'origine. A COUPLER a jointFrictionScaled = 1
                               # (sinon le frottement de Coulomb, porte par la
                               # secante, devient reversible)
bulkViscosity = 7.6e3          # eq. 6 : 2*mu*D, mu de la Table 1 [Pa.s]
dampingLocal = 0               # PAS de Cundall : l'amortissement de
                               # l'article est le visqueux ci-dessus
jointXi = 0                    # pas de dashpot de joint (absent chez eux)
absorbFactor = 2               # eq. 21 litterale (SHPB seulement)
# Materiau Table 1 (a poser dans le cas si non herite) :
# rho = 1704 / E = 15e9 / nu = 0.24 / ft = 1.3e6 / cohesion = 16.4e6
# frictionDeg = 23 / Gf = 3.8 / gfShearFactor = 22.105   # GfII/GfI = 84/3.8
