# ---------------------------------------------------------------------------
# TRIAXIAL 2D FEMDEM — GBM A TROIS PHASES POLYDISPERSES, confinement 20 MPa
# Genere par configs_yan/gen_tx_gbm3.py (y lire le detail des choix).
#
# Banc      : Yan, Zheng & Wang (IJRMMS 169, 2023), eprouvette 36 x 72 mm,
#             plateaux rigides frottants, confinement lateral rampe puis
#             chargement axial a 0,1 m/s, arret automatique apres le pic.
# Schema    : insertion ADAPTATIVE des cohesifs + loi de Yan (jointSoftening).
# Micro     : Voronoi/Laguerre a TROIS phases, TAILLES DE GRAIN DISTINCTES
#             REALISEES quartz 6,9 > feldspar 5,4 > biotite 3,1 mm (facteur 2,2
#             sur la phase fine), polydispersite log-normale 0,35 au sein de
#             chaque phase, 38 elements par grain de feldspath et 62 de quartz.
#             ATTENTION : les cles `phase.<nom>.grainSize` du deck sont des
#             cibles SUR-SPECIFIEES, pas les tailles obtenues — voir la NOTE du
#             generateur.
# Maillage  : intra-grain Delaunay NON STRUCTURE (grainMeshRandom) — regle 8.4
#             de DOCUMENTATION_rockim.md : un maillage structure en FDEM est une
#             condition d'invalidite.
# Interfaces: gbAlpha* = 0,7 (chi_t = chi_G de l'eq. 21 de la note 2026) et
#             surcharges par paire — les joints au contact de la biotite sont
#             les plus faibles, quartz-quartz le plus resistant.
#
#   rockim_g1fix.exe configs_yan/tx_gbm3_20.cfg out_tx_gbm3_20
#
# A LIRE DANS LE JOURNAL : la distribution de taille REALISEE par phase, le
# nombre de joints intra / homophase / heterophase, et le mode de rupture
# (tensile / shear) — c'est la que se voit l'effet de la microstructure.
# ---------------------------------------------------------------------------

mode = fdem
scenario = tension
loading = platens
T = 1.0e-2
frames = 24

# --- eprouvette (banc de Yan) ---------------------------------------
W = 0.036
H = 0.072
thickness = 1.0

# --- microstructure : Voronoi/Laguerre 3 phases polydisperses -------
mesh = voronoi
grainSize = 0.0045                # taille de reference (phases la surchargent)
grainSeeding = random             # exige par grainSizeSpread
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainMeshRandom = true          # OBLIGATOIRE en GBM (DOC 5.16 bis, regle 8.4)
grainElemSize = 0.0011            # 38 el./grain feldspath, 62 quartz (regle 35-90)
grainSizeSpread = 0.35            # ecart-type de ln(taille) DANS chaque phase
seed = 4211

# --- materiau de reference (herite par les phases non surchargees) --
rho = 2600
E = 70e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 22.105            # banc de Yan, inchange

# --- les TROIS phases -----------------------------------------------
phases = quartz feldspar biotite

phase.quartz.fraction = 0.33
phase.quartz.grainSize = 0.006
phase.quartz.rho = 2650
phase.quartz.E = 9.4e+10
phase.quartz.nu = 0.08
phase.quartz.ft = 1.3e+07
phase.quartz.cohesion = 3e+07
phase.quartz.frictionDeg = 45
phase.quartz.Gf = 90

phase.feldspar.fraction = 0.59
phase.feldspar.grainSize = 0.012
phase.feldspar.rho = 2560
phase.feldspar.E = 7e+10
phase.feldspar.nu = 0.29
phase.feldspar.ft = 1e+07
phase.feldspar.cohesion = 2.5e+07
phase.feldspar.frictionDeg = 40
phase.feldspar.Gf = 70

phase.biotite.fraction = 0.08
phase.biotite.grainSize = 0.0008
phase.biotite.rho = 3050
phase.biotite.E = 3.4e+10
phase.biotite.nu = 0.25
phase.biotite.ft = 7e+06
phase.biotite.cohesion = 1.5e+07
phase.biotite.frictionDeg = 30
phase.biotite.Gf = 40

# --- joints de grain : regle generale puis surcharges par paire -----
gbAlphaTen = 0.7                  # chi_t, eq. 21 de la note 2026
gbAlphaCoh = 0.7
gbAlphaGf = 0.7                   # chi_G
gbAlphaE = 1.0                    # la raideur n'est pas affaiblie
gbAlphaFric = 1.0

gb.biotite.biotite.ft = 2e+06
gb.biotite.biotite.cohesion = 5e+06
gb.biotite.biotite.Gf = 12
gb.biotite.biotite.frictionDeg = 18

gb.biotite.feldspar.ft = 3.5e+06
gb.biotite.feldspar.cohesion = 8e+06
gb.biotite.feldspar.Gf = 20
gb.biotite.feldspar.frictionDeg = 24

gb.biotite.quartz.ft = 3.5e+06
gb.biotite.quartz.cohesion = 8e+06
gb.biotite.quartz.Gf = 20
gb.biotite.quartz.frictionDeg = 24

gb.quartz.quartz.ft = 9e+06
gb.quartz.quartz.cohesion = 2.1e+07
gb.quartz.quartz.Gf = 60
gb.quartz.quartz.frictionDeg = 42

# --- schema : insertion adaptative + loi de Yan ----------------------
insertion = adaptive
jointSoftening = yan
insertionPenaltyFactor = 4
contactMu = 0.1
dampingLocal = 0.7                # quasi-statique : amortit les ondes
jointXi = 0.0

# --- chargement et confinement (protocole du banc) -------------------
pullV = -0.1
pullRamp = 2e-4
pullDelay = 6.0e-4                # laisse le confinement s'etablir
confiningPressure = 20e6
confiningRamp = 2e-4
confineFaces = sides
confineGaugeTime = 5.0e-4
ucsStopAfterPeak = true
ucsStopDelay = 2.0e-4
gaugeLoFrac = 0.25
gaugeHiFrac = 0.75
