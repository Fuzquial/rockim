# ---------------------------------------------------------------------------
# bd_yan_calibre.cfg — bresilien de Yan, Zheng & Wang (IJRMMS 169, 2023),
# section 3.2 / fig. 11-14, CALIBRE METROLOGIQUEMENT.
#
# Base : configs/bd_yan_adaptatif.cfg. Ce qui change et pourquoi (tous les
# chiffres viennent de runs mesures — voir protocole_bresilien.md) :
#
#   1. elasticGaugeLo / elasticGaugeHi : la jauge elastique est lue sur la
#      BANDE sigma_t = [0,3 ; 0,8] x ft. Elle sort a 1,001 (attendu 1). La
#      jauge historique (dernier pas avant la premiere rupture) sort a 0,227
#      parce qu'a cet instant sigma_t = 1,84 x ft : le centre a deja plastifie
#      et 2P/(pi D t) ne le decrit plus. Rien dans la geometrie du plateau
#      n'est en cause — voir protocole_bresilien.md section 2.
#   2. brazilianStopAfterPeak : l'essai s'arrete 60 us apres le verrouillage du
#      pic (premiere chute franche a 70 % du pic). Au-dela, les plateaux
#      ecrasent les deux demi-disques et sigma_t remonte a 2,17 MPa pour une
#      raison purement cinematique. La fig. 13a de l'article s'arrete la.
#      Gain de calcul mesure : arret a 96 589 pas sur les 180 471 du plafond
#      T = 1,1 ms, soit 46 % de pas economises (run mesure : 56,6 s de temps
#      machine, cadence 0,59 ms/pas identique au run complet).
#   3. T rallonge a 1,1 ms : marge de securite au-dela du pic (t = 0,51 ms a
#      0,1 m/s) ; l'arret anticipe rend ce plafond gratuit.
#   4. pullV et dampingLocal INCHANGES par rapport a l'article (0,1 m/s total,
#      0,1). Surcharge dynamique residuelle assumee : +9,4 % sur sigma_t.
#      Pour un point quasi-statique de reference, mettre pullV = 0,02
#      (+3,4 %, T = 4,5e-3) — c'est 3 fois plus cher.
#   5. platenHalfWidth et discFlattenDeg INCHANGES : le balayage montre que
#      2,5 mm donne la MEILLEURE jauge (0,994) et qu'elargir le plateau
#      jusqu'au meplat (4,41 mm) ou jusqu'au rayon la DEGRADE (0,943 / 0,937).
# ---------------------------------------------------------------------------
mode = fdem
scenario = brazilian
geometry = disc
T = 1.1e-3
frames = 24

W = 0.0508
H = 0.0508
thickness = 1.0

mesh = voronoi
grainSize = 0.006
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.00150
seed = 4211

rho = 1704
E = 15e9
nu = 0.24
ft = 1.3e6
cohesion = 16.4e6
frictionDeg = 23
Gf = 3.8
gfShearFactor = 22.105
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

brazilianLoading = platens
pullV = 0.1
pullRamp = 2e-4
platenHalfWidth = 0.0025
contactMu = 0.1
dampingLocal = 0.1
jointXi = 0.0

insertion = adaptive
jointPenaltyFactor = 100
insertionPenaltyFactor = 4
discMesh = native
discFlattenDeg = 20

# --- metrologie (nouvelles cles du patch protocole_bresilien.patch) ---
# jauge elastique lue sur la bande de charge ou 2P/(pi D t) est valable
elasticGaugeLo = 0.3
elasticGaugeHi = 0.8
# fin d'essai : arret 60 us apres le verrouillage du pic
brazilianStopAfterPeak = true
brazilianStopDelay = 6e-5

# loi cohesive de l'article (eq. 11, a=0,63 b=1,8 c=6) — active pour la
# campagne de reproduction des figures ; retirer pour retrouver le lineaire
jointSoftening = yan
