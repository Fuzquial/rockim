# ---------------------------------------------------------------------------
# ETUDE DE TAILLE — UCS 2D FEMDEM homogene, 2.2 x 4.5 mm, graine 99
# Genere par configs_yan/gen_size_study.py (y lire la question posee).
#
# Taille de maille h = 1,5 mm IDENTIQUE a tous les crans ; seule l'EPROUVETTE
# change. pullV mis a l'echelle de H pour tenir eps_point = 1.389 /s partout.
# Materiau : cas `gfs5` du balayage — l_ch,II = E G_fII / c^2 = 39,2 mm.
#   rapport l_ch,II / W =  17.4   (effet d'echelle attendu au-dela de ~1)
#
#   rockim_g1fix.exe configs_yan/size_L4_s99.cfg out_size_L4_s99
# ---------------------------------------------------------------------------

mode = fdem
scenario = tension
loading = platens
T = 3.5e-3
frames = 12
historyFlush = true

W = 0.00225
H = 0.0045
thickness = 1.0
mesh = file
meshFile = meshes/ucs2d_22x45_s99.msh

rho = 2600
E = 7e+10
nu = 0.25
ft = 1e+07
cohesion = 2.5e+07
frictionDeg = 40
Gf = 70
gfShearFactor = 5

insertion = adaptive
jointSoftening = yan
insertionPenaltyFactor = 4
contactMu = 0.1
dampingLocal = 0.7
jointXi = 0.0

pullV = -0.00625                  # eps_point = 1.389 /s, comme tous les crans
pullRamp = 2e-4
gaugeLoFrac = 0.25
gaugeHiFrac = 0.75
ucsStopAfterPeak = true
ucsStopDelay = 2.0e-4
stopPeakDrop = 0.35
