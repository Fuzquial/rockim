# ---------------------------------------------------------------------------
# UCS 2D FEMDEM, eprouvette HOMOGENE, maillage NON STRUCTURE — cas « brittle »
# Genere par configs_yan/gen_ucs_sweep.py (y lire le detail du balayage).
#
# Banc    : Yan, Zheng & Wang (IJRMMS 169, 2023) — 36 x 72 mm, plateaux
#           rigides frottants a 0,1 m/s, confinement NUL.
# Schema  : insertion ADAPTATIVE + loi de Yan (jointSoftening).
# Maillage: NON STRUCTURE importe (Gmsh Delaunay + Netgen), AUCUNE
#           microstructure — ni phases, ni grains, ni frontieres (regle 8.4 :
#           un maillage structure est une condition d'invalidite ; et la regle
#           de la these impose mesh = file pour tout essai lu en facies).
#
# Ce cas : Gf = 10, gfShearFactor = 5
#   l_ch,I  = E G_fI  / f_t^2 =    7.0 mm
#   l_ch,II = E G_fII / c^2   =    5.6 mm      (eprouvette : 36 x 72 mm)
#
#   rockim_g1fix.exe configs_yan/ucs_sw_brittle.cfg out_ucs_sw_brittle
# ---------------------------------------------------------------------------

mode = fdem
scenario = tension
loading = platens
T = 3.5e-3
frames = 20
historyFlush = true

# --- eprouvette -----------------------------------------------------
W = 0.036
H = 0.072
thickness = 1.0

# --- maillage : NON STRUCTURE IMPORTE, aucune microstructure --------
# `mesh = voronoi` a UNE phase n'est PAS un milieu homogene : la
# tessellation cree un reseau de joints ALIGNE sur les frontieres de
# cellules, chemins de fissuration privilegies meme a materiau
# identique. DOCUMENTATION_rockim.md : « la regle de la these impose
# mesh = file pour tout essai lu en FACIES ou en energie de bande ».
# Maillage genere par :
#   python tools/make_unstructured_mesh.py box2d 0.036 0.072 0.0015 \
#          meshes/ucs2d_h15.msh 4211
# Delaunay + optimisation Netgen (Gmsh), 3192 triangles, 4796 noeuds.
mesh = file
meshFile = meshes/ucs2d_h15.msh

# --- materiau HOMOGENE (une seule phase) ----------------------------
rho = 2600
E = 7e+10
nu = 0.25
ft = 1e+07
cohesion = 2.5e+07
frictionDeg = 40
Gf = 10
gfShearFactor = 5               # G_fII = 50 J/m2

# --- schema ---------------------------------------------------------
insertion = adaptive
jointSoftening = yan
insertionPenaltyFactor = 4
contactMu = 0.1
dampingLocal = 0.7               # quasi-statique
jointXi = 0.0

# --- chargement (UNIAXIAL : aucun confinement) ----------------------
pullV = -0.1
pullRamp = 2e-4
gaugeLoFrac = 0.25
gaugeHiFrac = 0.75
ucsStopAfterPeak = true
ucsStopDelay = 2.0e-4
stopPeakDrop = 0.35
