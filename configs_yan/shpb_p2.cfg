# ---------------------------------------------------------------------------
# Essai SHPB de Yan, Zheng & Wang (IJRMMS 169, 2023) — section 3.4, fig. 22-25.
# Materiaux de leur Table 2 : la roche et l'acier des barres sont portes par
# DEUX PHASES minerales, un corps = un "grain", donc les tables par phase du
# solveur (D, rho, cP) et le lumping de masse marchent tels quels.
# ---------------------------------------------------------------------------
mode = fdem
scenario = shpb
geometry = shpb

phases = bar rock
phase.bar.fraction  = 0.5
phase.bar.rho       = 7700
phase.bar.E         = 240e9
phase.bar.nu        = 0.01
# les barres restent elastiques : resistances tres elevees pour qu'aucun joint
# ne s'active dedans (l'article ne leur donne pas de resistance)
phase.bar.ft        = 1e12
phase.bar.cohesion  = 1e12
phase.bar.Gf        = 1e6

phase.rock.fraction = 0.5
phase.rock.rho      = 2800
phase.rock.E        = 100.8e9
phase.rock.nu       = 0.297
phase.rock.ft       = 30e6
phase.rock.cohesion = 65e6
phase.rock.frictionDeg = 59
phase.rock.Gf       = 100
phase.rock.gfShearFactor = 2.2      # GfII = 220 N/m

# proprietes globales = celles de la roche (jauge, dt, messages)
rho = 2800
E = 100.8e9
nu = 0.297
ft = 30e6
cohesion = 65e6
frictionDeg = 59
Gf = 100
gfShearFactor = 2.2

# ---- impulsion de vitesse sur la face frappee ------------------------------
# Demi-sinus v(t) = 5,2 sin(pi t / 220 us) m/s. L'article dit seulement
# "fitted experimental data" ; son encart fig. 22 montre une impulsion unique
# lisse culminant a 5,2 m/s vers 90 us et revenant a 0 vers 220 us.
# Justification de l'amplitude : dans une barre, eps = -v/c avec
# c = sqrt(E/rho) = 5583 m/s, donc eps_pic = 5,2/5583 = 9,31e-4, exactement le
# pic incident de la fig. 23 (-0,90 a -0,92 e-3).
shpbPulse = halfsine
shpbPulseV0 = 5.2
shpbPulseTau = 2.2e-4

# ---- frontiere visqueuse (eq. 21) : absorbFactor = 1 = Lysmer adapte -------
absorbFactor = 1.0

contactMu = 0.577          # k_c barre/roche (Table 2)
gcPenaltyFactor = 1.0      # penalite de contact = E*t
gcRestitution = 1.0        # interface elastique, pas de contact quasi-plastique
gcXi = 0.05
dampingLocal = 0.0         # aucun amortissement artificiel : on mesure l'onde
jointXi = 0.0
seed = 4211

# ---- montage complet barre - disque - barre (fig. 22) ----------------------
shpbIncidentLength = 2.00
shpbTransmitLength = 1.50
shpbBarDiameter = 0.05
shpbDiscDiameter = 0.050
shpbBarElemSize = 0.01
shpbDiscElemSize = 0.00075       # maille de l'article
shpbGap = 0.0
shpbMonitor1 = 1.00              # L_M1 = 1,00 m avant le disque
shpbMonitor2 = 3.05              # L_M2 = 1,00 m apres le disque
shpbGaugeHalfLength = 0.02
gcXwindow = 0.10
frames = 40
dtFactor = 0.2
T = 6e-4
insertion = intrinsic
insertionPenaltyFactor = 4

# loi cohesive de l'article (eq. 11, a=0,63 b=1,8 c=6) — active pour la
# campagne de reproduction des figures ; retirer pour retrouver le lineaire
jointSoftening = yan
jointPenaltyFactor = 2
