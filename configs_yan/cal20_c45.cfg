# ---------------------------------------------------------------------------
# CALIBRATION Red Bohus, triaxial sigma_3 = 20 MPa — point « c45 »
# Genere par configs_yan/gen_calib20.py (y lire la cible et le protocole).
#
# Cible : q_pic 404,8 +- 2,8 MPa | eps_pic 0,661 % | E 76,3 +- 1,3 GPa
# Ce point : c = 45 MPa, phi = 40 deg, G_fII = 350 J/m2
#            l_ch,II = E G_fII / c^2 =  12.1 mm   (eprouvette W = 18 mm)
#
# Eprouvette L1 (18 x 36 mm, 766 triangles, maillage non structure importe) :
# rend le module a -0,4 % et le pic a +1,7 % de l'eprouvette pleine, pour 8
# fois moins cher. L'objectif ne porte PAS sur l'adoucissement (le post-pic
# de L1 differe : pas de snap-back de jauge).
#
#   rockim_g1fix.exe configs_yan/cal20_c45.cfg out_cal20_c45
# ---------------------------------------------------------------------------

mode = fdem
scenario = tension
loading = platens
T = 8.0e-3
frames = 16
historyFlush = true

W = 0.018
H = 0.036
thickness = 1.0
mesh = file
meshFile = meshes/ucs2d_180x360_s4211.msh

rho = 2600
E = 7e+10
nu = 0.25
ft = 1e+07
cohesion = 4.5e+07
frictionDeg = 40
Gf = 70
gfShearFactor = 5

insertion = adaptive
jointSoftening = yan
insertionPenaltyFactor = 4
contactMu = 0.1
dampingLocal = 0.7
jointXi = 0.0

# --- chargement : confinement etabli AVANT la phase deviatoire ------
pullV = -0.05
pullRamp = 2e-4
pullDelay = 6.0e-4
confiningPressure = 2e+07
confiningRamp = 2e-4
confineFaces = sides
confineGaugeTime = 5.0e-4
gaugeLoFrac = 0.25
gaugeHiFrac = 0.75
ucsStopAfterPeak = true
ucsStopDelay = 2.0e-4
stopPeakDrop = 0.35
