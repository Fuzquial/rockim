# ---------------------------------------------------------------------------
# TUNNEL EDZ AVEC SCHISTOSITE VRAIE — PLANS PARALLELES A 0 deg
#
#   rockim_f2g.exe tunnel_schisto\tunnel_wp00.cfg out_wp00
#   (depuis la RACINE de rockim_f2 : meshFile est relatif au cwd)
#
# ===========================================================================
# CE QUI CHANGE PAR RAPPORT AU DECK PRECEDENT — ET POURQUOI
# ===========================================================================
# Le deck tunnel_schisto_b45.cfg posait un CHAMP CORRELE anisotrope
# (strengthCorrLengthB / strengthCorrAngleDeg). Ce n est pas une schistosite :
# il produit des TACHES allongees, et un joint y est faible parce qu il est au
# mauvais ENDROIT, jamais parce qu il est dans la bonne DIRECTION. Deux joints
# voisins et perpendiculaires y ont la meme resistance.
#
# Ce deck-ci pose la chose demandee : une FAMILLE DE PLANS PARALLELES, de
# pendage 45 deg et d espacement 1,5 m, dont les joints portent des proprietes
# mecaniques reduites. C est le sens strict du mot schistosite.
#
# ===========================================================================
# CE QUE L ARTICLE DE REFERENCE FAIT — ET NE FAIT PAS
# ===========================================================================
# Wang et al., Front. Earth Sci. 12:1517816 (2024), tunnel de Hutou Beishan.
# Leur figure 4 montre bien du SCHISTE dans la geologie traversee, mais leur
# MODELE ne represente aucune schistosite : page 11, « the model assumes
# isotropy ». Leur tableau 1 est un jeu de proprietes unique et isotrope.
#
# Consequence a assumer et a ecrire dans toute figure : la schistosite N EST
# PAS une reproduction de l article. L article fournit la REFERENCE HOMOGENE
# (a reproduire d abord) ; la schistosite est un apport propre.
#
# Leurs chiffres de reference, a sigma0 = 5 MPa hydrostatique :
#   rayon d EDZ                = 19 m        (leur fig. 12f)
#   deplacement maximal        = 0,347 m     (leur fig. 14a)
#   morphologie                = fissures conjuguees en X, CISAILLEMENT
#                                dominant (leur fig. 8)
#   a lambda = 1, l EDZ est CIRCULAIRE       (leur fig. 15c/f)
#
# Ce dernier point est capital : leur propre resultat etablit l HYPOTHESE
# NULLE. A lambda = 1 le champ est axisymetrique et leur EDZ est ronde. Toute
# ellipticite mesuree ici vient donc de la schistosite et de rien d autre.
#
# ===========================================================================
# LES PREDICTIONS, INSCRITES AVANT LANCEMENT
# ===========================================================================
#   H0 : l EDZ reste ronde (h/v dans [1,0 ; 1,4], le plancher de bruit mesure
#        sur out_tun_corr_th4) et le grand axe ne tourne pas avec le pendage.
#        Les plans ne commanderaient alors rien.
#   H1 : le grand axe de l EDZ TOURNE AVEC LE PENDAGE. C est le test decisif,
#        bien plus que l amplitude : il se lit sur les trois runs entre eux et
#        ne depend d aucun temoin exterieur.
#   H2 : l EDZ s allonge PERPENDICULAIREMENT aux plans. Ce serait un resultat
#        en soi — la rupture se propagerait EN TRAVERS des plans faibles.
#
# Controle independant : la distribution angulaire des joints rompus
# (crack_orientation.py) doit piquer a 45 deg si les fissures suivent les
# plans. Mesure directe, qui ne passe pas par la forme de l EDZ.
#
# ===========================================================================
# LE DIMENSIONNEMENT — ET LE CHIFFRE QU IL FAUT LIRE DANS LE JOURNAL
# ===========================================================================
# espacement 1,5 m : en paroi dx = 0,21 m, donc ~7 elements entre deux plans.
#   C est le minimum pour que deux plans voisins soient des entites
#   mecaniques distinctes. Le solveur AVERTIT si l espacement descend sous
#   4 x la longueur d arete moyenne.
#
# weakPlaneFactor = 0,40 : ft et cohesion des plans a 40 % de la matrice.
#   Mesure du 2026-09-01 sur eprouvette de traction : un facteur 0,35 donne un
#   rapport de resistance perpendiculaire/parallele de 2,6, ce qui tombe dans
#   la fourchette 2-4 rapportee pour les argilites schisteuses.
#
# weakPlaneGf = follow (DEFAUT) : Gf suit le facteur, donc la longueur de zone
#   cohesive l_cz = E Gf / ft^2 reste INCHANGEE sur les plans. Avec « keep »,
#   l_cz exploserait en 1/0,40^2 = 6,25 et vaudrait 3,5 m — soit plus du
#   double de l espacement : le plan cesserait alors d etre une entite
#   distincte. C est le piege que le champ correle avait, sans le voir.
#
# >>> LIRE « CONTINUITE » DANS LE JOURNAL. C est le rapport de la longueur
#     reellement affaiblie a la longueur ideale des plans. Sous 0,5 les plans
#     sont des troncons epars et le run n est PAS comparable aux autres
#     pendages. Mesure du 2026-09-01 : sur l eprouvette de traction, deux
#     pendages sur sept sont tombes a 0,25 et 0,30 et ont du etre rejetes.
#     Verifier ce chiffre AVANT d interpreter quoi que ce soit.
#
# ===========================================================================
# RESERVE ASSUMEE
# ===========================================================================
# Le plan discret suit les aretes du maillage, donc en zigzag. C est la meme
# approximation que pour TOUTE fissure en FDEM — une fissure ne peut pas non
# plus quitter les faces d elements — mais elle rend le plan legerement plus
# resistant qu un plan lisse. L effet mesure est donc une BORNE INFERIEURE.
# Le remede serait un maillage conforme aux plans ; il n est pas ecrit.
#
# La roche reste par ailleurs ELASTIQUEMENT ISOTROPE : une vraie schistosite
# donne aussi E_parallele != E_perpendiculaire. Seule la resistance est
# anisotrope ici.
#
# ===========================================================================
# COUT
# ===========================================================================
# 106 298 triangles, dt = 3,05e-06 s, T = 0,7 s -> ~229 450 pas,
# environ 4 h 18 par run (mesure sur out_tun_corr_th4). Trois pendages =
# ~13 h SEQUENTIELLES, un job a la fois.
#
#   python ..\rockim\rockim_p1\tunnel_edz\tools\edz_metrics.py       out_wp00
#   python ..\rockim\rockim_p1\tunnel_edz\tools\crack_orientation.py out_wp00
#
# SEULES tunnel_wp00 / wp45 / wp90 different, et par la SEULE valeur du
# pendage dans weakPlanes : le balayage est a variable unique.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension          # sert de BOITE A ROULEAUX (pullV = 0)
mesh = file
meshFile = meshes/tunnel_hs_iso.msh
thickness = 1.0
T = 0.7
frames = 34

# --- materiau : leur Table 1 -----------------------------------------------
rho = 2650
E = 10e9
nu = 0.26
ft = 0.6e6
cohesion = 0.8e6
frictionDeg = 34
Gf = 20
gfShearFactor = 5           # GfII / GfI = 100 / 20
crushCap = 1e12             # volume ELASTIQUE, comme leur fig. 1

# --- contrainte in situ ----------------------------------------------------
insituSh = 5e6              # pressions POSITIVES = compression
insituSv = 5e6              # lambda = 1 : leur fig. 15c donne une EDZ RONDE,
                            # donc toute ellipticite vient des plans

# --- excavation ------------------------------------------------------------
excavRelease = true
excavStart = 0.02
excavRamp = 0.08
boreCX = 50.0
boreCY = 50.0
boreSelectR = 8.0

# --- conditions aux limites : boite a rouleaux -----------------------------
pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none
verifyFt = false

# --- SCHISTOSITE : FAMILLE DE PLANS PARALLELES -----------------------------
# <<< LA SEULE CLE DU BALAYAGE : le pendage. 0 / 45 / 90.
weakPlanes = 0 1.5         # pendage [deg depuis l horizontale], espacement [m]
weakPlaneFactor = 0.40      # ft et cohesion des plans / matrice
weakPlaneAngleDeg = 25      # tolerance d orientation des aretes retenues
weakPlaneGf = follow        # DEFAUT explicite : l_cz inchangee sur les plans
# weakPlaneFrictionDeg      # non pose : frottement de la matrice conserve
# weakPlaneOffset           # non pose : la famille passe par l origine

# --- schema (les capacites validees du solveur) ----------------------------
insertion = adaptive        # REQUIS : l'etat in situ initial est alors exact
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15         # relaxation quasi-statique
jointXi = 0.01

# --- garde-fous ------------------------------------------------------------
budgetAbortPct = 0
budgetAbortMin = 1e3
