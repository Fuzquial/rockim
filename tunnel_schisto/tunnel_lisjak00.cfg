# ---------------------------------------------------------------------------
# TUNNEL EDZ — SCHISTOSITE PERVASIVE, METHODE DE LISJAK (les trois briques)
# pendage 0 deg
#
#   rockim_f2i.exe tunnel_schisto\tunnel_lisjak00.cfg out_lisjak00
#   (depuis la RACINE de rockim_f2 : meshFile est relatif au cwd)
#
# ===========================================================================
# CE QUE CE DECK EST — ET CE QU IL REMPLACE
# ===========================================================================
# Reference : Lisjak, these Toronto 2013, ch. 5 ; Lisjak, Grasselli & Vietor
# 2014, IJRMMS 65:96-115 ; cas reel Lisjak et al. 2015, TUST 45:227-248.
# C est l approche de la litterature FDEM pour une roche litee a l echelle
# de l ouvrage. Elle remplace tunnel_wp45.cfg (plans discrets espaces de
# 1,5 m, roche elastiquement isotrope) — configuration sans equivalent dans
# le corpus confirme, et que l auteur de l approche discrete a lui-meme
# declaree « unsuitable for field-scale models » (espacement metrique
# impose par la maille, delamination impossible a capturer).
#
# Les TROIS briques sont armees ; aucune ne suffit seule :
#   1. elasticite transversalement isotrope (beddingEperp/NuPerp/Gperp)
#   2. loi cohesive directionnelle (beddingXxRatio), min a gamma = 0
#   3. maillage a aretes alignees sur le litage (meshes/tunnel_hs_bed00.msh,
#      t = 0,35 m, h = 0,12 m, continuite 1,015 — voir _bedded_gen.log)
#
# ===========================================================================
# L ARTICLE DE REFERENCE (Wang et al. 2024) NE MODELISE PAS LA SCHISTOSITE
# ===========================================================================
# Page 11 : « the model assumes isotropy ». Leur table 1 est un jeu isotrope
# unique. Leur fig. 15c/f etablit qu a lambda = 1 l EDZ est CIRCULAIRE :
# c est l HYPOTHESE NULLE. Toute ellipticite mesuree ici vient du litage.
# Chiffres a sigma0 = 5 MPa : rayon d EDZ 19 m (fig. 12f), deplacement max
# 0,347 m (fig. 14a), fissures conjuguees en X a dominante cisaillement.
#
# ===========================================================================
# LES PARAMETRES D ANISOTROPIE — ET LEUR PROVENANCE
# ===========================================================================
# Wang ne donne AUCUNE constante anisotrope. On prend les RAPPORTS de Lisjak
# (Opalinus, table 5.1) appliques au materiau de Wang : ce sont des rapports
# d argilite a argilite, pas des valeurs absolues. A ecrire dans toute
# figure : « anisotropie d apres Lisjak (2013), rapports Opalinus ».
#   elastique : E'/E = 1,3/3,8 = 0,342 ; nu' = 0,25 ; G'/E = 0,9/3,8 = 0,237
#   cohesif   : ft 0,246 ; c 0,111 ; GIc 0,057 ; GIIc 0,286 ; phi constant
# Le deck porte les MAXIMA (gamma = 90) : les valeurs de Wang.
#
# ===========================================================================
# LES PREDICTIONS, INSCRITES AVANT LANCEMENT
# ===========================================================================
#   H0 : EDZ ronde (h/v dans [1,0 ; 1,4], plancher de bruit de
#        out_tun_corr_th4), grand axe insensible au pendage.
#   H1 : le grand axe de l EDZ TOURNE AVEC LE PENDAGE (test decisif, se lit
#        sur les trois runs entre eux). Mecanisme attendu (Lisjak fig. 5.7) :
#        glissement des plans de litage critiquement orientes, deconfinement,
#        ecaillage en extension — donc concentration d endommagement la ou la
#        contrainte orthoradiale est TANGENTE au litage, pas perpendiculaire.
#   H2 : grand axe PERPENDICULAIRE au litage — resultat en soi.
# Controle independant : crack_orientation.py doit piquer a 45 deg.
# Controle de convergence (le seul qui tranche « pourquoi t = 35 cm ») :
#   refaire a t = 0,25 m (h = 0,085) et verifier que h/v ne bouge pas.
#
# ===========================================================================
# COUT — HONNETEMENT
# ===========================================================================
# 303 907 triangles (2,9 x l isotrope) ET h = 0,12 m au lieu de 0,21 : le pas
# de temps tombe a 1,06e-6 s (3,05e-6 isotrope : maille plus fine ET c_P max
# 2556 au lieu de 2149 m/s), soit 662 000 pas au lieu de 229 000. Total 2,86 x 2,89 =
# 8,3 x le run isotrope de 4 h 18 : environ 35 HEURES PAR RUN, ~106 h pour les trois
# pendages, SEQUENTIELS, un job a la fois. C est le prix de la brique 3.
# Le raffinement est confine au disque r < 24 m ; au-dela, maille inchangee.
#
#   python ..\rockim\rockim_p1\tunnel_edz\tools\edz_metrics.py       out_lisjak00
#   python ..\rockim\rockim_p1\tunnel_edz\tools\crack_orientation.py out_lisjak00
#
# SEULS tunnel_lisjak00 / 45 / 90 different, et par DEUX lignes couplees :
# beddingDip et meshFile (le maillage lite est propre au pendage). Le
# balayage reste a variable unique — le pendage — puisque les trois
# maillages ont la meme statistique (comptes a 0,15 % pres, continuite
# 1,015-1,018).
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension          # sert de BOITE A ROULEAUX (pullV = 0)
mesh = file
meshFile = meshes/tunnel_hs_bed00.msh
thickness = 1.0
T = 0.7
frames = 34

# --- materiau : Wang table 1 = les valeurs DANS LE PLAN du litage ----------
rho = 2650
E = 10e9                    # E parallele au litage
nu = 0.26
ft = 0.6e6                  # MAXIMA (gamma = 90) : joints EN TRAVERS
cohesion = 0.8e6
frictionDeg = 34            # constant, non anisotrope (Lisjak)
Gf = 20
gfShearFactor = 5
crushCap = 1e12

# --- BRIQUE 1 : elasticite transversalement isotrope ----------------------
beddingDip = 0              # <<< LA VARIABLE DU BALAYAGE (avec meshFile)
beddingEperp = 3.42e9       # E' = 0,342 E   (rapport Opalinus 1,3/3,8)
beddingNuPerp = 0.25        # nu'            (Lisjak table 5.1)
beddingGperp = 2.37e9       # G' = 0,237 E   (rapport Opalinus 0,9/3,8)

# --- BRIQUE 2 : loi cohesive directionnelle (min a gamma = 0) -------------
beddingFtRatio = 0.246      # 0,16 / 0,65
beddingCohRatio = 0.111     # 1 / 9
beddingGfIRatio = 0.057     # 0,4 / 7,0
beddingGfIIRatio = 0.286    # 10 / 35

# --- contrainte in situ ----------------------------------------------------
insituSh = 5e6
insituSv = 5e6              # lambda = 1 : EDZ ronde chez Wang (fig. 15c)

# --- excavation ------------------------------------------------------------
excavRelease = true
excavStart = 0.02
excavRamp = 0.08
boreCX = 50.0
boreCY = 50.0
boreSelectR = 8.0

# --- conditions aux limites : boite a rouleaux -----------------------------
pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none
verifyFt = false

# --- schema (les capacites validees du solveur) ----------------------------
insertion = adaptive        # REQUIS : etat in situ initial exact, et aucune
                            # complaisance de penalite sur E (mesure t14b/c)
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01

# --- garde-fous ------------------------------------------------------------
budgetAbortPct = 0
budgetAbortMin = 1e3
