# ---------------------------------------------------------------------------
# B1 — OUVERTURE D'UNE DISCONTINUITE SOUS PRESSION UNIFORME
# AbuAisha, Eaton, Priest & Wong, J. Petrol. Sci. Eng. 154 (2017), annexe A,
# figures A.20 et A.21. Controle contre la SOLUTION ANALYTIQUE de Parker
# (1981, p. 33), leur equation A.1 :
#
#     w(x) = 2 sigma' (1 - nu^2) / E * sqrt(l^2 - x^2)
#
#   python bench_abuaisha/tools/make_crack_mesh.py 8.0 8.0 1.5 0.003 0.3 \
#          meshes/parker_crack.msh 1
#   rockim_tun.exe bench_abuaisha\configs\parker.cfg out_parker
#   python bench_abuaisha/tools/parker_check.py out_parker
#
# POURQUOI CE CAS EST SANS HYDRO PAR CONSTRUCTION. La discontinuite recoit une
# pression UNIFORME imposee, pas un fluide qui se propage ; et l'article donne
# a la resistance, a la cohesion et aux energies de rupture des valeurs
# « irreal high » pour empecher toute propagation. Il ne reste donc que de
# l'elasticite lineaire sous charge suiveuse — exactement ce que rockim sait
# faire. C'est le SEUL point de l'article confronte a une solution fermee.
#
# LE CHOIX DE LA CONTRAINTE NETTE. L'article pose sigma_h = 15 MPa lateral,
# sigma_v = 10 MPa vertical, et p = 12 MPa dans la fissure ; la solution ne
# depend que de sigma' = p - sigma_n = 12 - 10 = 2 MPa. On applique donc
# DIRECTEMENT 2 MPa sur une fissure dans un milieu non precontraint : meme
# sigma', meme ouverture, et surtout pas de levres plaquees l'une contre
# l'autre a t = 0 qu'il faudrait faire gerer au contact general. La variante
# precontrainte est un second essai, pas celui-ci.
#
# LES LEVRES. Le mailleur dedouble les noeuds de la ligne de fissure (greffon
# Crack de gmsh) : les deux levres sont des faces EXTERIEURES confondues a
# t = 0, sans joint entre elles. `confineFaces = bore` centre sur (4, 4) avec
# un rayon de 0,76 m les selectionne — et elles seules, le bord du bloc etant
# a 4 m.
#
# CIBLE CHIFFREE : w(0) = 2 x 2e6 x 0,96 x 0,75 / 45e9 = 0,0640 mm.
# Leur figure A.21 lit environ 0,065 mm. Le texte ecrit « E=45 MPa » : coquille
# pour 45 GPa, confirmee par cette arithmetique.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/parker_crack_c.msh
thickness = 1.0

# duree : la fissure doit atteindre son equilibre STATIQUE. Le bloc fait 8 m,
# c = sqrt(E/rho) = 4243 m/s, soit 1,9 ms par transit. On rampe sur 5 transits
# et on laisse 5 transits d'amortissement.
T = 0.02
frames = 20

# --- materiau : leur annexe A ----------------------------------------------
rho = 2500
E = 45e9
nu = 0.2
# « irreal high values » : rien ne doit casser, ni en traction ni en
# cisaillement. C'est la condition de validite de la comparaison a Parker.
ft = 1e9
cohesion = 2e9
frictionDeg = 38
Gf = 1e6
gfShearFactor = 8
crushCap = 1e12              # volume ELASTIQUE

# --- pas d'etat de contrainte initial : on applique la contrainte NETTE -----
insituSh = 0
insituSv = 0
excavRelease = false

# --- pression uniforme sur les deux levres ---------------------------------
confiningPressure = 0            # <- remplace par le module hydro
#confineFaces = bore
boreCX = 4.0
boreCY = 4.0
boreSelectR = 0.76           # demi-longueur 0,75 m + une maille de garde
#confiningRamp

# --- appuis ----------------------------------------------------------------
pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none
verifyFt = false

# --- schema ----------------------------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
# amortissement FRANC : on cherche la solution statique, pas la dynamique.
dampingLocal = 0.3
jointXi = 0.01

# --- H3 : PONT DE NON-REGRESSION du module hydro (spec 004) ----------------
# Le MEME probleme que parker_c.cfg, mais la pression de 2 MPa est portee par
# la cavite fluide au lieu de la pression de confinement. Physiquement
# identique : si la cavite, la connexite et le signe sont justes, l'ouverture
# doit etre LA MEME. Tout ecart est un bug, pas une physique.
hydro = on
hydroSource = bore              # les deux levres, dedoublees par gmsh Crack
hydroInjection = pressure
hydroPressure = 2e6
hydroRamp = 0.01                # meme rampe que confiningRamp
hydroP0 = 0
