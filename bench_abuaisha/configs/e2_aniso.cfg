# ---------------------------------------------------------------------------
# B2/B3/B4 — PRESSION DE RUPTURE AU FORAGE, etat de contrainte ANISOTROPE
# AbuAisha, Eaton, Priest & Wong, J. Petrol. Sci. Eng. 154 (2017), section 3,
# figures 6, 7, 9 et 11.
#
#   python tunnel_edz/tools/make_circle_mesh.py 8.0 8.0 0.05 0.003 0.4 0.3 \
#          meshes/hf_bore.msh 1
#   rockim_tun.exe bench_abuaisha\configs\hf_aniso.cfg out_hf_aniso
#
# CE QUI EST REPRODUIT ET CE QUI NE L'EST PAS. rockim n'a pas de fluide : la
# pression est IMPOSEE sur la paroi du forage, elle ne suit pas la fissure.
# Le commentaire de confineFaces = bore le dit : « faces born from cracking
# receive nothing ». Sont donc reproductibles la BRANCHE MONTANTE et le PIC de
# leur figure 11, le champ de contrainte avant amorcage (figure 9, panneau
# « no defects ») et le FACIES A L'AMORCAGE (figure 7, t = 1,2 ms). Ne le sont
# pas : le plateau post-pic a 5,5 MPa, le branchement et l'incurvation.
#
# POURQUOI LA RAMPE DE PRESSION EST LEGITIME. Leur section 3.2 mesure que la
# pression de rupture est INDEPENDANTE du debit tant qu'il reste sous ~100 l/s
# (ils injectent a 20 l/s). Une rampe de pression imposee reproduit donc la
# limite quasi-statique — c'est le meme regime.
#
# CIBLE CHIFFREE, leur equation 10 (Fjaer et al.) :
#   p_HF = sigma'_H - 3 sigma'_h + ft, en convention compression negative
#        = -6,8 - 3 x (-4,6) + 5 = 12 MPa
#   leur resultat numerique : ~12,5 MPa (leur figure 11b)
# Contraintes effectives : totales -32,6 (h) et -34,8 (H) MPa, pression de
# formation 28 MPa, d'ou -4,6 et -6,8 MPa.
#
# ORIENTATION — ATTENTION AU PIEGE DE NOMENCLATURE. Leur sigma_H est la
# contrainte LONGITUDINALE (axe x de leur figure 6), leur sigma_h la
# TRANSVERSALE (axe y). La cle rockim `insituSh` designe l'HORIZONTALE (x) et
# `insituSv` la VERTICALE (y). Donc insituSh <- leur sigma_H, insituSv <- leur
# sigma_h. Les deux « h » ne designent pas la meme chose.
#
# RESERVE ASSUMEE : rockim ne sait pas retarder la rampe de confinement, qui
# demarre a t = 0 en meme temps que l'excavation. L'excavation est donc bouclee
# a t = 0,2 ms, quand la paroi ne porte encore que 1,2 MPa, soit 10 % du seuil
# vise. A verifier au depouillement que le pic n'en depend pas.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/hf_bore.msh
thickness = 1.0

T = 3.2e-3
frames = 60                   # 1 trame par 66,7 us (leur fig. 7 compare 1,20 et 1,26 ms)

# --- materiau : leur Table 1, formation granitique a 1800 m -----------------
rho = 2500
E = 35e9
nu = 0.27
ft = 5e6
cohesion = 24e6
frictionDeg = 38
Gf = 10                      # G_Ic
gfShearFactor = 8            # G_IIc / G_Ic = 80 / 10
crushCap = 1e12              # volume ELASTIQUE : leur modele n'a pas de plasticite

# l_cz = E G_Ic / ft^2 = 35e9 x 10 / (5e6)^2 = 14 mm
# maille 3 mm -> 2 dx = 6 mm < 14 mm < 100 mm (diametre du forage).
# LA REGLE MAISON EST RESPECTEE DES DEUX COTES — contrairement au cas Heilman.

# --- contraintes lointaines EFFECTIVES, cas anisotrope ---------------------
insituSh = 6.8e6             # leur sigma'_H, longitudinale (x)
insituSv = 4.6e6             # leur sigma'_h, transversale (y)
insituSxy = 0
excavRelease = true
excavStart = 0.0
excavRamp = 2.0e-4           # excavation bouclee a 0,2 ms

# --- montee en pression de la paroi ----------------------------------------
confiningPressure = 0           # <- la pression vient desormais de la POMPE
#confineFaces = bore
boreCX = 4.0
boreCY = 4.0
boreSelectR = 0.06           # rayon du forage 0,05 m + une maille de garde
#confiningRamp

# --- appuis : leur figure 6, « BC restrained in HF » ------------------------
pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none
verifyFt = false

# --- schema ----------------------------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01

# --- POMPE (spec 004, F1/F4) -----------------------------------------------
# Leur §3.2 : injection a debit constant Q = 20 l/s, choisi sous le seuil de
# ~100 l/s au-dela duquel la pression de rupture augmente. En deformation plane
# a epaisseur unite, cela fait 0,02 m3/s par metre.
# La cavite du forage a un volume FINI (pi R^2 = 7,85e-3 m2/m), donc le modele
# de compressibilite est bien defini — contrairement au cas Parker.
hydro = on
hydroSource = bore
hydroInjection = rate
hydroRate = 0.02
fluidBulk = 2.2e9               # eau. NON DONNE par l'article : hypothese.
fluidDensity = 1000
hydroWetDamage = 0.0            # ESSAI 2 : toute interface inseree conduit
hydroP0 = 0                     # pressions EFFECTIVES, comme leurs contraintes

# E9 : la grille de contact suit desormais le maillage (6,5 Go -> quelques Mo)
gcBoxMesh = true

# ---------------------------------------------------------------------------
# VARIANTE « s » (signe corrige), 2026-08-20. Seul T change : 3,0 -> 4,0 ms.
# Avec le signe corrige la cavite S'OUVRE au lieu de se fermer, donc dp/dt
# baisse et la rupture arrive plus tard :
#   p = K_f ln(1 + Q t / V),  V = V0 (1 + 2 u_r / a),  u_r = p a / 2G
#   -> 2,49 ms en anisotrope, 2,95 ms en isotrope (contre 3,0 ms de fenetre).
# T = 3,0 ms couvrait 98 % du cas isotrope : aucune marge pour la compliance
# ajoutee par l'endommagement pre-pic. 4,0 ms laisse 26 % de marge.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ESSAI 2 (2026-08-20) — SUPPRESSION DE L INCUBATION A ZONE COHESIVE SECHE
#
# QUESTION. updateWetBoundary() n arrose que les interfaces ROMPUES (D = 1).
# Une interface en cours d adoucissement travaille donc SANS recevoir la
# pression du fluide, pendant que la pompe continue de monter. L essai 1 a
# mesure cette incubation pour la premiere fois, grace aux colonnes nInserted
# et nDamaging : de la premiere insertion au pic, la pression gagne encore
# +1,137 MPa alors que la zone cohesive est deja en train de ceder.
#
# METHODE. La cle neuve `hydroWetDamage` fixe le seuil d endommagement a partir
# duquel une interface conduit le fluide. Defaut 1.0 = comportement historique
# (chemin bit-identique, suite de non-regression 19/19 verifiee). Ici 0.0 :
# toute interface inseree conduit des sa naissance, ce qui supprime
# INTEGRALEMENT l incubation. C est la borne haute de l effet, pas un reglage
# physique — l essai encadre la reponse plutot qu il ne la calibre.
#
# PREDICTION (a confronter au resultat, inscrite AVANT lancement) :
#   pic anisotrope 14,993 - incubation budgetee 1,653 = 13,34 MPa (+11,2 %)
#   l incubation n y est pas mesuree (run non instrumente) : la valeur
#   vient du budget, la prediction est donc moins serree que pour l iso.
#
# LECTURE DU RESULTAT :
#   pic proche de la prediction -> l incubation est bien la cause, et le
#                                  budget se referme une seconde fois ;
#   pic inchange                -> le mouillage n est pas le mecanisme, et
#                                  il faut chercher du cote du schema
#                                  d insertion lui-meme (essai 3) ;
#   pic intermediaire           -> effet partiel, a quantifier.
#
# SIGNATURE A VERIFIER DES LES PREMIERES MINUTES : nWet doit suivre ~2 x
# nInserted (les deux levres) et non ~2 x nBroken. Dans l essai 1, nWet finit
# a 1209 pour 552 rompus et 2487 inseres ; ici on attend ~5000.
#
# FENETRE. T = 3,2 ms au lieu de 4,0. Le pic de l essai 1 tombait a 2,724 ms
# et celui de l anisotrope a 2,928 ms ; mouiller davantage de faces agrandit
# la cavite, donc RALENTIT la montee en pression et retarde le pic. 3,2 ms
# couvre l hypothese nulle (aucun effet) avec ~10 % de marge, tout en
# economisant la phase post-pic, mesuree 4 x plus couteuse que la montee.
#
# Binaire : rockim_e2.exe (compile 23h48, suite fast 19/19 aux valeurs de
# reference inchangees). Retour arriere : _backup_avant_essai2_2026-08-20/.
# ---------------------------------------------------------------------------
