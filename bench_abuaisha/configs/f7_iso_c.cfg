# ---------------------------------------------------------------------------
# B2/B3/B4 — PRESSION DE RUPTURE AU FORAGE, etat de contrainte ISOTROPE
# AbuAisha, Eaton, Priest & Wong, J. Petrol. Sci. Eng. 154 (2017), section 3,
# figures 6, 7, 9 et 11.
#
#   python tunnel_edz/tools/make_circle_mesh.py 8.0 8.0 0.05 0.003 0.4 0.3 \
#          meshes/hf_bore.msh 1
#   rockim_tun.exe bench_abuaisha\configs\hf_aniso.cfg out_hf_aniso
#
# CE QUI EST REPRODUIT ET CE QUI NE L'EST PAS. rockim n'a pas de fluide : la
# pression est IMPOSEE sur la paroi du forage, elle ne suit pas la fissure.
# Le commentaire de confineFaces = bore le dit : « faces born from cracking
# receive nothing ». Sont donc reproductibles la BRANCHE MONTANTE et le PIC de
# leur figure 11, le champ de contrainte avant amorcage (figure 9, panneau
# « no defects ») et le FACIES A L'AMORCAGE (figure 7, t = 1,2 ms). Ne le sont
# pas : le plateau post-pic a 5,5 MPa, le branchement et l'incurvation.
#
# POURQUOI LA RAMPE DE PRESSION EST LEGITIME. Leur section 3.2 mesure que la
# pression de rupture est INDEPENDANTE du debit tant qu'il reste sous ~100 l/s
# (ils injectent a 20 l/s). Une rampe de pression imposee reproduit donc la
# limite quasi-statique — c'est le meme regime.
#
# CIBLE CHIFFREE, leur equation 10 (Fjaer et al.) :
#   p_HF = sigma'_H - 3 sigma'_h + ft, en convention compression negative
#        = -4,6 - 3 x (-4,6) + 5 = 14,2 MPa
#   (leur figure 11 ne donne que l analytique anisotrope ; 14,2 MPa se deduit
# Contraintes effectives : totales -32,6 (h) et -34,8 (H) MPa, pression de
# formation 28 MPa, d'ou -4,6 et -6,8 MPa.
#
# ORIENTATION — ATTENTION AU PIEGE DE NOMENCLATURE. Leur sigma_H est la
# contrainte LONGITUDINALE (axe x de leur figure 6), leur sigma_h la
# TRANSVERSALE (axe y). La cle rockim `insituSh` designe l'HORIZONTALE (x) et
# `insituSv` la VERTICALE (y). Donc insituSh <- leur sigma_H, insituSv <- leur
# sigma_h. Les deux « h » ne designent pas la meme chose.
#
# RESERVE ASSUMEE : rockim ne sait pas retarder la rampe de confinement, qui
# demarre a t = 0 en meme temps que l'excavation. L'excavation est donc bouclee
# a t = 0,2 ms, quand la paroi ne porte encore que 1,2 MPa, soit 10 % du seuil
# vise. A verifier au depouillement que le pic n'en depend pas.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/hf_bore_c.msh
thickness = 1.0

T = 3.0e-3
frames = 60

# --- materiau : leur Table 1, formation granitique a 1800 m -----------------
rho = 2500
E = 35e9
nu = 0.27
ft = 5e6
cohesion = 24e6
frictionDeg = 38
Gf = 10                      # G_Ic
gfShearFactor = 8            # G_IIc / G_Ic = 80 / 10
crushCap = 1e12              # volume ELASTIQUE : leur modele n'a pas de plasticite

# l_cz = E G_Ic / ft^2 = 35e9 x 10 / (5e6)^2 = 14 mm
# maille 3 mm -> 2 dx = 6 mm < 14 mm < 100 mm (diametre du forage).
# LA REGLE MAISON EST RESPECTEE DES DEUX COTES — contrairement au cas Heilman.

# --- contraintes lointaines EFFECTIVES, cas anisotrope ---------------------
insituSh = 4.6e6             # ISOTROPE : sigma_H = sigma_h = -4,6 MPa effectifs
insituSv = 4.6e6
insituSxy = 0
excavRelease = true
excavStart = 0.0
excavRamp = 2.0e-4           # excavation bouclee a 0,2 ms

# --- montee en pression de la paroi ----------------------------------------
confiningPressure = 24e6     # au-dela du seuil vise : on veut voir le pic
confineFaces = bore
boreCX = 4.0
boreCY = 4.0
boreSelectR = 0.06           # rayon du forage 0,05 m + une maille de garde
confiningRamp = 4.0e-3       # 6 GPa/s : 12 MPa atteints a t = 2 ms

# --- appuis : leur figure 6, « BC restrained in HF » ------------------------
pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none
verifyFt = false

# --- schema ----------------------------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01

# F7 : facies a l amorcage (leur fig. 7), par RAMPE DE PRESSION.
# Pas de pompe : le facies est gouverne par le champ de contrainte, pas par la
# compressibilite. C est ce que bench_abuaisha/README.md classait deja comme
# reproductible « sous pression imposee ».
gcBoxMesh = true                 # E9 : sinon 6,5 Go de grille de contact
