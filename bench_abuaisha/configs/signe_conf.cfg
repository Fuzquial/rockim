# ---------------------------------------------------------------------------
# CONTROLE DU SIGNE, chemin A : la PRESSION DE CONFINEMENT (reference).
#
# H3 transpose au forage. Les deux chemins chargent EXACTEMENT la meme liste
# de faces (le pourtour du forage), avec la meme rampe en cosinus et la meme
# formule : tant qu'aucun joint ne rompt, ils doivent donner le meme
# deplacement de paroi AU BIT PRES. Toute difference est un bug de signe, de
# rampe ou de selection de faces.
#
# Resistances « irreal high » (procede de leur annexe A) : rien ne casse, on
# ne teste QUE l'elasticite sous charge suiveuse. La cible est alors analytique
# — trou pressurise en deformation plane, u_r = p a / 2G :
#     G = E / 2(1+nu) = 35e9 / 2,54 = 13,78 GPa
#     u_r = 12e6 x 0,05 / (2 x 13,78e9) = 2,18e-5 m = 21,8 um, VERS L'EXTERIEUR
#
# Pas d'in situ, pas d'excavation : un seul chargement, donc un seul suspect.
# T = 6e-4 s place la mesure AVANT le retour de l'onde reflechie sur les bords
# (4 m / 3742 m/s = 1,1 ms aller, 2,1 ms retour).
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/hf_bore_c.msh
thickness = 1.0

T = 6.0e-4
frames = 12

rho = 2500
E = 35e9
nu = 0.27
ft = 1e12                    # « irreal high » : aucune rupture possible
cohesion = 1e12
Gf = 10
crushCap = 1e12

pullV = 0
lateralRollers = true
absorbing = none
verifyFt = false

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01
gcBoxMesh = true

boreCX = 4.0
boreCY = 4.0
boreSelectR = 0.06

# --- LE CHARGEMENT : chemin A ----------------------------------------------
confiningPressure = 12e6
confineFaces = bore
confiningRamp = 3.0e-4
hydro = off
