# ---------------------------------------------------------------------------
# EXO TUNNEL dans rockim — le banc 6 de la these (cavite pressurisee 2D,
# DP-DFH) REFAIT en elements finis PURS, sans elements cohesifs.
#
#   rockim_i4.exe exo_tunnel\configs\exo_hole_t003.cfg out_exo_t003
#   (depuis la RACINE : meshFile est relatif au cwd)
#
# Reference Abaqus a retrouver (CONTINUUM/exo_hole_plate/RESULTATS_bench6.md) :
# fissures RADIALES discretes, N_span = 4/6/7/10/15 pour ppoint = 0,83/8,3/
# 25/83/250 MPa/us, coeur endommage de rayon Rd ~ 33 mm, motif OBJECTIF au
# maillage (armes aux memes positions de dx = 1,84 a 0,46 mm).
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension          # boite a rouleaux (pullV = 0), comme le deck tunnel
mesh = file
meshFile = meshes/exo_hole_dx1.msh
# Plaque 200 x 200 mm, trou r = 10 mm centre en (100, 100) mm, dx = 1 mm pres
# du trou (63 elements sur le pourtour, comme leurs 48 561 quads), 4 mm au loin.
thickness = 0.001           # 1 mm, comme leur *Solid Section
T = 4.0e-5
                            # atteignent Rd (leur convention)
frames = 30                 # leur *Output, number interval=30

# --- materiau : la carte *User Material de vumat_hole.f, constants=10 -------
rho = 2620                  # 2,62e-9 t/mm3
E = 52e9                    # 52 000 MPa
nu = 0.25
law = dpdfh                 # portage fidele de VUMATS/dfh/vumat_kstdfh.f
dfhBetaDeg = 51.7           # #3  friction Drucker-Prager
dfhDCoh = 153.3e6           # #4  cohesion DP
dfhPsiVar = 1               # #5 : la carte dit 15 deg mais vumat_hole.f
dfhPsiDeg = 15              # l IGNORE (l. 336-339) et calcule
dfhPsi0 = 160.345           #   psi = clamp(160,345 - 0,213793 p[MPa], 0, 51,7)
dfhKPsi = 0.213793          # psi ne descend sous 51,7 qu au-dela de p = 509 MPa :
dfhPsiMax = 51.7            # sous 250 MPa l ecoulement est donc ASSOCIE (psi = beta)
dfhWeibullM = 24            # #6  module de Weibull
dfhSigW = 23.5e6            # #7  sigma_w (carte QUASI-STATIQUE Bohus)
dfhZeff = 1e-9              # #8  Zeff = 1 mm3
dfhK = 0.38                 # #9  k
dfhS = 4.18879              # #10 S = 4 pi / 3
dfhDeld = 0.98              # DELD : suppression d element (jamais declenchee
                            # dans leur run, DCAP = 0,99 plafonne avant)
# NOTE V_el : la VUMAT du banc 6 fige V_el = 1 mm3 ; rockim prend h_el^3 par
# element (h median 0,6 mm ici) -> seuils de Weibull +6,5 %. Ecart assume et
# quantifie, a garder en tete au moment de comparer les comptes.

# --- AUCUN ELEMENT COHESIF ------------------------------------------------
# C'est le point de l'essai : on veut du FEM continu pur, comme Abaqus.
# L'insertion adaptative ne cree un joint que si l'enveloppe est atteinte ;
# avec des resistances inatteignables, AUCUNE arete ne s'insere jamais et les
# copies de noeuds restent liees -> continuum exact a noeuds partages.
# Toute la fissuration passe donc par la loi de volume DP-DFH.
insertion = adaptive
ft = 1e12
cohesion = 1e12
frictionDeg = 40
Gf = 70
verifyFt = false
crushCap = 1e12             # le cap de rockim est neutralise : c'est le
                            # Drucker-Prager de la loi qui plafonne

# --- chargement : pression interne en rampe -------------------------------
confineFaces = bore         # seules les faces du POURTOUR DU TROU
confiningPressure = 250e6   # PMAX = 250 MPa
confiningRamp = 3.0e-5
boreCX = 0.1
boreCY = 0.1
boreSelectR = 0.015         # 15 mm > r = 10 mm : marge sure

# --- conditions aux limites ------------------------------------------------
# ECART ASSUME : leur deck porte des absorbants de Lysmer (CONN2D2) sur les
# 4 bords ; rockim les ignore en scenario = tension (garde du solveur). On
# prend donc la boite a rouleaux du deck tunnel. L'aller-retour d'onde sur
# 90 mm vaut 2 x 0,09 / 4455 = 40 us : les reflexions n'arrivent qu'a la FIN
# du run, apres la formation des radiales (10-20 us). A surveiller sur les
# cas lents.
pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none

# --- schema ----------------------------------------------------------------
dtFactor = 0.2
dampingLocal = 0            # leur run : pas de bulk viscosity, pas de mass
                            # scaling — la signature de vitesse doit rester propre
budgetAbortPct = 0
