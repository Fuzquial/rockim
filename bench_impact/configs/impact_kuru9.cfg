# ---------------------------------------------------------------------------
# IMPACT A INSERT UNIQUE — calcaire St Anne, piston a 10,66 m/s
# Yang, Xiang, Naderi, Wang, Aising, Ugarte, Latham, IJRMMS 191 (2025)
# 106125 — le cas vitrine de leurs fig. 11(e-g) et 14. Donnees d'essai :
# Mines Paris-PSL (Aising et al.). Spec 005, WP4 ; variante ECONOME s = 1,5.
#
#   python tools/make_impact_mesh.py meshes/impact_s15.msh 1.5
#   rockim_i3.exe bench_impact/configs/impact_stanne_s15.cfg out_imp_stanne
#
# QUATRE CORPS (volumes physiques gmsh) : rock / insert (carbure) / bit /
# piston (acier). Le piston vole a 10,66 m/s, 0,2 mm au-dessus du bit ;
# l'insert est brase au bit (groupBond -> joints d'interface GBM) ; la
# roche est fixee en base. Plaque et circlip OMIS (leur poids sur l'outil
# n'est pas applique dans leurs simulations non plus).
#
# PREDICTIONS (leur Table 3, variation de maillage non structure, 10,66 m/s,
# inscrites AVANT lancement) :
#   vitesse d'indentation du bit : 9,4 - 9,85 m/s
#   vitesse de rebond            : 6,87 - 7,1 m/s
#   profondeur d'indentation     : ~1,53 mm
#   fissures radiales            : 20 - 24,5 mm
#   rayon de cratere             : 10 - 12 mm
#   chronologie (leur fig. 14, depuis le contact insert/roche) : zone
#   broyee ~130 us, radiales/medianes 250-390 us, tout fige a ~480 us.
# Reserve : s = 1,5 au lieu de 1 — leur Table 3 montre 2 % de variation sur
# l'energie et ~10 % sur la fissuration entre maillages ; l'echelle 1,5
# elargit cette barre. La replique fidele (s = 1) attendra une nuit dediee.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
toolShape = none
T = 7.0e-4
frames = 35

mesh = file
meshFile = meshes/impact_pulv.msh
gravity = 9.81

# --- roche : St Anne, leur Table 4 ------------------------------------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20

# --- les trois materiaux (leur Table 4 + Table 1 du papier 2 : la Table 5
#     du papier 1 a les colonnes acier/carbure INVERSEES) ; les fractions
#     sont exigees par le lecteur mais inertes avec mesh = file -------------
phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.insert = carbide

# --- assemblage -------------------------------------------------------------
groupBond.bit.insert = joints

# --- schema : l'insertion adaptative de rockim, PAS leur intrinseque --------
insertion = adaptive
strainRateDIF = yang-fig2
contact = potential
gcActivation = adaptive
contactMu = 0.6
insertionPenaltyFactor = 4
dampingLocal = 0
dtFactor = 0.2

# --- instrumentation (WP3) --------------------------------------------------
trackGroups = bit insert
gauge.bit = 0.28 0.30

# ---------------------------------------------------------------------------
# VARIANTE FIDELE (2026-08-22, demande de F. Uzquiano : « tout comme eux sauf
# l'adaptatif »). Ce deck ne garde de different que le SCHEMA D'INSERTION.
#
#   - insert POSE (jeu roche 0,02 mm) : le montage reel, diagnostic F-p ;
#   - PLAQUE (119,9 x 40 x 6, acier) posee sur le CIRCLIP (carbure, brase au
#     bit par groupBond) : leur fig. 5, poids sur l'outil par gravite ;
#   - jointShearEnvelope = yang : leur eq. 1 exactement ;
#   - jointSoftening = yan : la decroissance lisse, la plus proche de leur
#     fig. 3a (rockim n'a pas la z-curve de Munjiza : approximation notee) ;
#   - amortissement VISQUEUX comme eux, dampingLocal = 0. VALEUR : le
#     critique de Munjiza 2h sqrt(E rho) pour NOTRE maille fine (h = 1,5 mm)
#     = 3,7e4 Pa.s — leur 5,6e5 est 10x le critique de LEURS elements de
#     3 mm (coquille h = 30 mm probable) et forcerait dt / 3 ;
#   - TRI DES FRAGMENTS dans le run (leur §2.3) : 0,5 ms d'anti-gravite
#     apres l'impact -> cratere et masse de fragments mesures COMME EUX.
#
# PREDICTIONS (leur Table 3 a 10,66 m/s) : v_indentation 9,40-9,85 m/s,
# rebond 6,87-7,10, profondeur ~1,53 mm, fragments 1,44-1,58 g, radiales
# 20,2-24,5 mm, cratere 10,0-12,1 mm ; F-p en RAMPE vers ~130 kN a 1,5 mm.
# ---------------------------------------------------------------------------
jointShearEnvelope = yang
jointSoftening = yan
# amortissement visqueux PAR ELEMENT, echelle critique : mu_e = xi h sqrt(E rho).
# xi = 0,6 est le plus fort niveau qui ne degrade PAS dt (la borne diffusive
# rho h^2/4mu rejoint celle des ressorts) ; un mu GLOBAL au critique de la
# maille fine imposait dt/14 (borne commandee par les tets du carbure).
bulkViscosityXi = 0.6
bulkViscosityGraded = 1
# leur amortissement est une dissipation, pas un moteur de rupture : le
# terme visqueux ne doit PAS entrer dans la contrainte du critere
# d'insertion (sinon le taux agit deux fois, contrainte d'essai ET seuil DIF)
viscousInInsertion = 0
# fragBrushStart desarme (etape 1 violee sur P1) : le tri fera l objet
# d un run dedie, avec fragBrushZeroV = true et un depart cale sur la
# separation reelle lue au canal grpFz.
# coquille corrigee le 2026-08-25 : le code lit fragBrushV0, pas fragBrushV
# (sans effet jusqu ici, la valeur ecrite etant EGALE au defaut 2.5e-3 —
#  mais toute autre valeur aurait ete ignoree EN SILENCE)
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8
# la forme litterale de leur eq. 3 : rs = (s_max - s_p)/(s_c - s_p)
jointShearUnload = origin

# Leur volume est PUREMENT ELASTIQUE (toute la resistance est dans les
# joints) : le garde-fou par defaut de rockim (crushCap = 8c = 150 MPa)
# ecretait la force de pointe — la portance sous l'insert atteint le GPa —
# creusant l'enfoncement et aplatissant la rampe F-p (decouvert au F-p du
# run 2). On le releve a 2 GPa : au-dessus de toute contrainte legitime,
# mais toujours la comme garde contre la pompe d'energie des elements
# ecrases a deformation O(1) (l'incident documente du 2D : 1e6 J crees).
crushCap = 2e9

# ---------------------------------------------------------------------------
# ROCHE FINE (2026-08-22, demande F. Uzquiano : « de belles fissures ») :
# maillage impact_fidele_r10.msh — la ROCHE a l'echelle 1,0 de l'article
# (1 mm boule Phi 25, 2 mm jusqu'a Phi 50, 10 mm au bord), l'acier reste a
# 1,5 (il ne porte que l'onde). 132 863 tets, dt inchange (l'insert le
# commande). Cout estime ~40 h, tri des fragments compris.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# PULVERISATION A (2026-08-22 soir, decision Fernando apres le bilan) :
# l'objectif unique est l'ETOILE RADIALE et le CRATERE. Montage ALLEGE —
# rock (raffinement moyen 2 mm) + insert + bit lances ENSEMBLE a la vitesse
# d'indentation mesuree (9,5 m/s) : plus de piston ni de plaque, la phase
# de transfert est court-circuitee. Le diagnostic du bilan (rebond 99 %
# restitue a volume elastique) designe la dissipation manquante de la zone
# broyee : bulkDamage = yang la fournit (WP1). Variante A = calibration
# granite du papier 2 telle quelle (delta0 1,4e-5, deltaF 4e-4, Dmax 0,9).
# ---------------------------------------------------------------------------
groupVel.bit = 0 0 -5.62
groupVel.insert = 0 0 -5.62
bulkDamage = yang

# ---------------------------------------------------------------------------
# PULVERISATION x COULOMB (2026-08-28, WP6) — LA PHYSIQUE COMPLETE.
# Premier deck a combiner les trois ingredients valides separement :
#   1. jointShearRange = coulomb : plage mode II / fs(sigma_n) (correctif du
#      27/08, valide Bgrad : 78 % de cisaillement dans le noyau) ;
#   2. bulkDamage = yang (WP1) : degradation de raideur eq. 3-4, deja actif
#      dans ce deck (calibration granite Table 1 telle quelle) ;
#   3. contactResidualMu (WP6) : perte d appui — le contact sur matiere
#      pulverisee glisse a 0,18 au lieu de 0,6. VALEUR GRANITE (Table 1 du
#      papier 2) : AUCUNE valeur St Anne publiee — hypothese exploratoire,
#      inscrite comme telle. Jumeau de controle : impact_pulv_coulomb_ctrl
#      (identique SANS contactResidualMu) — la paire isole WP6.
# jointFrictionScaled = 1 : la forme litterale de l article avec origin
# (banniere d avertissement sinon) et le canal des 32 J de frottement.
# PREDICTIONS (inscrites avant lancement) :
#   - vs pulv_a (26/08) : morts de joints en cisaillement dans le noyau
#     des ~100-110 us (t_sim), F-p en dents de scie, e en BAISSE ;
#   - P1 vs ctrl : enfoncement P1 > ctrl a T egal, e_P1 < e_ctrl,
#     ejection de fragments accrue (perte d appui) ;
#   - banniere [FDEM3D] # contactResidualMu RETIRE : remplace par contactDamageCoupling = solidity
# (le couplage continu contient et depasse l echelon binaire de WP6) OBLIGATOIRE au log, et
#     "contact residuel : N > 0 evaluations" au resume final.
# ---------------------------------------------------------------------------
jointShearRange = coulomb
jointFrictionScaled = 1
# contactResidualMu RETIRE : remplace par contactDamageCoupling = solidity
# (le couplage continu contient et depasse l echelon binaire de WP6)

# ---------------------------------------------------------------------------
# P2 (2026-08-29) — deck corrige apres le depouillement de P1. TROIS ecarts
# avec P1, tous verifies dans le code avant d etre ecrits :
#   T = 7.0e-4 : a 550 us l outil etait ENCORE POUSSE a 10,5 kN (derivee de
#     la quantite de mouvement sur 530-550 us, jauge 9,7 kN sur les 50
#     dernieres). e = 0,446 n etait donc pas une restitution mais un
#     plancher ; l extrapolation donne 0,50-0,55. Sans separation, aucune
#     grandeur de rebond n est publiable.
#   trackGroup = insert (l. 1150, SINGULIER) : P1 ne posait que trackGroups
#     au pluriel, si bien que grpF_ n etait jamais calcule et que la force
#     ne se reconstruisait qu indirectement (jauge du bit, ou derivee de la
#     quantite de mouvement, 43,3 contre 54,6 kN). Cette cle donne la force
#     de contact DIRECTE, et c est elle qui datera la separation.
#   budgetAbortPct = 2 : garde-fou d energie en cours de run (l. 2156),
#     inerte par defaut. Un run de 10 a 30 h ne doit pas decouvrir a la fin
#     qu il a pompe de l energie.
# NE CHANGE PAS : insertion, bulkDamage, coulomb, contactResidualMu,
# viscosite, meanTensionCapFactor (defaut 3,0) — pour rester comparable a
# P1 sur la physique. Le schema d insertion fait l objet de son propre
# bilan (BILAN_interference_2026-08-29.md) et d un run dedie.
# ---------------------------------------------------------------------------
trackGroup = insert
budgetAbortPct = 2

meshFile = /home/user/rockim/bench_impact/donnees/impact_pulv_18123.msh

# ---------------------------------------------------------------------------
# KURU GREY (2026-08-29 soir) — replique du cas vitrine de Yang et al.,
# IJRMMS 206 (2026) 106660, sur le montage ALLEGE (bit + insert lances a la
# vitesse d INDENTATION du bit mesuree chez eux ; pas de piston).
# Materiau = leur Table 1, JEU INTEGRAL (leur avertissement p. 6 : les
# parametres sont calibres comme un ensemble, jamais isolement) :
#   rho 2626, E 60 GPa, nu 0,24, ft 10,98 MPa, cohesion 29,84 MPa,
#   frottement interne 1,85 (61,6 deg), G_I 50, G_II 1000 (facteur 20),
#   delta0 1,4e-5 m, deltaF 4,0e-4 m, Dmax 0,9 (defauts du code = Table 1),
#   frottement GLISSANT : granite 0,18, carbure 0,6, acier 0,6.
# DEUX NOUVELLES CAPACITES (verifiees sur leur source) :
#   contactMu.<phase>  — le mu glissant devient une propriete MATERIAU ;
#     regle de paire = MINIMUM (Solidity Y3Did.c l. 1292) ;
#   contactDamageCoupling = solidity — raideur normale ET frottement du
#     contact multiplies par d_fact = min(1-D_i, 1-D_j) (Y3Did.c l. 995,
#     1044, 1263-1265) : l effondrement de PORTANCE.
# RESERVES ASSUMEES : masse mobile ~1,20 kg contre 1,509 kg chez eux
# (montage allege + facettisation) — comparer d abord le RAPPORT de
# restitution, pas les energies absolues ; maillage s = 1,5 contre 1.
# PREDICTIONS (leur §5, inscrites avant lancement) :
#   v_indentation 5,62 m/s -> rebond 4,65 m/s (e = 0,827), perte 31,6 %
#   v_indentation 6,83 m/s -> rebond 2,66 m/s (e = 0,389), perte 84,8 %
#   LE VERDICT EST LA BASCULE : e doit S EFFONDRER entre les deux runs.
#   Pulverisation ~150 us apres impact ; elements pulverises ~200-400 (9)
#   contre ~740 (11 m/s, leur fig. 18) ; side cracks SANS medianes.
# ---------------------------------------------------------------------------
contactMu = 0.6
contactMu.rock = 0.18
contactMu.steel = 0.6
contactMu.carbide = 0.6
contactDamageCoupling = solidity
