# ---------------------------------------------------------------------------
# IMPACT 3D DP-DFH — percussion a insert unique, en continuum PUR (aucun
# element cohesif insere), sur maillage NON STRUCTURE.
#
#   rockim_dfh3.exe bench_impact\configs\impact3d_dpdfh.cfg out_imp3d_dfh
#
# HISTORIQUE (a lire avant de toucher au deck) : la premiere version tournait
# en mode = fem3d, dont le mailleur ne sait faire qu'une GRILLE structuree
# decoupee en 6 tetraedres de Kuhn. Le front d'endommagement sortait en
# LOSANGE aligne sur les diagonales de la grille — le meme biais de maillage
# que celui corrige sur le tunnel le 2026-08-17. On passe donc au solveur
# FDEM 3D, seul a lire un maillage non structure, en neutralisant ses joints.
#
# POURQUOI CE CAS : regime ou l'obscuration DFH est LEGITIME (fragmentation
# dynamique en traction, echelle de la microseconde). Nos runs FDEM cohesifs
# n'ont jamais produit l'ETOILE RADIALE (12 a 17,6 mm contre 20,2-24,5 mm
# chez Yang et al.) ; l'exo tunnel vient de montrer que la meme loi donne des
# ARMES RADIALES discretes en 2D. On teste le pendant 3D.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/impact3d_gros.msh
# Bloc 200 x 200 x 120 mm (le front d endommagement mettait 120 us a
# traverser les 40 mm du bloc precedent : on triple la course). Gradue :
# 2 mm sur 40 mm de rayon, 10 mm au loin. 143 451 tetraedres, h median 1,04 mm.
T = 1.5e-4
frames = 30

# --- roche : Red Bohus, la carte DP-DFH de la these (constants=10) ---------
rho = 2620
E = 52e9
nu = 0.25
law = dpdfh
dfhBetaDeg = 51.7
dfhDCoh = 153.3e6
dfhPsiVar = 1                # psi(p) de vumat_hole.f, et non le 15 deg mort
dfhPsi0 = 160.345
dfhKPsi = 0.213793
dfhPsiMax = 51.7
dfhWeibullM = 24
dfhSigW = 23.5e6
dfhZeff = 1e-9
dfhK = 0.38
dfhS = 4.18879
dfhDeld = 1e9                # pas de suppression, comme vumat_perc.f

# --- AUCUN ELEMENT COHESIF ------------------------------------------------
insertion = none            # CONTINUUM PUR : aucun joint ne peut naitre.
                            # Remplace l ancien bricolage (insertion =
                            # adaptive + ft = 1e12), qui a fait exploser le
                            # run du 2026-08-25 : un element pulverise s est
                            # distordu, a sorti une contrainte aberrante, et
                            # les 89 424 joints "inatteignables" qui se sont
                            # alors actives portaient dnE = ft/pj = 8 cm.
                            # 53 J devenus -89 GJ en 10 us.
ft = 18e6
cohesion = 37.5e6
frictionDeg = 40
Gf = 70
verifyFt = false
crushCap = 1e12
# (insertionPenaltyFactor devenu inutile : avec insertion = none le pas de
# temps ne paie plus du tout le ressort des joints, il gagne ~2,6x)

# --- outil rigide : l'insert -----------------------------------------------
toolShape = sphere
toolRadius = 0.005           # insert bouton de 10 mm de diametre
toolMass = 1.18              # masse bit+insert mesuree sur nos runs FDEM
impactSpeed = 9.5            # vitesse d'indentation mesuree (9,40-9,85 chez
                             # Yang et al.)

absorbing = all              # Lysmer sur les cotes et le fond (le scenario
                             # percussion les pose vraiment)
dampingLocal = 0
dtFactor = 0.2
