# ---------------------------------------------------------------------------
# IMPACT ST ANNE — points 6 et 10 du tableau : les DEUX VALEURS PUBLIEES
#
# Ce deck est la copie EXACTE de temoin_adaptatif.cfg (la reference d impact en
# cours de calcul dans rockim_p3) a TROIS LIGNES pres, en fin de fichier. Elles
# ne contiennent aucune modelisation nouvelle : elles remplacent deux reglages
# rockim par les valeurs que Yang et al. PUBLIENT dans la Table 1 de leur
# papier ARMA 24-0952. C est du recalage sur source, pas de l invention.
#
#   rockim_n2.exe bench_impact/configs/impact_p6p10.cfg out_imp_p6p10
#
# COUT ATTENDU : le meme ordre que la reference adaptative (~8 h a 8 threads,
# maillage econome 42 882 tets). La penalite montant de 4 a 26,3 E/h, le pas de
# temps baisse d environ sqrt(26,3/4) = 2,6 : compter plutot 15-20 h. La
# viscosite, elle, BAISSE (3,7x moins), ce qui relache la borne diffusive et
# joue en sens inverse. Le chiffre exact sortira de la banniere d init.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
toolShape = none
T = 1.0e-3
frames = 40

mesh = file
meshFile = meshes/impact_fidele_s15.msh
gravity = 9.81

# --- roche : St Anne, leur Table 4 ------------------------------------------
rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45
Gf = 12
gfShearFactor = 66.7

phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.insert = carbide
groupPhase.circlip = carbide
groupPhase.plate = steel

groupBond.bit.insert = joints
groupBond.bit.circlip = joints
groupVel.piston = 0 0 -10.66

# --- lois de joint : la forme litterale de l article -------------------------
jointShearEnvelope = yang
jointSoftening = yan
jointShearUnload = origin
contact = potential
gcActivation = adaptive
contactMu = 0.6
dampingLocal = 0
dtFactor = 0.2
insertion = adaptive
strainRateDIF = yang-fig2
viscousInInsertion = 0
crushCap = 2e9
jointXi = 0

# --- tri des fragments (leur §2.3) ------------------------------------------
fragBrushStart = 5.0e-4
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8

trackGroups = bit piston insert
gauge.bit = 0.28 0.30

# ===========================================================================
# LES TROIS SEULES LIGNES QUI DIFFERENT DE LA REFERENCE
# ===========================================================================
#
# POINT 6 — VISCOSITE. Leur Table 1 (ARMA 24-0952) donne, pour le calcaire
# St Anne, un parametre visqueux eta = 4 000 Pa.s, CONSTANT sur tout le
# domaine. Guo eq. 2.6 l ecrit  T = ... + eta D  ; rockim applique  2 mu D,
# donc eta = 2 mu et il faut bulkViscosity = 2 000.
# La reference tournait a bulkViscosityXi = 0,6 GRADUE, soit 2 mu = 14 972 Pa.s
# a h = 1 mm : rockim etait 3,74 x TROP VISQUEUX, et gradue la ou le leur est
# uniforme. La viscosite est un puits d energie qui concurrence directement la
# fissuration : c est un ecart de premier ordre sur le budget.
# RESERVE : un eta uniforme s applique aussi a l acier et au carbure, dont E et
# rho n ont rien a voir avec ceux de la roche. C est ce que leur valeur publiee
# implique, mais ils ne le disent pas explicitement.
bulkViscosity = 2000

# POINT 10 — PENALITE DE JOINT. Leur Table 1 donne p0 = 3 000 GPa, soit 52,6 E.
# Guo eq. 2.25 pose delta_np = 2 ft h / p0, donc une raideur de joint p0/(2h) ;
# rockim pose dnE = ft/pj avec pj = facteur E/h, donc facteur E/h. L equivalence
# est facteur = p0/(2E) = 3000/(2 x 57) = 26,32.
# La reference tournait a insertionPenaltyFactor = 4 : SIX FOIS ET DEMIE TROP
# MOU. Une penalite basse ajoute de la complaisance artificielle a la zone
# broyee et retarde l amorcage.
# NB : Guo lui-meme recommande E <= p0 <= 10E (son eq. 2.28). Les auteurs vont
# donc bien au-dela de la recommandation de leur propre these — c est leur
# choix publie, on le suit.
insertionPenaltyFactor = 26.32
jointPenaltyFactor = 26.32
