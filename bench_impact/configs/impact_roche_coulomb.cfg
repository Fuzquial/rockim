# ---------------------------------------------------------------------------
# IMPACT HEMISPHERE SEULE — roche RAFFINEE (echelle article), outil ANALYTIQUE
# (2026-08-28, demande F. Uzquiano : « garde que la demi-sphere, enleve le
# piston et le reste »).
#
#   python tools/make_impact_mesh.py meshes/impact_roche_r10.msh 1.0 2e-5 1.0 roche
#   rockim_cl.exe bench_impact/configs/impact_roche_coulomb.cfg out_roche_coulomb
#
# UN SEUL CORPS MAILLE : la roche (cylindre R125 x 150 mm, 112 848 tets non
# structures, 1 mm dans la boule R12,5 sous l'impact — l'echelle de l'article).
# L'outil est la SPHERE ANALYTIQUE du solveur (toolShape = sphere) : rayon
# 8,51 mm = leur insert, masse 1,283 kg = bit + insert reels (la masse fait
# l'energie d'impact : 59 J a 9,6 m/s, leur ordre de grandeur 49 J), lancee a
# la vitesse d'indentation publiee. Vol libre integre par Newton, contact
# penalite + amortisseur + Coulomb regularise (mu = contactMu).
#
# CE QU'ON GAGNE : aucun element de carbure ni d'acier -> le dt est commande
# par la ROCHE, pas par l'insert — c'est LE levier du cout. Et le contact
# commence a ~2 us (toolGap = 20 um, le jeu pose).
# CE QU'ON PERD, et il faut le dire : l'outil est RIGIDE (pas de deformation
# d'insert, pas d'aller-retour d'onde dans le taillant) et il n'y a plus de
# jauge a mi-bit. F-p, restitution et chronologie se lisent sur l'OUTIL
# (colonnes toolFz/toolZ/toolVz/toolKE de history.csv). Comparaison a
# l'article QUALITATIVE (facies, tailles de zones) — pas les 7 criteres.
#
# CHRONOLOGIE ATTENDUE (horloge contact ~ t_sim - 2 us, leur fig. 14) :
# noyau broye ~130 us, pic d'enfoncement ~205 us, radiales 250-390 us.
# T = 4,0e-4 couvre tout + tri des fragments a 3,3e-4.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 4.0e-4
frames = 40

mesh = file
meshFile = meshes/impact_roche_r10.msh
gravity = 9.81

# --- l'outil : la demi-sphere de l'article, rigide, lestee de l'outil reel --
toolShape = sphere
toolRadius = 0.00851
toolMass = 1.283
impactSpeed = 9.6
toolGap = 2e-5

# --- roche : St Anne, leur Table 4 ------------------------------------------
rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45
Gf = 12
gfShearFactor = 66.7

phases = rock
phase.rock.fraction = 1.0
groupPhase.rock = rock

# --- physique : IDENTIQUE aux runs A/B (impact_imperial_coulomb.cfg) --------
insertion = intrinsic
strainRateDIF = yang-fig2
strainRateDIFArm = continuous
strainRateFilter = none
contact = potential
gcActivation = adaptive
contactMu = 0.6
dampingLocal = 0
dtFactor = 0.2
jointShearEnvelope = yang
jointSoftening = yan
jointElastic = parabolic
jointDeltaC = solidity
jointFailRule = majority
jointQuadrature = midedge
jointDeath = damage
jointShearUnload = origin
bulkModel = neohookean
bulkViscosityXi = 0
bulkViscosityGraded = 1
bulkViscosity = 2000
viscousInInsertion = 0
insertionPenaltyFactor = 26.32
jointPenaltyFactor = 26.32
potPenaltyFactor = 5.0
potTangentFactor = 1.4286
gcBirth = penalty
gcBirthPenMin = 0.01
gcBirthPenMax = 3.0
meanTensionCapFactor = 0
crushCap = 1e12
jointXi = 0

# --- le correctif valide par le run B ---------------------------------------
jointShearRange = coulomb
jointFrictionScaled = 1

# --- tri des fragments (leur §2.3) ------------------------------------------
fragBrushStart = 3.3e-4
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8
