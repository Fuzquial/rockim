# ---------------------------------------------------------------------------
# IMPACT A INSERT UNIQUE — granite KURU GREY, piston a 9 m/s — RUN FIDELE (s = 1,0)
# Yang, Xiang, Naderi, Wang, Aising, Ugarte, Latham, IJRMMS 206 (2026)
# 106660 — la replique du papier 2 (fragmentation + PULVERISATION).
# Ecrit le 2026-08-30 depuis SPEC_replique_yang2026.md (Table 1 verifiee) et
# AUDIT_actifs_replique.md (12 ecarts) ; base structurelle :
# impact_stanne_fidele_s15.cfg (« tout comme eux sauf l'adaptatif »).
#
#   python tools/make_impact_mesh.py meshes/impact_kuru_s15.msh 1.5   # pilote
#   python tools/make_impact_mesh.py meshes/impact_kuru_s10.msh 1.0   # fidele
#   (mailleur CORRIGE 2026-08-30 : Mesh.Algorithm = 5 — le frontal imposait
#    3 directions de fissure, fabric 7,9 vs 1,4)
#
# PREDICTIONS INSCRITES AVANT LANCEMENT (leur texte p. 11 + figs 9-10) :
#   v indentation bit : 5,62 m/s   |  v rebond bit : 4,65 m/s (PIC du rebond)
#   E cinetique bit 23,84 J -> 16,31 J (perte 7,53 J, 31,6 %)
#   masse de fragments ~ 0,9-1 g   |  radiales FDEM ~ 13-16 mm (exp > sim)
#   rayon de cratere ~ 10-12 mm    |  ~ 360 elements pulverises (fig. 18)
#   chronologie (fig. 14) : dommage central immediat, retournement a 255 us,
#   side cracks SOUS la surface au retournement, pas de grosses ecailles.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
toolShape = none
T = 1.0e-3
frames = 60

mesh = file
meshFile = meshes/impact_kuru_s10.msh
gravity = 9.81

# --- roche : Kuru Grey, Table 1 du papier 2 (integralement) -----------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
# coefficient de frottement interne 1,85 -> atan(1,85) = 61,6 deg
frictionDeg = 61.6
# G_I = 50 J/m2 ; G_II = 1000 J/m2 -> facteur 20
Gf = 50
gfShearFactor = 20

# --- les trois materiaux (Table 1, colonnes carbure et acier) ---------------
phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.insert = carbide
groupPhase.circlip = carbide
groupPhase.plate = steel

# --- assemblage et charge ----------------------------------------------------
groupBond.bit.insert = joints
groupBond.bit.circlip = joints
# vitesse du piston : cas d'analyse detaillee du papier (figs 9-10, 14, 16-18)
groupVel.piston = 0 0 -9.0

# --- schema : adaptatif (l'UNIQUE ecart revendique, comme le deck fidele ;
#     l'intrinseque multi-corps butte sur B2 — l'outil se desassemble — tant
#     que toolSig_/soudure n'est pas re-specifie) -----------------------------
insertion = adaptive
insertionPenaltyFactor = 4
strainRateDIF = yang-fig2
contact = potential
gcActivation = adaptive
dampingLocal = 0
dtFactor = 0.2

# --- frottements (Table 1 + regle de paire mesuree dans Solidity) -----------
# Table 1 : glissement roche 0,18 ; carbure/acier 0,6. Solidity prend le MIN
# de la paire (Y3Did.c:1292, verifie sur commit deca80df) : tout contact
# impliquant la roche tombe donc a 0,18 chez eux. rockim n'a qu'un contactMu
# global : on pose 0,6 (contacts acier/acier du train de frappe) et le 0,18
# de la roche passe par les canaux RESIDUELS, la ou il agit physiquement :
jointResidualMu = 0.18
contactMu = 0.6
# DIVERGENCE DOCUMENTEE : chez eux le contact vif roche/carbure vaut aussi
# 0,18 (regle du min) ; ici il vaut 0,6 tant que rien n'est pulverise.
# A tester en variante (contactMu = 0.18) si la F-p s'ecarte.

# --- PULVERISATION (leur eq. 3-4 = bulkDamage yang ; Table 1 : delta0 0,014,
#     deltaF 0,4 [mm], Dmax 0,9 = les defauts documentes de rockim, SANS
#     remise a l'echelle : la zone fine est a 1 mm comme leur calibration) ---
bulkDamage = yang
contactResidualMu = 0.18

# --- chaine « article-exact » (papier 1, reprise du deck fidele) -------------
jointShearEnvelope = yang
jointSoftening = yan
jointShearUnload = origin
# (jointFrictionScaled RETIRE le 2026-08-30 : exclusif de jointResidualMu,
# qui le GENERALISE — residuel 0 = friction scalee, residuel tan(phi) = defaut.
# Notre jointResidualMu = 0.18 porte donc deja l'hysteresis de frottement ;
# l'avertissement du banner ne s'applique qu'en l'absence de residuel.)
bulkViscosityXi = 0.6
bulkViscosityGraded = 1
viscousInInsertion = 0
crushCap = 2e9

# --- tri des fragments (leur §2.3), memes parametres que le deck fidele -----
fragBrushStart = 5.0e-4
fragBrushV = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8

# --- GARDE-FOUS, ENSEMBLE (contre-audit M-6/M-7/B10 : jamais l'un sans
#     l'autre — gravity et fragBrush* sont armes, leur travail doit etre
#     comptabilise sinon budgetAbortPct coupe un run sain) --------------------
energyBodyForces = on
budgetAbortPct = 2

# --- instrumentation ---------------------------------------------------------
trackGroups = bit piston insert
gauge.bit = 0.28 0.30
