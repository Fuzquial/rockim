# ---------------------------------------------------------------------------
# TEMOIN INTRINSEQUE de l impact a insert unique — calcaire St Anne, 10,66 m/s
# Yang, Xiang, Naderi, Wang, Aising, Ugarte, Latham, IJRMMS 191 (2025) 106125.
#
# CE DECK EST LA COPIE EXACTE de impact_stanne_fidele_s15.cfg, A DEUX LIGNES
# PRES (en fin de fichier). C est le controle que l etude « insertion
# adaptative vs macro-fissures » du 2026-08-22/25 a mene sur le TUNNEL mais
# jamais sur l IMPACT. Le tunnel avait donne : +72 % de joints rompus, blocs
# x2, propagation 58,9 % contre 43,7 %.
#
# NE PAS LANCER SANS VALIDATION — voir le bandeau CONFONDANTES en fin de
# fichier : deux reglages heritent de defauts qui ne sont PAS neutres entre
# les deux schemas, et le cout est un multiple de celui du run adaptatif.
#
#   rockim_d1.exe bench_impact/configs/impact_stanne_intrinseque.cfg out_imp_intr
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
toolShape = none
T = 1.0e-3
frames = 40

mesh = file
meshFile = meshes/impact_fidele_r10.msh
gravity = 9.81

# --- roche : St Anne, leur Table 4 ------------------------------------------
rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45
Gf = 12
gfShearFactor = 66.7

# --- les trois materiaux (leur Table 4 + Table 1 du papier 2 : la Table 5
#     du papier 1 a les colonnes acier/carbure INVERSEES) --------------------
phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.insert = carbide
groupPhase.circlip = carbide
groupPhase.plate = steel

# --- assemblage -------------------------------------------------------------
groupBond.bit.insert = joints
groupBond.bit.circlip = joints
groupVel.piston = 0 0 -10.66

# --- lois de joint : la forme litterale de l article -------------------------
jointShearEnvelope = yang
jointSoftening = yan
jointShearUnload = origin
contact = potential
gcActivation = adaptive
contactMu = 0.6
dampingLocal = 0
dtFactor = 0.2

# --- viscosite et DIF --------------------------------------------------------
bulkViscosityXi = 0.6
bulkViscosityGraded = 1
viscousInInsertion = 0
strainRateDIF = yang-fig2

# --- volume quasi elastique (leur bulk est purement elastique) --------------
crushCap = 2e9

# --- tri des fragments (leur §2.3) ------------------------------------------
fragBrushStart = 5.0e-4
# coquille corrigee le 2026-08-25 : le code lit fragBrushV0, pas fragBrushV
# (sans effet jusqu ici, la valeur ecrite etant EGALE au defaut 2.5e-3 —
#  mais toute autre valeur aurait ete ignoree EN SILENCE)
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8

# --- instrumentation (WP3) --------------------------------------------------
trackGroups = bit piston insert
gauge.bit = 0.28 0.30

# ===========================================================================
# LES DEUX SEULES LIGNES QUI DIFFERENT DU DECK FIDELE
# ===========================================================================
insertion = intrinsic
strainRateDIFArm = envelope
# `envelope` est OBLIGATOIRE ici : sans instant d insertion, le DIF n a pas
# d instant de gel. Il est alors fige au moment ou le joint quitte sa branche
# elastique — l analogue exact du gel a l insertion (capacite du 2026-08-25 ;
# le resume imprime « K joints endommages SANS DIF », qui doit valoir 0).

# ===========================================================================
# CONFONDANTES CONNUES — a trancher AVANT lancement (F. Uzquiano)
# ===========================================================================
#
# (1) jointXi — LE PIEGE. Non pose ici, donc DEFAUT 0,05 : un dashpot sur
#     CHAQUE joint. En adaptatif il n armait que les 1 766 joints reellement
#     inseres ; en intrinseque il s arme sur les ~265 000 joints du maillage
#     des t = 0, en bilateral sur tout joint intact. C est une dissipation
#     massive et sans equivalent declare chez eux. Le risque est net : le
#     temoin pourrait fermer l ecart de rebond POUR LA MAUVAISE RAISON.
#     Trois options :
#       a. jointXi = 0 ici ET re-lancer l adaptatif a jointXi = 0  (le plus
#          propre : une seule variable change entre les deux runs) ;
#       b. laisser 0,05 et LIRE dampWork au resume (le solveur l imprime avec
#          son verdict) pour quantifier ce que le dashpot a mange ;
#       c. jointXi = 0 ici seulement — deconseille : deux variables changent.
#     Recommandation : (a) si la machine le permet, (b) sinon.
#
# (2) Penalite de joint. En adaptatif le deck fidele utilise
#     insertionPenaltyFactor = 4 ; en intrinseque c est jointPenaltyFactor,
#     defaut 20, qui s applique. Le joint intrinseque sera donc 5 fois plus
#     RAIDE. Cet ecart est inherent aux deux schemas et n est pas un bug —
#     mais il n est pas neutre. Pour memoire, la valeur de l article
#     (ARMA 2024, Table 1 : penalite 3 000 GPa pour E = 57 GPa) equivaut a
#     jointPenaltyFactor ~ 26, donc leur joint est ~30 % plus raide que notre
#     intrinseque par defaut et 6,6 fois plus raide que notre adaptatif.
#     C est le point 10 du tableau de comparaison, a traiter a son tour.
#
# (3) COUT. Le run adaptatif fidele etait estime a ~40 h (arrete a 41 %). En
#     intrinseque : dt divise par ~1,9 (mesure de l etude tunnel) ET tous les
#     joints actifs a chaque pas au lieu de 1 766. Ordre de grandeur : 4 a 6
#     jours. Deux facons d y couper :
#       - variante ECONOME : meshFile = meshes/impact_fidele_s15.msh (echelle
#         1,5, ~40 k tets) — le temoin sort en quelques heures, la barre
#         maillage s elargit d environ 10 % sur la fissuration ;
#       - T reduit a 5e-4 : le pic, l indentation et le rebond sont acquis
#         avant 500 us (leur fig. 14 fige tout a ~482 us) ; on perd le tri des
#         fragments et la phase tardive.
#     Recommandation : faire d abord le temoin ECONOME a s = 1,5, en
#     re-lancant l adaptatif au MEME maillage pour que la comparaison porte
#     sur le seul schema.
