# ---------------------------------------------------------------------------
# IMPACT DIRECT LEGER — roche RAFFINEE (echelle article), SANS piston ni
# transmission d'onde (2026-08-28, demande F. Uzquiano : « un impact normal
# rapide et raffine, sans toute la panoplie de la barre »).
#
#   python tools/make_impact_mesh.py meshes/impact_leger_r10.msh 1.5 2e-5 1.0 leger
#   rockim_cl.exe bench_impact/configs/impact_leger_coulomb.cfg out_leger_coulomb
#
# TROIS CORPS seulement : roche (echelle 1,0 de l'article — 1 mm x SR dans la
# boule R12,5, insert pose a 20 um) + insert + bit. PAS de piston, circlip ni
# plaque : le bloc bit+insert PART DEJA a la vitesse d'indentation publiee
# (9,6 m/s, leur fourchette 9,40-9,85 a 10,66 m/s de piston). Le bit reste
# dans le modele parce qu'il PORTE LA MASSE (1,28 kg avec l'insert) : un
# insert seul (64 g) s'arreterait apres ~0,03 mm. L'onde fait toujours ses
# allers-retours dans le bit (c'est de la physique, pas du montage), mais il
# n'y a plus NI vol du piston NI transmission initiale : le contact
# insert/roche commence a t ~ 2 us au lieu de ~68.
#
# CE QUE CE BANC EST : le facies de fissuration (noyau broye, radiales,
# cratere) a la resolution de l'article, avec la loi coulomb validee par le
# run B (arrete a 128 us : cisaillement 62 %, verdict acquis).
# CE QU'IL N'EST PAS : la replique des 7 criteres — sans piston, l'histoire
# de chargement differe (pas de rampe d'onde) ; F-p et restitution ne se
# comparent a l'article que qualitativement.
#
# CHRONOLOGIE ATTENDUE (horloge CONTACT = t_sim - ~2 us, leur fig. 14) :
# noyau broye ~130 us, pic d'enfoncement ~205 us, radiales 250-390 us,
# tout fige ~480 us. D'ou T = 5,0e-4 et tri des fragments a 4,0e-4.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
toolShape = none
T = 5.0e-4
frames = 40

mesh = file
meshFile = meshes/impact_leger_r10.msh
gravity = 9.81

# --- roche : St Anne, leur Table 4 ------------------------------------------
rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45
Gf = 12
gfShearFactor = 66.7

# --- materiaux (fractions exigees par le lecteur, inertes avec mesh=file) ---
phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.insert = carbide

# --- assemblage : brasure insert/bit, et le bloc outil DEJA LANCE ----------
groupBond.bit.insert = joints
groupVel.bit = 0 0 -9.6
groupVel.insert = 0 0 -9.6

# --- physique : IDENTIQUE au run B (impact_imperial_coulomb.cfg), seule la
#     cinematique d'entree change. Bloc reporte tel quel. -------------------
insertion = intrinsic
strainRateDIF = yang-fig2
strainRateDIFArm = continuous
strainRateFilter = none
contact = potential
gcActivation = adaptive
contactMu = 0.6
dampingLocal = 0
dtFactor = 0.2
jointShearEnvelope = yang
jointSoftening = yan
jointElastic = parabolic
jointDeltaC = solidity
jointFailRule = majority
jointQuadrature = midedge
jointDeath = damage
jointShearUnload = origin
bulkModel = neohookean
bulkViscosityXi = 0
bulkViscosityGraded = 1
bulkViscosity = 2000
viscousInInsertion = 0
insertionPenaltyFactor = 26.32
jointPenaltyFactor = 26.32
potPenaltyFactor = 5.0
potTangentFactor = 1.4286
gcBirth = penalty
gcBirthPenMin = 0.01
gcBirthPenMax = 3.0
meanTensionCapFactor = 0
crushCap = 1e12
jointXi = 0

# --- le correctif valide par le run B --------------------------------------
jointShearRange = coulomb
jointFrictionScaled = 1

# --- tri des fragments (leur §2.3) et instrumentation ----------------------
fragBrushStart = 4.0e-4
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8
trackGroups = bit insert
gauge.bit = 0.28 0.30
