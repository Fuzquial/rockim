# ---------------------------------------------------------------------------
# IMPACT A INSERT UNIQUE — calcaire St Anne, piston a 10,66 m/s
# Yang, Xiang, Naderi, Wang, Aising, Ugarte, Latham, IJRMMS 191 (2025)
# 106125 — le cas vitrine de leurs fig. 11(e-g) et 14. Donnees d'essai :
# Mines Paris-PSL (Aising et al.). Spec 005, WP4 ; variante ECONOME s = 1,5.
#
#   python tools/make_impact_mesh.py meshes/impact_s15.msh 1.5
#   rockim_i3.exe bench_impact/configs/impact_stanne_s15.cfg out_imp_stanne
#
# QUATRE CORPS (volumes physiques gmsh) : rock / insert (carbure) / bit /
# piston (acier). Le piston vole a 10,66 m/s, 0,2 mm au-dessus du bit ;
# l'insert est brase au bit (groupBond -> joints d'interface GBM) ; la
# roche est fixee en base. Plaque et circlip OMIS (leur poids sur l'outil
# n'est pas applique dans leurs simulations non plus).
#
# PREDICTIONS (leur Table 3, variation de maillage non structure, 10,66 m/s,
# inscrites AVANT lancement) :
#   vitesse d'indentation du bit : 9,4 - 9,85 m/s
#   vitesse de rebond            : 6,87 - 7,1 m/s
#   profondeur d'indentation     : ~1,53 mm
#   fissures radiales            : 20 - 24,5 mm
#   rayon de cratere             : 10 - 12 mm
#   chronologie (leur fig. 14, depuis le contact insert/roche) : zone
#   broyee ~130 us, radiales/medianes 250-390 us, tout fige a ~480 us.
# Reserve : s = 1,5 au lieu de 1 — leur Table 3 montre 2 % de variation sur
# l'energie et ~10 % sur la fissuration entre maillages ; l'echelle 1,5
# elargit cette barre. La replique fidele (s = 1) attendra une nuit dediee.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
toolShape = none
T = 1.0e-3
frames = 40

mesh = file
meshFile = meshes/impact_fidele_r10.msh
gravity = 9.81

# --- roche : St Anne, leur Table 4 ------------------------------------------
rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45
Gf = 12
gfShearFactor = 66.7

# --- les trois materiaux (leur Table 4 + Table 1 du papier 2 : la Table 5
#     du papier 1 a les colonnes acier/carbure INVERSEES) ; les fractions
#     sont exigees par le lecteur mais inertes avec mesh = file -------------
phases = rock steel carbide
phase.rock.fraction = 0.90
phase.steel.fraction = 0.05
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.fraction = 0.05
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.20
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.insert = carbide

# --- assemblage -------------------------------------------------------------
groupBond.bit.insert = joints
groupVel.piston = 0 0 -10.66

# --- schema : l'insertion adaptative de rockim, PAS leur intrinseque --------
insertion = adaptive
strainRateDIF = yang-fig2
contact = potential
gcActivation = adaptive
contactMu = 0.6
insertionPenaltyFactor = 4
dampingLocal = 0
dtFactor = 0.2

# --- instrumentation (WP3) --------------------------------------------------
trackGroups = bit piston insert
gauge.bit = 0.28 0.30

# ---------------------------------------------------------------------------
# VARIANTE FIDELE (2026-08-22, demande de F. Uzquiano : « tout comme eux sauf
# l'adaptatif »). Ce deck ne garde de different que le SCHEMA D'INSERTION.
#
#   - insert POSE (jeu roche 0,02 mm) : le montage reel, diagnostic F-p ;
#   - PLAQUE (119,9 x 40 x 6, acier) posee sur le CIRCLIP (carbure, brase au
#     bit par groupBond) : leur fig. 5, poids sur l'outil par gravite ;
#   - jointShearEnvelope = yang : leur eq. 1 exactement ;
#   - jointSoftening = yan : la decroissance lisse, la plus proche de leur
#     fig. 3a (rockim n'a pas la z-curve de Munjiza : approximation notee) ;
#   - amortissement VISQUEUX comme eux, dampingLocal = 0. VALEUR : le
#     critique de Munjiza 2h sqrt(E rho) pour NOTRE maille fine (h = 1,5 mm)
#     = 3,7e4 Pa.s — leur 5,6e5 est 10x le critique de LEURS elements de
#     3 mm (coquille h = 30 mm probable) et forcerait dt / 3 ;
#   - TRI DES FRAGMENTS dans le run (leur §2.3) : 0,5 ms d'anti-gravite
#     apres l'impact -> cratere et masse de fragments mesures COMME EUX.
#
# PREDICTIONS (leur Table 3 a 10,66 m/s) : v_indentation 9,40-9,85 m/s,
# rebond 6,87-7,10, profondeur ~1,53 mm, fragments 1,44-1,58 g, radiales
# 20,2-24,5 mm, cratere 10,0-12,1 mm ; F-p en RAMPE vers ~130 kN a 1,5 mm.
# ---------------------------------------------------------------------------
groupPhase.circlip = carbide
groupPhase.plate = steel
groupBond.bit.circlip = joints
jointShearEnvelope = yang
jointSoftening = yan
# amortissement visqueux PAR ELEMENT, echelle critique : mu_e = xi h sqrt(E rho).
# xi = 0,6 est le plus fort niveau qui ne degrade PAS dt (la borne diffusive
# rho h^2/4mu rejoint celle des ressorts) ; un mu GLOBAL au critique de la
# maille fine imposait dt/14 (borne commandee par les tets du carbure).
bulkViscosityXi = 0.6
bulkViscosityGraded = 1
# leur amortissement est une dissipation, pas un moteur de rupture : le
# terme visqueux ne doit PAS entrer dans la contrainte du critere
# d'insertion (sinon le taux agit deux fois, contrainte d'essai ET seuil DIF)
viscousInInsertion = 0
fragBrushStart = 5.0e-4
# coquille corrigee le 2026-08-25 : le code lit fragBrushV0, pas fragBrushV
# (sans effet jusqu ici, la valeur ecrite etant EGALE au defaut 2.5e-3 —
#  mais toute autre valeur aurait ete ignoree EN SILENCE)
fragBrushV0 = 2.5e-3
fragBrushAccel = 98.1
fragBrushBeta = 0.8
# la forme litterale de leur eq. 3 : rs = (s_max - s_p)/(s_c - s_p)
jointShearUnload = origin

# Leur volume est PUREMENT ELASTIQUE (toute la resistance est dans les
# joints) : le garde-fou par defaut de rockim (crushCap = 8c = 150 MPa)
# ecretait la force de pointe — la portance sous l'insert atteint le GPa —
# creusant l'enfoncement et aplatissant la rampe F-p (decouvert au F-p du
# run 2). On le releve a 2 GPa : au-dessus de toute contrainte legitime,
# mais toujours la comme garde contre la pompe d'energie des elements
# ecrases a deformation O(1) (l'incident documente du 2D : 1e6 J crees).
crushCap = 2e9

# ---------------------------------------------------------------------------
# ROCHE FINE (2026-08-22, demande F. Uzquiano : « de belles fissures ») :
# maillage impact_fidele_r10.msh — la ROCHE a l'echelle 1,0 de l'article
# (1 mm boule Phi 25, 2 mm jusqu'a Phi 50, 10 mm au bord), l'acier reste a
# 1,5 (il ne porte que l'onde). 132 863 tets, dt inchange (l'insert le
# commande). Cout estime ~40 h, tri des fragments compris.
# ---------------------------------------------------------------------------

# ===========================================================================
# TEMOIN DU POINT 1 — volet ADAPTATIF (la reference du couple) (2026-08-25)
# ===========================================================================
# Deck APPARIE a temoin_intrinseque.cfg : voir son bandeau. Identique a lui
# en tout point SAUF les deux dernieres lignes. Ce n est PAS le run fidele du
# 2026-08-22 : celui-la avait jointXi = 0,05 et le maillage r10. Il faut donc
# le refaire ici pour que la comparaison porte sur le seul schema.
# ===========================================================================
meshFile = meshes/impact_fidele_s15.msh
jointXi = 0
insertion = adaptive

# ===========================================================================
# LA CONFIGURATION PORTEE — ligne 14 du tableau           (2026-08-25)
# ===========================================================================
# Ce deck est la copie EXACTE de temoin_adaptatif.cfg (la reference d impact)
# a ce bloc pres. Il active TOUT ce qui a ete porte aujourd hui depuis Guo et
# l ARMA, et RIEN d autre. La comparaison des deux runs repond a la seule
# question qui compte : la physique portee comble-t-elle le deficit de
# dissipation (0,66 J de frottement mesures contre 32,0 J publies) ?
#
# CE QUI EST VOLONTAIREMENT ABSENT :
#   - jointResidualMu : c est du Y-Geo, PAS de leur code. Solidity n a aucun
#     frottement residuel de joint (le mot n apparait qu une fois dans les 333
#     pages de Guo, hors sujet) — chez eux c est le relais au contact qui fait
#     le travail. L activer eloignerait de la replique au lieu d en rapprocher.
#   - insertion = intrinsic : on garde le schema ADAPTATIF de rockim, qui est
#     le sujet de la these. On ne change que la physique, pas le schema.
#   - la quadrature aux milieux d aretes : non portee, et c est un ARBITRAGE
#     (l integration aux noeuds est le choix d Abaqus, contre les oscillations
#     parasites a forte penalite) et non un defaut.
# ===========================================================================

# --- lignes 2 : le relais du joint rompu vers le contact (Guo §2.3.3) ------
jointDeath = damage

# --- lignes 4 et 5 : loi de volume + assemblage exact (Guo eq. 2.6 et 2.8) -
bulkModel = neohookean

# --- lignes 6 et 7 : la loi de joint de Guo (eq. 2.31 et 2.30) -------------
# jointSoftening = yan est OBLIGATOIRE : la parabole va avec la z-curve.
jointSoftening = yan
jointElastic = parabolic
jointDeltaC = guo

# --- ligne 9 : leur viscosite publiee, eta = 4000 Pa.s CONSTANT -----------
# rockim applique 2 mu D et Guo eq. 2.6 ecrit eta D, donc mu = eta/2.
# La reference tournait a 14 972 Pa.s GRADUE : 3,74 x trop visqueux.
bulkViscosityXi = 0
bulkViscosity = 2000

# --- ligne 10 : leur penalite publiee, p0 = 3000 GPa ----------------------
# Guo eq. 2.25 : delta_np = 2 ft h/p0, d ou facteur = p0/(2E) = 26,32.
# C est la parabole (ligne 6) qui rend ce facteur coherent A LA FOIS sur
# l ouverture au pic ET sur la raideur initiale.
insertionPenaltyFactor = 26.32
jointPenaltyFactor = 26.32

# --- duree : les 7 criteres sont acquis avant ~500 us (leur fig. 14 fige
# tout a 482). On raccourcit T et on avance le tri des fragments en
# consequence — le BILAN D ENERGIE, lui, est lisible a tout instant.
T = 5.5e-4
fragBrushStart = 4.0e-4

# ===========================================================================
# REPLIQUE IMPERIAL COLLEGE — la physique de Solidity, pas celle de rockim
# ===========================================================================
# Objectif : reproduire l impact a insert unique de Yang, Xiang, Naderi, Wang,
# Aising, Ugarte, Latham (IJRMMS 191, 2025) avec LEUR modele. Tout ce qui
# distingue rockim de Solidity est ici soit porte, soit neutralise.
#
# 1. JOINTS INTRINSEQUES. Leurs elements joints a 6 noeuds sont inseres entre
#    TOUS les tetraedres des t = 0 (Guo §2.3.1). C est leur schema ; celui de
#    rockim (adaptatif, Yan 2023) est une capacite EN PLUS, pas la leur.
insertion = intrinsic
jointPenaltyFactor = 26.32
# Sans instant d insertion, le DIF a besoin d un instant de gel. AUCUNE des
# trois sources ne dit lequel : c est le SEUL point ou la replique est
# impossible a l identique. `envelope` gele au franchissement de l enveloppe
# du joint — l analogue le plus proche, mais une convention rockim.
strainRateDIFArm = envelope
#
# 2. DISPOSITIFS ROCKIM SANS EQUIVALENT CHEZ EUX, neutralises :
#    - meanTensionCapFactor : plafond sur la contrainte moyenne de traction.
#      Defaut 3, donc ACTIF si on ne le pose pas. N existe dans aucun code de
#      reference.
meanTensionCapFactor = 0
#    - crushCap : plafond plastique du deviateur. Leur volume est purement
#      elastique (papier 1) et la loi neo-hookeenne se protege seule de
#      l ecrasement — le garde-fou n a plus de raison d etre.
crushCap = 1e12
#    - dampingLocal (Cundall) et jointXi (dashpot de joint) : deja a zero
#      plus haut, aucun equivalent declare chez eux.
#
# 3. CE QUI RESTE NON CONFORME, et il faut le dire :
#    (la QUADRATURE est desormais PORTEE, voir la cle ci-dessous)
#    - le MAILLAGE : le leur fait 230 788 elements (1 mm dans une boule de
#      25 mm). Celui-ci est l econome a 42 882. Passer a
#      meshes/impact_fidele_r10.msh (132 863) s en rapproche.
#    - l instant de gel du DIF (voir ci-dessus).
# ===========================================================================

# --- QUADRATURE : leurs 3 points aux milieux d aretes (Guo Table 2.2) ------
# Ecart nul en chargement uniforme, 50 a 200 % au front de fissure. Portee le
# 2026-08-26. A noter : la regle NODALE que rockim avait est celle d Abaqus
# pour ses elements cohesifs, retenue contre les oscillations de traction a
# forte penalite — ce n est donc pas un defaut qu on corrige, c est LEUR
# convention qu on adopte.
jointQuadrature = midedge

# ===========================================================================
# LEVEE D AMBIGUITE SUR LEUR "PENALTY NUMBER"        (2026-08-26)
# ===========================================================================
# La Table 1 de l ARMA donne "Penalty Number = 3 000 GPa" sans dire de quoi il
# s agit : penalite de JOINT, de CONTACT, ou les deux ? Et relative a quel
# module — la roche (57 GPa) ou le carbure (600) ?
#
# TRANCHE. Guo cite, a propos de la penalite, Turon, Davila, Camanho & Costa
# (2007), Eng. Fract. Mech. 74:1665-1682 : "the penalty term should be large
# enough in order to reduce the extra elasticity in the system introduced by
# the joint elements (Turon et al., 2007)". C est LE papier du rapport
# classique des modeles de zone cohesive, K = alpha E / t avec alpha ~ 50.
#   alpha = 50 sur la ROCHE  ->  p0 = 50 x 57  = 2 850 GPa
#   ils ecrivent                  p0 = 3 000 GPa,  soit alpha = 52,6
# La coincidence est trop exacte pour etre fortuite : leur Penalty Number EST
# la penalite des elements COHESIFS, rapportee au module de la ROCHE, posee par
# la regle de Turon. Ni le contact, ni le carbure.
#
# CONSEQUENCE : l equivalence utilisee ici est confirmee. Guo eq. 2.25 pose
# delta_np = 2 ft h / p0, donc une raideur de joint p0/(2h) ; rockim pose
# pj = facteur E/h. D ou facteur = p0/(2E) = 26,32 — le facteur 2 venant de SA
# convention dans delta_np, pas d une approximation de notre part.
#
# A NOTER, et c est instructif : l eq. 2.28 de Guo recommande E <= p0 <= 10E,
# ce qui CONTREDIT le alpha ~ 50 de Turon qu il cite deux phrases plus haut.
# Les auteurs de l article ont suivi Turon, pas l eq. 2.28 de la these.
# ===========================================================================

# --- PENALITE DE CONTACT : leur 3 000 GPa, lue comme UNE SEULE penalite ----
# Guo §2.3.4 decrit exactement la loi de rockim : potentiel de Munjiza integre
# sur le recouvrement (son eq. 2.49, f = somme des integrales de
# grad(phi_ci) - grad(phi_tj) sur V_ij — l ecriture en volume de notre
# integrale de bord, identiques par le theoreme de la divergence), detection
# NBS, paires de TETRAEDRES, frottement de Coulomb pur. Meme famille, meme
# formulation. Mais il ne donne AUCUNE valeur de penalite de contact.
#
# LECTURE RETENUE : la Table 1 de l ARMA ne liste QU UN SEUL "Penalty Number".
# Dans la lignee Munjiza une seule penalite sert habituellement au joint ET au
# contact. On pose donc la penalite de contact a leurs 3 000 GPa.
# rockim : potP = potPenaltyFactor x maxE, et maxE = 600 GPa (le carbure).
#   3 000 / 600 = 5,0
# ⚠️ C est une LECTURE, pas une certitude — et elle depend de maxE, donc du
# jeu de phases : si les materiaux changent, ce 5,0 est a recalculer.
#
# VERIFIE avant de le poser (fdem_percussion 2D, contact = potential) :
#   potPenaltyFactor = 1,0  ->  residu du bilan 0,333 %
#   potPenaltyFactor = 5,0  ->  residu du bilan 0,312 %
# Stable, et meme legerement meilleur. Sans cout : la penalite de CONTACT
# n entre pas dans le budget du pas de temps (seule celle de l outil y figure).
potPenaltyFactor = 5.0

# --- CE QUI RESTE UNE CONVENTION ROCKIM, faute de source ------------------
# strainRateTau (defaut 1e-6 s) : rockim FILTRE le taux de deformation par une
# exponentielle avant d en tirer le DIF, parce que le taux brut par element est
# trop bruite pour figer un facteur. Aucune des trois sources ne dit s ils
# filtrent. Laisse au defaut, et signale ici comme un ecart possible.
# ===========================================================================
# LE CODE SOURCE DE SOLIDITY, LU                          (2026-08-26)
# ===========================================================================
# Le solveur est PUBLIC : github.com/ImperialCollegeLondon/solidity-solver-open
# (LGPL-3.0, C, 17 000 lignes, format .Y3D — la lignee Munjiza de Guo et Yang).
# Les quatre conventions ci-dessous ne sont plus deduites d un article : elles
# sont RELEVEES DANS LEUR CODE, fichier et ligne cites. Ce qui suit remplace
# donc les conjectures du bloc precedent.
#
# CE QUE LA SOURCE CONFIRME (rockim etait deja juste, rien a changer) :
#   - loi de volume  T = (mu/J)B + [(lambda lnJ - mu)/J]I + eta D  (l. 716)
#     -> bulkModel = neohookean, deja pose ligne 190. Exact.
#   - viscosite : leur `dpeks*D`, et rockim ecrit 2 mu D
#     -> bulkViscosity = 2000 pour leur eta = 4000. Deja pose. Exact.
#   - z-curve a=0,63 b=1,8 c=6 (l. 1088-1090), couplage elliptique
#     sqrt(rn^2+rs^2) (l. 1136), branche elastique parabolique (2r-r^2)
#     (l. 1274), raideur DOUBLE en compression (l. 1265). Tous conformes.
#   - 3 points d integration aux MILIEUX D ARETES, poids A/6 sur chacun des
#     deux noeuds de l arete (l. 900-917 et 940) -> jointQuadrature = midedge,
#     deja pose ligne 261. Exact, y compris la ponderation.
#   - DIF applique a ft ET Gf, c ET GfII par le meme facteur (l. 1448-1456).
#     Conforme.
#   - AUCUN amortissement dans l integrateur (Y3Dsd.c) : la viscosite de
#     volume est leur seule dissipation hors joints et frottement. Conforme.
#   - leur modele d endommagement diffus est DESACTIVE (`df = R0`, l. 61 de
#     CauchyTet4) — ce que l article de 2026 sur le granite de Kuru dit
#     lui-meme du calcaire et du gres. Rien a activer.
#
# --- 1. delta_c : leur CODE ne fait pas ce qu ecrit la these ---------------
# Y3Dfd.c l. 1099 :  ot = MAXIM(2*op, 3*Gf/ft)   et la rupture est a op + ot.
# La convention `guo` (3 Gf/ft depuis zero) oublie et l offset op et le
# plancher 2 op. Le plancher ne mord qu en maillage FIN devant Gf/ft — donc
# ici, sous l insert. Leur propre commentaire dit deux fois
# `/*need further investigation*/`.
jointDeltaC = solidity

# --- 2. la rupture demande DEUX points sur trois --------------------------
# Y3Dfd.c l. 1175 : `if((nfail>1)&&(i1elpr[ielem]>=0))`. Un seul point au-dela
# de z >= 1 ne tue pas la facette. La regle implique un endommagement PAR
# POINT — chez eux z est une variable LOCALE de la boucle d integration, si
# bien qu un point rompu cesse de transmettre pendant que les autres tiennent.
# rockim ne portait qu un scalaire par joint, deja le max des points : la cle
# arme Joint::Dk et rend chaque point autonome.
jointFailRule = majority

# --- 3. leur DIF est CONTINU, jamais fige ---------------------------------
# `dpeftdif` est une variable locale de la boucle element, reevaluee a chaque
# pas (l. 1448-1456). Il n y a donc pas d instant de gel a deviner : c etait le
# « seul point ou la replique est impossible a l identique » — il ne l est
# plus. Le facteur suit le taux courant, a la hausse comme a la baisse.
# (Dans la version publique il vaut R1 = 1.0, c est-a-dire neutralise ; c est
#  l ARCHITECTURE qui est reprise ici, avec la formule de Yang.)
strainRateDIFArm = continuous

# --- 4. le rapport tangent/normal du contact vaut 2/7 ---------------------
# Y3Did.c l. 1017 : `ktss = 2.0/(7.0)*penalty`. Et leur frottement est
# exactement celui de rockim — ressort tangentiel a glissement MEMORISE puis
# retour radial de Coulomb (l. 1026-1051), pas un amortisseur en vitesse.
# rockim : kt/kn = potTangentFactor / potPenaltyFactor. Avec 5,0 ci-dessus,
#   potTangentFactor = 5,0 x 2/7 = 1,4286
potTangentFactor = 1.4286

# --- 5. la naissance d un contact sur un joint qui vient de mourir --------
# Y3Did.c l. 915-964. rockim relachait la force d un contact ne en
# recouvrement sur une constante de temps : il PART DE ZERO et monte sur
# gcBirthTau. Sous l insert, ou les joints meurent EN COMPRESSION sous forte
# charge, c est une perte de portance a chaque rupture.
# Eux font l inverse : au pas exact de la naissance ils lisent la force que le
# joint portait en mourant et calent la penalite de LA PAIRE pour que la force
# du contact naissant l egale — `d1pepe[icoup] = penalty*fn_joint/fn_contact`,
# borne a [0,01 ; 3]. La force est CONTINUE, le facteur persiste ensuite, et
# la raideur tangentielle le suit (`ktss = 2/7 * d1pepe[icoup]`).
# MESURE (percussion 2D, 2026-08-26) : 4 joints morts, 100 % en compression,
# 651 kN/m relayes, facteur moyen 1,031 ; travail de contact 0,213 -> 0,274
# J/m, dont frottement 0,111 -> 0,116. En TRACTION pure le facteur retombe a
# 1 (rien a relayer) et seule la suppression de la rampe se voit.
gcBirth = penalty
# Leurs deux bornes sont ARBITRAIRES (aucune justification ni dans le code ni
# dans les articles) : elles sont exposees pour qu on puisse mesurer ce
# qu elles coutent. Le resume imprime le facteur moyen — s il colle a une
# borne, c est le clamp qui decide a la place de la physique.
gcBirthPenMin = 0.01
gcBirthPenMax = 3.0

# --- 6. le taux de deformation qui alimente le DIF : BRUT -----------------
# Y3Dfd.c l. 1448 : dpeftdif est calcule sur le taux de l element tel quel,
# sans aucun lissage. rockim filtrait par un passe-bas de constante
# strainRateTau, et la raison en etait explicite dans son message d erreur :
# « le taux brut par element est trop bruite pour FIGER un DIF dessus ».
# Cette raison vise le GEL. Avec strainRateDIFArm = continuous (ligne plus
# haut) le facteur est repris a chaque pas : un pic de bruit ne dure qu un
# pas au lieu d etre grave dans le joint, et l argument tombe. Les deux cles
# se repondent — c est ensemble qu elles font leur schema.
# ⚠️ strainRateTau devient alors EXCLUSIVE : le solveur refuse qu elle soit
# ecrite en meme temps, plutot que de l ignorer en silence.
strainRateFilter = none

# --- CE QUI RESTE UNE CONVENTION ROCKIM, apres lecture de la source -------
# jointResidualMu : CONFIRME absent chez eux — leur `dpefm` vaut 0,0 en dur
# (l. 1091). Un joint rompu ne porte aucun cisaillement ; tout le frottement
# vient du contact. La cle reste donc DESACTIVEE, comme decide plus haut.
# Il ne reste, a ce jour, AUCUN ecart de physique connu et non porte entre ce
# deck et leur code. Les ecarts restants sont de DISCRETISATION :
#   - le MAILLAGE : 42 882 elements ici contre leurs 230 788 ;
#   - leurs tetraedres sont des T10 quadratiques avec F-bar (leur page
#     technique 3D FEMDEM, Xiang et al. 2009) la ou rockim est en T4 ;
#     a noter que leur element JOINT, lui, est bien le TET4JOINT a 6 noeuds
#     que rockim reproduit.
