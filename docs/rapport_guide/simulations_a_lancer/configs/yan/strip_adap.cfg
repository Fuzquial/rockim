# ---------------------------------------------------------------------------
# Yan, Wang & Jiao (IJRMMS 169, 2023, 105439) — section 3.1 :
# verification en milieu continu, bande ("long strip") pesante confinee.
#
# Bande h = 10 m, base encastree, flancs bloques en direction normale
# (rouleaux : u_x = 0, u_y libre), sommet libre, gravite g = 9,8 m/s2.
# Solution analytique (leur eq. 20, deformation plane) :
#   U = rho g h^2 (1+nu)(1-2nu) / (2 E (1-nu)) = 6,0087e-4 m
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion       # seul scenario "boite" sans chargement impose ;
impactSpeed = 0.0           # l'outil est immobile et hors contact (gap 1e-4)
toolMass = 1e-6
geometry = box

W = 2.0
H = 10.0
nx = 8
ny = 40
thickness = 1.0
mesh = grid

# --- conditions aux limites -------------------------------------------------
absorbing = none            # => rangee basse encastree (FIXED) par setupBoundaries
lateralRollers = true       # => flancs x = 0 et x = W en rouleau (u_x = 0)

# --- materiau ---------------------------------------------------------------
rho = 2800
E = 2e9
nu = 0.22
# resistances volontairement tres au-dessus de la contrainte de gravite
# (rho g h = 0,274 MPa) : aucune fissuration, aucun joint insere — c'est le
# cas de verification purement elastique de l'article
ft = 10e6
cohesion = 20e6
frictionDeg = 30
Gf = 100.0

# --- force de volume --------------------------------------------------------
gravity = 9.8

# --- pilotage ---------------------------------------------------------------
T = 0.4
frames = 20
dampingLocal = 0.7
insertion = adaptive
insertionPenaltyFactor = 4
