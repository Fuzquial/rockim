# RED BOHUS — jeu GBM 2D CALIBRÉ (calibration bayésienne 2026-07-31,
# tools/calibrate_bohus.py ; posterior_bohus.pdf) :
#   cibles : sigma_t = 18,3 MPa (Saadati/Shariati QS), UCS = 126,6 MPa
#            (triaxial réel sigma3 = 0, Dumoulin 2024)
#   confirmé (3 graines) : sigma_t = 17,07 MPa (-6,7 %), UCS = 139,1 MPa
#            (+9,9 %) — dans la dispersion labo déclarée (10 %)
#   postérieur : cohesion 13,6 MPa CI95 [6,9-19,6], phi_joint 13,4 deg
#            CI95 [10,2-20,1] (identifié), ft fixé 34 MPa par la traction
# Leçons de calibration (détail en tête de calibrate_bohus.py) :
#   - crushCap DÉCOUPLÉ (400 MPa) : le défaut 8*cohesion contrôlait l'UCS ;
#   - phi_joint 13 deg << phi macro : les joints plats du GBM sont
#     sur-résistants en compression (UCS/sigma_t ~ 15-20 sans ce levier).
# Ce fichier est l'essai de TRACTION ; pour l'UCS : pullV = -0.2,
# pullRamp = 3e-4, T = 1.5e-3.
mode = fdem
scenario = tension
mesh = voronoi
T = 8e-4
frames = 10
W = 0.03
H = 0.06
grainSize = 0.003
grainSeeding = random
lloydIters = 2
refineLevels = 0
seed = 12345
rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10
gbAlphaTen = 0.5
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
crushCap = 400e6
jointPenaltyFactor = 20
pullV = 0.08
pullRamp = 2e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false
