# ---------------------------------------------------------------------------
# NOUVEAU BANC B11, étape 0 — brésilien QUASI STATIQUE, granite de Kuru.
# Sert de dénominateur au DIF de rockim (sigma_dyn / sigma_QS, tous deux
# calculés par rockim) ; référence expérimentale : ft0 ~ 13 MPa (Saksala,
# Hokka, Kuokkala, Mäkinen, IJRMMS 59 (2013) 128-138, §2.2, D = 40,8 mm,
# L = 16 mm, doi:10.1016/j.ijrmms.2012.12.018). Aucun paramètre n'est recalé
# sur cette valeur : on la note.
# Fiche : docs/rapport_guide/simulations_a_lancer/NOUVEAUX_BANCS.md, banc 2.
# Maillage : python3 docs/rapport_guide/simulations_a_lancer/configs/nouveaux_bancs/bresilien_dyn_kuru/gen_mesh.py
# Gabarit : calib_quick/bts_v070b.cfg (brésilien sur disque Gmsh).
# ---------------------------------------------------------------------------
mode = fdem
scenario = brazilian
geometry = disc
mesh = file
meshFile = docs/rapport_guide/simulations_a_lancer/meshes/nb_disc41_h05_f5_s1.msh
T = 4e-3
frames = 10
W = 0.0408
H = 0.0408
thickness = 1.0
brazilianLoading = platens
# fermeture 0,01 m/s : vitesse de deformation ~0,25 /s, 27 fois sous le plus lent
# des essais dynamiques (6,7 /s) ; amortissement de Cundall 0,1 comme le deck
# brazilien de Yan (docs/rapport_guide/simulations_a_lancer/configs/yan/bd_adap.cfg)
pullV = 0.01
pullRamp = 3e-4
platenHalfWidth = 0.002
contactMu = 0.1
elasticGaugeLo = 0.3
elasticGaugeHi = 0.8
brazilianStopAfterPeak = true
brazilianStopDelay = 6e-5
seed = 12345
# --- jeu Kuru de rockim : Yang et al. 2026 (IJRMMS 206, 106660), Table 1,
#     repris tel quel de configs/yang2026_kuru_train1_v5.cfg
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20
meanTensionCapFactor = 0
insertion = adaptive
dampingLocal = 0.1
jointXi = 0.0
