# ---------------------------------------------------------------------------
# NOUVEAU BANC B10 — écaillage (spalling) d'un barreau de granite de Bohus
# Référence : M. Saadati, P. Forquin, K. Weddfelt, P.-L. Larsson, Adv. Mater.
# Sci. Eng. 2016, 6279571, doi:10.1155/2016/6279571 (fig. 2a, fig. 3, éq. 1).
# Fiche : docs/rapport_guide/simulations_a_lancer/NOUVEAUX_BANCS.md, banc 1.
#
# Variante « dif » : DIF de Yang (exposant de la figure 2b) armé à l'insertion.
# La variante sans DIF est ecaillage_nodif.cfg (même deck, deux lignes en moins).
#
# Montage. Le barreau (section carrée 39,9 x 39,9 mm = aire d'un Ø45 mm,
# longueur 140 mm : HYPOTHÈSE, l'article ne cote pas l'éprouvette, voir la
# fiche) reçoit sur sa face d'entrée (bottom, z = 0) la contrainte incidente
# mesurée à la jauge G1 (fig. 3 de l'article, numérisée à ±1,5 MPa et ±1 µs),
# appliquée comme traction morte. La face arrière (top, z = L) est libre : sa
# vitesse moyenne est le signal du vélocimètre laser (fig. 2a).
# Maillage :
#   python3 tools/make_unstructured_mesh.py box3dbc 0.0399 0.0399 0.14 0.0025 \
#       docs/rapport_guide/simulations_a_lancer/meshes/nb_ecaillage_h2p5.msh 1
# (62 217 tétraèdres ; l_cz = E Gf / ft^2 = 48 mm, h = 2,5 mm < l_cz/2.)
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = loads
mesh = file
meshFile = docs/rapport_guide/simulations_a_lancer/meshes/nb_ecaillage_h2p5.msh
insertion = adaptive
T = 1.5e-4
frames = 30
historyFlush = true

# --- matériau : granite de Bohus de Saadati ---------------------------------
# rho = 2660 kg/m3 et C0 = 4050 m/s (texte sous l'éq. 1) ; E = rho C0^2 pour
# que le barreau à faces libres propage à C0 (onde de barre).
rho = 2660
E = 43.63e9
# nu = 0,15 : Saadati et al. 2014 (IJNAMG, preprint ccsd), Table 1.
nu = 0.15
# ft quasi statique = 8 MPa « pour une éprouvette de même taille » (texte §2.2,
# renvoi [15] de l'article). C'est la seule résistance donnée par la source.
ft = 8e6
# Gf : NON publié par Saadati. 70 J/m2 = valeur du jeu Red Bohus de rockim
# (configs/calib/R_tens.cfg) ; sensibilité 35 et 140 J/m2 prévue dans la fiche.
Gf = 70
gfShearFactor = 10
# cohésion et frottement : défauts de rockim ; sans effet attendu en
# traction uniaxiale (vérifier nBrokShear ~ 0 au dépouillement).
cohesion = 25e6
frictionDeg = 40
meanTensionCapFactor = 0
dampingLocal = 0.0

# --- effet de vitesse (variante dif) -----------------------------------------
strainRateDIF = yang-fig2
strainRateTau = 1e-6
strainRateDIFArm = insertion

# --- chargement : contrainte incidente G1 (fig. 3), pic 41,5 MPa --------------
# t = 0 au pied de l'onde (t = -25 µs de la figure). Amplitude normalisée par
# 41,5 MPa ; traction positive selon +z = compression qui entre dans le barreau.
traction.bottom = 0 0 41.5e6
amplitude.bottom = 0 0 5e-6 0.036 10e-6 0.12 15e-6 0.265 20e-6 0.48 25e-6 0.70 30e-6 0.89 32e-6 0.965 35e-6 1.0 38e-6 0.94 40e-6 0.87 43e-6 0.72 45e-6 0.60 47e-6 0.43 50e-6 0.24 53e-6 0.10 55e-6 0.0

# --- mesures -----------------------------------------------------------------
# vitesse de la face arrière = dérivée de U_top_z (moyenne de la face) et de
# U_rear_z (sommet le plus proche du centre de la face, comme le laser).
force.top = 0 0 0
point.rear = 0.01995 0.01995 0.14
force.rear = 0 0 0
# jauges de la fig. 2b, à 116, 45 et 35 mm de la face arrière (axe du barreau)
point.g1 = 0.01995 0.01995 0.024
force.g1 = 0 0 0
point.g2 = 0.01995 0.01995 0.095
force.g2 = 0 0 0
point.g3 = 0.01995 0.01995 0.105
force.g3 = 0 0 0
