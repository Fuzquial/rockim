# ---------------------------------------------------------------------------
# NOUVEAU BANC P1.4 — problème de Lamb : force ponctuelle verticale en échelon
# (montée en cosinus de 2 µs) au centre de la surface d'un bloc 240 x 240 x 120 mm
# à bords absorbants (Lysmer + ressorts, absorbing = all : quatre côtés et fond).
# Références : Lamb (1904), Pekeris (1955, PNAS 41:469, forme fermée pour
# nu = 1/4), célérités de Rayleigh (Achenbach 1973), Boussinesq (Johnson 1985).
# Fiche : docs/rapport_guide/simulations_a_lancer/NOUVEAUX_BANCS.md, banc 3.
# Maillage (1,5 min, 686 392 tétraèdres) :
#   python3 docs/rapport_guide/simulations_a_lancer/configs/nouveaux_bancs/lamb_pekeris/gen_mesh.py 1.5 1
# Variante fdem3d (insertion adaptative, aucun joint inséré) ; voir lamb_fem3d.cfg.
# ---------------------------------------------------------------------------
mode = fdem3d
insertion = adaptive
# continuum sans rupture : resistances hors d atteinte (la force ponctuelle
# est singuliere sous la source)
ft = 1e12
cohesion = 1e12
Gf = 1e6
meanTensionCapFactor = 0
scenario = loads
mesh = file
meshFile = docs/rapport_guide/simulations_a_lancer/meshes/nb_lamb_h1p5.msh
# 0-35 us : aucune onde reflechie n atteint les stations (fenetre de Lamb) ;
# 35-80 us : fenetre de controle des bords absorbants
T = 8e-5
frames = 8
historyFlush = true
# matériau de V1 (vv/V1_onde) : nu = 0,25 exactement (solide de Poisson)
# c_S = 3 009,4 m/s ; c_P = 5 212,5 m/s ; c_R = 0,919 40 c_S = 2 766,9 m/s
rho = 2650
E = 60e9
nu = 0.25
absorbing = all
dampingLocal = 0.0
# source : P = 1 kN vers le bas (-z), échelon adouci
force.src = 0 0 -1000
amplitude.src = ramp 2e-6
# stations de surface : déplacement vertical U_<g>_z dans history.csv
force.r20 = 0 0 0
force.r30 = 0 0 0
force.r40 = 0 0 0
force.r50 = 0 0 0
force.d40 = 0 0 0
