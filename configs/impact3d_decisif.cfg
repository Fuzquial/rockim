# ---------------------------------------------------------------------------
# LE RUN DECISIF (2026-08-17) — le banc peut-il casser de la roche, oui ou non ?
#
# Reponse binaire attendue. Un seul run, une seule variable changee par rapport
# aux runs rates de la journee : le COUPLE (ft, Gf), choisi pour que la zone
# cohesive tienne dans la fenetre de faisabilite.
#
# VERIFICATION FAITE AVANT LANCEMENT (la discipline qui manquait ce matin) :
#   l_cz = E*Gf/ft^2 = 50e9 * 150 / (50e6)^2 = 3,00 mm
#   critere bas : l_cz > 2*dx = 1,62 mm   (dx = 0,81 mm, maillage p1_grad_7b)
#                 -> 3,70 elements pour resoudre la zone cohesive        OK
#   critere haut : l_cz < a = 7,5 mm      (rayon de contact de l'insert)
#                 -> l_cz/a = 0,40, la zone cohesive tient dans le contact OK
#
#   Pour memoire, les runs rates : ft = 10 MPa, Gf = 70 -> l_cz = 35 mm, soit
#   4,7 fois le rayon de contact. Aucune fissure ne pouvait localiser.
#
# JUSTIFICATION DU NIVEAU DE ft : 50 MPa est une resistance ELEVEE, justifiee
# par l'effet d'echelle a l'echelle de l'indentation (V_eff ~ 1 mm3). Elle se
# situe entre les 23,5 MPa employes pour la cavite sous pression et les 70 MPa
# de la barre d'ecaillage du rapport DP-DFH (§14.2). Gf = 150 J/m2 est dans la
# gamme du granite (40-300). Ce n'est PAS une calibration : c'est un point de
# fonctionnement coherent avec l'echelle, choisi pour rendre la question
# decidable.
#
# Volontairement ABSENTS pour que la reponse soit sans ambiguite : effet
# d'echelle (jointSizeEffect) et heterogeneite (jointWeibullM). Une seule
# variable a la fois — c'est l'erreur que j'ai commise trois fois aujourd'hui.
#
#   rockim_flush.exe configs\impact3d_decisif.cfg out_imp3d_decisif
#   maillage : make_unstructured_mesh.py bench1g 0.12 0.12 0.12 0.011 0.00005 \
#              0.004 0.0028 0.0007 0.010 0.010 meshes/p1_grad_7b.msh 1
#              (162993 tets dont 1247 dans l'insert, roche 0,81 mm sous impact)
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/p1_grad_7b.msh
T = 1.2e-4
frames = 12

# --- roche : le couple qui rend la fissuration possible ---
rho = 2650
E = 50e9
nu = 0.25
ft = 50e6
cohesion = 125e6
frictionDeg = 40
Gf = 150
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 20
insertionPenaltyFactor = 4

budgetAbortPct = 5
budgetAbortMin = 0.05
