# CALIBRATION facon Heilman et al., ARMA 24-0238 (LANL / HOSS) : roche
# HOMOGENE, joints cohesifs a loi de MOHR-COULOMB classique
#     mode I  : rupture quand sigma_n depasse ft, adoucissement sur Gf_I
#     mode II : tau = sigma tan(phi) + c, adoucissement sur Gf_II
# — c'est exactement l'equation (2) de l'article, et exactement la loi de joint
# de rockim : aucune modification du code n'a ete necessaire.
#
# HOMOGENE mais maillage DESORDONNE : la tessellation de Voronoi est utilisee
# comme simple mailleur (une seule phase, tous les alphas a 1), donc chaque
# joint porte la resistance du bulk et la microstructure n'introduit aucun
# contraste. Un maillage structure est proscrit : il oriente les fissures et,
# mesure sur ce code, fait diverger le calcul.
#
# Materiau : granite de la Table 1 de l'article (Utah FORGE, McLennan 2018).
#   UCS 212 MPa | E 48,26 GPa | rho 2610 | ft 10,62 MPa | c 44,815 MPa
#   mu = 0,8 -> phi = 38,66 deg | nu 0,23 | Gf_I 152,9 | Gf_II 645,3 J/m2
# Cibles de l'article : UCS simule 191,34 MPa (-9,7 %% du labo), BD 10,86 MPa.
#
# ESSAI UCS — eprouvette 120 x 60 mm (rapport longueur/largeur 2:1), chargee
# par PLATINES en contact et non par une rangee de noeuds encastree (la
# pratique Y-Geo ; un encastrement cree une couche limite ou le maillage fin
# casse). pullV < 0 = compression.
mode = fdem
scenario = tension
loading = platens
T = 4e-3
frames = 20
W = 0.06
H = 0.12
grainSize = 0.005
mesh = voronoi
grainSeeding = random
grainMesh = delaunay
lloydIters = 2
vertexMergeFrac = 0.12
refineLevels = 0
seed = 12345
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.660
Gf = 152.9
gfShearFactor = 4.2204

jointPenaltyFactor = 100
jointXi = 0.01
pullV = -0.1
pullRamp = 5e-4
dampingLocal = 0.1
verifyFt = false
