# ---------------------------------------------------------------------------
# T1b — LE BANC QUI CASSE. Étape 5 du plan du 2026-09-02.
#
#   python tools/make_unstructured_mesh.py box2d 0.008 0.004 0.00025 \
#          meshes/t1b_toolcut.msh 1
#   rockim_f2u.exe configs\verify_fdem_toolcut_break.cfg out_t1b_ref
#
# LA QUESTION. T1 a montré que la pompe du canal OUTIL disparaît sous
# `toolContact = signorini` (injection 4,43 -> 0,905). Mais T1 ne cassait rien :
# bloc LIBRE, contact 4,8 µs, et surtout l_cz = E·Gf/ft² = 65 mm pour un bloc de
# 4 mm — la rupture était hors d'atteinte par construction. On n'a donc JAMAIS
# pu mesurer si les canaux JOINT et FRAGMENTS pompent une fois l'outil propre.
# C'est la seule question qui bloque encore la coupe, et c'est ce banc-ci qui y
# répond.
#
# CE QUI CHANGE PAR RAPPORT À T1, ET POURQUOI
#   1. `shearSupport = fixedBottom` — le bloc est TENU. Sans cela l'outil le
#      chasse et il n'y a pas de coupe (mesuré sur T1 : 1,8 % du temps en
#      contact, bloc éjecté à 10,2 m/s). Aucune combinaison de clés existantes
#      ne le faisait : `absorbing` charge la face d'ENTRÉE.
#   2. `Gf = 5` — l_cz = 2,14 mm, soit sous la hauteur du bloc (4 mm) et sous
#      sa longueur (8 mm). C'est la condition pour que la rupture soit
#      ATTEIGNABLE. Le Gf de Heilman (152,9) donne 65 mm : hors fenêtre.
#      ⚠️ Gf est ici un paramètre de BANC, pas la valeur du granite : on veut
#      un essai qui casse, pas une prédiction de ténacité.
#   3. `dampingLocal = 0` — le Cundall s'applique à l'impulsion de contact
#      (mesuré : 51 % du travail outil sur T1 ; banc T0b cas C9 : la barre
#      perd 15,5 % de sa restitution à 0,05). Obligatoire sur un banc de force.
#   4. `cutterFloor = true` — sans quoi le cutter laboure une bande de
#      cutterThick·sin(rake) SOUS son arête (0,171 mm ici).
#   5. `cutDepth = 0,00075` — 3 h, contact soutenu et non une bouffée.
#   6. Joints en pénalité FIXE et `jointDeath = separation` : l'ÉTAT DE
#      RÉFÉRENCE. Les variantes `adaptive` / `damage` se posent en surcharge,
#      pour que la bissection mesure LEUR biais et pas un mélange.
#
# CE QU'ON LIT AU RÉSUMÉ (compteurs de l'étape 2)
#   injection outil / (trapèze) ...... canal OUTIL   — doit rester ~1
#   canaux (travail +) joints / gc ... canaux JOINT et FRAGMENTS — la question
#   v nodale max / 2 v_outil ......... borne physique, seule à trancher net
#   noeuds profonds .................. traversées invisibles à l'audit
#   broken joints / fragments ........ le banc casse-t-il vraiment ?
#
# ⚠️ Le « travail positif » ne distingue pas seul l'oscillation de la pompe :
# un ressort qui vibre en accumule. Il se lit AVEC v_max et avec le net (eJnt,
# eGc de l'history). C'est le couple qui tranche.
# ---------------------------------------------------------------------------
mode = fdem
scenario = shear
T = 4.0e-4
frames = 8

thickness = 1.0
mesh = file
meshFile = meshes/t1b_toolcut.msh

# --- granite Utah FORGE (Heilman et al., Table 1) — sauf Gf, voir en-tête ---
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 5.0                     # PARAMÈTRE DE BANC : l_cz = 2,14 mm <= bloc
gfShearFactor = 4.220
crushCap = 1e12              # volume ÉLASTIQUE, comme leur modèle

# --- montage : bloc TENU, amortissement NUL ---------------------------------
shearSupport = fixedBottom
absorbing = none
dampingLocal = 0.0

# --- cutter PDC -------------------------------------------------------------
toolShape = pdc
toolContact = signorini
backRakeDeg = 20
cutterLen = 0.003
cutterThick = 0.0005
cutterFloor = true
chamferLen = 0.0             # lu mais SANS EFFET dans le contact (défaut connu)
cutDepth = 0.00075           # 3 h : contact soutenu
cutSpeed = 10.0
toolX = -0.0003              # part hors matière
contactMu = 0.8

# --- schéma : celui de la campagne de coupe ---------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
jointXi = 0.05

# --- état de RÉFÉRENCE des canaux joint/fragments ---------------------------
jointContactPenalty = fixed      # la bissection surcharge en `adaptive`
jointDeath = separation          # la bissection surcharge en `damage`

# --- instruments ------------------------------------------------------------
vNodeMaxEvery = 1                # un pic isolé ne doit pas passer entre deux mesures
budgetAbortPct = 0               # le moniteur B4 est aveugle ici, on ne lui demande rien
historyFlush = true
