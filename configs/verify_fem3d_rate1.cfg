# FEM3D verification -- Perzyna rate effect, run 1 of 2. Same compression as
# verify_fem3d_dp but law = saksala (eta = 5e4 Pa s, cap parked far away).
# Steady uniaxial overstress above the static DP strength:
#   dsig = sqrt(3) * eta * epdot / (1/sqrt(3) - alpha)
# epdot = |pullV|/H = 8.33 /s -> dsig = 2.75 MPa (peak ~ 110.0 MPa).
# Run 2 doubles the rate: the overstress must double (linear Perzyna).
mode = fem3d
law = saksala
scenario = tension
T = 1e-3
frames = 5

W = 0.03
D = 0.03
H = 0.06
nx = 6
ny = 6
nz = 12

rho = 2650
E = 50e9
nu = 0.25
ft = 100e6
cohesion = 25e6
frictionDeg = 40
Gf = 7000
gfShearFactor = 10

saksalaEta = 5e4
capP0 = 500e6
capH = 40e9

pullV = -0.5
pullRamp = 5e-4
gripLateralFree = true
dampingLocal = 0.1

