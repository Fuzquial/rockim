# FEM3D demo -- 3D percussion with the saksala-type law (viscoplastic DP +
# cap + crack-band tensile damage + erosion): the same rigid sphere as the
# fdem3d demo (R = 15 mm, 0.5 kg, 8 m/s) on a 0.1 x 0.1 x 0.08 m block.
# Copy this config with law = elastic / dpr for the law comparison (or use
# the shipped fem3d_percussion_elastic/dpr.cfg): same insert, same mesh,
# only the constitutive law changes.
mode = fem3d
law = dpr
scenario = percussion
T = 1e-3
frames = 25

W = 0.1
D = 0.1
H = 0.08
nx = 24
ny = 24
nz = 18

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

# rate + crush parameters (plausible orders of magnitude, uncalibrated):
# eta 1e4 Pa s -> DIF ~ 1.6 at 1e3 /s; cap engages at 250 MPa pressure
saksalaEta = 1e4
capP0 = 250e6
erodeD = 0.98

toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

absorbing = all
dampingLocal = 0.05
dtFactor = 0.3


