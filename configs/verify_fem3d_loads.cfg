# Banc A des charges par groupes en fem3d (portage du 2026-10-03) : la meme
# barre elastique que configs/verify_fdem3d_loads.cfg, en continuum a noeuds
# partages. Solution exacte : sigma = 5 MPa, eps = sigma/E = 1e-4,
# allongement 4,0e-6 m, reaction de l appui = -2000 N (tets lineaires :
# l etat homogene est represente exactement).
# Maillage : python3 tools/make_unstructured_mesh.py box3dbc 0.02 0.02 0.04
#            0.004 meshes/loads_bar_h4.msh 1   (Gmsh 4.13.1, 1 662 tets)
# Reperes de la suite : loads_traction_fem3d, loads_pression_fem3d,
# loads_force_fem3d (tools/verify_suite.py).
mode = fem3d
scenario = loads
mesh = file
meshFile = meshes/loads_bar_h4.msh
law = elastic
T = 3e-4
frames = 4
rho = 2650
E = 50e9
nu = 0.25
dampingLocal = 0.3
# appuis isostatiques : fond glissant en z, un coin tenu en x y, un autre en y
fix.bottom = z
fix.c000 = x y
fix.c100 = y
traction.top = 0 0 5e6
amplitude.top = ramp 1e-4
