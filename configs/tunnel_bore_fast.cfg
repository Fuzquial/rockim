# ---------------------------------------------------------------------------
# TUNNEL PRESSURISE 2D (analogie du banc 6 Abaqus DP-DFH TUN_*) :
# plaque 100 x 100 mm percee d'une cavite circulaire R = 10 mm au centre,
# parois de la cavite pressurisees en rampe (charge suiveuse, les fissures
# ne recoivent RIEN) -> fissures radiales.
#   maillage : python tools/make_unstructured_mesh.py tunnel 0.1 0.1 0.01 \
#              0.002 meshes/tunnel_2d.msh 1
#   lancer  : rockim_dev.exe configs\tunnel_bore.cfg out_tunnel
# Mors de tension immobiles (pullV = 0) = plaque tenue haut/bas.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/tunnel_2d.msh
T = 2e-4
frames = 8
thickness = 0.01

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

pullV = 0
pullRamp = 1e-5
gripLateralFree = 1

# cavite pressurisee (la nouvelle selection bore)
confiningPressure = 40e6
confiningRamp = 1e-5
confineFaces = bore
boreCX = 0.05
boreCY = 0.05
boreSelectR = 0.015

dampingLocal = 0.05
dtFactor = 0.2
