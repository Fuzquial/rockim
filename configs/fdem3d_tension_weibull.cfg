# FDEM3D/GBM demo -- the correlated-strength-field experiment in 3D: direct
# tension on a single-phase voronoi structure whose joint strengths sample
# ONE Gaussian random field (Weibull marginals, mean 1) with a horizontal
# texture plane (angle 0): the weak BANDS are normal to z, so the specimen
# should break through the weakest band, reproducibly across meshes (change
# 'seed' with 'fieldSeed' fixed to test). Both 2D loading lessons applied:
# cosine pullRamp (quasi-static loading) + frictionless lateral grips.
mode = fdem3d
scenario = tension
mesh = voronoi
T = 6e-4
frames = 12

W = 0.04
D = 0.04
H = 0.06
grainSize = 0.011
grainSeeding = random
lloydIters = 2
vertexMergeFrac = 0.25   # 3D: les eventails de faces minces controlent dt
refineLevels = 0
seed = 12345

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointWeibullM = 6
strengthCorrLength = 0.012      # in-plane correlation length [m]
strengthCorrLengthB = 0.006     # across the texture plane: bands
strengthCorrAngleDeg = 0
fieldSeed = 555                 # the field, independent of the mesh seed

verifyFt = false                # the peak is MEANT to sit below ft
jointPenaltyFactor = 20
pullV = 0.05
pullRamp = 3e-4                 # ~10 wave transits: quasi-static loading
gripLateralFree = true
dampingLocal = 0.7
