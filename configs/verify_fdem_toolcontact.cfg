# ---------------------------------------------------------------------------
# T1 — BANC DE RACLAGE MINUSCULE : la pompe du contact outil, en quelques
# secondes au lieu d'une heure vingt.
#
#   python tools/make_unstructured_mesh.py box2d 0.004 0.002 0.00025 \
#          meshes/t1_toolcontact.msh 1
#   rockim_f2t0.exe configs\verify_fdem_toolcontact.cfg out_t1_penalty
#   rockim_f2t0.exe configs\verify_fdem_toolcontact.cfg out_t1_signorini
#          (avec toolContact = signorini)
#
# CE QU'IL MESURE. Les deux indicateurs que le rapport coupe PDC du
# 2026-08-18 reclamait en conclusion et qui n'avaient jamais ete poses :
#   1. injection = travail outil->solide / travail de corps rigide  (v3 : 408)
#   2. v nodale max / 2 v_outil, borne physique dure           (v3 : 127)
# Les deux sont imprimes au resume de TOUT run avec outil depuis le
# 2026-09-02 ; ce banc les met sous un critere.
#
# POURQUOI 10 m/s ET NON 1. La borne 2 v_outil est SANS ECHELLE — verifie en
# forme fermee par le banc T0 (cas C3, invariance sur six decades). Tourner a
# 10 m/s rend le banc dix fois moins cher ET plus severe : c'est la vitesse a
# laquelle la pompe a ete mesuree. Conclure a 10 m/s vaut pour 1 m/s.
#
# POURQUOI CE BANC A DES DENTS. Il est concu pour que la voie PENALITE
# ECHOUE. Un controle que les deux voies passent ne prouverait rien.
#
# GEOMETRIE. Bloc 4 x 2 mm, h = 0,25 mm. L'outil part hors matiere et traverse
# 3 mm — assez pour engager, racler et detacher, pas assez pour couter.
# Materiau : granite Utah FORGE de Heilman et al. (ARMA 24-0238), Table 1,
# celui du run v3 — pour que les nombres se comparent directement.
# ---------------------------------------------------------------------------
mode = fdem
scenario = shear
T = 3.0e-4
frames = 6

thickness = 1.0
mesh = file
meshFile = meshes/t1_toolcontact.msh

# --- granite Utah FORGE (Heilman et al., Table 1) ---------------------------
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 152.9
gfShearFactor = 4.220
crushCap = 1e12              # volume ELASTIQUE, comme leur modele

# --- cutter PDC -------------------------------------------------------------
toolShape = pdc
backRakeDeg = 20
cutterLen = 0.002            # face de coupe, a l'echelle du bloc
cutterThick = 0.0005         # face de degagement (sinon coin infini)
chamferLen = 0.0             # lu mais SANS EFFET dans le contact (defaut connu)
cutDepth = 0.0002            # 0,2 mm
cutSpeed = 10.0
toolX = -0.0003              # part hors matiere
contactMu = 0.8

# --- schema : celui de la campagne coupe -----------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

# --- loi de contact de l'outil ---------------------------------------------
# defaut = penalty (la voie qui pompe). Le run Signorini surcharge cette cle.
toolContact = penalty

# le moniteur d'energie est DESARME a dessein : il lisait [OK] a 1,9e-10 %
# pendant que la physique etait detruite. Ce banc ne lui demande rien.
budgetAbortPct = 0
