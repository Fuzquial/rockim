# RED BOHUS — essai BRÉSILIEN sur le GBM CALIBRÉ (jeu de
# bohus_gbm_calibrated.cfg : ft = 34 MPa, cohesion = 13,6 MPa,
# phi_joint = 13,4 deg, alphas 0,5, crushCap découplé 400 MPa).
#
# C'est une PRÉDICTION, pas un ajustement : le jeu a été calibré sur la
# traction directe (cible 18,3 MPa, obtenu 17,07) et l'UCS (cible 126,6,
# obtenu 139,1) — le brésilien n'est entré dans aucune des deux passes de
# calibration. Attendu : sigma_t(brésilien) >= sigma_t(traction directe),
# la littérature donnant couramment +10 à +40 % (le champ brésilien est
# biaxial, la fissure doit percoler un chemin de joints tortueux, et la
# zone comprimée sous les platines retarde l'amorçage). Un résultat
# NETTEMENT sous la traction directe signalerait au contraire que la
# rupture part des platines et non du centre — d'où la fraction diamétrale
# imprimée à côté de la résistance : il faut lire les deux ensemble.
mode = fdem
scenario = brazilian
geometry = disc
mesh = voronoi
T = 1.2e-3
frames = 20

# disque 50 mm, grains 3 mm (comme l'éprouvette de calibration)
W = 0.05
H = 0.05
grainSize = 0.003
grainSeeding = random
lloydIters = 2
vertexMergeFrac = 0.12
refineLevels = 0
seed = 12345

rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10

gbAlphaTen = 0.5
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
crushCap = 400e6
# chargement : deux platines rigides qui se RAPPROCHENT (pratique Y-Geo /
# FEM-DEM ; pullV = vitesse de fermeture totale, chaque platine a la moitie).
# Les deux doivent bouger : avec la platine basse fixe, le disque derive et
# l'amortissement de Cundall porte la charge (mesure : 1,39 MN en haut contre
# 11 kN en bas). Appui ETROIT (2*alpha ~ 20 deg) : la litterature prefere le
# contact plat-sur-plat pour le bresilien, qui fait amorcer la fissure au
# CENTRE du disque.
brazilianLoading = platens
platenHalfWidth = 0.004
pullV = 0.05
pullRamp = 3e-4
# penalite de joint a 100 E : Tatone & Grasselli (IJRMMS 75, 2015) calibrent
# les essais 2D de laboratoire entre 100 E et 1000 E, contre 20 E par defaut
# ici (regle pour l'impact).
jointPenaltyFactor = 100
# amortissement modere : les deux platines symetriques annulent l'effet de
# force de volume de l'amortissement de Cundall entre les deux moities, mais
# 0,7 biaiserait encore le champ
dampingLocal = 0.1
verifyFt = false
