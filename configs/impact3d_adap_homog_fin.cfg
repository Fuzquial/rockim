# ---------------------------------------------------------------------------
# IMPACT 3D — CAS 1 : HOMOGENE, panoplie complete (2026-08-17)
#
# Reprise du banc P1 moyen (p1_banc_mid.cfg, run du 14/08) avec TOUTES les
# capacites validees activees, la ou le run d'origine n'avait que
# contact = potential + gcActivation = adaptive.
# Maillage LIBRE homogene (p1_banc_mid.msh, 259k tets (maillage p1_banc_fin, h 3,0/1,8 mm)) : aucun grain GBM.
# Temoin du couple homogene / heterogene — voir impact3d_adap_weib.cfg, qui
# n'ajoute que jointWeibullM + strengthCorrLength + fieldSeed.
#
#   rockim_chk.exe configs\impact3d_adap_homog.cfg out_imp3d_homog_fin
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/p1_banc_fin.msh
T = 1.2e-4
frames = 6

# roche : granite du banc percussion
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

# l'insert maille remplace l'outil rigide
toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

# --- panoplie derniere generation ---
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 20
insertionPenaltyFactor = 4

# --- garde-fou energie (E2) ---
budgetAbortPct = 5
budgetAbortMin = 0.05
