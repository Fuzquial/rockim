# FDEM verification — BRAZILIAN (indirect tension) on an UNSTRUCTURED disc.
#
# THE MESH IS UNSTRUCTURED ON PURPOSE, and this is not a detail. In FDEM a
# crack can only run along element boundaries, so "fracture propagation paths
# are limited by mesh orientations"; the Y-Geo literature (Lisjak & Grasselli)
# states the rule plainly: to minimize the bias induced on the model response,
# RANDOMLY DISCRETIZED MESHES SHOULD BE USED IN PLACE OF STRUCTURED GRIDS. The
# cross-diagonal grid this code uses elsewhere offers a crack exactly two
# directions at 45 deg, which is precisely the wrong thing to hand a test whose
# whole answer is "does it split along the loaded diameter". mesh = voronoi
# with grainSeeding = random (Poisson-disc) gives isotropic facet orientations
# — the same front-end as verify_fdem_voronoi_tension, single phase and all
# alphas at 1, so every joint carries the bulk strength and the tessellation is
# used purely as an unstructured mesher.
#
# WHAT IS CHECKED — the elastic field, which is parameter-free. On an elastic
# disc compressed along a diameter the centre carries
#     sigma_xx = +2P/(pi D t)   (exactly what the ISRM formula reports)
#     sigma_yy = -6P/(pi D t)
# so sigma_yy/sigma_xx = -3, a number containing no material constant, no
# geometry and not even the load. The solver latches both on the last step
# before the first joint breaks: that one line verifies the platens, the disc
# cut and the stress recovery at once. Finite bearing softens both slightly.
#
# The measured STRENGTH is reported, not pass/failed: an intrinsic-joint FDEM
# reads somewhat ABOVE ft for the same reason direct tension on a voronoi mesh
# does (+9...+12 % there — the crack path is tortuous and its facets see
# sigma*cos^2). Read it together with the DIAMETRAL FRACTION printed beside it:
# a disc that fails off-axis or crushes under a platen is not a tensile
# measurement whatever the formula returns.
mode = fdem
scenario = brazilian
geometry = disc
mesh = voronoi
T = 4e-3
frames = 20

# the disc is inscribed in the box: diameter = min(W, H) = 0.06 m
W = 0.06
H = 0.06
grainSize = 0.004
grainSeeding = random
lloydIters = 2
vertexMergeFrac = 0.12
refineLevels = 0
seed = 12345

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

# Loading: two rigid platens closing on the disc, as in Y-Geo (Mahabadi et al.)
# and the FEM-DEM BTS literature. pullV is the CLOSURE rate, each platen moving
# inward at half of it. BOTH platens must move: with a fixed lower platen the
# disc drifts and the Cundall damping silently carries the load (measured on the
# first attempt here: 1.39 MN read on top against 11 kN underneath). Tatone &
# Grasselli (IJRMMS 75, 2015) report the result is insensitive to the platen
# velocity for values of order 0.05 m/s and below.
brazilianLoading = platens
pullV = 0.05
pullRamp = 2e-4

# Narrow bearing: the literature prefers a flat-to-flat contact for the
# brazilian precisely because it makes the crack initiate at the CENTRE of the
# disc. 10 mm on a 60 mm disc is a loading angle of about 20 deg, the standard
# flattened-disc value. Measured pay-off on the structured mesh: the centre
# tensile stress matches 2P/(pi D t) to 2 % this way, against a factor 2 error
# with platens spanning the whole polar facet.
platenHalfWidth = 0.005

# Penalty: Tatone & Grasselli calibrate 2D FDEM lab-scale tests at 100 E to
# 1000 E, well above the 20 E this code defaults to for impact work. The
# stiffer joint costs sqrt(20/100) of the time step and removes most of the
# artificial compliance of the intrinsic penalty.
jointPenaltyFactor = 100

# Cundall damping is a force -c|f|sign(v) on every node, so whenever a specimen
# moves coherently the sum of those forces acts as a body force. Closing both
# platens symmetrically cancels it between the two halves, but 0.7 would still
# bias the field: 0.1 damps the ringing and little else.
dampingLocal = 0.1
