# ---------------------------------------------------------------------------
# IMPACT 3D SUR GRANITE DE KURU — version GROSSIERE de validation.
# Yang, Xiang, Naderi, Wang, Aising, Ugarte & Latham, IJRMMS 206 (2026) 106660.
#
#   python tools/make_impact3d_mesh.py 0.150 0.150 0.100 0.002 0.0125 0.015 #          meshes/impact3d_gros.msh 1
#   rockim_f2u.exe configs\impact3d_kuru_gros.cfg out_3d_gros
#
# POURQUOI LA 3D CHANGE TOUT SUR UN POINT. En 2D, la masse de l'insert n'avait
# aucun equivalent depuis leurs 1,509 kg : c'etait un parametre LIBRE, que j'ai
# d'abord pose vingt fois trop bas (rien ne cassait) puis balaye jusqu'a
# 400 kg/m. En 3D la masse est une VRAIE masse : on prend la leur, telle quelle.
# Plus aucun parametre ajuste — c'est tout l'interet de refaire l'essai en 3D.
#
# CE QUE LE BALAYAGE 2D A ETABLI (a garder en tete pour lire ce run) :
#   e passe de 0,709 a 0,428 quand l'energie est multipliee par huit, et
#   l'ecaillage de fond s'efface (56 % -> 3 % des ruptures) a mesure que la
#   vraie fissuration prend le dessus. Le point haut 2D (e = 0,428) encadre
#   leur mesure haute (0,39). Ici on vise leur point BAS : e = 0,83.
#
# VALIDATION D'ABORD : maille 2 mm sous l'impact (contre 1 mm chez eux),
# eprouvette 150 x 150 x 100 mm (contre un cylindre Ø250 x 150), insert
# SPHERIQUE ANALYTIQUE (contre un insert maille + taillant + piston). Ce run
# ne cherche pas la fidelite, il cherche le COUT et le montage.
#
# ⚠️ Les deux indicateurs de pompe (injection outil, v nodale max) n'existent
# QU'EN 2D a ce jour — le resume 3D ne les imprimera pas. Parite a faire.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 3.0e-4
frames = 20

mesh = file
meshFile = meshes/impact3d_gros.msh

# --- granite de Kuru Grey, leur Table 1 -------------------------------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20
crushCap = 1e12

# --- les trois ingredients de l'article -------------------------------------
bulkDamage = yang
bulkDamageDelta0 = 1.4e-5
bulkDamageDeltaF = 4.0e-4
bulkDamageDmax = 0.9
jointDeath = damage
jointResidualMu = 0.18

# --- l'insert : LEUR masse, LEUR vitesse, LEUR rayon ------------------------
toolShape = sphere
toolRadius = 0.00851
toolMass = 1.509             # kg — LEUR bit (p. 11), plus aucun parametre libre
impactSpeed = 5.62           # m/s — LEUR vitesse d'enfoncement a 9 m/s piston
toolGap = 1e-4
contactMu = 0.6
toolContact = penalty        # obligatoire pour mesurer un rebond

absorbing = all

# --- schema : celui des runs 2D ---------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
contact = potential
gcActivation = adaptive
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

budgetAbortPct = 0
historyFlush = true
