# ---------------------------------------------------------------------------
# ETOILE V2 — la version corrigee apres discussion du 2026-08-30 :
#   * insertion = adaptive : B8 a mesure x3,24 de ratcheting sous-critique en
#     intrinseque ; ce halo diffus mange le contraste dont la localisation
#     radiale a besoin. L'adaptatif est le bon choix pour l'etoile.
#   * bulkDamage = yang + contactResidualMu : la poche sous l'insert devient
#     broyage de volume a friction residuelle (Yang et al. 2026, IJRMMS 206).
#     !!! delta0/deltaF RECALIBRES x2,5 : les defauts Kuru Grey sont lus pour
#     des elements de 1 mm ; ici h ~ 2,5 mm et delta_m = h*eps. Cette mise a
#     l'echelle preserve la DEFORMATION seuil, pas une calibration Kuru !
#   * maillage fin h 2,5 mm (293 577 tets, box3d_star_h25.msh, FOURNI).
# Le reste = deck etoile : bloc 120x120x80, ft 12 MPa / Gf 30 (l_ch 12,5 mm),
# champ Weibull correle (m 6, l 10 mm, graine 555), 2 kg a 8 m/s, T 500 us.
# Cout : nuit avec OpenMP (set OMP_NUM_THREADS=coeurs physiques).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/box3d_star_h25_delaunay.msh
T = 5e-4
frames = 12

rho = 2650
E = 60e9
nu = 0.25
ft = 12e6
cohesion = 30e6
frictionDeg = 40
Gf = 30
gfShearFactor = 10

jointPenaltyFactor = 20
insertion = adaptive

toolShape = sphere
toolRadius = 0.015
toolMass = 2.0
impactSpeed = 8.0

jointWeibullM = 6
strengthCorrLength = 0.010
fieldSeed = 555

bulkDamage = yang
bulkDamageDelta0 = 3.5e-5
bulkDamageDeltaF = 1.0e-3
contactResidualMu = 0.2

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15
