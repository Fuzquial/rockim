# ---------------------------------------------------------------------------
# P1 BANC v2 — correction du gap : 0,05 mm (au lieu de 0,5 mm) pour que
# l'impact ait lieu DANS la fenetre T = 20 µs (contact ~6,5 µs, valide par
# le smoke test configs/smoke_impact.cfg du 2026-08-14 : Fz -> 4,85 kN,
# 3 joints casses, residu B4 = 5,7e-6 %).
# Identique a p1_banc.cfg sauf meshFile. Maillage :
#   python tools/make_unstructured_mesh.py bench1 0.12 0.12 0.12 0.011 \
#          0.00005 0.002 0.002 meshes/p1_banc_v2.msh 1
# Lancer via p1_windows_v2.bat (1 thread puis tous coeurs).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/p1_banc_v2.msh
T = 2e-5
frames = 2

# roche (defauts globaux = granite du banc percussion)
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

jointPenaltyFactor = 20

# l'insert maille remplace l'outil rigide
toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

contact = potential
gcActivation = adaptive
