# RED BOHUS — essai TRIAXIAL sur le GBM calibré : compression uniaxiale
# (scenario = tension avec pullV < 0) PLUS une pression de confinement sur
# les faces latérales. C'est l'UCS de la calibration (jeu de
# bohus_gbm_calibrated.cfg, obtenu 139,1 MPa à sigma3 = 0) auquel on ajoute
# le seul ingrédient qui manquait pour rejoindre la campagne triaxiale de la
# thèse (données Dumoulin 2024).
#
# Deux réglages qui comptent :
#   - confiningRamp < pullRamp : le confinement doit être ÉTABLI avant que
#     la charge axiale ne monte, sinon on mesure un chemin de chargement
#     proportionnel et pas un triaxial ;
#   - la pression est un chargement SUIVEUR appliqué aux faces extérieures
#     d'origine seulement — pas dans les fissures qui s'ouvrent (une cellule
#     triaxiale a une membrane ; pressuriser les lèvres de fissure est un
#     autre problème physique, celui de la fracturation hydraulique).
#
# Le résumé imprime la contrainte laterale RÉELLEMENT atteinte au coeur de
# l'éprouvette : c'est le contrôle à lire avant d'exploiter le pic. Balayer
# sigma3 = 0 / 5 / 10 / 20 / 40 MPa donne l'enveloppe de rupture à comparer
# à celle de CONTINUUM\calib_bohus_triax.
mode = fdem
scenario = tension
mesh = voronoi
T = 2.5e-3
frames = 20

W = 0.03
H = 0.06
grainSize = 0.003
grainSeeding = random
lloydIters = 2
refineLevels = 0
seed = 12345

rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10

gbAlphaTen = 0.5
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
crushCap = 400e6
jointPenaltyFactor = 20

# compression : pullV NÉGATIF
pullV = -0.2
pullRamp = 1e-3
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false

# confinement lateral
confiningPressure = 10e6
confiningRamp = 1e-4
confineFaces = sides
# la jauge de confinement est lue a 3 rampes : le temps que la pression
# s'equilibre dans l'eprouvette, et bien avant que l'axial ne compte
confineGaugeTime = 3e-4
