# Bresilien de Yan, Zheng & Wang (IJRMMS 169, 2023) — fig. 11-13.
# Disque D = 50,8 mm, maillage non structure ~0,75 mm, deux plateaux fermant a
# 0,1 m/s (0,05 chacun), frottement 0,1, materiau de leur Table 1 (Tatone).
# Attendu (fig. 12-13) : fissure de traction le long du diametre charge ;
# l'adaptatif donne la courbe la plus raide et le pic le plus haut (~2,9 MPa
# de sigma_t nominal), l'intrinseque 100E converge juste en dessous.
mode = fdem
scenario = brazilian
geometry = disc
T = 2.5e-3
frames = 16

W = 0.0508
H = 0.0508
thickness = 1.0

mesh = voronoi
grainSize = 0.006
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.00075
seed = 4211

rho = 1704
E = 15e9
nu = 0.24
ft = 1.3e6
cohesion = 16.4e6
frictionDeg = 23
Gf = 3.8
gfShearFactor = 22.105
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

brazilianLoading = platens
pullV = 0.1
pullRamp = 2e-4
platenHalfWidth = 0.0025
contactMu = 0.1
dampingLocal = 0.1
jointXi = 0.0

# intrinseque : 100E = la reference convergee de l'article (et Tatone) ;
# le run adaptatif surcharge ces deux lignes
insertion = adaptive
jointPenaltyFactor = 100
insertionPenaltyFactor = 4
discMesh = native
discFlattenDeg = 20
