# ---------------------------------------------------------------------------
# BENCH 1 (V1) — impact d'un INSERT SPHERIQUE MAILLE sur une eprouvette :
# premier jalon de la trajectoire Solidity (insert -> piston-taillant-roche).
# L'outil rigide historique est retire (toolShape = none) ; l'insert est un
# CORPS DEFORMABLE du maillage, porte par un groupe physique Gmsh.
#
# Maillage : deux volumes physiques ("rock" 80x80x50 mm, "insert" sphere
# R = 11 mm posee 0.5 mm au-dessus), AUCUN noeud partage, AUCUN joint entre
# les deux corps — l'interaction passe par le contact general uniquement.
#   python3 tools/make_unstructured_mesh.py bench1 0.08 0.08 0.05 0.011 \
#           0.0005 0.0045 0.0028 meshes/bench1_insert.msh 1
#
# Materiaux par groupe : chaque corps prend la phase HOMONYME (phase.rock,
# phase.insert). Les fractions sont sans effet ici (pas de tirage Voronoi :
# les groupes du maillage decident) mais la cle est obligatoire.
# L'insert est en carbure de tungstene (E = 600 GPa, rho = 14500) avec des
# resistances hors d'atteinte : il doit rester elastique dans ce banc.
#
# Lancer depuis la racine rockim/ :
#   ./build/rockim configs/fdem3d_bench1_insert.cfg out_bench1
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/bench1_insert.msh
T = 2e-4
frames = 30

# roche (defauts globaux = granite du banc percussion)
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

jointPenaltyFactor = 20

# l'insert maille remplace l'outil rigide
toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

contact = potential
gcActivation = adaptive
