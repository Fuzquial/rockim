# FEM3D demo -- 3D percussion with the FAITHFUL PORT of the thesis' Saksala
# (2011) VUMAT (law = saksala2011), material = Table I of the paper
# (Kuru-granite-like, converted to SI). No erosion and no fracture-energy
# regularization -- exactly like the published law: the crater is the
# damage field, crushed material stays as a bearing rubble bed (unilateral
# crack closure). All sk* parameters default to Table I; only the shared
# elastic/strength block needs restating here.
mode = fem3d
law = saksala2011
scenario = percussion
T = 1e-3
frames = 25

W = 0.1
D = 0.1
H = 0.08
nx = 24
ny = 24
nz = 18

rho = 2600
E = 60e9
nu = 0.2
ft = 13e6
cohesion = 37.5e6
frictionDeg = 30
Gf = 70
gfShearFactor = 10

toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

absorbing = all
dampingLocal = 0.05
dtFactor = 0.3
