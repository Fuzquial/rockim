# FDEM3D -- lateral cutting by a prescribed rigid sphere at a fixed depth
# of cut: the 3D lift of the 2D fdem shear demo. Same joint-penalty caveat:
# a millisecond of cutting is tens of thousands of steps, budget minutes.
mode = fdem3d
scenario = shear
T = 8e-4
frames = 20

W = 0.09
D = 0.05
H = 0.04
nx = 18
ny = 10
nz = 8
meshJitter = 0.3

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
toolRadius = 0.012
cutDepth = 0.004
cutSpeed = 10.0
contactMu = 0.4

dampingLocal = 0.05
absorbing = sides
