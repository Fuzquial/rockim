# ---------------------------------------------------------------------------
# PERCUSSION « ETOILE » — leve les quatre verrous des fissures radiales :
#  1. heterogeneite  : champ Weibull correle (m=6, l=10 mm, fieldSeed 555)
#  2. echelle        : bloc 120x120x80 mm ; materiau granite plus fragile
#                      (ft 12 MPa, Gf 30 J/m2 -> l_ch = E Gf/ft^2 = 12,5 mm,
#                      soit ~10 l_ch dans le bloc contre 2,3 au deck de base)
#  3. resolution     : maillage Delaunay h = 3,5 mm (114 682 tets),
#                      genere par tools/make_unstructured_mesh.py (repo)
#  4. energie/fenetre: 2 kg a 8 m/s (64 J au lieu de 16) ; T = 500 us
# Tout le reste est le deck de base. frames = 6 (economie disque).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/box3d_star_h35.msh
T = 5e-4
frames = 6

rho = 2650
E = 60e9
nu = 0.25
ft = 12e6
cohesion = 30e6
frictionDeg = 40
Gf = 30
gfShearFactor = 10

jointPenaltyFactor = 20
toolShape = sphere
toolRadius = 0.015
toolMass = 2.0
impactSpeed = 8.0

jointWeibullM = 6
strengthCorrLength = 0.010
fieldSeed = 555

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15
