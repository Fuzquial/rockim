# ---------------------------------------------------------------------------
# IMPACT 3D — CAS 2 : HETEROGENE (Weibull sur les joints), panoplie complete
#
# STRICTEMENT identique a impact3d_adap_homog.cfg, a trois cles pres (en bas) :
# la comparaison isole donc l'effet de l'heterogeneite, et rien d'autre.
# Maillage LIBRE homogene lui aussi : le desordre vient du CHAMP de resistance,
# pas de grains GBM.
#
#   rockim_chk.exe configs\impact3d_adap_weib.cfg out_imp3d_weib
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/p1_banc_mid.msh
T = 1.2e-4
frames = 6

# roche : granite du banc percussion
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

# l'insert maille remplace l'outil rigide
toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

# --- panoplie derniere generation ---
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 20
insertionPenaltyFactor = 4

# --- garde-fou energie (E2) ---
budgetAbortPct = 5
budgetAbortMin = 0.05

# ===========================================================================
# LA SEULE DIFFERENCE AVEC LE CAS 1 : le champ de resistance desordonne.
# m = 6 (granite, valeur du 2D) ; ell = 4 mm ~ 1,5 element sur ce maillage,
# donc le champ reste resolu ; le champ vit dans l'ESPACE (independant du
# maillage), fieldSeed le pilote.
# ===========================================================================
jointWeibullM = 24
strengthCorrLength = 0.004
fieldSeed = 555

# ===========================================================================
# EFFET D'ECHELLE STATISTIQUE (eq. 42 du rapport DP-DFH, convention VUMAT).
# Zeff = 2.0e-8 m3 = 20 mm3 : le volume moyen d'element du maillage MOYEN,
# mesure par inversion du facteur. Il est FIGE pour les deux maillages — c'est
# ce qui rend la comparaison valide. Le maillage moyen garde donc ses
# resistances actuelles (facteur 1,000) et le maillage fin recoit les +4,9 %
# que la statistique de Weibull lui impose a m = 24.
# ATTENTION : ce Zeff ancre une valeur de ft NON calibree (10 MPa herite du
# banc percussion). Il rend l'etude de maillage interpretable ; il ne pretend
# PAS identifier Bohus a l'echelle de l'indentation (§14.2 du rapport).
# m = 24 : pente franche de Bohus apres retrait de la seconde population de
# defauts (§14.1) — remplace le m = 6 des runs precedents, qui etait la pente
# apparente contaminee.
# ===========================================================================
jointSizeEffect = 1
jointSizeEffectM = 24
jointZeff = 2.0e-8
