# VALIDATION du critere d insertion sur un champ UNIFORME (2026-09-12) : cube 40 mm en traction, adaptatif,
# facetAverage = max. Les trois valeurs (arith, max, nodal) doivent donner le meme pic (ft = 10 MPa) et le
# meme instant de premiere rupture (~282 us). Mesure : 9,98 / 9,80 / 9,72 MPa, 282,4 / 281,6 / 282,8 us.
# FDEM3D verification — direct tension on a cube. The Kuhn subdivision keeps
# complete planes of triangular joints normal to z at every cell interface,
# which all carry exactly the macro stress: the peak must equal ft.
mode = fdem3d
scenario = tension
T = 4e-4
frames = 2

W = 0.04
D = 0.04
H = 0.04
nx = 10
ny = 10
nz = 10
meshJitter = 0.0

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

insertion = adaptive
insertionPenaltyFactor = 20
facetAverage = max
pullV = 0.05
dampingLocal = 0.7
