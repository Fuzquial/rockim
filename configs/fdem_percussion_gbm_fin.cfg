# IMPACT FDEM 2D — configuration DIMENSIONNEE (2026-08-06).
# Corrige les trois defauts releves sur la demo d'origine :
#  1. SLIVERS : grainMesh = delaunay (maillage non structure a l'interieur des
#     grains) au lieu de l'eventail depuis le centroide. Mesure sur ce meme
#     cas : pire angle 22,8 deg contre 10,1 ; 0 % d'elements sous 20 deg contre
#     5,3 % ; h_min a 60 % de la mediane contre 33 % — le pas de temps n'est
#     plus pilote par un element trois fois trop petit.
#  2. DOMAINE : 0,40 x 0,25 m au lieu de 0,2 x 0,2. A 24 m/s les fissures
#     atteignaient 57,5 mm du point d'impact pour un bord a 100 mm, soit une
#     marge de 1,7x seulement ; elle passe a 3,5x. La regle du depot demande au
#     moins une longueur de fissure entre la zone de process et toute frontiere.
#  3. FINESSE : element cible 1,2 mm pour des grains de 8 mm, soit ~6,7
#     elements en travers d'un grain (ratio 0,15, dans la fourchette de la
#     litterature GBM-FDEM qui va de 0,17 a 0,18).
# Vitesse portee a 16 m/s : depuis la correction du signe de l'amortisseur de
# joint, 8 m/s ne fracture plus (la fissuration des anciens resultats etait
# alimentee par l'anti-amortissement).
# FDEM/GBM demo — percussive impact of the same rigid disc as all the other
# percussion demos (R = 15 mm, 5 kg, 8 m/s) on a THREE-PHASE granite-like
# grain structure (quartz / feldspar / biotite, plausible textbook values)
# with attenuated grain boundaries. Color the mesh by 'phase' or 'grain' and
# the joints by 'type' + 'damage' in ParaView: cracks nucleate on the
# boundary network and preferentially around the weak, compliant biotite.
mode = fdem
scenario = percussion
mesh = voronoi
T = 2.5e-4
frames = 30

W = 0.40
H = 0.25
grainSize = 0.008
grainSeeding = random   # Poisson-disc: isotropic boundary orientations
lloydIters = 2
refineLevels = 0
grainMesh = delaunay
grainElemSize = 0.0012
seed = 12345

# base material (defaults; phases override)
rho = 2650
E = 70e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = quartz feldspar biotite
phase.quartz.fraction = 0.33
phase.quartz.E = 94e9
phase.quartz.nu = 0.08
phase.quartz.rho = 2650
phase.quartz.ft = 13e6
phase.quartz.cohesion = 30e6
phase.quartz.frictionDeg = 45
phase.quartz.Gf = 90
phase.feldspar.fraction = 0.59
phase.feldspar.E = 70e9
phase.feldspar.nu = 0.29
phase.feldspar.rho = 2560
phase.feldspar.ft = 10e6
phase.feldspar.cohesion = 25e6
phase.feldspar.frictionDeg = 40
phase.feldspar.Gf = 70
phase.biotite.fraction = 0.08
phase.biotite.E = 34e9
phase.biotite.nu = 0.25
phase.biotite.rho = 3050
phase.biotite.ft = 7e6
phase.biotite.cohesion = 15e6
phase.biotite.frictionDeg = 30
phase.biotite.Gf = 40

# grain boundaries: half the mean strength/toughness, slightly weaker again
# when the two sides are different minerals (heterophase)
gbAlphaTen = 0.5
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
gbAlphaE = 1.0
gbAlphaFric = 0.9
gbHeteroFactor = 0.8

jointPenaltyFactor = 20
toolShape = disc
toolRadius = 0.015
toolMass = 5.0
impactSpeed = 16.0

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15
