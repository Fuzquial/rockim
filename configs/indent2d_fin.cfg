# ---------------------------------------------------------------------------
# INDENTATION 2D FINE — calcaire St Anne (Table 4 de Yang et al., IJRMMS 191,
# 2025), sa loi (eq. 1) et son DIF, sur la panoplie de Yan.
#
# Maillage UNIFORME 0,15 mm, 169 112 triangles sur 48 x 30 mm. Le 3D a 2 mm
# n etait pas assez resolu ; en 2D on peut se payer treize fois plus fin pour
# un cout comparable.
#   l_cz = E GI/ft^2 = 14,0 mm  contre 2 dx = 0,30 mm -> 47 fois resolue.
#
# Outil : disque rigide R = 6 mm, 20 kg/m a 12 m/s = 1440 J/m. Meme famille
# que indent2d_ye.cfg, qui fissurait proprement.
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion
T = 1.5e-4
frames = 30
thickness = 1.0
mesh = file
meshFile = meshes/indent2d_fin.msh

rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45.0
Gf = 12
gfShearFactor = 66.6667
contactMu = 0.6
crushCap = 1e12

toolShape = disc
toolRadius = 0.006
toolMass = 20.0
impactSpeed = 12.0
absorbing = all

jointShearEnvelope = yang
strainRateDIF = yang-fig2
strainRateTau = 1.0e-6

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.0
bulkViscosityXi = 2.0
jointXi = 0.05
budgetAbortPct = 5
budgetAbortMin = 1.0
