# BISECTION 2D (2026-09-12) : variante V3 — DIF fige a l enveloppe, taux filtre (le reglage v1)
# VARIANTE A : sans gcBirth = penalty (rampe de naissance par defaut) — bisection du pompage 2D.
# ---------------------------------------------------------------------------
# IMPACT 2D SUR KURU GREY — SCHEMA INTRINSEQUE « COMME YANG » (2026-09-12)
#
# Derive de configs/_m100.cfg (campagne 2D du 03/09, adaptatif) : meme
# eprouvette 250 x 150 mm a maillage gradue 1 -> 10 mm (leur fig. 6), meme
# insert analytique R 8,51 mm de 100 kg/m lance a 5,62 m/s (LEUR vitesse
# d enfoncement de bit a 9 m/s piston), memes frontieres absorbantes. Ce qui
# change : la loi de joint est celle du deck 3D v2 (yang2026_impact.cfg),
# clé pour clé, et le schema est INTRINSEQUE.
#
#   rockim_g1y9.exe configs/impact2d_kuru_intrinseque.cfg out_2d_kuru_intr
#
# LIMITES (bilan du 03/09) : deformation plane, pas de masse de fragments ni
# de rayon de cratere ; onde carree du piston remplacee par une masse a
# vitesse initiale (bosse unique) ; ecaillage possible au fond malgre
# absorbing = all. Comparaison QUALITATIVE : cone broye, radiales, restitution.
# Cible : leur p. 11, e = 4,65 / 5,62 = 0,83, 31,6 % d energie perdue.
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion
T = 6.0e-5
frames = 2
thickness = 1.0
mesh = file
meshFile = meshes/impact2d_grad_clean.msh

# --- Kuru Grey, Table 1 ------------------------------------------------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20

# --- schema INTRINSEQUE, loi de joint du deck 3D v2 --------------------------
insertion = intrinsic
jointPenaltyFactor = 20
jointElastic = parabolic
jointSoftening = munjiza
jointShearEnvelope = yang
jointShearRange = coulomb
jointShearUnload = origin
jointResidualMu = 0
jointDeath = damage
jointXi = 0
jointQuadrature = midedge
jointDeltaC = solidity
jointFailRule = majority

# --- DIF de Yang, reevalue a chaque pas sur le taux brut (Solidity) ---------
strainRateDIF = yang
difExpT = 0.17
difExpS = 0.07
strainRateDIFArm = envelope
strainRateFilter = exponential

# --- pulverisation (eq. 3-4, Table 1) ; crushCap neutralise -----------------
bulkDamage = yang
bulkDamageDelta0 = 1.4e-5
bulkDamageDeltaF = 4.0e-4
bulkDamageDmax = 0.9
crushCap = 1e12

# --- contact : potentiel de Munjiza, frottement roche 0,18 ------------------
contact = potential
potTangentFactor = 1.4286
gcActivation = adaptive
contactMu = 0.18
contactDamageCoupling = solidity
# insert analytique : la penalite est la seule voie qui permette un rebond en 2D
toolShape = disc
toolRadius = 0.00851
toolMass = 100.0
impactSpeed = 5.62
toolGap = 1e-4
toolContact = penalty

# --- aucun amortissement numerique, garde-fou d energie ---------------------
dampingLocal = 0
absorbing = all
dtFactor = 0.15
budgetAbortPct = 2
vNodeMaxEvery = 1
historyFlush = true
