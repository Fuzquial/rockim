# COUPE PDC 2D — reproduction de Heilman et al., ARMA 24-0238 (LANL/HOSS).
# Roche HOMOGENE (une seule phase, tous les alphas a 1 : la tessellation de
# Voronoi ne sert que de mailleur DESORDONNE) et joints cohesifs a loi de
# MOHR-COULOMB — c'est l'equation (2) de l'article, deja la loi de rockim.
#
# Geometrie de l'article ramenee en 2D : eprouvette 40 x 20 mm (ils ont
# 40 x 20 x 30 mm), cutter PDC de 13 mm de diametre reduit a son ARETE DE
# COUPE et a sa face de coupe inclinee du BACK RAKE. Leur maillage fait
# 0,25 mm pres du cutter ; ici il est uniforme.
# ⚠️ Pas d'entaille de depart (l'article en met une, de profondeur egale a la
# passe) : le cutter engage progressivement depuis l'exterieur.
#
# Matrice de l'article : vitesse 5 et 10 m/s, passe 0,508 / 1,016 / 1,524 mm,
# back rake 10 et 20 deg, avec et sans confinement (30,29 MPa vertical,
# 17,85 MPa horizontal in situ).
mode = fdem
scenario = shear
mesh = voronoi
grainSeeding = random
grainMesh = delaunay
lloydIters = 2
vertexMergeFrac = 0.12
refineLevels = 0
seed = 12345

W = 0.04
H = 0.02
grainSize = 0.0025
T = 4e-4
frames = 30

rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.660
Gf = 152.9
gfShearFactor = 4.2204

jointPenaltyFactor = 20
jointXi = 0.05

toolShape = pdc
backRakeDeg = 20
cutterLen = 0.013
cutDepth = 0.001016
cutSpeed = 10.0
contactMu = 0.3

absorbing = sides
dampingLocal = 0.02
dtFactor = 0.2
