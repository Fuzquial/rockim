# Banc A des charges par groupes (2026-10-03) : barre elastique en traction
# uniaxiale. Solution exacte : sigma = 5 MPa, eps = sigma/E = 1e-4,
# allongement 4,0e-6 m, contraction laterale nu.eps.L = 5,0e-7 m sur 20 mm,
# reaction de l appui = -2000 N. Insertion adaptative avec ft eleve : aucun
# joint ne s insere, le maillage est un continuum EF exact (tets lineaires,
# etat de contrainte homogene represente exactement).
# Maillage : python3 tools/make_unstructured_mesh.py box3dbc 0.02 0.02 0.04
#            0.004 meshes/loads_bar_h4.msh 1   (Gmsh 4.13.1, 1 662 tets)
# Reperes de la suite : loads_traction_3d, loads_pression_3d,
# loads_force_3d, loads_intrinseque_3d (tools/verify_suite.py).
mode = fdem3d
scenario = loads
mesh = file
meshFile = meshes/loads_bar_h4.msh
insertion = adaptive
T = 3e-4
frames = 4
rho = 2650
E = 50e9
nu = 0.25
ft = 50e6
cohesion = 100e6
frictionDeg = 40
Gf = 70
dampingLocal = 0.3
# appuis isostatiques : fond glissant en z, un coin tenu en x y, un autre en y
fix.bottom = z
fix.c000 = x y
fix.c100 = y
traction.top = 0 0 5e6
amplitude.top = ramp 1e-4
