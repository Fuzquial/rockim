# FDEM3D/GBM demo -- percussive impact of the standard 3D insert (sphere
# R = 15 mm, 0.5 kg, 8 m/s) on a THREE-PHASE granite-like grain structure
# (quartz / feldspar / biotite, the same textbook values as the 2D demo)
# with attenuated grain boundaries. Color the mesh by 'phase' or 'grain'
# and threshold the joints on 'damage' in ParaView: crack surfaces follow
# the 3D boundary network. All values are UNCALIBRATED illustrations.
mode = fdem3d
scenario = percussion
mesh = voronoi
T = 2e-4
frames = 25

W = 0.08
D = 0.08
H = 0.06
grainSize = 0.012
grainSeeding = random   # Poisson-disc: isotropic boundary orientations
lloydIters = 2
vertexMergeFrac = 0.25   # 3D: les eventails de faces minces controlent dt
refineLevels = 0
seed = 12345

# base material (defaults; phases override)
rho = 2650
E = 70e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = quartz feldspar biotite
phase.quartz.fraction = 0.33
phase.quartz.E = 94e9
phase.quartz.nu = 0.08
phase.quartz.rho = 2650
phase.quartz.ft = 13e6
phase.quartz.cohesion = 30e6
phase.quartz.frictionDeg = 45
phase.quartz.Gf = 90
phase.feldspar.fraction = 0.59
phase.feldspar.E = 70e9
phase.feldspar.nu = 0.29
phase.feldspar.rho = 2560
phase.feldspar.ft = 10e6
phase.feldspar.cohesion = 25e6
phase.feldspar.frictionDeg = 40
phase.feldspar.Gf = 70
phase.biotite.fraction = 0.08
phase.biotite.E = 34e9
phase.biotite.nu = 0.25
phase.biotite.rho = 3050
phase.biotite.ft = 7e6
phase.biotite.cohesion = 15e6
phase.biotite.frictionDeg = 30
phase.biotite.Gf = 40

# grain boundaries: half the mean strength/toughness, slightly weaker again
# when the two sides are different minerals (heterophase)
gbAlphaTen = 0.5
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
gbAlphaE = 1.0
gbAlphaFric = 0.9
gbHeteroFactor = 0.8

jointPenaltyFactor = 20
toolShape = sphere
toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15
