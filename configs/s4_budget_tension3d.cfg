# ---------------------------------------------------------------------------
# S4 — VALIDATION DU BUDGET EN TENSION 3D (micro-cas, plan fiabilite E1/E2) :
# barre 15x15x30 elastique (resistances hors d'atteinte, rien ne casse),
# mors rampes SANS confinement — le regime exact qui fuyait (rampe de vitesse
# des noeuds pilotes). Verdict : residu B4 < 1 % avec la formule Sierra
# (travail de la liaison R = m.a - f en vitesse moyenne).
# Promu repere de suite « budget tension » une fois valide.
#   lancer : rockim_chk.exe configs\s4_budget_tension3d.cfg out_s4_budget
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = tension
mesh = file
meshFile = meshes/triax3d_h30.msh
T = 3e-4
frames = 2

rho = 2620
E = 52e9
nu = 0.25
ft = 400e6
cohesion = 800e6
frictionDeg = 13.4
Gf = 400
gfShearFactor = 10
crushCap = 4000e6
jointPenaltyFactor = 20

insertion = adaptive
jointShearUnload = origin
gcActivation = adaptive
contact = potential

pullV = -0.5
pullRamp = 1.5e-4
gripLateralFree = true
dampingLocal = 0.05
verifyFt = false

# moniteur arme : il ne doit PAS declencher si la formule est juste
budgetAbortPct = 5
budgetAbortMin = 0.05
