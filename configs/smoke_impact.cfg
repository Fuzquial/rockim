# ---------------------------------------------------------------------------
# SMOKE TEST P1 — impact bench1 REDUIT (17,9k tets) avec gap 0,05 mm :
# verifie EN QUELQUES MINUTES que l'impact a bien lieu dans la fenetre T
# (contact attendu vers t = gap/v = 6,25 µs) AVANT de payer le banc 842k.
# Identique a p1_banc.cfg sauf : maillage reduit (gap 0.00005), frames pour
# visualisation. Lancer : rockim.exe configs\smoke_impact.cfg out_smoke
#   maillage : python tools/make_unstructured_mesh.py bench1 0.08 0.08 0.05 \
#              0.011 0.00005 0.0045 0.0028 meshes/smoke_impact.msh 1
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/smoke_impact.msh
T = 2e-5
frames = 4

# roche (defauts globaux = granite du banc percussion)
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

jointPenaltyFactor = 20

# l'insert maille remplace l'outil rigide
toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

contact = potential
gcActivation = adaptive
