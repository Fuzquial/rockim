# ---------------------------------------------------------------------------
# ETUDE OBJECTIVITE MAILLAGE ??? triaxial 3D HOMOGENE, schemas VALIDES du
# solveur (config approuvee par Fernando le 2026-08-14) :
#   insertion adaptative (Yan 2023) + decharge s??cante origine (eq. 18) +
#   contact potentiel de Munjiza + activation adaptative (Fukuda).
# 4 maillages (h = 3,0 / 2,4 / 2,0 / 1,5 mm), SEUL meshFile change entre les
# runs. Correction vs smoke : pullDelay = 3 rampes (l'axial demarre confinement
# ETABLI), T rallonge d'autant.
# Ce fichier est la BASE : les tx_adap3d_h*.cfg n'en different que par meshFile.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = tension
mesh = file
meshFile = meshes/triax3d_h24.msh
T = 1.05e-3
frames = 8

rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10

crushCap = 400e6
jointPenaltyFactor = 20

# schemas valides (regle : les capacites implementees s'utilisent)
insertion = adaptive
jointShearUnload = origin
gcActivation = adaptive
contact = potential

# compression : axial APRES confinement etabli
pullV = -0.5
pullRamp = 1.5e-4
pullDelay = 2.4e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false

# confinement lateral (fut)
confiningPressure = 10e6
confiningRamp = 8e-5
confineFaces = lateral
confineGaugeTime = 2.4e-4
