# ---------------------------------------------------------------------------
# ETAPE 1 — CONVERGENCE DU CONTACT, EN ELASTIQUE PUR (2026-08-17).
#
# Question : la reponse de contact du banc est-elle convergee ? Le couple
# 82k/259k a montre -37 % sur le pic de force pour un raffinement de 3,16,
# alors que la fissuration etait negligeable (4 vs 5 joints) : c'est donc la
# reponse ELASTIQUE qui n'est pas convergee. On l'isole ici.
#
# Comment : ft et cohesion portes a 1e12 Pa. Le critere d'insertion adaptative
# ne se declenche jamais, toutes les faces restent BONDED (liaison rigide =
# FEM a noeuds partages exacts), et la roche est un continuum elastique pur.
# Le contact de Munjiza reste la seule non-linearite.
#
# Fenetre reduite a T = 4e-5 : on ne compare pas le pic (qui arrive vers
# 43-56 us) mais la RAIDEUR, c'est-a-dire la force a penetration donnee sur la
# branche de charge. C'est la grandeur convergente et elle coute quatre fois
# moins cher.
#
# Le maillage est surcharge en ligne (fichier ajoute apres celui-ci).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
T = 4e-5
frames = 8

rho = 2650
E = 50e9
nu = 0.25
ft = 1e12
cohesion = 1e12
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 1e12
phase.insert.cohesion = 1e12
phase.insert.Gf = 400

toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 20
insertionPenaltyFactor = 4

budgetAbortPct = 5
budgetAbortMin = 0.05

meshFile = meshes/p1_grad_15.msh
