# ---------------------------------------------------------------------------
# IMPACT 2D SUR GRANITE DE KURU — reproduction 2D du cas de Yang, Xiang,
# Naderi, Wang, Aising, Ugarte & Latham, IJRMMS 206 (2026) 106660,
# « High-fidelity modelling of fragmentation and pulverisation in hard granite
# under percussion loading ». Données expérimentales de Mines Paris-PSL.
#
#   python tools/make_unstructured_mesh.py box2d 0.120 0.060 0.001 \
#          meshes/impact_kuru.msh 1
#   rockim_f2u.exe configs\impact_kuru.cfg out_kuru_yang
#
# LA CIBLE. Leur p. 11, cas piston 9 m/s : le bit entre a 5,62 m/s et repart a
# 4,65 m/s — **e = 0,83**, 31,6 % d'energie perdue. Au-dela du point de bascule
# (piston > 9 m/s) la pulverisation s'emballe et e s'effondre a 0,39.
#
# POURQUOI MON PREMIER IMPACT DONNAIT e = 0,099. Il lui manquait les DEUX
# mecanismes dont l'article fait toute sa these — et rockim les possede :
#   1. `bulkDamage = off` : leurs eq. 3-4, degradation de raideur des elements
#      sous l'insert. Les defauts de rockim SONT leur calibration Kuru Grey
#      (delta0 = 0,014 mm, deltaF = 0,4 mm, Dmax = 0,9).
#   2. `jointFrictionScaled = 1` : leur « sliding friction coefficient », Table 1.
#      C'est ce frottement RESIDUEL bas — contre 1,85 au pic — qui permet aux
#      fragments d'etre ejectes et de CESSER DE PORTER l'insert. L'article le
#      dit explicitement : sans lui, les fragments restent sous le bit et
#      empechent la bascule.
# Et il tournait sur le mauvais granite (Utah FORGE de Heilman, GI = 153 J/m2)
# au lieu du Kuru Grey (GI = 50).
#
# CE QUE CE DECK NE PEUT PAS FAIRE. Leur chargement est une ONDE CARREE : un
# piston de 265 mm frappe un bit, d'ou le plateau de force de ~100 us de leur
# fig. 8 (2L/c). Ici l'insert est une masse rigide a vitesse initiale : la force
# est une bosse unique. Les FORMES de courbe ne peuvent donc pas coincider ;
# c'est la RESTITUTION qu'on cherche a approcher, pas le profil temporel.
# Et c'est du 2D contre leur 3D (cylindre 250 x 150 mm) : comparaison
# QUALITATIVE.
#
# MAILLAGE A 1 mm, a dessein : c'est la taille de leur zone raffinee, et celle
# sur laquelle delta0/deltaF sont calibres (le modele lit delta_m = h_e . eps).
# Un maillage plus fin decalerait le seuil d'endommagement.
# Bloc 120 x 60 mm : leurs fissures vont a 21 mm pour un specimen de 250 mm,
# soit 1:12 ; ici 1:6, le minimum que leur section 3.1 recommande.
#
# CONTACT : `penalty`. Etabli aujourd'hui — `toolContact = signorini` a
# relax = 0 INTERDIT le rebond par construction (l'impulsion vaut m(0 - v_n),
# elle s'annule des que l'approche s'annule). Pour mesurer une restitution il
# faut la voie penalite.
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion
T = 4.0e-4
frames = 20

thickness = 1.0
mesh = file
meshFile = meshes/impact_kuru.msh

# --- granite de Kuru Grey, leur Table 1 -------------------------------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6                 # Tensile Strength (MPa)
cohesion = 29.84e6           # Cohesive (MPa)
frictionDeg = 61.61          # atan(1.85), leur « internal friction coefficient »
Gf = 50                      # Energy Release Rate Mode I (J/m2)
gfShearFactor = 20           # GII/GI = 1000/50
crushCap = 1e12              # neutralise : la pulverisation passe par bulkDamage

# --- INGREDIENT 1 : pulverisation, leurs eq. 3-4 ----------------------------
bulkDamage = off
bulkDamageDelta0 = 1.4e-5    # leur 0,014 mm  (defaut rockim = cette calibration)
bulkDamageDeltaF = 4.0e-4    # leur 0,4 mm
bulkDamageDmax = 0.9         # leur « damage factor max value »

# --- INGREDIENT 3 : PERTE DE PORTANCE DES FRAGMENTS -------------------------
# Le solveur l'annonce lui-meme au lancement : « sous l'indenteur un joint
# ecroui en compression ne meurt JAMAIS [en jointDeath = separation], le relais
# contact roche/roche ne s'engage pas. Levier : jointDeath = separation ». Or la
# these de l'article est precisement la « loss of fragment support » : la
# matiere broyee doit CESSER DE PORTER l'insert pour que le rebond s'effondre.
# Sans ce relais, les fragments restent solidaires et soutiennent le bit.
jointDeath = separation

# --- INGREDIENT 2 : frottement residuel post-rupture ------------------------
jointFrictionScaled = 1       # leur « sliding friction coefficient », Table 1
                             # (exclusif de jointFrictionScaled, retire ici)

# --- l'insert : hemispherique R = 8,51 mm, LIBRE ----------------------------
toolShape = disc
toolRadius = 0.00851         # leur fig. 5d
toolMass = 20.0              # kg/m — parametre 2D LIBRE (leur bit fait 1,509 kg
                             # en 3D, sans equivalent direct). Regle la
                             # PROFONDEUR ; la vitesse regle la restitution.
impactSpeed = 5.62           # LEUR vitesse d'enfoncement de bit a 9 m/s piston
toolGap = 1e-4
contactMu = 0.6              # leur « sliding friction » insert/roche (Table 1)
toolContact = penalty        # obligatoire pour mesurer un rebond

absorbing = all

# --- schema -----------------------------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

vNodeMaxEvery = 1
budgetAbortPct = 0
historyFlush = true
