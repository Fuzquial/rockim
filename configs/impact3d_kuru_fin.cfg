# ---------------------------------------------------------------------------
# IMPACT 3D KURU — MAILLAGE RAFFINE + FENETRE COMPLETE + FROTTEMENT FIDELE.
# Le run qui doit produire le SEUL chiffre que Yang et al. publient pour ce cas :
# le coefficient de restitution.
#
#   rockim_f2u.exe configs\impact3d_kuru_fin.cfg out_3d_fin
#
# TROIS CHANGEMENTS, tous justifies, contre configs/impact3d_kuru_gros.cfg :
#
# 1. meshFile — 16 049 tetraedres (contre 18 566), mais 9 807 dans la boule fine
#    r < 12,5 mm (contre 4 008). Taille caracteristique mediane du code (6V/A)
#    dans cette boule : 0,682 mm contre 1,096 mm, soit un RAFFINEMENT DE 1,61x.
#    Les facettes de joint sont 2,6x plus petites : a aire fissuree egale le
#    comptage montera d'autant, ce qui rapproche du comptage de l'article.
#    Le champ lointain passe de 15 a 30 mm — c'est LUI qui payait le raffinement
#    (a hFar = 15 mm le meme hFine coutait 105 min). Le champ lointain ne porte
#    que l'onde sortante, absorbee au bord (absorbing = all).
#    ⚠️ A VERIFIER AU DEPOUILLEMENT : la repartition en PROFONDEUR des ruptures.
#    Un champ lointain plus grossier peut reflechir sur le gradient de taille.
#    Reference propre : out_3d_gros n'avait AUCUNE rupture au-dela de 4,4 mm.
#    Si des ruptures apparaissent au-dela de ~15 mm, c'est l'artefact, pas la
#    physique — et il faudra revenir a hFar = 20 mm.
#
# 2. T = 4,5e-4 — out_3d_gros et out_3d_mu001 s'arretaient a 300 us avec le
#    CONTACT ENCORE ACTIF (F = 49 kN, vz = +2,14 m/s et croissante, 11,37 J
#    encore stockes en elastique) : aucune restitution mesurable. Separation
#    extrapolee a 373-406 us par le panel du 2026-09-03. 450 us laisse la marge.
#
# 3. contactMu = 0,18 — Table 1 de l'article (IJRMMS 206, p. 6) donne le
#    sliding friction PAR MATERIAU : Kuru Grey 0,18 / carbure 0,60 / acier 0,60.
#    La regle de paire de Solidity est le MINIMUM des deux (Y3Did.c l. 1292),
#    donc bit-roche = min(0,60 ; 0,18) = 0,18, comme roche-roche. Le 0,6 des
#    decks precedents etait la valeur du CARBURE, qui ne gouverne jamais face au
#    granite. NE PAS confondre avec l'ARMA 24-0788 (Bit-Rock 0,01) : leur essai
#    se fait en cellule a huile, le contact y est lubrifie.
#
# CE QUI NE CHANGE PAS : contactResidualMu reste ABSENTE. L'article la decrit
# (p. 11, « reducing their sliding friction coefficient » des elements du centre
# d'impact) et rockim l'implemente (WP6 de la spec 005), mais une capacite a la
# fois — elle fera son propre A/B contre CE run.
#
# CE QUE LE BANC 2D DU JOUR PREVIENT (out_m100 a mu = 0,60 / 0,18 / 0,01) :
# e vaut 0,668 / 0,671 / 0,592. Entre 0,60 et 0,18 la RESTITUTION NE BOUGE PAS
# (+0,4 %) ; seule la fragmentation repond (+14 % de joints, +57 % de fragments).
# Donc si e s'ecarte de leur 0,83, la cause sera le maillage, la pulverisation
# ou les frontieres — PAS le frottement. Ce run tranche entre ces causes.
#
# CIBLES PUBLIEES (IJRMMS §5 et fig. 9b) : enfoncement 1,07 mm ; sortie
# 4,65 m/s ; e = 0,83 ; perte 23,84 -> 16,31 J, soit 7,53 J (31,6 %).
#
# COUT ESTIME 58 min (modele calibre sur les deux runs du jour :
# 1,95e-6 s par tetraedre et par pas, borne haute ; 16 049 tets x 89 400 pas).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 4.5e-4
frames = 30

mesh = file
meshFile = meshes/impact3d_fin.msh

# --- granite de Kuru Grey, leur Table 1 -------------------------------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20
crushCap = 1e12

# --- les trois ingredients de l'article -------------------------------------
bulkDamage = yang
bulkDamageDelta0 = 1.4e-5
bulkDamageDeltaF = 4.0e-4
bulkDamageDmax = 0.9
jointDeath = damage
jointResidualMu = 0.18

# --- l'insert : LEUR masse, LEUR vitesse, LEUR rayon ------------------------
toolShape = sphere
toolRadius = 0.00851
toolMass = 1.509             # kg — LEUR bit (p. 11), plus aucun parametre libre
impactSpeed = 5.62           # m/s — LEUR vitesse d'enfoncement a 9 m/s piston
toolGap = 1e-4
contactMu = 0.18
toolContact = penalty        # obligatoire pour mesurer un rebond

absorbing = all

# --- schema : celui des runs 2D ---------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
contact = potential
gcActivation = adaptive
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

budgetAbortPct = 0
historyFlush = true
