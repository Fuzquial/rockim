# FDEM3D/GBM verification -- direct tension on a SINGLE-PHASE 3D voronoi
# grain structure with unattenuated joints (all alphas = 1): every joint
# carries the bulk strength, so the macroscopic peak must sit AT or slightly
# ABOVE ft -- above, because the crack has to follow a tortuous grain-boundary
# surface whose inclined facets see only sigma*cos^2(theta). The check bands
# the peak in [-5 %, +25 %] of ft, as in the 2D voronoi verification.
mode = fdem3d
scenario = tension
mesh = voronoi
T = 4e-4
frames = 8

W = 0.04
D = 0.04
H = 0.06
grainSize = 0.011
grainJitter = 0.5
lloydIters = 2
vertexMergeFrac = 0.25   # 3D: les eventails de faces minces controlent dt
refineLevels = 0
seed = 12345

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
pullV = 0.05
dampingLocal = 0.7
