# ---------------------------------------------------------------------------
# COUPE 3D AU CUTTER PDC — Heilman, Euser, Frash, Meng, Li, Lei & Rougier,
# ARMA 24-0238 (Los Alamos, code HOSS), « FDEM modeling of PDC cutter-rock
# interactions for geothermal drilling applications ». Granite Utah FORGE.
# PHASE 1 (2026-09-03) : SANS confinement — leurs fig. 2 et 3.
#
#   python tools/make_cut3d_mesh.py 0.040 0.030 0.020 0.001016 0.000284 0.003 \
#          0.0005 0.001 0.010 0.006 0.003 0.004 meshes/cut3d_h50.msh 1
#   rockim_f2p.exe configs\cut3d_heilman.cfg out_cut3d_h50
#
# CAPACITE : `toolShape = pdc` en 3D, ajoutee le 2026-09-03 (ToolPdc3d.hpp,
# selftest-pdc3d G1-G5, suite fast bit-identique sans la cle). Disque fini
# chanfreine par distance signee exacte — PAS l extrusion du coin 2D.
#
# POURQUOI scenario = shear. En 3D `shear` EST deja la coupe : placeTool y pose
# un outil a vitesse IMPOSEE (Fdem3dSolver.cpp, cutDepth / cutSpeed / toolX),
# setupBoundaries encastre le fond z = 0, step() cumule work_ = -F.v dt et
# history.csv porte toolFx,toolFy,toolFz. Exactement le 2D (scenario = shear +
# toolShape = pdc). Il ne manquait que la FORME.
#
# LEUR LOI (leur section 2) : volume ELASTIQUE + joints cohesifs, mode I sur
# ft, mode II Mohr-Coulomb, mode mixte. Ni plasticite de volume, ni DIF, ni
# endommagement volumique : d ou `law` absent, crushCap desarme, bulkDamage
# absent. C est la loi native de rockim (z-curve 0,63 / 1,8 / 6 de Munjiza).
#
# LEUR TABLE 1, deux conversions :
#   frictionDeg   = atan(0,8)              = 38,66 deg
#   gfShearFactor = GfII/GfI = 645,3/152,9 = 4,220
#
# LEUR GEOMETRIE (section 3) : 40 (longueur) x 30 (profondeur) x 20 (hauteur)
# mm, entaille de depart, maille 0,25 mm dans la zone d interaction. Ici
# hFine = 0,50 mm (leur 0,25 mm : 70 000 tets, 3 h 20 a 18 h par run — tableau
# du 2026-09-03). L entaille porte un JEU de 0,284 mm (lecon 2D, v3ter).
#
# LEUR TABLE 2, cas retenu : garde 20 deg, passe 1,016 mm, 10 m/s. Balayage
# complet : 5 et 10 m/s x 0,508 / 1,016 / 1,524 mm x 10 et 20 deg.
#
# CIBLE DE LA PHASE 1 : sans confinement leur force MONTE, CULMINE (15-30 kN
# selon garde/vitesse), puis RETOMBE A ZERO — « the PDC cutter loses contact
# with the rock material after it has fragmented ». C est la SIGNATURE que l on
# cherche ; le pic vient apres.
#
# RESERVE A CONNAITRE, INCHANGEE DEPUIS LE 2D : l_cz = E.GfI/ft^2 = 65,4 mm,
# plus grand que l eprouvette. Aucun facies de fissuration ne se lit comme un
# resultat tant que ce point n est pas instruit.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = shear
T = 4.0e-6
frames = 1
historyFlush = true

mesh = file
meshFile = meshes/cut3d_h50.msh

# --- materiau : leur Table 1, granite Utah FORGE ---------------------------
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 152.9
gfShearFactor = 4.220
crushCap = 1e12              # volume ELASTIQUE : leur modele n a pas de plasticite

# --- le cutter PDC 3D --------------------------------------------------------
# `toolX/toolY` designent l ARETE DE COUPE (comme en 2D, pas le centre).
toolShape = pdc
cutterDia = 0.013            # m — leur disque de 13 mm (cle 3D ; cutterLen = 2D, refusee)
cutterThick = 0.0025         # m — leur epaisseur de 2,5 mm (face de degagement)
chamferLen = 0.0             # m — « chamfered edge » chez eux, SANS dimension
                             # publiee : arete vive ici, a instruire.
backRakeDeg = -20            # SIGNE, decision du 2026-09-03 : meme convention
                             # que le 2D (Tool.hpp relevee y -> z). A b < 0 le
                             # corps MONTE en arriere, rien sous l arete — c est
                             # l orientation de cut2d_v3ter_rake.cfg validee par
                             # F. Uzquiano sur la figure du PDC, et celle d un
                             # vrai cutter de forage. A b > 0 le dos descend de
                             # t.sin b = 0,855 mm sous l arete et laboure le
                             # plancher (defaut historique v3). Le selftest G4
                             # le demontre ; le solveur avertit si b > 0.
cutterFloor = true           # ceinture et bretelles : jamais de contact sous
                             # le niveau de l arete (a b < 0 il ne mord pas)
cutDepth = 0.001016          # m — leur passe
cutSpeed = 10.0              # m/s — leur vitesse
toolX = 0.0025               # m — arete 0,5 mm devant la face verticale de
                             # l entaille (x = 3 mm) : 4,5 mm de coupe REELLE
toolY = 0.015                # m — arete centree en profondeur (D/2)
contactMu = 0.8              # leur coefficient de frottement

# --- contact outil : SIGNORINI, ET CE N EST PAS UNE OPTION -----------------
# A vitesse IMPOSEE l outil est un reservoir d energie infini : la penalite
# pompe (2D, banc T1 : injection 4,43 et 8,25 x la borne 2 v_outil ; Signorini
# 0,905 et 1,08). Et en penalite l ecretage 0,6 h atteint l axe median du
# disque dans l anneau de l arete, ou la normale saute de 90 deg.
toolContact = signorini
toolSignoriniRelax = 0.0     # 0 = condition de vitesse pure. Ne pas relever.

# --- frontieres : eprouvette TENUE, fond encastre (defaut shear) -----------
# Pas d absorbing : l article tient son bloc, et absorbing = all remplacerait
# l encastrement par des ressorts et laisserait le bloc partir.

# --- schema : celui des runs 2D de coupe et 3D d impact ---------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05          # comme tous les decks valides ; le banc T1 2D
                             # montre que le Cundall pese sur la force (51 %
                             # du travail outil) — a mettre a 0 dans une
                             # variante DEDIEE a la mesure de force, pas au
                             # premier run de recette.
jointXi = 0.05

# --- garde-fou -------------------------------------------------------------
budgetAbortPct = 0
budgetAbortMin = 1.0

# ---------------------------------------------------------------------------
# PHASE 2 (a venir) — CONFINEMENT. L article : 30,29 MPa vertical + 17,85 MPa
# horizontal. rockim 3D n a qu UNE pression scalaire (confiningPressure +
# confineFaces = lateral | all). Le vertical n a aucun porteur ; les frontieres
# absorbantes COMBATTENT le confinement (jauge 91 -> 67 %, mesure 2026-09-03).
# Chantier separe : tenseur diagonal insituSx/Sy/Sz, ~145 lignes ajoutees.
# ---------------------------------------------------------------------------
