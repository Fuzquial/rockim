# FDEM/GBM demo — direct tension with STATISTICAL joint strengths: every
# joint's ft and cohesion carry a Weibull(m = 6) factor of mean 1, sampled
# from ONE correlated Gaussian random field (correlation length = grain
# size) through the Gaussian copula. The field lives in SPACE, independent
# of the mesh: rebuild the mesh with another 'seed' but the same
# 'fieldSeed' and the crack localizes in the same weak zone — the
# reproducible-crack-map property the thesis' correlated-sigma_w idea is
# after. Expected macroscopics: peak BELOW the deterministic voronoi case
# (weakest-link), crack through the low-ftScale region (color the joints
# .vtu by 'ftScale' in ParaView).
# Set strengthCorrLength = 0 for the independent-per-joint draw (the
# analogue of per-element Weibull in smeared DFH codes): statistics
# converge, the crack map does not.
mode = fdem
scenario = tension
mesh = voronoi
T = 1.2e-3
frames = 10

W = 0.06
H = 0.12
grainSize = 0.008
grainSeeding = random
lloydIters = 2
refineLevels = 0
seed = 12345

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

# statistical strengths (fieldSeed 555: the weakest band of the field sits
# at mid-height, far from both grips — a sharp test that failure follows
# the FIELD and not the loading)
jointWeibullM = 6
strengthCorrLength = 0.008
fieldSeed = 555

jointPenaltyFactor = 20
pullV = 0.05
# smooth grip-velocity ramp over ~10 wave transits: a STEPPED grip launches
# a transient that unzips the first joint row under the grip whatever the
# strength field says (unphysical straight crack at the top). With the ramp
# the loading is quasi-static and the specimen breaks where it is WEAK.
pullRamp = 2.5e-4
dampingLocal = 0.1

# weakest-link: the peak is MEANT to sit below ft
verifyFt = false
# frictionless grips: without this the clamped-corner stress concentration
# decides where the specimen breaks and drowns the field localization
gripLateralFree = true
