# FEM3D demo -- 3D percussion with the FAITHFUL PORT of the thesis'
# DP-DFH law (law = dpdfh, VUMATS/dfh/vumat_kstdfh.f): Drucker-Prager in
# compression (OPTION-3), anisotropic DFH obscuration damage in tension
# with deterministic per-element Weibull draws (spatial hash), frozen
# principal frame, cube-root obscuration integrator. NO regularization and
# NO deletion by default, exactly like the VUMAT (damaged elements stay as
# the rubble bed). All dfh* parameters default to the thesis' Red Bohus
# card (phd/CONTINUUM.md par.2): beta=51.7, d=153.3 MPa, psi=15, m=24,
# sigw=120 MPa @ Zeff=1 mm^3, k=0.38, S=4.18879. Only the elastic block
# needs restating here. Port verified at 4.7e-12 against the ifx-compiled
# Fortran reference (rockim selftest-dpdfh).
mode = fem3d
law = dpdfh
scenario = percussion
T = 2e-4
frames = 25

W = 0.1
D = 0.1
H = 0.08
nx = 24
ny = 24
nz = 18

rho = 2620
E = 52e9
nu = 0.25
ft = 18e6
cohesion = 37.5e6
frictionDeg = 30
Gf = 70
gfShearFactor = 10

toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

absorbing = all
dampingLocal = 0.05
dtFactor = 0.3
