# ---------------------------------------------------------------------------
# LE RUN DECISIF, version corrigee (2026-08-17 soir).
#
# Corrige la version 'impact3d_decisif.cfg', retiree avant lancement : elle
# reposait sur un rayon de contact de 7,5 mm, lu a tort sur l'etendue du champ
# de contrainte visible. Le vrai rayon de Hertz vaut 1,45 mm a delta = 0,19 mm
# (a = sqrt(R*delta), R = 11 mm) — facteur 5 d'erreur. La fenetre de
# faisabilite s'est donc refermee et le couple (ft, Gf) a change.
#
# VERIFICATION FAITE AVANT LANCEMENT :
#   a (Hertz, delta = 0,19 mm)         = 1,45 mm
#   dx (roche sous le contact, mesure) = 0,458 mm
#   l_cz = E*Gf/ft^2 = 50e9*150/(87e6)^2 = 1,00 mm
#     critere bas  : l_cz > 2*dx = 0,92 mm  ->  l_cz/dx = 2,18   OK
#     critere haut : l_cz < a    = 1,45 mm  ->  l_cz/a  = 0,69   OK
#   Les deux bornes sont tenues, sans marge enorme mais des deux cotes.
#
# JUSTIFICATION DU COUPLE : ft = 87 MPa tombe dans la fourchette 71-122 MPa
# que la fenetre impose a Gf = 150 J/m2, et cette fourchette recouvre les
# valeurs que le rapport DP-DFH identifie a l'echelle de l'indentation
# (§14.2 : 70 MPa pour la barre d'ecaillage, 120 MPa au point materiel).
# Gf = 150 J/m2 est dans la gamme du granite (40-300). cohesion = 2,5 x ft,
# ratio conserve depuis le banc d'origine.
#
# MAILLAGE p1_ultra : zone fine RESSERREE a 4 mm de rayon et 4 mm de
# profondeur — le contact ne fait que 1,5 mm de rayon, inutile d'affiner sur
# 10 mm comme je le faisais. Resultat : 127 147 tets (MOINS que p1_grad_7b)
# pour une roche a 0,458 mm au lieu de 0,81 mm.
#   make_unstructured_mesh.py bench1g 0.12 0.12 0.12 0.011 0.00005 \
#                             0.004 0.0028 0.0004 0.004 0.004 meshes/p1_ultra.msh 1
#
# Une seule variable par rapport aux runs rates : le couple (ft, Gf), plus le
# maillage. Ni effet d'echelle ni heterogeneite — reponse binaire voulue.
#
#   rockim_flush.exe configs\impact3d_ultra.cfg out_imp3d_ultra   (~53 min)
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/p1_ultra.msh
T = 1.2e-4
frames = 16

# --- roche : le couple qui rend la fissuration possible ---
rho = 2650
E = 50e9
nu = 0.25
ft = 87e6
cohesion = 217e6
frictionDeg = 40
Gf = 150
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 20
insertionPenaltyFactor = 4

budgetAbortPct = 5
budgetAbortMin = 0.05

# ===========================================================================
# CORRECTIF (ajout apres coup, 2026-08-17) : jointShearUnload = origin sans
# jointFrictionScaled = 1 rend le glissement frottant REVERSIBLE (aucune
# hysteresis) — le solveur l'avertit au demarrage, et la forme LITTERALE de
# l'eq. 18 de Yan est origin + jointFrictionScaled = 1. Omis dans les six
# configs precedentes de la journee. Redhibitoire ici : la question du run
# est de savoir ou va l'energie, et un frottement reversible n'en dissipe
# aucune.
# ===========================================================================
jointFrictionScaled = 1
