# ---------------------------------------------------------------------------
# SMOKE TRIAXIAL 3D — GBM Red Bohus MINIMAL (~30 grains) : verifier que la
# chaine confinement 3D (lateral, suiveur) + compression axiale (tension,
# pullV < 0) fonctionne en fdem3d AVANT de payer une vraie eprouvette.
# Jeu calibre 2D transpose tel quel (bohus_gbm_calibrated) ; memes reglages
# de protocole que triax_bohus_gbm.cfg :
#   - confiningRamp << pullRamp (confinement ETABLI avant l'axial),
#   - jauge a 3 rampes,
#   - crushCap DECOUPLE (400 MPa, pas le defaut 8*cohesion).
# Verdicts a lire au resume : sigma3 atteint ~-10 MPa ; pic macro > UCS 2D
# attendu sous confinement ; joints casses > 0 ; pas d'explosion.
#   lancer : rockim_dev.exe configs\triax3d_bohus_smoke.cfg out_triax3d_smoke
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = tension
mesh = voronoi
T = 8e-4
frames = 8

W = 0.015
D = 0.015
H = 0.03
grainSize = 0.006
grainSeeding = random
lloydIters = 2
refineLevels = 0
vertexMergeFrac = 0.25
seed = 12345

rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10

gbAlphaTen = 0.5
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
crushCap = 400e6
jointPenaltyFactor = 20

# compression : pullV NEGATIF, rampe cosinus
pullV = -0.5
pullRamp = 1.5e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false

# confinement lateral (fut), etabli avant la charge axiale
confiningPressure = 10e6
confiningRamp = 8e-5
confineFaces = lateral
confineGaugeTime = 2.4e-4
