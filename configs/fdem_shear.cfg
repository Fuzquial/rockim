# FDEM — lateral cutting by a prescribed disc at a fixed depth of cut.
# NOTE: at the joint-penalty time step a millisecond of cutting is ~200k
# steps; budget minutes of wall time.
mode = fdem
scenario = shear
T = 8e-4
frames = 40

W = 0.2
H = 0.1
nx = 96
ny = 48
meshJitter = 0.3

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
toolRadius = 0.02
cutDepth = 0.005
cutSpeed = 10.0
contactMu = 0.4

dampingLocal = 0.02
absorbing = sides
