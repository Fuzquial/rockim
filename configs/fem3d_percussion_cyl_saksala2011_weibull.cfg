# FEM3D demo -- percussion on a WIDE CYLINDER (sample-like geometry, as in
# Saksala's percussive-drilling simulations): diameter 160 mm, height
# 100 mm, carved from the structured tet grid (geometry = cylinder; the
# staircase lateral surface is far from the impact and fully absorbing).
# Law = the faithful saksala2011 port, material = Table I. Fields of
# interest: damage (omega_t), kapDP (the model's compression-side
# viscoplastic hardening/softening variable -- the 2011 law has no
# separate omega_c), vonMises, pressure.
mode = fem3d
law = saksala2011
scenario = percussion
geometry = cylinder
T = 1e-3
frames = 25

W = 0.16
D = 0.16
H = 0.1
nx = 40
ny = 40
nz = 30
# desordre du maillage : Kuhn miroite en damier (defaut) + jitter fort des
# noeuds interieurs ??? casse l'alignement des fissures sur les diagonales
meshJitter = 0.45
seed = 12345

rho = 2600
E = 60e9
nu = 0.2
ft = 13e6
cohesion = 37.5e6
frictionDeg = 30
Gf = 70
gfShearFactor = 10

toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

absorbing = all
dampingLocal = 0.05
dtFactor = 0.3



matWeibullM = 3

