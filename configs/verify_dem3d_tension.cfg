# DEM3D verification — direct tension on a load-aligned simple-cubic lattice.
# Only the vertical (z) bonds carry load. Bond cross-section pi*Rb^2 over a
# cell area (2r)^2 gives the exact expectation
#   sigma_peak = (pi/4) * lambda^2 * sigma_c = 7.854 MPa here.
mode = dem3d
scenario = tension
T = 2.6e-4
frames = 10

W = 0.04
D = 0.04
H = 0.04
particleRadius = 1.25e-3
packing = cubic

rho = 2650
E = 50e9
ft = 10e6
bondTensile = 10e6
bondStrengthScatter = 0.0

pullV = 0.05
dampingLocal = 0.7
