# DEM verification — direct tension on a load-aligned square lattice.
# Only the vertical bonds carry load, so the macroscopic peak stress must be
#   sigma_peak = lambda * sigma_c(bond) = 10 MPa here (lambda = 1),
# recovering the calibrated bond tensile strength.
mode = dem
scenario = tension
T = 2.6e-4
frames = 20

W = 0.05
H = 0.05
particleRadius = 1.25e-3
packing = square

rho = 2650
E = 50e9
ft = 10e6
bondTensile = 10e6
bondStrengthScatter = 0.0

pullV = 0.05
dampingLocal = 0.7    # quasi-static: heavy local damping
