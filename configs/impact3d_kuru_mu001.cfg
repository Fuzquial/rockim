# ---------------------------------------------------------------------------
# IMPACT 3D KURU — CORRECTION DU FROTTEMENT OUTIL/ROCHE. A/B contre
# out_3d_gros : UNE SEULE cle change, contactMu 0,6 -> 0,01.
#
#   rockim_f2u.exe configs\impact3d_kuru_mu001.cfg out_3d_mu001
#
# POURQUOI. Gerbaud, Velmurugan, Aising, Chambres, Naderi, Latham, Xiang &
# Yang, ARMA 24-0788 (2024), « A Study of Rock Breakage under Extreme Submerged
# Confining Pressure », Table 2 — MEME equipe, MEME code (SOLIDITY), memes
# essais de Mines Paris. Leur table distingue deux frottements :
#     Sliding Friction Coefficient (Rock-Rock) = 0,60
#     Sliding Friction Coefficient (Bit-Rock)  = 0,01
# Le deck d'origine portait contactMu = 0,6 avec le commentaire « leur sliding
# friction insert/roche » : c'est la valeur ROCHE-ROCHE qui avait ete prise pour
# le contact de l'OUTIL. Soixante fois trop.
#
# CE QUE CELA DOIT CHANGER. Le frottement de l'outil n'a dissipe que 0,177 J
# (0,9 %) dans out_3d_gros, donc l'effet ENERGETIQUE sera petit. L'enjeu est
# ailleurs : un insert qui colle a 0,6 retient la matiere broyee sous lui, un
# insert qui glisse a 0,01 la laisse fuir lateralement. C'est le mecanisme de
# « loss of fragment support » dont l'article IJRMMS fait sa these. Le critere
# a regarder n'est donc PAS l'energie mais la PROFONDEUR de la zone endommagee
# (4,2 mm ici contre leurs 13,2 mm) et le volume detache (16,6 mm3).
#
# REFERENCE A BATTRE (out_3d_gros, contactMu = 0,6, T = 300 us) :
#   penetration max 0,928 mm | pic 64,6 kN | 76 joints rompus | aire 174,3 mm2
#   79 elements pulverises   | zone endommagee 4,15 mm | detache 16,6 mm3
#   travail 20,38 J | pulverisation 7,72 J | fissuration 0,377 J
#
# ⚠️ CE RUN RESTE TRONQUE (T = 300 us, contact encore actif a la fin) : il ne
# mesure PAS la restitution. C'est un A/B a fenetre EGALE, pas une mesure de e.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 3.0e-4
frames = 20

mesh = file
meshFile = meshes/impact3d_gros.msh

# --- granite de Kuru Grey, leur Table 1 -------------------------------------
rho = 2626
E = 60e9
nu = 0.24
ft = 10.98e6
cohesion = 29.84e6
frictionDeg = 61.61
Gf = 50
gfShearFactor = 20
crushCap = 1e12

# --- les trois ingredients de l'article -------------------------------------
bulkDamage = yang
bulkDamageDelta0 = 1.4e-5
bulkDamageDeltaF = 4.0e-4
bulkDamageDmax = 0.9
jointDeath = damage
jointResidualMu = 0.18

# --- l'insert : LEUR masse, LEUR vitesse, LEUR rayon ------------------------
toolShape = sphere
toolRadius = 0.00851
toolMass = 1.509             # kg — LEUR bit (p. 11), plus aucun parametre libre
impactSpeed = 5.62           # m/s — LEUR vitesse d'enfoncement a 9 m/s piston
toolGap = 1e-4
contactMu = 0.01
toolContact = penalty        # obligatoire pour mesurer un rebond

absorbing = all

# --- schema : celui des runs 2D ---------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
contact = potential
gcActivation = adaptive
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

budgetAbortPct = 0
historyFlush = true
