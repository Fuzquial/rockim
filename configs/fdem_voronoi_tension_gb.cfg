# FDEM/GBM demo — direct tension on a TWO-PHASE grain structure with WEAK
# grain boundaries (alphaTen = 0.4): the macroscopic strength must drop
# well below the bulk ft and the crack must run INTERGRANULAR (watch the
# "intergranular fraction" line of the summary, and color the joints .vtu
# by 'type' + 'damage' in ParaView). This is the qualitative GBM signature:
# strength and crack path are controlled by the boundary network, not by
# the bulk.
mode = fdem
scenario = tension
mesh = voronoi
T = 6e-4
frames = 10

W = 0.06
H = 0.12
grainSize = 0.008
grainJitter = 0.5
lloydIters = 2
refineLevels = 0
seed = 12345

# base material (defaults for both phases)
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = alpha beta
phase.alpha.fraction = 0.6
phase.beta.fraction = 0.4
phase.beta.E = 70e9

# weak boundaries: joint strength = 0.4 x mean(ft), cohesion halved
gbAlphaTen = 0.4
gbAlphaCoh = 0.5
gbAlphaGf = 0.5
gbHeteroFactor = 0.9

jointPenaltyFactor = 20
pullV = 0.05
dampingLocal = 0.7

# the strength drop is the POINT of this demo: report the ratio to bulk ft
# instead of a PASS/FAIL against it
verifyFt = false
