# Validation croisee rockim <-> Abaqus/Explicit + vumat_saksala_2011.f90 :
# percussion sphere R 15 mm / 0,5 kg / 8 m/s, MEME maillage (export via
# tools/export_abaqus.py), MEME loi (portage verifie a 8e-14), et des
# conditions aux limites identiques et simples : fond ENCASTRE, faces
# libres (absorbing = none — pas de comparaison de modeles de Lysmer),
# frottement de contact 0,5 des deux cotes. T court : pic + debut de
# rebond (~100 us de contact).
mode = fem3d
law = saksala2011
scenario = percussion
T = 2e-4
frames = 25

W = 0.1
D = 0.1
H = 0.08
nx = 24
ny = 24
nz = 18

rho = 2600
E = 60e9
nu = 0.2
ft = 13e6
cohesion = 37.5e6
frictionDeg = 30
Gf = 70
gfShearFactor = 10

toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0
contactMu = 0.5

absorbing = none
dampingLocal = 0.05
dtFactor = 0.3
