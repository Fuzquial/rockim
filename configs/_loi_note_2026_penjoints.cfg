# ISOLATION 2026-09-11 (b) : MEME deck, loi de matrice INTACTE, joints revenus a la
# loi penalisee historique (jointTSL = penalty, sans rise ni BK). Si ce run
# explose, la loi de matrice est la source, independamment des joints.
# ---------------------------------------------------------------------------
# LA LOI DE LA NOTE, EN UNE CARTE — « Lois constitutives proposées pour un FDEM
# hybride à insertion adaptative », note de travail, septembre 2026.
#
#   Matrice : viscoplasticité de Mohr-Hoek PARFAITE + endommagement de
#             COMPRESSION seul. Elle ne porte AUCUNE traction.
#   Joints  : cohésifs EXTRINSÈQUES, insérés à la volée, initialement rigides,
#             mode mixte de Benzeggagh-Kenane, dépendants de la vitesse.
#
# Règle directrice de la note : « un mécanisme par physique, et jamais deux
# fois la même dissipation ». Chaque ligne « HYGIÈNE » ci-dessous éteint un
# mécanisme parasite qui, laissé à son défaut, compterait une dissipation deux
# fois. Ces défauts ne sont PAS changés dans le code (croissance par addition,
# principe VIII) : ils s'éteignent ici, dans le deck, et nulle part ailleurs.
#
#   rockim_g1.exe configs\loi_note_2026.cfg out_note2026
#
# Contrat d'implémentation : docs/SPEC_loi_note_2026.md
# Audit de départ         : ../rockim_g0/AUDIT_loi_adaptative_2026-09-11.md
#
# CE DECK EST UN BANC DE RECETTE, PAS UN RÉSULTAT. Il est dimensionné pour
# tourner en quelques minutes et prouver que les 21 briques s'allument
# ensemble. Aucune des valeurs ci-dessous n'est calibrée sur Red Bohus : ce
# sont celles du tableau §3.4 de la note, pour le granite de KURU.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 1.0e-4
frames = 10
historyFlush = true

# --- géométrie et microstructure -------------------------------------------
# Voronoï MONOPHASE : c'est la configuration qui porte l'hétérogénéité
# inter/intra-granulaire de l'eq. 21 SANS tomber sur le refus `phases_.n() > 1`
# (Fdem3dSolver.cpp:423) qui interdit une loi de volume multiphase.
mesh = voronoi
W = 0.040
D = 0.040
H = 0.030
grainSize = 0.006
grainJitter = 0.5
lloydIters = 2
refineLevels = 0
seed = 12345

# --- matériau : granite de KURU, tableau §3.4 de la note --------------------
rho = 2630
E = 60e9
nu = 0.2

# --- §1.2 : enveloppe de Mohr-Hoek en LOI PUISSANCE -------------------------
#   f = s1 - s3 - B <s3>^n - sigma_c(kappa_point),  sigma_c = sigma_c0 + s_MH kappa_point
# ATTENTION AUX UNITÉS, vérifiées dans le code (MatLaw.cpp:993) :
#   Bpow(s3) = 1e6 * merB * (max(s3,0)/1e6)^merN
# donc merB se pose EN MPa^(1-n) et merFc0 EN Pa. La note écrit
# « 30,1 MPa^(1/n) » : sa notation diffère, la VALEUR 30,1 est reprise telle
# quelle — À CONFRONTER aux triaxiaux de Hokka 2016 avant tout résultat.
law = saksala
meridian = power
merB = 30.1              # MPa^(1-n) — note §3.4 (Saksala 2017)
merN = 0.676             # -          — note §3.4
merFc0 = 235e6           # Pa         — sigma_c0 du granite de Kuru (Hokka 2016)

# §1.2 — viscoplasticité PARFAITE. `saksalaEta` est eta [Pa.s], PAS s_MH
# [MPa.s] : le solveur imprime désormais sigma_c(eps_point) en clair au
# démarrage, LIS CETTE LIGNE avant d'exploiter quoi que ce soit. La note vise
# s_MH = 1,5 MPa.s, « à réduire » — et l'audit a montré que la surcontrainte
# linéaire NE SATURE PAS : à 1e5 /s le travail plastique est divisé par 155 et
# omega_c s'éteint avec lui. Point ouvert de la note, pas du code.
saksalaEta = 1.5e6

# §1.2 — HYGIÈNE : pas de cap écrouissant. `law = saksala` allume par défaut
# capP0 = 8c (MatLaw.cpp:4816, s.pc += capH*dev), ce qui contredit
# « viscoplasticité parfaite » et reste INVISIBLE en triaxial.
capP0 = 0

# §1.2 eq. 2 et 3 — le critère et l'écoulement en contraintes PRINCIPALES.
# Sans `mhForm = principal` rockim résout un cône de Drucker-Prager CIRCULAIRE
# qui ne coïncide avec l'eq. 2 qu'en compression triaxiale (s2 = s3) — or sous
# un insert l'état n'est triaxial nulle part ailleurs que sur l'axe.
# Les deux clés vont ensemble : sous `dpFlowForm = mc` avec un critère lisse,
# un triaxial piloté en déformation axisymétrique cesse d'être axisymétrique en
# contrainte (la composante intermédiaire du gradient de l'eq. 3 est nulle) ;
# l'arête de Koiter de `principal` rétablit l'axisymétrie.
mhForm = principal
dpFlowForm = mc
dpDilationDeg = 5        # psi, note §3.4 (Saksala 2018)

# --- §1.3 : endommagement de COMPRESSION en bande de fissuration -----------
#   omega_c = A_c [1 - exp(-beta_c eps_vp)],  beta_c = sigma_c0 h_e / G_c_bulk
compDamage = crackband
compAc = 0.98            # note §3.4
compGIIc = 1.0e4         # J/m^2 — G_c_bulk = 10 kJ/m2, note §3.4, « à recalibrer »
# eq. 6 : h_e = (12 V_e / sqrt(2))^(1/3), l'arête du tétraèdre RÉGULIER de même
# volume. Sans cette clé rockim passe à beta_c le diamètre inscrit 6V/A, soit
# un facteur 5,0 : un G_c_bulk identifié avec la convention de la note y
# donnerait une branche adoucissante CINQ FOIS trop ductile.
compBandLength = tetEdge

# --- §1.4 : la matrice ne porte AUCUNE traction ----------------------------
# LE POINT CENTRAL DE LA NOTE. sigma = sigma_barre+ + (1 - omega_c) sigma_barre-,
# « pas de coupure de Rankine dans la matrice » : c'est le critère d'insertion
# des joints qui joue ce rôle. Sans cette clé, rockim_g0 exécutait le bloc de
# Rankine INCONDITIONNELLEMENT et la matrice dissipait en traction EN PLUS des
# joints — le double comptage que la note interdit explicitement.
bulkTensionDamage = off

# --- §2 : les joints cohésifs EXTRINSÈQUES ---------------------------------
insertion = adaptive
ft = 11.4e6              # t_n0, note §3.4 (brésilien quasi-statique)
Gf = 100                 # G_Ic [J/m^2], note §3.4, « à vérifier »
gfShearFactor = 10       # G_IIc / G_Ic = 10, note §3.4 (hypothèse initiale)
cohesion = 30e6          # c_j0, note §3.4 — hypothèse, via sigma_n*
frictionDeg = 35         # phi_j, note §3.4

# §2.1 eq. 10 et 11 — traction de facette pondérée par les VOLUMES, et TENSEUR
# taux à l'interface. Sans `facetRate = tensor` il n'existe qu'un scalaire
# équivalent par élément : eps_point_eq (mode I) et gamma_point (mode II) ne
# sont pas formables, et DIF_t et DIF_s partagent le même argument.
facetAverage = volume
facetRate = tensor

# §2.2 eq. 12 et 13 — critère ELLIPTIQUE et hystérésis.
# Le OU logique de rockim_g0 laissait intacte une facette à 80 % de sa
# résistance en traction ET 80 % en cisaillement ; l'ellipse l'insère (Phi = 1,28).
insertionCriterion = elliptic
insertionHoldSteps = 3   # n_h de la note (2-3), contre les insertions en rafale
strainRateDIF = yang-fig2
difExpT = 0.333          # a_t ~ 1/3, note §3.4 (type Inada/Zhao, « à identifier »)
# difExpS non posée = 0,07, l'exposant de compression confirmé par la figure
# 2(a) de Yang et al. On a donc bien a_s < a_t, comme l'exige l'eq. 13.

# §2.4 eq. 16-19 — loi INITIALEMENT RIGIDE de Camacho-Ortiz.
# t_m_ins = la traction RÉELLEMENT TRANSMISE au pas d'activation (et non le
# seuil nominal), delta_f = 2 G_C / t_m_ins recalculé joint par joint : c'est
# ce qui supprime tout saut de contrainte, dépassement explicite compris, et
# ce qui rend int t_m d delta_m = G_C indépendant du maillage.
jointTSL = penalty        # [ISOLATION penjoints]
# §2.4 « Discontinuité temporelle des lois extrinsèques » — la note prescrit
# elle-même delta_m^0 = 1e-3 delta_m^f. Ce n'est PAS optionnel : le 2026-09-11,
# trois runs de ce deck à rise = 0 ont explosé à ~91 µs (bloc de 40 mm ->
# nœuds à 18 m), dt divisé par 3,49 compris. Cause mesurée : raideur sécante
# de recharge t_ins/dm_max non bornée (p99,9 = 210 x pj, max 549 x pj) et
# Dirac de -t_ins à chaque insertion. La branche ascendante borne k0 =
# t_ins^2/(2 rise G_C) et rend la traction continue ; int t dδ reste = G_C.
# [ISOLATION penjoints] jointTSLRise = 1e-3
# [ISOLATION penjoints] jointMixLaw = bk         # eq. 18, G_C gelé au ratio de mode à l'insertion
# [ISOLATION penjoints] jointBKEta = 2.0         # eta dans [1,5 ; 2,5]
insertionPenaltyFactor = 10   # k_c = 10 E / h_e (Mohammadnejad 2020), §2.4
contactMu = 0.55         # mu = 0,5-0,6, note §3.4

# §2.4 — le facteur D sur la part FROTTANTE. Sans lui le joint inséré dissipe
# en frottement dès D = 0, ce qui compte une seconde fois le cisaillement déjà
# porté par la viscoplasticité de la matrice.
# CONSÉQUENCE À MESURER AVANT TOUTE CONCLUSION : cette clé retire aussi le
# terme mu|sigma_n| du SEUIL d'insertion en cisaillement (cohérence exigée,
# sinon chute instantanée de mu|sigma_n| au pas suivant l'insertion), donc les
# facettes comprimées s'insèrent dès |tau| >= c. L'effet est massif sous un insert.
jointFrictionMobilised = damage

# §2.5 — OPTION A retenue (DIF gelé à l'insertion). L'option B (viscosité
# après insertion) resterait à jointEtaN / jointEtaS ; la note interdit les
# deux ensemble, et le solveur refuse désormais la combinaison.
# jointEtaN = 0
# jointEtaS = 0
jointViscousInCriterion = off   # tauLim sur sigEl : l'amortisseur ne doit pas
                                # créer d'effet de vitesse sur le seuil

# §2.6 eq. 21 et 22 — hétérogénéité inter/intra-granulaire et Weibull par FACETTE.
gbCombine = min          # eq. 21 : MINIMUM des deux grains, pas leur moyenne
gbAlphaTen = 0.7         # chi_t, note §3.4
gbAlphaGf = 0.7          # chi_G, note §3.4
gbAlphaCoh = 0.7
jointWeibullM = 6
jointWeibullXu = 0.3     # eq. 22 : seuil x_u, en fraction du seuil de facette
jointWeibullScale = area # eq. 22 : facteur d'échelle sur l'AIRE de la facette
jointSizeEffect = true

# --- l'outil : un bouton sphérique (§3.3 point 6 de la note) ---------------
toolShape = sphere
toolRadius = 0.004
toolMass = 0.1
impactSpeed = 8.0
# toolContact RESTE AU DÉFAUT (`penalty`) — NE PAS poser `signorini` ici.
# Mesuré le 2026-09-11 : sur un outil LIBRE de percussion (toolMass +
# impactSpeed), `toolContact = signorini` donne une force RIGOUREUSEMENT NULLE
# — l'outil traverse la roche, toolVz reste à −8 m/s, toolKE à 3,2 J, et sa
# base finit 0,14 mm sous la surface sans qu'un seul joint ne s'insère. Le
# schéma de Signorini de rockim est une condition EN VITESSE, écrite pour un
# outil à vitesse IMPOSÉE (la coupe PDC, `cutSpeed`), où la pénalité pompe.
# Le même deck au défaut `penalty` donne 24 754 N. Ce n'est pas une régression
# du lot : `rockim_g1ref.exe` se comporte à l'identique.

# --- frontières ------------------------------------------------------------
absorbing = all          # HYGIÈNE : le défaut `none` fait réfléchir toute
                         # l'onde sur un bloc de 40 mm

# --- HYGIÈNE : les mécanismes parasites armés par défaut -------------------
# Chacun de ces trois défauts compte une dissipation que la note attribue déjà
# à un autre mécanisme. Le code ne les change pas — on les éteint ici.
dampingLocal = 0         # amortissement de Cundall : NON PHYSIQUE, et le code
                         # lui-même l'exige nul sur tout banc de force
                         # (FdemSolver.cpp:9296-9299)
jointXi = 0              # amortisseur de joint : sa traction visqueuse entre
                         # dans le cap de Coulomb ET dans fnSum, la charge
                         # normale mesurée — il pollue la courbe force-pénétration
dtFactor = 0.15
# erodeD / erodeEpv NE SONT PAS POSÉES : elles sont désormais REFUSÉES en FDEM.
# rockim_g0 les armait sans clé (erodeD = 0,98) alors que `grep -c eroded` rend
# 0 dans les deux solveurs FDEM : l'élément « érodé » gardait masse, joints et
# nœuds et continuait d'entrer avec un poids 0,5 dans la moyenne de facette,
# divisant par deux la traction vue par un voisin survivant au moment où il
# porte seul la charge.

# --- §3.2 : le bilan d'énergie, sans lequel rien n'est falsifiable ---------
# W_bit = E_el + E_kin + D_vp + D_omega_c + D_coh + D_fric + E_abs + E_art.
# Sans cette clé, fdem3d n'avait qu'UN poste `eEl` pour tout le volume : on ne
# pouvait ni démontrer les 70-90 % de la zone broyée, ni prouver l'absence de
# double comptage.
energyBreakdown = on
