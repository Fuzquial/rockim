# ---------------------------------------------------------------------------
# INDENTATION 2D — architecture de YE et al. (2025) : bulk elasto-plastique
# Mohr-Coulomb + joints cohesifs. Bouton spherique R = 4 mm repris du deck
# Abaqus CONTINUUM/calib_kuru/indent2d.
#
#   python tunnel_edz/tools/make_impact_mesh.py 0.040 0.025 0.0004 0.012 \
#          0.0012 meshes/indent2d_block.msh 1
#   rockim_tun.exe tunnel_edz\configs\indent2d_ye.cfg out_indent2d_ye
#
# ARCHITECTURE (leur section 2.2.1.1) : toute la FISSURATION reste dans les
# joints, toute la dissipation PLASTIQUE passe dans le volume. C'est
# l'architecture A2 de la campagne de calibration Red Bohus, etiquetee
# « ecole Ye ».
#
# POURQUOI CA DEBLOQUE L'INDENTATION. Avec un bulk elastique, le contact d'un
# bouton de 4 mm a la premiere fissure fait ~0,02 mm de demi-largeur, soit
# vingt fois moins qu'une maille de 0,4 mm : le pic de Hertz n'est pas resolu
# et rien ne casse (mesure du 2026-08-17 sur trois essais). Avec la plasticite
# de Mohr-Coulomb, la contrainte de contact est PLAFONNEE par l'ecoulement :
# le pic singulier devient une zone plastique de largeur finie
# (~F/2fc, soit plusieurs millimetres), que le maillage resout.
#
# GEOMETRIE reprise du deck Abaqus : bloc 40 x 25 mm, maille 0,4 mm, bouton
# R = 4 mm. Le deck imposait un deplacement de 1,5 mm en 1,5e-4 s (10-18 m/s) ;
# ici l'outil est LIBRE (percussion), 20 kg/m a 12 m/s = 1,44 kJ/m, dimensionne
# pour un enfoncement du meme ordre.
#
# MATERIAU : granite de Kuru du deck (E = 60 GPa, nu = 0,2, rho = 2630,
# phi = 50 deg, psi = 5 deg, fc = 235 MPa -> c_MC = 42,8 MPa).
# JOINTS : ft = 25 MPa et Gf = 20 J/m^2 donnent l_cz = E Gf/ft^2 = 1,92 mm,
# soit DANS la fenetre 2 dx < l_cz < taille du cratere (0,8 < 1,92 < 4 mm).
# Le ft macro du granite (11,4 MPa) donnerait l_cz = 9 mm, hors fenetre : le
# ft de JOINT est un micro-parametre, il n'a pas a valoir le ft macro.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 1.25e-4
frames = 25

mesh = file
meshFile = meshes/indent3d_grad.msh

# --- volume : loi de Ye (Mohr-Coulomb elasto-plastique a aretes) ------------
rho = 2630
E = 60e9
nu = 0.2
law = mc
mcCohesion = 42.8e6          # de fc = 235 MPa a phi = 50 deg
mcFrictionDeg = 50
mcDilationDeg = 5            # non associe, comme le deck Abaqus

# --- joints cohesifs : toute la fissuration --------------------------------
ft = 25e6
cohesion = 60e6
frictionDeg = 50
Gf = 20
gfShearFactor = 5

# --- insert spherique R = 4 mm (le bouton du deck Abaqus) ------------------
toolShape = sphere
toolRadius = 0.004
toolMass = 0.08
impactSpeed = 12.0

absorbing = all

# --- schema : celui de l'etude tunnel --------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
contactMu = 0.5              # pose EXPLICITEMENT cette fois (defaut identique)
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.0
jointXi = 0.05
budgetAbortPct = 5
budgetAbortMin = 0.05
# re-basage 2026-08-28 (reparation 3) : sous law le cap etait desarme —
# intention figee explicitement, le resultat ne depend plus du defaut.
meanTensionCapFactor = 0
