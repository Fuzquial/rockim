# ---------------------------------------------------------------------------
# IMPACT INSERT UNIQUE SUR KURU GREY — LOI DE YANG et al. 2026, A L'IDENTIQUE
#
# Reference : X. Yang, J. Xiang, S. Naderi, Y. Wang, J. Aising, I. Ugarte,
# J.-P. Latham, « High-fidelity modelling of fragmentation and pulverisation
# in hard granite under percussion loading: a FDEM-based approach »,
# Int. J. Rock Mech. Min. Sci. 206 (2026) 106660.  Code : Solidity (Imperial).
# Donnees experimentales : Aising et al., Mines Paris-PSL / Drillco.
#
#   rockim_g1fix.exe configs/yang2026_impact.cfg out_yang2026
#
# ---------------------------------------------------------------------------
# TOUT CE QUI SUIT EST RECOPIE DE LEUR TABLE 1 ET DE LEURS EQUATIONS.
# La colonne « source » de chaque bloc dit d'ou vient le nombre. Les seuls
# reglages qui ne viennent PAS de l'article sont signales par « CHOIX » et
# regroupes en fin de fichier : ils correspondent aux grandeurs que
# l'article ne publie pas.
# ---------------------------------------------------------------------------

mode = fdem3d
scenario = percussion

# --- maillage : leur fig. 5 (geometrie) et fig. 6 (tailles) ----------------
# Six corps : rock, insert (carbure), bit, piston, circlip, plate (acier).
# Roche cylindre R 125 x 150 mm ; insert hemispherique R 8,51 mm ; bit Phi 30
# x 265 mm ; piston Phi 26,5 x 260 mm.
#   python tools/make_impact_mesh.py meshes/impact_yang_s1.msh 1.0
mesh = file
meshFile = meshes/impact_yang_s1.msh

# --- duree : leurs figures vont jusqu'a ~750 us (rebond inclus) ------------
T = 2.0e-6
frames = 2
historyFlush = true

# ---------------------------------------------------------------------------
# MATERIAUX — Table 1 de l'article, sans une seule substitution
# ---------------------------------------------------------------------------
# Kuru Grey granite (colonne 1). Le bloc global sert de defaut ; les phases
# le surchargent corps par corps.
rho = 2626                       # kg/m3
E = 60e9                         # Pa      (60 GPa)
nu = 0.24
ft = 10.98e6                     # Pa      tensile strength
cohesion = 29.84e6               # Pa      cohesive
# « Internal friction coefficient 1.85 » = tan(phi). phi = atan(1,85).
frictionDeg = 61.61
# Energy release rate mode I = 50 J/m2, mode II = 1000 J/m2.
# rockim pose G_II = Gf x gfShearFactor : 50 x 20 = 1000. C'EST le rapport
# de l'article, et il vaut 20 — pas 5. (Rappel : les quatre articles de ce
# groupe utilisent des rapports G_II/G_I de 20 a 75.)
Gf = 50
gfShearFactor = 20

phases = rock insert bit piston circlip plate
phase.rock.fraction = 1
phase.insert.fraction = 1
phase.bit.fraction = 1
phase.piston.fraction = 1
phase.circlip.fraction = 1
phase.plate.fraction = 1

# carbure (colonne 2 de leur Table 1)
phase.insert.rho = 15250
phase.insert.E = 600e9
phase.insert.nu = 0.2

# acier (colonne 3). Bit, piston, circlip et plaque de charge.
phase.bit.rho = 7850
phase.bit.E = 200e9
phase.bit.nu = 0.29
phase.piston.rho = 7850
phase.piston.E = 200e9
phase.piston.nu = 0.29
phase.circlip.rho = 7850
phase.circlip.E = 200e9
phase.circlip.nu = 0.29
phase.plate.rho = 7850
phase.plate.E = 200e9
phase.plate.nu = 0.29

# ---------------------------------------------------------------------------
# LOI DE JOINT — leur section 2, fig. 1 de Yang 2025
# ---------------------------------------------------------------------------
# Insertion INTRINSEQUE : « potential fracture zones are represented by
# six-node joint elements inserted between tetrahedral elements ». Tous les
# joints preexistent. C'est le defaut de rockim — la cle `insertion` est donc
# VOLONTAIREMENT ABSENTE. Ne pas la mettre a `adaptive` : l'insertion
# adaptative est Yan, Zheng & Wang 2023, un AUTRE schema.
#
# Adoucissement : z-curve de Munjiza 2004 (a = 0,63, b = 1,8, c = 6), celle
# de Y-Geo et de Solidity. Dans rockim `munjiza` est un alias de `yan`.
jointSoftening = munjiza
# Critere : Mohr-Coulomb avec COUPURE DE TRACTION, leur eq. 1 :
#   f_s = c - sigma_n tan(phi)  si sigma_n < f_t ;  c - f_t tan(phi) sinon.
# C'est exactement l'enveloppe `yang` de rockim (mcFrictionTerm : le terme
# frottant est -min(t_n, f_t), donc plafonne a f_t).
jointShearEnvelope = yang

# ---------------------------------------------------------------------------
# EFFET DE VITESSE DE DEFORMATION — leurs eq. 1 et 2
# ---------------------------------------------------------------------------
#   DIF_compression = 0,77 + 0,56 edot^0,07,  plafond 1,84 au-dela de 1e4 /s
#   DIF_traction    = 0,95 + 0,41 edot^0,17,  plafond 1,85 au-dela de 1e2 /s
# ATTENTION, POINT MESURE LE 2026-09-11 : l'article de 2025 (IJRMMS 191,
# eq. 3) imprime 0,07 pour la TRACTION, l'article de 2026 (eq. 2) imprime
# 0,17. rockim avait deja une option `yang-fig2` a 0,1707, deduite par
# lecture de leur figure 2b parce que le 0,07 de 2025 rendait la loi
# discontinue. Les auteurs ont corrige en 2026 : c'est bien 0,17, et la
# valeur lue sur la figure etait la bonne. On pose donc l'exposant PUBLIE.
strainRateDIF = yang
# En schema INTRINSEQUE il n'y a pas d'instant d'insertion ou figer le DIF :
# rockim refuse le couple et impose de dire QUAND le geler. `envelope` le fige
# au franchissement de l'enveloppe de rupture — le temoin intrinseque, et le
# seul choix qui ait un sens ici (mesure du 2026-09-11 : le solveur rejette
# le deck sans cette cle).
strainRateDIFArm = envelope
difExpT = 0.17                   # traction, eq. 2 de 2026
difExpS = 0.07                   # compression / cisaillement, eq. 1

# ---------------------------------------------------------------------------
# PULVERISATION — leurs eq. 3 et 4, et les cinq dernieres lignes de Table 1
# ---------------------------------------------------------------------------
# sigma = sigma_NH tant que eps <= eps_d, puis C_d deps = (1 - D) dsigma_bar.
# D croit lineairement de 0 a D_max entre delta_m^0 et delta_m^f.
# Les valeurs de leur Table 1 sont DEJA les defauts de rockim ; on les ecrit
# quand meme, pour que le deck se lise sans aller chercher le code.
bulkDamage = yang
bulkDamageDelta0 = 1.4e-5        # « effective displacement min value » 0,014 mm
bulkDamageDeltaF = 4.0e-4        # « effective displacement max value » 0,4 mm
bulkDamageDmax = 0.9             # « damage factor max value »

# ---------------------------------------------------------------------------
# FROTTEMENT DE CONTACT — colonne « sliding friction coefficient »
# ---------------------------------------------------------------------------
# 0,6 pour le carbure et l'acier (donc tout contact intact), 0,18 pour la
# roche pulverisee. rockim encode exactement cette bascule : contactMu vaut
# tant que l'element n'est pas pulverise, contactResidualMu des que
# bulkDamage atteint D_max. C'est le WP6 de la spec 005, ecrit d'apres cet
# article.
contactMu = 0.6
contactResidualMu = 0.18
# SANS CECI LE mu RESIDUEL EST INACCESSIBLE LA OU IL SERT. Avertissement du
# solveur au banc court du 2026-09-11 : avec `jointDeath = separation` (le
# defaut), un joint ecroui EN COMPRESSION sous l'indenteur ne meurt jamais,
# donc le relais contact roche/roche ne s'engage pas et contactResidualMu
# n'est jamais atteint — or la zone broyee sous l'insert est precisement
# l'endroit ou Yang le fait agir. `damage` tue le joint sur l'endommagement.
jointDeath = damage

# ---------------------------------------------------------------------------
# CHARGEMENT — leur section 3.1
# ---------------------------------------------------------------------------
# Le piston frappe le bit, qui frappe la roche. Vitesses de leur campagne :
# 5,68 / 9 / 11 / 13 m/s (energies 13,23 a 114,95 J).
groupVel.piston = 0 0 -9.0

# --- instrumentation : les sept criteres de leur fig. 8 --------------------
# Jauge de contrainte au MILIEU du bit (leur fig. 9a) et cinematique des
# corps (vitesses d'indentation et de rebond, profondeur max).
trackGroups = bit piston insert
gauge.bit = 0.15 0.20

# ---------------------------------------------------------------------------
# CHOIX — ce que l'article NE PUBLIE PAS, et qu'il faut donc decider
# ---------------------------------------------------------------------------
# 1. Raideur de penalite des joints. Yang ne la donne pas. Naderi et al. 2025
#    (meme groupe, meme code) posent k = 900 GPa pour E = 37 GPa, soit 24 E ;
#    la litterature Munjiza recommande 10 E. On prend 20, la valeur des decks
#    d'impact de rockim. ELLE FIXE LE PAS DE TEMPS : la diviser par 4 double
#    presque dt.
jointPenaltyFactor = 20
#
# 2. Amortissement. Yang n'en mentionne aucun (impact franc, pas de
#    quasi-statique). On laisse le defaut.
#
# 3. Frontieres. « The lower surface of the rock is fixed to provide
#    support » — base bloquee, flancs LIBRES. Ils justifient l'absence
#    d'effet de bord par le rapport 1:7 entre extension de fissure (21 mm) et
#    diametre (250 mm). Donc PAS de frontieres absorbantes : en poser
#    changerait le bilan d'energie et le rebond du bit.
#
# 4. dtFactor. Yang annonce dt = 2,5e-9 s. Valeur a confronter au dt que
#    rockim calcule sur ce maillage ; si rockim est plus prudent, le run est
#    d'autant plus long.
dtFactor = 0.15
#
# 5. gcRestitution. Defaut 0,2 — la detente normale du contact general. Le
#    solveur previent qu'il faut la figer au deck des que l'EJECTION ou le
#    REBOND est une metrique : ils le sont tous les deux ici (quatre des sept
#    criteres portent sur la cinematique du bit). Valeur laissee au defaut
#    documente, a faire varier dans l'etude de sensibilite.
gcRestitution = 0.2
