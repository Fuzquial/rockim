# Compression uniaxiale de Yan, Zheng & Wang (IJRMMS 169, 2023) — fig. 17.
# Eprouvette 36 x 72 mm, maillage non structure ~0,75 mm, plateaux rigides
# frottants (mu = 0.1) fermant a 0,1 m/s, materiau de leur Table 1 (Tatone).
# Attendu (fig. 18-19) : E = 15 GPa retrouve, UCS ~ 51 MPa, bande de
# cisaillement conjuguee a ~62 deg, cisaillement dominant.
mode = fdem
scenario = tension
loading = platens
T = 3.2e-3
frames = 16

W = 0.036
H = 0.072
thickness = 1.0

# maillage non structure : un "grain" voronoi ne sert ici que de support au
# mailleur delaunay intra-grain — 1 phase, tous les alphas a 1, donc les
# joints de frontiere portent exactement le materiau du volume
mesh = voronoi
grainSize = 0.006
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.00075
seed = 4211

rho = 1704
E = 15e9
nu = 0.24
ft = 1.3e6
cohesion = 16.4e6
frictionDeg = 23
Gf = 3.8
# GfII = 84 N/m = 22.1 x GfI
gfShearFactor = 22.105
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

pullV = -0.1
pullRamp = 2e-4
contactMu = 0.1
dampingLocal = 0.7
jointXi = 0.0

# --- mode : surcharge en ligne de commande via un second .cfg ---
insertion = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
