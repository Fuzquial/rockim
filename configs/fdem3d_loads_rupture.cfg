# Charges et CL par groupes (2026-10-03, DOCUMENTATION §5.21) : traction
# jusqu'a rupture d'une barre 20 x 20 x 40 mm, insertion adaptative.
# C'est le montage de `scenario = tension` (mors encastre en bas, vitesse
# imposee en haut avec x y tenus) ecrit par GROUPES : meme maillage, meme
# rampe, il redonne 408 joints inseres, 2 rompus, pic 12,27 MPa, et la force
# d appui a 0,1 % pres (vitesse lue a t + dt/2 au lieu de t).
# Maillage : python3 tools/make_unstructured_mesh.py box3dbc 0.02 0.02 0.04
#            0.004 meshes/loads_bar_h4.msh 1
# Sorties : history.csv -> U_top_*, RF_top_*, RF_bottom_*, eBc ; resume ->
# « groupe top : U = ... ; RF = ... ». ~10 min a 2 fils.
mode = fdem3d
scenario = loads
mesh = file
meshFile = meshes/loads_bar_h4.msh
insertion = adaptive
T = 3e-4
frames = 4
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10
dampingLocal = 0.0
fix.bottom = all
velocity.top = 0 0 0.05
amplitude.top = ramp 5e-5
