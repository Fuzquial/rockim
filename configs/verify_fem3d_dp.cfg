# FEM3D verification -- quasi-static uniaxial COMPRESSION (tension scenario
# with pullV < 0), law = dpr: the stress plateau must equal the analytic DP
# uniaxial compressive strength sigma_c = k / (1/sqrt(3) - alpha) with
# (alpha, k) matched to Mohr-Coulomb in triaxial compression from
# (cohesion, frictionDeg). c = 25 MPa, phi = 40 deg -> sigma_c = 107.2 MPa.
# ft is set high so tensile damage never fires; frictionless ramped grips.
mode = fem3d
law = dpr
scenario = tension
T = 3.5e-3
frames = 5

W = 0.03
D = 0.03
H = 0.06
nx = 6
ny = 6
nz = 12

rho = 2650
E = 50e9
nu = 0.25
ft = 100e6
cohesion = 25e6
frictionDeg = 40
Gf = 7000
gfShearFactor = 10

pullV = -0.05
pullRamp = 5e-4
gripLateralFree = true
dampingLocal = 0.7
