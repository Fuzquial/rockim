# FEM verification — 1D bar wave speed.
# With nu = 0 the plane-strain modulus reduces to E, so the wavefront from a
# velocity step applied at x = 0 must travel at sqrt(E/rho) = 4344 m/s here.
mode = fem
scenario = bar_wave
T = 230e-6
frames = 20

W = 1.0               # bar length
H = 0.02
nx = 500
ny = 10

rho = 2650
E = 50e9
nu = 0.0              # uniaxial-strain = uniaxial-stress => c = sqrt(E/rho)
damage = off

barV0 = 1.0
barGaugeFrac = 0.8
cfl = 0.7
