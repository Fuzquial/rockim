# ---------------------------------------------------------------------------
# BANC MOYEN COMPLET — geometrie du banc P1 (bloc 120x120x120, insert R = 11)
# a resolution intermediaire (~82k tets, h 4,5/2,8 mm) et fenetre COMPLETE
# T = 1,2e-4 : contact ~6,5 µs + chargement-decharge (~90 µs Hertz) + REBOND.
# Objectif : physique (e ~ 0,71 ?, facies) en ~1h30 multithread — ne remplace
# PAS le protocole P1 (qui exige le couple 1 thread / tous coeurs sur 842k).
#   maillage : python tools/make_unstructured_mesh.py bench1 0.12 0.12 0.12 \
#              0.011 0.00005 0.0045 0.0028 meshes/p1_banc_mid.msh 1
#   lancer  : rockim.exe configs\p1_banc_mid.cfg out_banc_mid  (OMP libre)
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/p1_banc_mid.msh
T = 1.2e-4
frames = 6

# roche (defauts globaux = granite du banc percussion)
rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 14500
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

jointPenaltyFactor = 20

# l'insert maille remplace l'outil rigide
toolShape = none
groupVel.insert = 0 0 -8
trackGroup = insert

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

contact = potential
gcActivation = adaptive
