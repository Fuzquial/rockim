# FDEM/GBM -- lateral cutting on the THREE-PHASE granite-like grain
# structure (same mineralogy as the voronoi percussion demos): chips must
# negotiate the grain-boundary network, so chip size talks to grain size.
# Color by 'grain'/'phase' and threshold joint 'damage' in ParaView.
mode = fdem
scenario = shear
mesh = voronoi
T = 8e-4
frames = 20

W = 0.12
H = 0.06
grainSize = 0.008
grainSeeding = random
lloydIters = 2
refineLevels = 1
seed = 12345

# base material (defaults; phases override)
rho = 2650
E = 70e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

