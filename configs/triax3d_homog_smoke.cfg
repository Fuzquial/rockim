# ---------------------------------------------------------------------------
# SMOKE TRIAXIAL 3D HOMOGENE — la capacite d'abord, sans variable parasite :
# eprouvette 15 x 15 x 30 mm, 4498 tets non structures, UN corps, UN materiau,
# joints uniformes (pas de GBM). Confinement lateral 10 MPa (suiveur) etabli
# AVANT la charge axiale (rampes ordonnees, jauge a 3 rampes), compression par
# mors (scenario tension, pullV < 0), crushCap decouple.
# Verdicts : sigma3 ~ -10 MPa a la jauge ; pic axial ; casse en cisaillement ;
# pas d'explosion. Le residu B4 sortira [CHECK] (travail du confinement non
# comptabilise — limitation connue, cf DOCUMENTATION).
#   maillage : python tools/make_unstructured_mesh.py box3d 0.015 0.015 0.03 \
#              0.002 meshes/triax3d_box.msh 1
#   lancer  : rockim_dev.exe configs\triax3d_homog_smoke.cfg out_triax3d_homog
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = tension
mesh = file
meshFile = meshes/triax3d_box.msh
T = 8e-4
frames = 8

rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10

crushCap = 400e6
jointPenaltyFactor = 20

# compression : pullV NEGATIF, rampe cosinus
pullV = -0.5
pullRamp = 1.5e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false

# confinement lateral (fut), etabli avant la charge axiale
confiningPressure = 10e6
confiningRamp = 8e-5
confineFaces = lateral
confineGaugeTime = 2.4e-4
