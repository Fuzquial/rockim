# ---------------------------------------------------------------------------
# IMPACT 2D — bouton RIGIDE lâché à vitesse initiale sur une éprouvette de
# granite. Scénario `percussion` : l'outil est LIBRE.
#
#   python tools/make_unstructured_mesh.py box2d 0.040 0.020 0.00025 \
#          meshes/impact2d.msh 1
#   rockim_f2u.exe configs\impact2d_bouton.cfg out_impact2d
#
# POURQUOI CE SCÉNARIO EST DIFFÉRENT DE LA COUPE. En coupe l'outil est à
# VITESSE IMPOSÉE : il ne décélère jamais, donc toute fuite de la loi de contact
# puise dans un réservoir INFINI — c'est la cause structurelle de la pompe
# mesurée le 2026-08-18 (injection ×408). En percussion l'outil est LIBRE
# (`toolMass`) : il décélère, rebondit, et son énergie est bornée par
# ½ m v₀² = 250 J/m. La même loi de contact n'a plus de quoi diverger. C'est
# aussi le scénario VALIDÉ de rockim (+7,9 % de pic contre Abaqus, même
# maillage, même loi).
#
# MAILLAGE NON STRUCTURÉ, à dessein. Le deck historique
# `configs/fdem_percussion.cfg` utilise `mesh = grid` ; le solveur AVERTIT
# lui-même qu'une grille structurée biaise les trajets de fissure et peut
# diverger en phase débris (fiche 2026-08-06). Pour un essai où la casse est
# le résultat, il faut du non structuré : 12 800 triangles à 0,25 mm, même
# famille de maillage que les runs de coupe d'aujourd'hui.
#
# MATÉRIAU : granite Utah FORGE de Heilman et al., identique aux runs de coupe,
# pour que les deux essais se comparent directement.
#
# ÉNERGIE : 5 kg/m à 10 m/s = 250 J/m — exactement l'énergie cinétique des
# runs de coupe (`toolKE = 250`). Les deux essais partent du même budget.
#
# CE QU'ON REGARDE
#   - le cratère : joints rompus, fragments, volume détaché
#   - le REBOND : `tool work output` et la KE perdue par l'outil, donc le
#     coefficient de restitution — la percussion a un e mesurable, la coupe non
#   - les compteurs par canal (étape 2) : outil / joints / fragments
#   - v nodale max rapportée à 2·v_outil = 20 m/s, la MÊME borne qu'en coupe
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion
T = 1.0e-4
frames = 20

thickness = 1.0
mesh = file
meshFile = meshes/impact2d.msh

# --- granite Utah FORGE (Heilman et al., Table 1) ---------------------------
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 152.9
gfShearFactor = 4.220
crushCap = 1e12              # volume ÉLASTIQUE : toute la fissuration est aux joints

# --- l'insert : bouton rigide LIBRE -----------------------------------------
toolShape = disc
toolRadius = 0.004           # bouton de 4 mm, celui du deck Abaqus calib_kuru
toolMass = 5.0               # kg/m — l'outil DÉCÉLÈRE, réservoir fini
impactSpeed = 10.0           # m/s  -> KE = 250 J/m
toolGap = 1e-4               # jeu initial outil-surface
contactMu = 0.8              # même coefficient que les runs de coupe

# --- loi de contact de l'outil ----------------------------------------------
# Le deck de référence sera rejoué en `penalty` : la percussion est le cas
# VALIDÉ, donc le premier devoir de Signorini est de ne pas le casser.
toolContact = penalty

# --- frontières : champ lointain absorbant ----------------------------------
absorbing = all

# --- schéma : celui des runs de coupe ---------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

# --- instruments ------------------------------------------------------------
vNodeMaxEvery = 1
budgetAbortPct = 0
historyFlush = true
