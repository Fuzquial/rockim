# FDEM/GBM demo -- the crack-orientation control test. Same tension as the
# weibull demo, but the strength field is ANISOTROPIC: correlation 0.04 m
# ALONG a direction tilted 30 deg from horizontal and 0.005 m across it,
# i.e. narrow weak BANDS at 30 deg (a foliation-like texture). Pure mode I
# wants a horizontal crack; the weak band wants 30 deg. If the crack
# follows the band, the orientation is physics (weakness/stress
# competition), not a solver preference. Color the joints .vtu by
# 'ftScale' and compare with the final 'damage'.
mode = fdem
scenario = tension
mesh = voronoi
T = 1.2e-3
frames = 10

W = 0.06
H = 0.12
grainSize = 0.008
grainSeeding = random
lloydIters = 2
refineLevels = 0
seed = 12345

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

# anisotropic correlated Weibull strengths: 30-deg weak bands
jointWeibullM = 6
strengthCorrLength = 0.04
strengthCorrLengthB = 0.005
strengthCorrAngleDeg = 30
fieldSeed = 11

jointPenaltyFactor = 20
pullV = 0.05
pullRamp = 2.5e-4
dampingLocal = 0.1

verifyFt = false
gripLateralFree = true

