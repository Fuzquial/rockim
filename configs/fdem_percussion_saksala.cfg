# FDEM 2D — PERCUSSION avec loi de SAKSALA dans le BULK (2026-08-05).
#
# Configuration COUPLEE de la these (vumat_fdem_coupled) : un bulk dissipatif
# ET des joints cohesifs discrets, au lieu de l'un ou de l'autre.
#   - les ELEMENTS suivent `law` (deformation plane : la loi 3D recoit une
#     deformation de Biot co-tournee dont la composante hors-plan est
#     exactement nulle) ;
#   - les JOINTS restent des cohesifs intrinseques ft/Gf en mode I,
#     c/Gf_II en mode II, avec frottement residuel.
# Quand une loi est active, `crushCap` et le cap de traction moyenne sont
# DESACTIVES : ils etaient le substitut elastique d'une vraie loi.
#
# ⚠️ MAILLAGE DESORDONNE OBLIGATOIRE. Un facies d'impact EST un trajet de
# fissure, et en FDEM une fissure ne peut suivre que les aretes d'elements :
# la grille en croix diagonale ne lui offre que deux directions a 45 deg. La
# litterature (revue Y-Geo, Lisjak & Grasselli) impose des maillages
# discretises ALEATOIREMENT a la place des grilles structurees. On utilise
# donc la tessellation de Voronoi (semis Poisson) comme simple MAILLEUR
# desordonne : une seule phase, tous les alphas a 1, donc chaque joint porte
# la resistance du bulk et la microstructure n'introduit aucun contraste.
# Pour un vrai GBM multi-phases, voir fdem_voronoi_percussion.cfg.
#
# ⚠️ AUCUN parametre n'est calibre. Le jeu Red Bohus de juillet a ete invalide
# par la correction du signe de l'amortisseur de joint. Demonstration de
# FONCTIONNEMENT, pas resultat exploitable.
mode = fdem
scenario = percussion
mesh = voronoi
T = 2.5e-4
frames = 30

W = 0.2
H = 0.2
grainSize = 0.01
grainSeeding = random
lloydIters = 2
refineLevels = 1
vertexMergeFrac = 0.12
seed = 12345

# --- loi du bulk ---
law = saksala
saksalaEta = 1e4
capP0 = 250e6
capH = 5e9

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

# une seule phase, joints non attenues : la tessellation ne sert que de
# mailleur desordonne (mêmes conventions que verify_fdem_voronoi_tension)
jointPenaltyFactor = 20
# regime d'IMPACT : le dashpot de joint stabilise le contact (0,01 en
# quasi-statique, 0 pour verifier la loi seule)
jointXi = 0.05

toolShape = disc
toolRadius = 0.015
toolMass = 5.0
impactSpeed = 8.0
contactMu = 0.5

absorbing = all
dampingLocal = 0.05
dtFactor = 0.15
