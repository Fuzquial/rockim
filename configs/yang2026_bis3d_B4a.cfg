# BISECTION 3D niveau 2 (12/09, 0 h 30) : B4a — sans jointElastic = parabolic seulement (origin + coulomb gardes) ; base = banc intrinseque, rampe, borne KE 2 %
# CERTIFICATION 13/09, variante RAMPE : gcBirth = penalty retire (releve de naissance par volume, defaut).
# CERTIFICATION 13/09 : le banc intrinseque de reference, relance sous la borne KE (g1y10) — le run du 11/09 tournait sans elle.
# BANC COURT s = 2,5 (10 563 tets) : meme physique que yang2026_impact.cfg, maillage 2,5 x plus grossier,
# pour parcourir TOUTE la chronologie (piston -> bit -> insert -> roche -> rebond) en minutes
# et falsifier chaque mecanisme avant le run s = 1. Genere par sed depuis le deck principal :
# seules meshFile et frames changent.
# ---------------------------------------------------------------------------
# IMPACT INSERT UNIQUE SUR KURU GREY — LOI DE YANG et al. 2026, A L'IDENTIQUE
# Version 2 (2026-09-11 soir) : deck REFONDU apres le point du 11/09.
#
# Reference : X. Yang, J. Xiang, S. Naderi, Y. Wang, J. Aising, I. Ugarte,
# J.-P. Latham, « High-fidelity modelling of fragmentation and pulverisation
# in hard granite under percussion loading: a FDEM-based approach »,
# Int. J. Rock Mech. Min. Sci. 206 (2026) 106660.  Code : Solidity (Imperial).
# Donnees experimentales : Aising et al., Mines Paris-PSL / Drillco.
#
#   python tools/make_impact_mesh.py meshes/impact_yang_s1_pose.msh 1.0 gap=2e-5 gapr=2e-5
#   rockim_g1y3.exe configs/yang2026_impact.cfg out_yang2026   (g1y3 = contact parallele, 2026-09-11 soir)
#
# CE QUI A CHANGE PAR RAPPORT A LA VERSION 1 (docs/ETAT_yang2026_2026-09-11.md,
# §3, une ligne par correction, chacune mesuree) :
#   - outil analytique fantome supprime (toolShape = none) ;
#   - acier et carbure INCASSABLES et CONTINUS (phase.*.ft = 1e12 +
#     groupContinuum) : la v1 leur donnait les joints de la roche (ft 11 MPa)
#     et les joints du carbure fixaient dt = 0,94 ns pour 4,7 ns de CFL ;
#   - insert et circlip BRASES au bit (groupBond) : la v1 les laissait libres ;
#   - contact par POTENTIEL de Munjiza (contact = potential) : la penalite
#     noeud-face (gcPenaltyFactor 0,01 E h) est 800 x trop molle pour le
#     choc piston/bit de 100 kN ; c est le contact de Solidity ;
#   - frottement 0,18 sur la ROCHE (Table 1, colonne Kuru), 0,6 acier/carbure,
#     regle du minimum de Solidity (Y3Did.c l. 1292) ;
#   - amortissements numeriques ETEINTS (dampingLocal, jointXi) : Yang n en
#     applique aucun, rockim en armait deux par defaut ;
#   - jointShearRange = coulomb (plage de mode II de Guo p. 65, verrou du
#     noyau broye leve le 27/08) et jointElastic = parabolic (branche
#     elastique de Solidity, Guo eq. 2.31) ;
#   - jauge au MILIEU du bit dans le repere SOLVEUR (le maillage est
#     translate de +0,149 m) ;
#   - jeux piston/bit et insert/roche 0,2 mm -> 0,02 mm (66 us de vol
#     inutiles supprimes) ; gravite 9,81 + comptabilisee ;
#   - garde-fou budgetAbortPct = 2 : un run de 20 h qui cree de l energie
#     s arrete au lieu de finir « OK ».
# ---------------------------------------------------------------------------

mode = fdem3d
scenario = percussion
# L outil EST le corps maille « piston » lance par groupVel : aucune sphere
# analytique (le defaut en creerait une de 0,5 kg a 8 m/s, 16 J fantomes).
toolShape = none

# --- maillage : leur fig. 5 (geometrie) et fig. 6 (tailles) ----------------
# Six corps : rock, insert (carbure), bit, piston, circlip, plate (acier).
# Roche cylindre R 125 x 150 mm ; insert hemispherique R 8,51 mm ; bit Phi 30
# x 265 mm insert compris ; piston Phi 26,5 x 260 mm ; plaque 119,9 x 40 x 6.
# Jeux 0,02 mm : insert POSE sur la roche (le poids sur l outil assied le
# bit dans l essai) et piston au contact du bit.
mesh = file
meshFile = meshes/impact_yang_s2.5_pose.msh

# --- duree : leurs figures vont jusqu a ~750 us (rebond inclus) ------------
# Chronologie (v2) : piston -> bit 2 us ; onde dans le bit 48 us ; charge de
# la roche des ~52 us ; pic de force ~80 us ; rebond du bit ~450 us.
T = 9.0e-5
frames = 4
historyFlush = true

# --- garde-fous et pesanteur -------------------------------------------------
# Yang : « gravity, which is also applied to the model ». Le travail de la
# pesanteur doit entrer au bilan, sinon budgetAbortPct coupe un run sain.
gravity = 9.81
energyBodyForces = on
# Arret si l energie CREEE depasse 2 % de l echelle : le bilan B4 seul est
# une identite comptable qui a deja affiche [OK] sur un bloc parti a 18 m.
budgetAbortPct = 2

# ---------------------------------------------------------------------------
# MATERIAUX — Table 1 de l article, sans une seule substitution
# ---------------------------------------------------------------------------
# Kuru Grey granite (colonne 1). Le bloc global = la roche.
rho = 2626                       # kg/m3
E = 60e9                         # Pa      (60 GPa)
nu = 0.24
ft = 10.98e6                     # Pa      tensile strength
cohesion = 29.84e6               # Pa      cohesive
# « Internal friction coefficient 1.85 » = tan(phi). phi = atan(1,85).
frictionDeg = 61.61
# Energy release rate mode I = 50 J/m2, mode II = 1000 J/m2 (rapport 20).
Gf = 50
gfShearFactor = 20

# Trois PHASES (materiaux) pour six CORPS (volumes physiques du maillage).
# Les fractions ne servent qu au bilan par phase (elles sont normalisees) :
# on ecrit les fractions volumiques reelles du maillage pour que la ligne
# « target » du journal soit lisible.
phases = rock steel carbide
phase.rock.fraction = 0.9573
# acier (colonne 3) : bit, piston, plaque de charge.
phase.steel.fraction = 0.0421
phase.steel.rho = 7850
phase.steel.E = 200e9
phase.steel.nu = 0.29
# carbure (colonne 2) : insert et circlip.
phase.carbide.fraction = 0.0007
phase.carbide.rho = 15250
phase.carbide.E = 600e9
phase.carbide.nu = 0.2
# Yang ne donne NI resistance NI energie de rupture a l acier et au carbure :
# ce sont des corps elastiques incassables. Sans ces lignes, rockim leur
# donnerait ft = 10,98 MPa et c = 29,84 MPa — ceux de la roche (v1).
phase.steel.ft = 1e12
phase.steel.cohesion = 1e12
phase.carbide.ft = 1e12
phase.carbide.cohesion = 1e12

groupPhase.rock = rock
groupPhase.insert = carbide
groupPhase.circlip = carbide
groupPhase.bit = steel
groupPhase.piston = steel
groupPhase.plate = steel

# Insert et circlip sont BRASES au bit (leur fig. 5d : une seule piece).
groupBond.bit.insert = joints
groupBond.bit.circlip = joints

# Corps CONTINUS (2026-09-11) : aucun joint n est evalue dans l acier ni le
# carbure, leurs noeuds sont lies par groupes (continuum EF exact). Deux
# raisons mesurees : (1) les joints de penalite du carbure (600 GPa, 0,7 mm,
# pf 20) commandaient le pas de temps a 0,94 ns quand la CFL des elements
# seuls permet 4,7 ns ; (2) des joints a pf = 20 dans l acier ajoutent une
# complaisance E/(1 + 1/20) = -4,8 % sur le module du bit, qui n a aucun
# equivalent dans un piston reel — et l onde mesuree a la jauge (critere 1)
# se compare a l EXPERIENCE, pas a Solidity.
groupContinuum.insert = true
groupContinuum.circlip = true
groupContinuum.bit = true
groupContinuum.piston = true
groupContinuum.plate = true

# ---------------------------------------------------------------------------
# LOI DE JOINT (roche) — leur section 2, fig. 1 de Yang 2025
# ---------------------------------------------------------------------------
# Insertion INTRINSEQUE : « potential fracture zones are represented by
# six-node joint elements inserted between tetrahedral elements ». Tous les
# joints de la roche preexistent (defaut de rockim : cle `insertion` ABSENTE).
# Ne PAS mettre `adaptive` : c est Yan, Zheng & Wang 2023, un autre schema.
#
# Raideur de penalite : NON PUBLIEE par Yang (verifie sur les 4 PDF). Naderi
# 2025 (meme code) tabule 24 E ; Munjiza recommande 10 E. 20 = la valeur des
# decks d impact de rockim ; sensibilite mesuree (configs_bench/pen_f*.cfg) :
# E_eff = E / (1 + 1/f), soit -4,8 % a f = 20, -9,1 % a f = 10.
jointPenaltyFactor = 20
# Branche elastique PARABOLIQUE de Solidity (Guo eq. 2.31, sigma = ft (2r - r^2)),
# puis adoucissement z-curve de Munjiza 2004 (a = 0,63, b = 1,8, c = 6).
jointSoftening = munjiza
# Critere : Mohr-Coulomb avec COUPURE DE TRACTION, leur eq. 1 :
#   f_s = c - sigma_n tan(phi) si sigma_n < f_t ; c - f_t tan(phi) sinon.
jointShearEnvelope = yang
# Plage d adoucissement de mode II divisee par f_s(sigma_n) a la pression
# courante (Guo p. 65, Solidity Y3Dfd.c l. 1110-1126) et non par c seule :
# sous l insert l ecart vaut x54 — sans cette cle, pas de noyau broye, pas de
# radiales, rebond 0,99 (verdict du 2026-08-27).
jointShearRange = coulomb
# Decharge/recharge en cisaillement sur la secante a l origine (eq. 18 de
# Yan, symetrique du mode I) : la loi de joint de Solidity est un
# endommagement, pas une plasticite a glissement conserve.
jointShearUnload = origin
# Chez Solidity un joint rompu ne porte AUCUN cisaillement (dpefm = 0.0 en
# dur, Y3Dfd.c l. 1091) : le frottement du joint decroit avec f(D) jusqu a 0,
# puis le CONTACT prend le relais. 0 = exactement cela.
jointResidualMu = 0
# Mort du joint des D >= 1 quel que soit le signe de l ouverture (regle de
# Guo §2.3.3) : avec le defaut `separation`, un joint ecroui EN COMPRESSION
# sous l indenteur ne meurt jamais et le contact roche/roche (donc mu = 0,18)
# ne s engage jamais.
jointDeath = damage
# Aucun amortisseur visqueux de joint chez Solidity (rockim en arme un a
# xi = 0,05 par defaut, « 0 pour les verifications de loi »).
jointXi = 0
# Trois conventions de Solidity portees le 2026-08-27 depuis leur source
# (BILAN_replique_solidity, six cles) : points d integration a mi-arete,
# ouverture critique calculee comme Y3Dfd.c l. 1099, joint mort quand DEUX
# points sur trois ont atteint z >= 1 (l. 1175) et non des le premier.
jointQuadrature = midedge
jointDeltaC = solidity
jointFailRule = majority

# ---------------------------------------------------------------------------
# EFFET DE VITESSE DE DEFORMATION — leurs eq. 1 et 2
# ---------------------------------------------------------------------------
#   DIF_compression = 0,77 + 0,56 edot^0,07,  plafond 1,84 au-dela de 1e4 /s
#   DIF_traction    = 0,95 + 0,41 edot^0,17,  plafond 1,85 au-dela de 1e2 /s
# L article de 2025 imprime 0,07 en traction (coquille : loi discontinue),
# celui de 2026 imprime 0,17 = la lecture de leur fig. 2b. On pose le PUBLIE.
strainRateDIF = yang
difExpT = 0.17                   # traction, eq. 2 de 2026
difExpS = 0.07                   # compression / cisaillement, eq. 1
# Chez Solidity le DIF est une variable LOCALE de la boucle element,
# reevaluee a chaque pas sur le taux BRUT (Y3Dfd.c l. 1448-1456) : aucun gel.
# `continuous` + `none` = cette architecture (portes le 2026-08-27). La v1
# posait `envelope` (gel au franchissement de l enveloppe) parce que le
# solveur refuse le DIF sans dire QUAND l appliquer — c etait le choix le
# plus proche, pas le leur.
strainRateDIFArm = continuous
strainRateFilter = none

# ---------------------------------------------------------------------------
# PULVERISATION — leurs eq. 3 et 4, et les cinq dernieres lignes de Table 1
# ---------------------------------------------------------------------------
# sigma = sigma_NH tant que eps <= eps_d, puis C_d deps = (1 - D) dsigma_bar.
# D croit lineairement de 0 a D_max entre delta_m^0 et delta_m^f.
bulkDamage = yang
bulkDamageDelta0 = 1.4e-5        # « effective displacement min value » 0,014 mm
bulkDamageDeltaF = 4.0e-4        # « effective displacement max value » 0,4 mm
bulkDamageDmax = 0.9             # « damage factor max value »
# rockim plafonne par defaut le deviateur du bulk a 8 c = 239 MPa (garde-fou
# maison, absent de Solidity) : sous l insert la pression depasse le GPa. Le
# modele de Yang laisse la pulverisation seule degrader l element.
crushCap = 1e12

# ---------------------------------------------------------------------------
# CONTACT — le potentiel de Munjiza, celui de Solidity
# ---------------------------------------------------------------------------
# Le contact general par defaut de rockim est une penalite noeud-face de
# raideur 0,01 E h par noeud, faite pour des debris de roche : pour le choc
# piston/bit (~100 kN sur ~50 noeuds) elle est ~800 x trop molle, la
# penetration depasserait le plafond de detection (0,6 h) et le piston
# traverserait le bit. Le contact par potentiel (paires de tetraedres,
# force = p * integrale du recouvrement) est dimensionne en contrainte.
contact = potential
# kt/kn = 2/7 comme leur ktss = 2/7 * penalty (Y3Did.c l. 1017).
potTangentFactor = 1.4286
# Faces de contact actives par regles (Fukuda) au lieu de tout l exterieur
# des six corps balaye a chaque pas : 53 % du cout par pas en v1.
gcActivation = adaptive
# Naissance du contact a force CONTINUE (Y3Did.c l. 915-964) : sous
# l insert les joints meurent COMPRIMES, la rampe par defaut (force nulle
# puis montee sur gcBirthTau) faisait perdre la portance a chaque mort.
# Frottement de glissement, Table 1 PAR MATERIAU : Kuru Grey 0,18, carbure
# 0,6, acier 0,6. Solidity prend le MIN de la paire (Y3Did.c l. 1292,
# verifie sur commit deca80df) : tout contact impliquant la roche vaut 0,18.
# La v1 posait 0,6 partout et 0,18 « residuel » — 3,3 x trop haut sur
# l insert (bilan du 2026-09-03).
contactMu = 0.6
contactMu.rock = 0.18
contactMu.steel = 0.6
contactMu.carbide = 0.6
# Un element pulverise glisse a 0,18 comme la roche intacte (Table 1 n a
# qu une valeur par materiau) : contactResidualMu n apporte rien ici. Ce que
# leur CODE fait en plus (Y3Did.c l. 995, 1044, 1263-1265) : raideur normale
# ET frottement du contact multiplies par d_fact = min(1 - D_i, 1 - D_j) —
# la « loss of load-bearing capacity » sous l insert que l article decrit.
contactDamageCoupling = solidity

# ---------------------------------------------------------------------------
# AMORTISSEMENT ET PAS DE TEMPS
# ---------------------------------------------------------------------------
# Yang n applique AUCUN amortissement (impact franc). rockim arme par defaut
# un amortissement local de Cundall a 0,05 en percussion 3D : il freine
# l onde dans le bit et dissipe hors bilan physique. 0.
dampingLocal = 0
# dt = dtFactor x min(CFL des elements, ressorts). Yang annonce 2,5e-9 s.
dtFactor = 0.15

# ---------------------------------------------------------------------------
# INSTRUMENTATION : les sept criteres de leur fig. 8
# ---------------------------------------------------------------------------
# Cinematique massique des corps (vitesses d indentation et de rebond,
# profondeur max) et jauge de contrainte au MILIEU du bit (« strain gauge
# placed at the middle of the drill bit », Yang 2025 §4.1).
# REPERE SOLVEUR : le maillage est translate pour que le bas de la roche soit
# a z = 0 ; le bit occupe z = [0,1732 ; 0,4150] m, milieu 0,2941 m. Le
# journal imprime l etendue de chaque corps et avertit si la fenetre sort de
# la moitie centrale. La v1 lisait [0,15 ; 0,20] = les 26 mm du BAS du bit.
trackGroups = bit piston insert
gauge.bit = 0.28 0.31

# ---------------------------------------------------------------------------
# CHARGEMENT — leur section 3.1
# ---------------------------------------------------------------------------
# Le piston frappe le bit, qui frappe la roche. Vitesses de leur campagne :
# 5,68 / 9 / 11 / 13 m/s (energies 13,23 a 114,95 J). Cas d analyse : 9 m/s.
groupVel.piston = 0 0 -9.0

# ---------------------------------------------------------------------------
# OPTION — tri des fragments de Yang 2025 §2.3 (critere « masse de fragments »)
# ---------------------------------------------------------------------------
# rockim porte l algorithme (anti-gravite v = 2,5 mm/s, a = 98,1 m/s2 = 10 g,
# 0,5 ms, beta = 0,8 ; brushReport au resume). Il prolonge le run de 0,5 ms
# (+62 % de pas). A armer QUAND la masse de fragments est la metrique visee :
#   T = 1.3e-3
#   fragBrushStart = 8.0e-4
#   fragBrushV0 = 2.5e-3
#   fragBrushAccel = 98.1
#   fragBrushBeta = 0.8
# (energyBodyForces = on est deja pose : le travail de l anti-gravite entre
#  au bilan, sinon budgetAbortPct couperait un run sain.)
