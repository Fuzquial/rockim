# ---------------------------------------------------------------------------
# CAS DE BASE percussion 3D — maillage NON STRUCTURE « a la Yan et al. 2023 »
# (tetraedres Delaunay uniformes, Gmsh, AUCUNE structure de grains).
# Remplace la demo grille de Kuhn comme point de depart de toute etude : un
# maillage structure biaise les trajets ET peut diverger en phase debris
# (2D mesure 2026-08-06 ; 3D confirme 2026-08-11 — grille intrinseque en
# cascade gcWork +584 J, alors que CE maillage est sain dans les deux
# schemas). Le maillage est fourni (meshes/box3d_h45.msh) ; pour le regenerer
# ou en changer la taille/graine :
#   python3 tools/make_unstructured_mesh.py box3d 0.08 0.08 0.06 0.0045 \
#           meshes/box3d_h45.msh 1
# Lancer depuis la racine rockim/ (le chemin meshFile est relatif au cwd) :
#   ./build/rockim configs/fdem3d_percussion_base.cfg out_p3
# Variante adaptative : ajouter `insertion = adaptive`.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/box3d_h45.msh
T = 2e-4
frames = 30

rho = 2650
E = 50e9
nu = 0.25
ft = 10e6
cohesion = 25e6
frictionDeg = 40
Gf = 70
gfShearFactor = 10

jointPenaltyFactor = 20
toolShape = sphere
toolRadius = 0.015
toolMass = 0.5
impactSpeed = 8.0

dampingLocal = 0.05
absorbing = all
dtFactor = 0.15

# champ de resistance heterogene correle (verrou n.1 des fissures radiales)
jointWeibullM = 6
strengthCorrLength = 0.008
fieldSeed = 555
# fenetre doublee : la decharge complete (verrou n.4)
T = 4e-4
