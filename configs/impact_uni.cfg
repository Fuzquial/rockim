# ---------------------------------------------------------------------------
# IMPACT PONCTUEL — calcaire St Anne (Table 4 de Yang et al., IJRMMS 191, 2025),
# leur loi (eq. 1), machinerie de Yan, maillage UNIFORME 2 mm, 60 J.
#
# Maillage : bloc 60 x 60 x 40 mm, insert spherique R 8,51 mm, 180 933 tetras,
# arete mediane 2,01 mm dans la roche — UNIFORME, sans gradation.
#   l_cz = E GI/ft^2 = 14,0 mm contre 2 dx = 4,0 mm : zone cohesive resolue.
#
# Energie : insert de 0,30 kg a 20 m/s = 60 J (Yang : 71 J). La masse est
# rendue par la densite de la phase insert sur une sphere de leur rayon ; on
# la prend plus legere et plus rapide que leur taillant de 1,47 kg pour
# RACCOURCIR l evenement (duree ~ sqrt(m)), sinon le run depasse 30 h.
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
mesh = file
meshFile = meshes/impact_uni.msh

rho = 2731
E = 57e9
nu = 0.31
ft = 7.0e6
cohesion = 18.8e6
frictionDeg = 45.0
Gf = 12
gfShearFactor = 66.6667
contactMu = 0.6

phases = rock insert
phase.rock.fraction = 0.5
phase.insert.fraction = 0.5
phase.insert.rho = 116210
phase.insert.E = 600e9
phase.insert.nu = 0.22
phase.insert.ft = 400e6
phase.insert.cohesion = 800e6
phase.insert.Gf = 400

toolShape = none
groupVel.insert = 0 0 -20.0
trackGroup = insert
absorbing = all
dtFactor = 0.15

jointShearEnvelope = yang
strainRateDIF = yang-fig2
strainRateTau = 1.0e-6

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dampingLocal = 0.0
bulkViscosityGraded = 1
bulkViscosityXi = 2.0

budgetAbortPct = 5
budgetAbortMin = 0.05

T = 2.5e-4
frames = 25
