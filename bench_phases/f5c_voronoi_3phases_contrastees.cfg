# F5c — MEME deck, contraste mineral du Red Bohus : quartz 83,1 GPa,
# feldspath 70 GPa, biotite 29,3 GPa. VARIANTE QUI DOIT ECHOUER l'egalite de
# F5b : si elle passait, les phases ne seraient pas branchees et l'on se
# serait prouve une tautologie. C'est ce contraste de RAIDEUR qui concentre
# les contraintes aux frontieres de grain — un champ de Weibull sur un bloc
# de raideur uniforme ne le pouvait pas, faute de contraste elastique.
mode = fem3d
mesh = voronoi
law = elastic
scenario = tension
W = 0.006
D = 0.006
H = 0.006
grainSize = 2.0e-3
grainJitter = 0.5
lloydIters = 2
vertexMergeFrac = 0.25
grainSeeding = hex
seed = 12345
T = 2e-6
frames = 2
pullV = 0.5
triaxStats = true
E = 60e9
nu = 0.25
rho = 2650
ft = 10e6
cohesion = 30e6
frictionDeg = 40
Gf = 60
phases = quartz feldspath biotite
phase.quartz.fraction = 0.35
phase.quartz.E = 83.1e9
phase.quartz.rho = 2650
phase.feldspath.fraction = 0.45
phase.feldspath.E = 70.0e9
phase.feldspath.rho = 2560
phase.biotite.fraction = 0.20
phase.biotite.E = 29.3e9
phase.biotite.rho = 3050
