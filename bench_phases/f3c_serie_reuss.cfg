# F3c — LE BANC DECISIF. Deux couches en SERIE : dur (E1) en bas,
# mou (E2) en haut, interface a z = H/2, noeuds partages. La solution
# en serie est fermee : 1/E_app = f1/E1 + f2/E2 (borne de REUSS).
# C'est le SEUL test qui distingue une capacite qui MARCHE d'une
# capacite qui AFFICHE : si laws_[e.phase] n'etait pas branche, les
# champs VTU seraient parfaits et E_app vaudrait E1.
mode = fem3d
mesh = file
meshFile = bench_phases/bar2.msh
law = elastic
scenario = tension
T = 4e-5
frames = 2
pullV = 0.04
pullRamp = 1e-5
triaxStats = true
historyFlush = 1
nu = 0.25
rho = 2650
ft = 10e6
cohesion = 30e6
frictionDeg = 40
Gf = 60
E = 83.1e9
phases = dur mou
phase.dur.fraction = 0.5
phase.dur.E = 83.1e9
phase.mou.fraction = 0.5
phase.mou.E = 29.3e9
