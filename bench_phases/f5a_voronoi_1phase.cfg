# F5a — mesh = voronoi en fem3d, UNE seule phase (pas de cle `phases`).
# Criteres falsifiants imprimes par le solveur lui-meme :
#   - aire des faces exterieures == aire de la boite (les grains sont SOUDES ;
#     sinon le bloc serait un tas de grains libres, avec des contraintes
#     plausibles et une resistance effondree) ;
#   - aucune face partagee par plus de deux tetraedres ;
#   - audit de masse sum(m) == sum_p rho_p V_p ;
#   - hmin et lc max, a MESURER avant de dimensionner toute campagne : les
#     tets de la tessellation sont des cones (centre de cellule, centre de
#     face, arete), plats par construction, et hmin pilote le pas de temps.
mode = fem3d
mesh = voronoi
law = elastic
scenario = tension
W = 0.006
D = 0.006
H = 0.006
grainSize = 2.0e-3
grainJitter = 0.5
lloydIters = 2
vertexMergeFrac = 0.25
grainSeeding = hex
seed = 12345
T = 2e-6
frames = 2
pullV = 0.5
triaxStats = true
E = 60e9
nu = 0.25
rho = 2650
ft = 10e6
cohesion = 30e6
frictionDeg = 40
Gf = 60
