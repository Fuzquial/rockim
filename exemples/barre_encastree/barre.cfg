# ===========================================================================
# Barre encastree a gauche, appui (compression) a droite — exemple rockim
# (charges et CL par groupes, DOCUMENTATION_rockim.md §5.21, 2026-10-03)
#
#   z
#   |      xmin (encastre)                          xmax (on appuie)
#   |      ||----------------------------------------|  <== p = 5 MPa
#   |      ||          barre 100 x 20 x 20 mm        |
#   |      ||----------------------------------------|
#   +----------------------------------------------------> x
#
# Lancer depuis la racine du depot :
#   ./build/rockim exemples/barre_encastree/barre.cfg exemples/barre_encastree/out
# Maillage (deja fourni, a regenerer si besoin) :
#   python3 tools/make_unstructured_mesh.py box3dbc 0.10 0.02 0.02 0.004 \
#           exemples/barre_encastree/barre.msh 1
#   -> volume "solid", faces xmin xmax ymin ymax bottom top, coins c000..c111
#
# Ordre de grandeur attendu (barre libre lateralement) : raccourcissement
# p.L/E = 5e6 x 0,1 / 50e9 = 1,0e-5 m ; reaction de l encastrement = +2 000 N.
# L encastrement complet (fix.xmin = all) empeche le gonflement de Poisson
# au voisinage de xmin : la barre est un peu plus raide que 1,0e-5 m.
# Mesure (2026-10-03, Linux, 4 fils, ~6 min) : U_xmax_x = -9,950e-6 m,
# reaction 2 000,7 N pour 2 000,1 N appliques, residu B4 9e-13 %.
# ===========================================================================

# ---- solveur et montage -----------------------------------------------------
mode = fdem3d
scenario = loads          # ni outil ni appui automatique : tout est decrit ici
mesh = file
meshFile = exemples/barre_encastree/barre.msh
insertion = adaptive      # joints inseres a la demande (aucun ici : ft eleve)

# ---- duree et sorties ---------------------------------------------------------
T = 6e-4                  # [s]
frames = 4                # trames VTU pour ParaView

# ---- materiau (granite generique, SI) ------------------------------------------
rho = 2650
E = 50e9
nu = 0.25
ft = 50e6                 # resistances elevees : on reste elastique
cohesion = 100e6
frictionDeg = 40
Gf = 70
dampingLocal = 0.7        # amortissement (valeur maison du quasi statique)

# ---- conditions aux limites -------------------------------------------------------
fix.xmin = all            # encastrement : u = 0 sur x, y et z

# ---- chargement : l appui a droite -------------------------------------------------
pressure.xmax = 5e6       # [Pa] pression suiveuse, > 0 = elle pousse vers -x
amplitude.xmax = ramp 1e-4   # montee douce en 0,1 ms (pas de choc)

# ---- variantes (decommenter UNE ligne a la place de pressure.xmax) -------------------
# force.xmax = -2000 0 0          # meme effort en force TOTALE [N]
# traction.xmax = -5e6 0 0        # charge morte [Pa], direction fixe
# velocity.xmax = -0.01 free free # deplacement impose (vitesse [m/s]) au lieu d une force
# force.c111 = 0 0 -200           # force PONCTUELLE sur le coin c111
# point.bout = 0.1 0.01 0.02      # ... ou sur le noeud le plus proche d un point
# force.bout = 0 0 -200           #     (repere solveur, en m)
