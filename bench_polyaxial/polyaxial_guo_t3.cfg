# Repere COMPRESSED-SHEAR-TO-FAILURE — le test polyaxial de Guo 2014 §3.5,
# Test 3 (sa fig. 3.17), en TRIAXIAL equivalent (Mohr-Coulomb ignore sigma2,
# raison meme de son choix de sigma2 = -9,375) : confinement -3,75 MPa,
# compression axiale jusqu a sigma1f = N*3,75 + UCS = 15,25 MPa (son -15).
# Table 3.3 : E 30 GPa, nu 0,27, ft 1,0 MPa, c 3,8 MPa, phi 12,4 deg,
# Gf 60 J/m2 (UNIQUE, modes I et II), cube 500 mm, maille ~27 mm, mu 0,6.
# Attendu (ses fig. 3.17/3.18, eq. 3.7) : bandes de cisaillement a
# 45 + phi/2 = 51,2 deg puis conjuguees.
mode = fdem3d
scenario = tension
T = 2.0e-3
frames = 20

W = 0.5
D = 0.5
H = 0.5
nx = 18
ny = 18
nz = 18
meshJitter = 0.3

rho = 2700
E = 30e9
nu = 0.27
ft = 1.0e6
cohesion = 3.8e6
frictionDeg = 12.4
Gf = 60
gfShearFactor = 1.0
contactMu = 0.6
crushCap = 1e12
jointPenaltyFactor = 20

confiningPressure = 3.75e6
confiningRamp = 3e-4
pullV = -0.3
pullRamp = 4e-4
gripLateralFree = true
dampingLocal = 0.7
verifyFt = false

insertion = adaptive
jointSoftening = yan
jointShearEnvelope = yang
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
insertionPenaltyFactor = 4
dtFactor = 0.15
jointShearRange = coulomb
