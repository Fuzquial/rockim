# ---------------------------------------------------------------------------
# COUPE 2D AU CUTTER PDC — loi et parametres de Heilman, Euser, Frash, Meng,
# Li, Lei & Rougier, ARMA 24-0238 (Los Alamos, code HOSS), « FDEM modeling of
# PDC cutter-rock interactions for geothermal drilling applications ».
#
#   python tunnel_edz/tools/make_cut_mesh.py 0.040 0.020 0.001016 0.003 \
#          0.00025 0.004 0.001 meshes/cut_notch.msh 1
#   rockim_tun.exe tunnel_edz\configs\cut2d_heilman.cfg out_cut_heilman
#
# LEUR LOI (leur section 2) : VOLUME ELASTIQUE + joints cohesifs entre toutes
# les faces adjacentes. Mode I quand la resistance en traction est depassee,
# mode II quand la resistance tangentielle l'est, gouverne par Mohr-Coulomb
# tau = sigma tan(phi) + c (leur eq. 2), mode mixte possible. AUCUNE
# plasticite de volume : ni Ye, ni Saksala, ni DP-DFH. C'est la loi native de
# rockim, d'ou `law` absent et crushCap desarme.
#
# LEUR TABLE 1 (granite Utah FORGE) reprise a l'identique. Deux conversions :
#   frictionDeg = atan(0.8) = 38,66 deg  (ils donnent un coefficient, pas un angle)
#   gfShearFactor = GfII/GfI = 645,3/152,9 = 4,220
#
# LEUR GEOMETRIE (leur section 3) : eprouvette 40 mm de long x 20 mm de haut
# (leur 3e dimension, 30 mm, n'a pas d'equivalent en 2D), maille 0,25 mm dans
# la zone d'interaction, ENTAILLE DE DEPART de la profondeur de passe. Leur
# cutter fait 13 mm de diametre ; ici la face de coupe fait 13 mm d'etendue.
#
# LEUR TABLE 2, cas retenu : back rake 20 deg, passe 1,016 mm, 10 m/s.
#
# CIBLE CHIFFREE. Leur figure 3B donne un pic de 21,5 kN pour ce cas. Leur
# cutter etant un disque de 13 mm, la largeur de contact a 1,016 mm de passe
# vaut 2 sqrt(d(D-d)) = 6,98 mm, soit une force lineique de 3,08 MN/m — c'est
# a ce nombre que notre resultat 2D doit se comparer.
#
# RESERVE A CONNAITRE : avec leurs parametres, l_cz = E GfI/ft^2 = 65 mm,
# soit SOIXANTE FOIS la profondeur de passe. La regle maison (2 dx < l_cz <
# dimension structurale) est donc violee par le haut : la zone cohesive est
# bien plus grande que le copeau. Ils publient malgre tout des forces
# plausibles. On reproduit leurs parametres tels quels — c'est la demande —
# mais aucun facies de fissuration ne devra etre lu comme un resultat tant que
# ce point n'est pas instruit.
# ---------------------------------------------------------------------------
mode = fdem
scenario = shear
T = 3.0e-4
frames = 15

thickness = 1.0
mesh = file
meshFile = meshes/cut_notch.msh

# --- materiau : leur Table 1, granite Utah FORGE ---------------------------
rho = 2610
E = 48.26e9
nu = 0.23
ft = 10.62e6
cohesion = 44.815e6
frictionDeg = 38.66
Gf = 152.9
gfShearFactor = 4.220
crushCap = 1e12              # volume ELASTIQUE : leur modele n'a pas de plasticite

# --- cutter : leur Table 2, cas back rake 20 deg / 1,016 mm / 10 m/s -------
toolShape = pdc
backRakeDeg = 20
cutterLen = 0.013
chamferLen = 0.0             # ⚠ lu mais SANS EFFET dans le contact (defaut connu)
cutDepth = 0.001016
cutSpeed = 10.0
toolX = 0.0005               # depart DANS l'entaille, face degagee
contactMu = 0.8              # leur coefficient de frottement

# --- schema ----------------------------------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05

# --- garde-fou REARME ------------------------------------------------------
# Le run precedent a diverge des le premier contact et a brule 56 minutes
# faute de moniteur. Il etait desarme par heritage de la config tunnel, ou il
# produisait un faux positif du fait des mors encastres — absents ici.
budgetAbortPct = 5
budgetAbortMin = 1.0
