# ---------------------------------------------------------------------------
# TUNNEL EDZ en DP-DFH — le cas de Wang et al. (2024) refait en ELEMENTS FINIS
# PURS, sans elements cohesifs, avec la loi de volume de la these.
#
#   rockim_dfh.exe tunnel_edz\configs\tunnel_dpdfh.cfg out_tun_dpdfh
#
# La question : l endommagement DP-DFH (obscuration + repere fige) produit-il
# la LOCALISATION que l insertion adaptative ne donne pas ? Reference a battre,
# mesuree sur nos propres runs : l adaptatif granule (76 % de blocs
# mono-element, aucune macro-fracture), l intrinsique produit des blocs de
# 68 a 318 m2.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/tunnel_hs_iso.msh
thickness = 1.0
T = 0.7
frames = 34

# --- materiau : leur Table 1, TRANSPOSEE en carte DP-DFH -------------------
rho = 2650
E = 10e9
nu = 0.26
law = dpdfh
# Mohr-Coulomb (c = 0,8 MPa, phi = 34 deg) -> Drucker-Prager, cone de
# compromis : tan(beta) = 6 sin(phi)/(3-sin(phi)), d = 6 c cos(phi)/(3-sin(phi))
dfhBetaDeg = 53.96
dfhDCoh = 1.630e6
# dilatance variable, la forme de vumat_hole.f. Ici p reste tres inferieure a
# 509 MPa, donc psi sature a psiMax : ecoulement ASSOCIE (comme leur reference).
dfhPsiVar = 1
dfhPsi0 = 160.345
dfhKPsi = 0.213793
dfhPsiMax = 53.96            # = beta : on plafonne a l associe, pas a 51,7
                             # (leur beta a eux) — coherence de la carte
dfhWeibullM = 24
# EFFET D ECHELLE, a lire attentivement : le seuil d amorcage vaut
# sigw (Zeff/V_el)^(1/m) avec V_el = h_el^3. Ici h = 0,209 m donc
# V_el = 9,13e-3 m3 et le facteur vaut 0,513. Pour retrouver LEUR ft de
# 0,6 MPa comme seuil effectif median il faut donc sigw = 1,17 MPa.
dfhSigW = 1.170e6
dfhZeff = 1e-9
dfhK = 0.38
dfhS = 4.18879
dfhDeld = 1e9                # PAS de suppression d element : on veut lire le
                             # champ D, pas ouvrir des trous

# --- AUCUN ELEMENT COHESIF (voir exo_hole_t003.cfg) ------------------------
insertion = adaptive
ft = 1e12
cohesion = 1e12
frictionDeg = 40
Gf = 70
verifyFt = false
crushCap = 1e12

# --- contrainte in situ + excavation, a l identique du deck de reference ---
insituSh = 5e6
insituSv = 5e6
excavRelease = true
excavStart = 0.02
excavRamp = 0.08
boreCX = 50.0
boreCY = 50.0
boreSelectR = 8.0

pullV = 0
gripLateralFree = false
lateralRollers = true
absorbing = none

dtFactor = 0.2
dampingLocal = 0.15
budgetAbortPct = 0
