# -------------------------------------------------------------------------
# balayage lambda (section 5.2) : lambda = 1.5, sigma_h = 5 MPa, sigma_v = 3.33 MPa
# Genere par tunnel_edz/tools/make_configs.py depuis
# tunnel_edz/configs/tunnel_ref_s5_lam1.cfg — ne pas editer a
# la main : reprendre la reference puis relancer le generateur.
# EXIGE les patchs 1 (in situ) et 2 (excavation).
#
#   rockim_tun.exe tunnel_edz\configs\sweep\tunnel_lam1p5.cfg out_tunnel_lam1p5
#   (depuis la RACINE du depot : meshFile est relatif au cwd)
# -------------------------------------------------------------------------
mode = fdem
scenario = tension          # sert de BOITE A ROULEAUX (pullV = 0), cf. plus bas
mesh = file
meshFile = meshes/tunnel_hs.msh
thickness = 1.0             # 2D : grandeurs par metre d'epaisseur
T = 0.25
frames = 6                  # balayage : 6 trames suffisent

# --- materiau : leur Table 1 -----------------------------------------------
rho = 2650
E = 10e9
nu = 0.26
ft = 0.6e6
cohesion = 0.8e6
frictionDeg = 34
Gf = 20                     # GfI
gfShearFactor = 5           # GfII / GfI = 100 / 20
# Leurs elements sont ELASTIQUES (leur fig. 1). Le cap deviatorique de rockim
# vaut par defaut 8*cohesion = 6,4 MPa ici : il mordrait sur le seul champ in
# situ. On le neutralise â€” c'est un garde-fou numerique, pas de la physique.
crushCap = 1e12

# --- contrainte in situ (PATCH 1) ------------------------------------------
insituSh = 5e+06         # 5 MPa
insituSv = 3.33e+06         # 3.33 MPa (lambda = 1.5)

# --- excavation (PATCH 2) --------------------------------------------------
excavRelease = true
excavStart = 0.02           # equilibrage prealable (doit etre plat : cf. V1)
excavRamp = 0.08            # ~1,7 transit d'onde sur 100 m -> quasi-statique
boreCX = 50.0               # la section est centree en (50, 50)
boreCY = 50.0
boreSelectR = 8.0           # contour a <= 6,0 m du centre ; 8 m = marge sure
                            # (les faces exterieures sont a >= 45 m : aucun risque)

# --- conditions aux limites : boite a rouleaux (deja dans rockim) ----------
# haut/bas : uy = 0, ux libre (grips + gripLateralFree, pullV = 0)
# gauche/droite : ux = 0, uy libre (lateralRollers)
# = "boundaries fixed in the normal direction" de leur section 3.3
pullV = 0
gripLateralFree = false     # mors ENCASTRES : les 4 coins seraient sinon libres
                            # en x tout en portant sigma_xx -> 5185 J/m de
                            # sonnerie parasite (mesure du 2026-08-17, V1).
                            # Ecart a "normal-fixed" : le dof TANGENTIEL des
                            # faces haut/bas, a 45 m du tunnel. Arbitre par V2.
lateralRollers = true
absorbing = none
verifyFt = false            # le verdict de resistance n'a pas de sens ici

# --- schema (les capacites validees du solveur) ----------------------------
insertion = adaptive        # REQUIS : aretes non inserees = noeuds partages,
                            # donc l'etat in situ initial est exact
jointSoftening = yan        # leur fig. 2 / eq. 2
jointShearUnload = origin   # eq. 18
jointFrictionScaled = 1     # forme litterale (frottement sur la secante)
contact = potential         # Munjiza, conservatif
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15         # relaxation quasi-statique ; 0,7 biaiserait les
                            # contraintes (regle maison), 0,05 convergerait trop lentement
jointXi = 0.01              # reglage quasi-statique recommande

# --- garde-fous ------------------------------------------------------------
# Moniteur d'energie E2 : arrete proprement si le budget derive. Seuils a
# reajuster apres le premier run (l'energie elastique stockee est de l'ordre
# du MJ ici : sigma^2/2E x volume ~ 1,2e7 J).
budgetAbortPct = 0
budgetAbortMin = 1e3
# Moniteur E2 DESARME (pct = 0) : mesure du 2026-08-17 — avec des mors
# encastres portant des forces de plusieurs MN, la correction leapfrog
# f^2 dt^2/2m est accumulee sur des noeuds a vitesse IMPOSEE, ou aucune
# energie ne circule. Elle croit lineairement (13,6 J/m par pas ici) et
# atteindrait ~0,8 MJ/m sur le run de reference, soit l'ordre du signal
# physique : le moniteur ne peut pas discriminer. Il a coupe le premier
# smoke a t = 0,0043 s AVANT le relachement, bloc au repos (KE = 2e-16).
# Controles de remplacement : energie cinetique, jauge de contrainte, et
# lecture du budget B4 en fin de run.
