# ---------------------------------------------------------------------------
# CONTROLE DE CALAGE MICRO -> MACRO, avant de payer le run de reference.
#
# Wang et al. (2024) ecrivent, section 4 : "the strength-stress ratio of the
# surrounding rock at Rc/sigma0 = 5" pour sigma0 = 5 MPa, soit une resistance
# macroscopique en compression Rc = 25 MPa. C'est la cible que leur calibration
# des micro-parametres (ft = 0,6 / c = 0,8 MPa, leur Table 1) visait DANS
# MultiFracS. Rien ne garantit que les memes micro-parametres donnent la meme
# macro dans rockim : schema d'insertion et penalite different.
#
# On mesure donc l'UCS avec EXACTEMENT le materiau de leur Table 1, EXACTEMENT
# le schema du run tunnel, et EXACTEMENT la taille de maille de sa zone fine
# (0,22 m) — le nombre cherche est le pic de contrainte.
#
#   rockim_tun.exe tunnel_edz\configs\ucs_calib_check.cfg out_ucs_check
#
# LECTURE :
#   ~25 MPa  -> notre calage coincide avec le leur, comparaison legitime
#   ~3 MPa   -> on colle a l'enveloppe de Mohr-Coulomb des JOINTS
#               (2c cos phi/(1 - sin phi) = 3,0 MPa) : pas d'imbrication,
#               l'EDZ sortira beaucoup trop grande
#   entre les deux -> le facteur mesure dit de combien l'EDZ sera biaisee
#
# Gabarit repris de calibration_redbohus/configs/c_CAL1_ucs_s4211.cfg (recette
# quasi-statique validee : plateaux frottants, arret apres pic), transpose a
# l'echelle metrique : 4,4 x 8,8 m = elancement 2:1 et 20 elements en largeur,
# comme l'eprouvette 40 x 80 mm de la campagne en portait 20.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
loading = platens
T = 0.15
frames = 4

W = 4.4
H = 8.8
thickness = 1.0

# maillage non structure a 0,22 m : les grains ne servent que de support au
# mailleur delaunay, tous les alphas a 1 -> materiau homogene (recette campagne)
mesh = voronoi
grainSize = 0.55
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.22
seed = 4211
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

# --- materiau : Table 1 de Wang et al. (2024), a l'identique ----------------
rho = 2650
E = 10e9
nu = 0.26
ft = 0.6e6
cohesion = 0.8e6
frictionDeg = 34
Gf = 20
gfShearFactor = 5
crushCap = 1e12             # bulk elastique, comme dans le run tunnel

# --- chargement : lent devant le transit d'onde -----------------------------
# transit H/c = 8,8/2149 = 4,1 ms ; a 0,27 m/s la deformation de rupture
# (~0,25 % si Rc = 25 MPa) est atteinte en ~80 ms, soit 20 transits.
pullV = -0.27
pullRamp = 0.01
contactMu = 0.1
ucsStopAfterPeak = true

# --- schema : STRICTEMENT celui du run tunnel -------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 0        # VARIANTE : frottement residuel conserve
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01
verifyFt = false
budgetAbortPct = 0
