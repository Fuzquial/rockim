# ---------------------------------------------------------------------------
# INDENTATION 3D — le meme essai que indent2d_ye.cfg, en trois dimensions.
# Architecture de Ye et al. (2025) : bulk elasto-plastique Mohr-Coulomb +
# joints cohesifs, bouton spherique R = 4 mm du deck Abaqus indent2d.
#
#   python tunnel_edz/tools/make_impact_mesh3d.py 0.04 0.04 0.025 0.0006 \
#          0.006 0.0025 meshes/indent3d_block.msh 1
#   rockim_tun.exe tunnel_edz\configs\indent3d_ye.cfg out_indent3d_ye
#
# ECARTS ASSUMES AVEC LE 2D, et leurs raisons :
#   * maille fine 0,6 mm au lieu de 0,4 : en 3D le nombre de tetraedres croit
#     en 1/h^3. A 0,4 mm on depasserait 100 000 tetraedres et l'heure de
#     calcul ; a 0,6 mm on garde 2 dx = 1,2 mm sous l_cz = 1,92 mm, donc la
#     fenetre tient (de justesse — a resserrer si le facies est douteux).
#   * masse d'outil 0,05 kg (et non 20 kg/m) : en 3D la masse est absolue.
#     A 12 m/s cela fait 3,6 J, dimensionne pour un enfoncement du meme ordre
#     que les 0,66 mm obtenus en 2D (estimation W ~ pi p R delta^2 = 1,3 J
#     pour delta = 0,66 mm, plus le rebond).
#   * bloc 40 x 40 x 25 mm : la troisieme dimension reprend la largeur du deck.
#
# Le reste est identique au cas 2D : meme materiau, meme loi de volume, memes
# joints, meme schema. En 3D `toolShape` est bien honore (le contournement
# force en percussion 2D n'existe pas ici — verifie dans Fdem3dSolver).
# ---------------------------------------------------------------------------
mode = fdem3d
scenario = percussion
T = 2.0e-5
frames = 4

mesh = file
meshFile = meshes/indent3d_block.msh

# --- volume : loi de Ye (Mohr-Coulomb elasto-plastique a aretes) ------------
rho = 2630
E = 60e9
nu = 0.2
law = mc
mcCohesion = 42.8e6
mcFrictionDeg = 50
mcDilationDeg = 5

# --- joints cohesifs : toute la fissuration --------------------------------
ft = 25e6
cohesion = 60e6
frictionDeg = 50
Gf = 20
gfShearFactor = 5

# --- insert spherique R = 4 mm ---------------------------------------------
toolShape = sphere
toolRadius = 0.004
toolMass = 0.05
impactSpeed = 12.0

absorbing = all

# --- schema : celui de l'etude tunnel --------------------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
contactMu = 0.5
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05
jointXi = 0.05
budgetAbortPct = 0

jointContactPenalty = adaptive
# re-basage 2026-08-28 (reparation 3) : sous law le cap etait desarme —
# intention figee explicitement, le resultat ne depend plus du defaut.
meanTensionCapFactor = 0
