# ---------------------------------------------------------------------------
# V2b — CONTROLE DE KIRSCH, lambda = 0,5 : le controle de l'ANISOTROPIE, celui
# qui valide que le relachement applique bien sigma0 . n face par face et non
# une pression scalaire. Identique a verif_kirsch_lam1.cfg sauf insituSv.
#
#   rockim_tun.exe tunnel_edz\configs\verif_kirsch_lam05.cfg out_kirsch_lam05
#   python tunnel_edz\tools\kirsch_check.py out_kirsch_lam05
#
# ATTENDU (sH = 5, sV = 10, compression) :
#   couronne (theta = 90 deg) : 3 sH - sV =  5 MPa
#   reins    (theta =  0 deg) : 3 sV - sH = 25 MPa
# Tolerance +- 5 % (Kirsch vaut pour une plaque infinie ; ici a/b = 1/10).
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/kirsch_r5.msh
thickness = 1.0
T = 0.25
frames = 4

rho = 2650
E = 10e9
nu = 0.26
ft = 1e9
cohesion = 2e9
frictionDeg = 34
Gf = 1e6
gfShearFactor = 5
crushCap = 1e12

insituSh = 5e6
insituSv = 10e6             # lambda = 0,5

excavRelease = true
excavStart = 0.02
excavRamp = 0.08
boreCX = 50.0
boreCY = 50.0
boreSelectR = 6.0

pullV = 0
gripLateralFree = false     # mors ENCASTRES : les 4 coins seraient sinon libres
                            # en x tout en portant sigma_xx -> 5185 J/m de
                            # sonnerie parasite (mesure du 2026-08-17, V1).
                            # Ecart a "normal-fixed" : le dof TANGENTIEL des
                            # faces haut/bas, a 45 m du tunnel. Arbitre par V2.
lateralRollers = true
absorbing = none
verifyFt = false

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01
