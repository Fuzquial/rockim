# ---------------------------------------------------------------------------
# IMPACT sur le MATERIAU ET LE SCHEMA DE L'ETUDE TUNNEL — bloc plein, sans
# excavation, frappe par un insert libre.
#
#   rockim_tun.exe tunnel_edz\configs\impact_roche_tunnel.cfg out_impact_tun
#
# TOUT vient de tunnel_ref_s5_lam1.cfg sauf la geometrie et le chargement :
# meme materiau (leur Table 1), meme loi de joint (Yan/Munjiza, decharge sur
# secante a l'origine, frottement mis a l'echelle par f(D)), meme insertion
# adaptative, meme contact par potentiel de Munjiza avec activation adaptative.
#
# ECHELLE — imposee par le materiau, pas choisie :
#   l_cz = E GfI / ft^2 = 10e9 x 20 / (0,6e6)^2 = 0,556 m
#   fenetre 2 dx < l_cz < taille du cratere
#   -> dx <= 0,278 m : on prend 0,20 m
#   -> le cratere doit depasser 0,56 m, donc l'impacteur est METRIQUE.
# Un impacteur centimetrique sur cette roche tendre serait hors domaine : la
# zone de processus serait cent fois plus grande que le cratere. C'est
# exactement le piege que la regle du 2026-08-17 sert a eviter.
#
# INSERT — en 2D le solveur n'a pas les groupes physiques (documente 3D-only
# dans la constitution) : l'insert est donc l'outil LIBRE integre, rigide, de
# masse et vitesse donnees. Poincon PLAT et non disque, pour que la largeur de
# contact soit finie et RESOLUE des le premier pas : 2 m de large sur des
# elements de 0,20 m, soit une dizaine d'elements en contact. Un disque
# donnerait une demi-largeur de Hertz sous la taille de maille, et le contact
# lisse ne casserait rien (mesure faite ce jour sur un essai a l'echelle
# centimetrique : 0 joint rompu malgre 2,5 MN/m de force outil).
#
# MAILLAGE — voie voronoi + delaunay intra-grain, PAS gmsh : le semis de
# Poisson donne des orientations isotropes, alors que Mesh.Algorithm = 6 pave
# en triangles equilateraux (piege du 2026-08-17, rapport pic/creux 30).
# Tous les alphas de joint de grain a 1 : les grains ne servent que de support
# au mailleur, le materiau est homogene.
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion
T = 0.03
frames = 16

thickness = 1.0

# MEME MAILLAGE QUE L'ETUDE TUNNEL : gmsh, Mesh.Algorithm = 5 (Delaunay,
# isotrope), champ de distance + seuil. Seule difference : pas de cavite, et
# le raffinement est centre sur le point d'impact au lieu de la paroi.
#   python tunnel_edz/tools/make_impact_mesh.py 40 24 0.22 12 1.5 \
#          meshes/impact_block.msh 1
# Bloc 40 x 24 m, 16 057 triangles, dx = 0,22 m jusqu'a 12 m de l'impact.
# Isotropie verifiee : pic/creux 1,17 et R6 = 0,024, exactement comme le
# maillage du tunnel (1,18 / 0,038).
mesh = file
meshFile = meshes/impact_block.msh

# --- materiau : Table 1 de Wang et al. (2024), a l'identique ----------------
rho = 2650
E = 10e9
nu = 0.26
ft = 0.6e6
cohesion = 0.8e6
frictionDeg = 34
Gf = 20
gfShearFactor = 5
crushCap = 1e12
# VOLUME STRICTEMENT ELASTIQUE, comme dans l'etude tunnel. Laisser crushCap a
# son defaut (8 x cohesion = 6,4 MPa) aurait introduit un plafond
# elasto-plastique sur le deviateur — c'est-a-dire une AUTRE loi de volume, et
# non un reglage numerique. Toute la rupture reste dans les joints.
# Consequence a surveiller : sous le poincon, les elements sur-comprimes n'ont
# plus ce garde-fou contre la distorsion. Si le bilan d'energie derive ou si
# des elements s'aplatissent, c'est le premier suspect — mais on le constatera
# au lieu de le masquer.

# --- insert libre : poincon plat de 2 m, 1 t/m a 3 m/s ---------------------
toolShape = disc
toolRadius = 20.0
toolMass = 1000.0
impactSpeed = 8.0

# --- frontieres absorbantes : l'onde sort au lieu de revenir cogner --------
absorbing = all

# --- schema : STRICTEMENT celui de l'etude tunnel ---------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05          # regle maison : 0,05 en impact
jointXi = 0.05               # idem
budgetAbortPct = 0
