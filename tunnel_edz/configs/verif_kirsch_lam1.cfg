# ---------------------------------------------------------------------------
# V2a — CONTROLE DE KIRSCH, lambda = 1 (le seul controle QUANTITATIF a forme
# fermee de toute la chaine : pre-contrainte + relachement + rouleaux).
#
# Trou CIRCULAIRE R = 5 m au centre d'une plaque 100 x 100 m, materiau rendu
# incassable (ft = 1 GPa contre ~25 MPa de contrainte reelle) : elastique pur,
# aucun joint insere, tres rapide.
#
#   python tunnel_edz\tools\make_circle_mesh.py 100 100 5 0.25 10 3 \
#          meshes\kirsch_r5.msh 1
#   rockim_tun.exe tunnel_edz\configs\verif_kirsch_lam1.cfg out_kirsch_lam1
#   python tunnel_edz\tools\kirsch_check.py out_kirsch_lam1
#
# ATTENDU : sigma_theta en paroi = (sH + sV) - 2(sH - sV) cos(2 theta)
#           lambda = 1  ->  10 MPa de COMPRESSION, uniformement (+- 5 %).
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/kirsch_r5.msh
thickness = 1.0
T = 0.25
frames = 4

rho = 2650
E = 10e9
nu = 0.26
# materiau incassable : dnF = 2 Gf/ft = 2,0 mm > dnE = ft/pj = 1,25 mm (pas de
# snapback), et aucune contrainte du modele n'approche 1 GPa
ft = 1e9
cohesion = 2e9
frictionDeg = 34
Gf = 1e6
gfShearFactor = 5
crushCap = 1e12

insituSh = 5e6
insituSv = 5e6

excavRelease = true
excavStart = 0.02
excavRamp = 0.08
boreCX = 50.0
boreCY = 50.0
boreSelectR = 6.0           # trou R = 5 m

pullV = 0
gripLateralFree = false     # mors ENCASTRES : les 4 coins seraient sinon libres
                            # en x tout en portant sigma_xx -> 5185 J/m de
                            # sonnerie parasite (mesure du 2026-08-17, V1).
                            # Ecart a "normal-fixed" : le dof TANGENTIEL des
                            # faces haut/bas, a 45 m du tunnel. Arbitre par V2.
lateralRollers = true
absorbing = none
verifyFt = false

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01
