# ---------------------------------------------------------------------------
# V3 — SMOKE du cas de reference (regle maison : jamais de run > 30 min sans
# smoke prealable). MEME physique, MEMES cles, maillage reduit (15,7 k
# triangles au lieu de 95 k) et fenetre raccourcie : ~5-10 min.
#
#   rockim_tun.exe tunnel_edz\configs\tunnel_smoke.cfg out_tun_smoke
#
# VERDICTS A COCHER :
#   - le relachement demarre bien a t = excavStart (la casse ne peut pas
#     apparaitre avant) ;
#   - ca casse : nBroken > 0, et le faciès amorce en X ;
#   - residu B4 < 1 % (en pratique ~1e-3 %), dashpot et Cundall <= 0 ;
#   - l'energie cinetique redescend apres la rampe -> l'etat se stabilise
#     (c'est LE critere de convergence quasi-statique) ;
#   - wall time extrapole : x6 elements x2,3 pas ~= x14 pour le cas de ref.
#
# ATTENTION : la zone fine du maillage smoke ne va qu'a 6 m de la paroi, alors
# que l'EDZ attendue s'etend a ~19 m du CENTRE. Ce run valide la MACHINERIE,
# pas le rayon d'EDZ — ne pas en tirer de chiffre physique.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/tunnel_hs_smoke.msh
thickness = 1.0
T = 0.10
frames = 6

rho = 2650
E = 10e9
nu = 0.26
ft = 0.6e6
cohesion = 0.8e6
frictionDeg = 34
Gf = 20
gfShearFactor = 5
crushCap = 1e12

insituSh = 5e6
insituSv = 5e6

excavRelease = true
excavStart = 0.01
excavRamp = 0.04
boreCX = 50.0
boreCY = 50.0
boreSelectR = 8.0

pullV = 0
gripLateralFree = false     # mors ENCASTRES : les 4 coins seraient sinon libres
                            # en x tout en portant sigma_xx -> 5185 J/m de
                            # sonnerie parasite (mesure du 2026-08-17, V1).
                            # Ecart a "normal-fixed" : le dof TANGENTIEL des
                            # faces haut/bas, a 45 m du tunnel. Arbitre par V2.
lateralRollers = true
absorbing = none
verifyFt = false

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01
budgetAbortPct = 0
budgetAbortMin = 1e3
# Moniteur E2 DESARME (pct = 0) : mesure du 2026-08-17 � avec des mors
# encastres portant des forces de plusieurs MN, la correction leapfrog
# f^2 dt^2/2m est accumulee sur des noeuds a vitesse IMPOSEE, ou aucune
# energie ne circule. Elle croit lineairement (13,6 J/m par pas ici) et
# atteindrait ~0,8 MJ/m sur le run de reference, soit l'ordre du signal
# physique : le moniteur ne peut pas discriminer. Il a coupe le premier
# smoke a t = 0,0043 s AVANT le relachement, bloc au repos (KE = 2e-16).
# Controles de remplacement : energie cinetique, jauge de contrainte, et
# lecture du budget B4 en fin de run.
