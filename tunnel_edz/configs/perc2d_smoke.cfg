# ---------------------------------------------------------------------------
# PERCUSSION 2D avec la pile de schemas de l'etude tunnel.
#
#   rockim_tun.exe tunnel_edz\configs\perc2d_moderne.cfg out_perc2d
#
# OBJET : porter sur la percussion exactement ce qui a ete valide aujourd'hui
# sur l'excavation — insertion adaptative, loi de joint de Yan/Munjiza,
# decharge sur secante a l'origine, frottement mis a l'echelle par f(D),
# contact par potentiel de Munjiza et activation adaptative des faces.
# C'est la brique de base de la future campagne de percussion CONFINEE
# (il suffira d'ajouter insituSh/insituSv).
#
# MATERIAU : le couple (ft, Gf) du run impact3d_ultra du 2026-08-17, choisi
# par la regle de la fenetre 2 dx < l_cz < a et valide ce matin-la (1 057
# joints rompus la ou l'ancien couple n'en cassait qu'un).
#   l_cz = E GfI / ft^2 = 50e9 x 150 / (87e6)^2 = 0,99 mm
#   -> dx admissible <= 0,50 mm ; on prend 0,35 mm
#   -> et l_cz doit rester SOUS la taille du cratere (quelques mm) : OK
# Monophase volontairement : pas de GBM ici, pour ne pas melanger l'effet du
# schema avec celui des joints de grain. Tous les alphas a 1, les grains ne
# servent que de support au mailleur (et garantissent l'isotropie des
# orientations, contrairement au chemin gmsh — cf. piege du 2026-08-17).
#
# DIMENSIONNEMENT DE L'IMPACT : outil de 1 kg par metre d'epaisseur a 10 m/s,
# soit 50 J/m, proportionne au domaine reduit (la config historique de 640 J/m
# visait un bloc 0,40 x 0,25 m, seize fois plus grand en surface).
# ---------------------------------------------------------------------------
mode = fdem
scenario = percussion
T = 6e-5
frames = 6

W = 0.05
H = 0.035
thickness = 1.0

# maillage : voronoi + delaunay intra-grain (orientations isotropes)
mesh = voronoi
grainSize = 0.004
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.0007
seed = 4211
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

# --- materiau : couple valide par la fenetre l_cz (impact3d_ultra) ---------
rho = 2650
E = 50e9
nu = 0.25
ft = 87e6
cohesion = 217e6
frictionDeg = 40
Gf = 150
gfShearFactor = 10

# --- outil libre ------------------------------------------------------------
toolShape = disc
toolRadius = 0.008
toolMass = 1.0
impactSpeed = 10.0

# --- frontieres : Lysmer + ressorts de Deeks-Randolph -----------------------
# `all` remplace aussi le fond encastre : l'onde sort du domaine au lieu de
# revenir cogner le cratere. C'est aussi la configuration qui devra tenir une
# pre-contrainte in situ quand on passera a la percussion confinee — les
# ressorts de Deeks-Randolph sont la pour ca, a verifier alors par un controle
# a charge nulle.
absorbing = all

# --- schema : STRICTEMENT celui de l'etude tunnel ---------------------------
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.15
dampingLocal = 0.05          # regle maison : 0,05 en impact (0,15 en quasi-statique)
jointXi = 0.05               # idem : 0,05 en impact
budgetAbortPct = 5
budgetAbortMin = 0.05
