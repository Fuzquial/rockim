# ---------------------------------------------------------------------------
# V1 — CONTROLE A CHARGE NULLE, VERSION IN SITU (constitution, principe II).
#
# Le massif est pre-contraint a 5 MPa et la traction de paroi est MAINTENUE
# (excavStart = 10 s, bien au-dela de T) : rel(t) reste a 1, l'etat est un
# equilibre exact. Rien ne doit bouger.
#
#   rockim_tun.exe tunnel_edz\configs\verif_zeroload_insitu.cfg out_v1
#
# ATTENDU (sinon le patch est faux) :
#   - broken joints            : 0
#   - adaptive insertion       : 0 arete inseree
#   - block kinetic energy     : ~1e-10 J (bruit machine)
#   - joint dashpot work       : 0 [OK, dissipative]
#   - residu B4                : < 0,01 %
#   - achievedConfinement      : -5,000 MPa   <-- la mesure DIRECTE de sigma0
#
# Diagnostic si ca casse :
#   sigma_xx du coeur = +5 MPa  -> signe de insituS_ inverse (patch 1)
#   sigma_xx du coeur = 0       -> hasInsitu_ pas arme (clefs mal lues)
#   casse concentree en paroi   -> convention de normale du patch 2
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
mesh = file
meshFile = meshes/tunnel_hs_smoke.msh      # 15,7 k triangles : ~2 min
thickness = 1.0
T = 0.02
frames = 2

rho = 2650
E = 10e9
nu = 0.26
ft = 0.6e6
cohesion = 0.8e6
frictionDeg = 34
Gf = 20
gfShearFactor = 5
crushCap = 1e12

insituSh = 5e6
insituSv = 5e6

excavRelease = true
excavStart = 10.0           # >> T : la paroi n'est JAMAIS relachee
excavRamp = 0.01
boreCX = 50.0
boreCY = 50.0
boreSelectR = 8.0

pullV = 0
gripLateralFree = false     # mors ENCASTRES : les 4 coins seraient sinon libres
                            # en x tout en portant sigma_xx -> 5185 J/m de
                            # sonnerie parasite (mesure du 2026-08-17, V1).
                            # Ecart a "normal-fixed" : le dof TANGENTIEL des
                            # faces haut/bas, a 45 m du tunnel. Arbitre par V2.
lateralRollers = true
absorbing = none
verifyFt = false

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
jointFrictionScaled = 1
contact = potential
gcActivation = adaptive
jointPenaltyFactor = 20
insertionPenaltyFactor = 4
dtFactor = 0.2
dampingLocal = 0.15
jointXi = 0.01
