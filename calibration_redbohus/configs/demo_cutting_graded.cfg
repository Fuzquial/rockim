# ---------------------------------------------------------------------------
# COUPE PDC — maillage HOMOGENE GRADUE (sans GBM).
#
# Le mode voronoi impose une tessellation UNIFORME : impossible d'y raffiner
# la zone de coupe. On charge donc un maillage libre gradue (gmsh, champ de
# taille en rampe sur y) : fin sous la surface, grossier au fond.
#   python tools/make_cut_mesh.py 30 15 0.35 2.5 2.5
#   -> 2546 triangles, 57 % dans la bande superieure de 2,5 mm,
#      diametre inscrit 0,20 mm dans la bande contre 0,44 mm au fond
#
# Materiau homogene : plus de grains ni de joints de grains — les cohesifs
# sont inseres entre TOUS les triangles, avec l'heterogeneite de Weibull
# comme seule source de desordre (indispensable a la localisation).
# ---------------------------------------------------------------------------
mode = fdem
scenario = shear
T = 3.5e-3
frames = 60

mesh = file
meshFile = meshes/cut_graded.msh
thickness = 1.0

# --- outil PDC ---
toolShape = pdc
cutDepth = 0.0005
cutSpeed = 2.0
backRakeDeg = 20.0
cutterLen = 0.010
toolX = -0.002
contactMu = 0.3
contactXi = 0.2

# --- materiau ---
rho = 2620
E = 77.66e9
nu = 0.29
ft = 25e6
cohesion = 12e6
frictionDeg = 45
Gf = 40
gfShearFactor = 2
crushCap = 900e6

jointWeibullM = 6
fieldSeed = 555

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 100
insertionPenaltyFactor = 4

absorbing = sides
dampingLocal = 0.1
jointXi = 0.0

budgetAbortPct = 5
budgetAbortMin = 0.05
