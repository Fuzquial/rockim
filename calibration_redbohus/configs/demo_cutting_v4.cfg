# ---------------------------------------------------------------------------
# COUPE PDC v3 ??? domaine REDIMENSIONNE et maillage raffine.
#
# Diagnostic des deux essais precedents : la fissuration s'amorcait
# correctement devant l'arete, puis envahissait TOUT le bloc et la force
# croissait sans jamais redescendre (aucun cycle de copeau). Cause : le
# domaine etait trop petit devant l'outil ??? 30 x 18 mm pour une passe de
# 1,5 mm, avec la base encastree a 16 mm sous l'arete. La litterature de
# coupe FDEM prend une eprouvette de plusieurs DIZAINES de fois la passe
# dans les deux directions, pour que le copeau ait la place de se former
# et que les frontieres ne renvoient rien.
#
# Ici : passe 0,5 mm, bloc 40 x 20 mm
#        -> 80 x la passe en longueur, 40 x la passe en hauteur
#        -> l'arete est a 19,5 mm de la base (39 x la passe)
# et maillage raffine : elements de 0,7 mm = 1,4 x la passe (contre 0,8 x
# auparavant), 3 elements par grain.
# ---------------------------------------------------------------------------
mode = fdem
scenario = shear
T = 3.5e-3
frames = 60

W = 0.03
H = 0.015
thickness = 1.0

# --- outil PDC : passe FINE devant un grand domaine ---
toolShape = pdc
cutDepth = 0.0005         # 0,5 mm
cutSpeed = 2.0
backRakeDeg = 20.0
cutterLen = 0.010
toolX = -0.002
contactMu = 0.3
contactXi = 0.2           # amortissement du contact outil (adoucit l'engagement)

# --- maillage raffine ---
mesh = voronoi
grainSize = 0.0015
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.00045
vertexMergeFrac = 0.25
seed = 4211

# --- materiau ---
rho = 2620
E = 77.66e9
nu = 0.29
ft = 25e6
cohesion = 12e6
frictionDeg = 45
Gf = 40
gfShearFactor = 2
crushCap = 900e6

jointWeibullM = 6
fieldSeed = 555

insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 100
insertionPenaltyFactor = 4

absorbing = sides
dampingLocal = 0.1
jointXi = 0.0

budgetAbortPct = 5
budgetAbortMin = 0.05
