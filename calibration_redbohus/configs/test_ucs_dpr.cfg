# ---------------------------------------------------------------------------
# CALIBRATION RED BOHUS ??? R1 : UCS 2D (baseline, jeu de depart inchange)
# Base : configs_yan/ucs_adap.cfg (montage plateaux frottants VALIDE sur
# l'article Yan : UCS 51,1 MPa vs ~51, E 99,1 %). Ce qui change : geometrie
# d'eprouvette Red Bohus (50 x 100 mm), materiau Bohus, schemas de campagne.
# Cibles experimentales (experimental_data_red_bohus.json, 4 essais) :
#   UCS = 112,1 / 158,1 / 121,4 / 114,8 MPa (moyenne 126,6, mediane ~118)
#   E   = a re-fitter proprement sur la bande lineaire
# Maillage : voronoi 1 phase + delaunay intra-grain = NON STRUCTURE homogene
# (tous les gbAlpha a 1 : les joints de frontiere portent le meme materiau
# que le volume ??? pas de GBM ici).
#   lancer : rockim_chk.exe configs\cal_ucs_bohus.cfg out_cal_ucs_b0
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
loading = platens
T = 4e-3
frames = 12

W = 0.05
H = 0.10
thickness = 1.0

mesh = voronoi
grainSize = 0.008
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.002
seed = 4211

# --- materiau Red Bohus (jeu de DEPART, a calibrer) ---
rho = 2620
E = 52e9
nu = 0.25
ft = 34e6
cohesion = 13.6e6
frictionDeg = 13.4
Gf = 70
gfShearFactor = 10
law = dpr
erodeD = 0.98
erodeEpv = 1.5
gbAlphaE = 1.0
gbAlphaTen = 1.0
gbAlphaCoh = 1.0
gbAlphaGf = 1.0
gbAlphaFric = 1.0

# --- chargement quasi-statique par plateaux ---
pullV = -0.2
pullRamp = 2e-4
contactMu = 0.1
dampingLocal = 0.7
jointXi = 0.0
verifyFt = false

# --- schemas de campagne (capacites validees) ---
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 100
insertionPenaltyFactor = 4

# --- garde-fous ---
ucsStopAfterPeak = true
budgetAbortPct = 5
budgetAbortMin = 0.05
