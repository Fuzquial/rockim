# ---------------------------------------------------------------------------
# DEMO — rupture NETTE puis resistance RESIDUELLE, FDEM 2D homogene.
# Toute la panoplie du solveur, y compris la seule capacite que la campagne
# de calibration n'avait jamais activee : l'HETEROGENEITE DE WEIBULL.
#
# Pourquoi elle est decisive : avec des joints strictement identiques, tous
# atteignent leur critere au meme instant — l'endommagement est diffus et la
# courbe passe en PLATEAU. Un tirage de Weibull cree des points faibles :
# la rupture LOCALISE sur une bande, la charge s'effondre d'un coup, puis
# les levres de la bande frottent l'une sur l'autre et portent la charge
# residuelle. C'est le mecanisme decrit par toute la litterature GB-FDEM.
#
# Trois autres reglages qui comptent pour voir la chute :
#   - dampingLocal 0,7 -> 0,15 : 0,7 lisse la dynamique de l'effondrement ;
#   - gfShearFactor 2 : joints fragiles en cisaillement (chute rapide) ;
#   - contactMu 0,5 : frottement des levres = la resistance residuelle ;
#   - PAS de ucsStopAfterPeak : on veut justement voir l'apres-pic.
# ---------------------------------------------------------------------------
mode = fdem
scenario = tension
loading = platens
T = 5e-3
frames = 12

W = 0.04
H = 0.08
thickness = 1.0

# --- maillage GBM (1 phase = homogene au sens mineral) ---
mesh = voronoi
grainSize = 0.005
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.002
seed = 4211

# --- materiau ---
rho = 2620
E = 77.66e9
nu = 0.29
ft = 25e6
cohesion = 12e6
frictionDeg = 45
Gf = 40
gfShearFactor = 2
crushCap = 900e6

# --- L'INGREDIENT MANQUANT : heterogeneite de resistance des joints ---
# m = 6 : dispersion realiste pour un granite (Weibull de moyenne 1)
jointWeibullM = 6
fieldSeed = 555

# --- schemas dernier cri, tous valides ---
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 100
insertionPenaltyFactor = 4

# --- chargement quasi-statique, amortissement REDUIT pour voir la chute ---
pullV = -0.2
pullRamp = 2e-4
contactMu = 0.5
dampingLocal = 0.15
jointXi = 0.0
verifyFt = false

# --- garde-fous ---
budgetAbortPct = 5
budgetAbortMin = 0.05
