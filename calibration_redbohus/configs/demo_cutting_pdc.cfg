# ---------------------------------------------------------------------------
# DEMO — COUPE PAR CUTTER PDC (FDEM 2D). Un outil polycristallin passe a
# profondeur constante et taille la roche : c'est le mode d'attaque du
# forage ROTATIF (par opposition au percussif du reste de la these).
#
# Le scenario existe deja dans le solveur (scenario = shear + toolShape =
# pdc) : l'outil est pilote en deplacement lateral, `x` EST l'arete de
# coupe, placee a la profondeur voulue et demarree hors de l'eprouvette
# pour que l'engagement soit progressif.
#
# Materiau : celui de la demo de rupture nette — avec HETEROGENEITE DE
# WEIBULL, sans laquelle la fissuration reste diffuse et le copeau ne se
# detache pas.
# ---------------------------------------------------------------------------
mode = fdem
scenario = shear
T = 4e-3
frames = 30

W = 0.05
H = 0.03
thickness = 1.0

# --- outil PDC ---
toolShape = pdc
cutDepth = 0.002          # profondeur de passe (2 mm)
cutSpeed = 10.0           # vitesse de coupe (m/s)
backRakeDeg = 20.0        # angle de coupe arriere (valeur usuelle PDC)
cutterLen = 0.013
toolX = -0.003            # depart hors matiere : engagement progressif
contactMu = 0.3           # frottement outil / roche
contactXi = 0.1

# --- maillage GBM ---
mesh = voronoi
grainSize = 0.003
grainSeeding = random
grainJitter = 0.5
lloydIters = 2
grainMesh = delaunay
grainElemSize = 0.0012
seed = 4211

# --- materiau (identique a la demo de rupture nette) ---
rho = 2620
E = 77.66e9
nu = 0.29
ft = 25e6
cohesion = 12e6
frictionDeg = 45
Gf = 40
gfShearFactor = 2
crushCap = 900e6

# --- heterogeneite : indispensable pour que le copeau se DETACHE ---
jointWeibullM = 6
fieldSeed = 555

# --- schemas dernier cri ---
insertion = adaptive
jointSoftening = yan
jointShearUnload = origin
gcActivation = adaptive
contact = potential
jointPenaltyFactor = 100
insertionPenaltyFactor = 4

# --- frontieres : bloc pose, flancs absorbants (pas de reflexion parasite) ---
absorbing = sides
dampingLocal = 0.1
jointXi = 0.0

budgetAbortPct = 5
budgetAbortMin = 0.05
